<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EcomIQ — Free Profitability Bootcamp (9:16)</title>
    <!-- GSAP vendored locally — CDN cert-fails in the render env and freezes renders -->
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      /* LOCAL fonts — no network dependency at render time */
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      @font-face { font-family: 'Hedvig Letters Serif'; font-style: italic; font-weight: 400;
        font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: var(--brand-navy);
        font-family: 'Rethink Sans', system-ui, sans-serif;
        color: var(--brand-text);
      }

      /* ---- Footage (full-frame, footage-forward) --------------------------- */
      #footage-wrapper {
        position: absolute; inset: 0; z-index: 0;
        background: var(--brand-navy);
      }
      #footage {
        display: block; width: 100%; height: 100%; object-fit: cover;
        /* Gentle brand grade: a touch of contrast + saturation so the shot reads
           punchy against navy chrome, without looking processed. */
        filter: contrast(1.04) saturate(1.05);
      }

      /* ---- Persistent brand bug (top-left, every frame) -------------------- */
      /* Wrapper is a POSITIONED, non-clip div so the engine never drifts it
         (see LESSONS.md). The logo img inside is the timed clip. */
      #logo-bug {
        position: absolute; top: 54px; left: 56px; width: 150px; z-index: 120;
        /* Layered dark halo so the white lockup reads on any shot — including the
           bright ceiling at top-left of the wide shots. */
        filter:
          drop-shadow(0 2px 6px rgba(0, 0, 0, 0.55))
          drop-shadow(0 0 14px rgba(0, 0, 0, 0.45));
      }
      #logo-bug img { display: block; width: 100%; height: auto; }

      /* ---- End card (last ~2s) --------------------------------------------- */
      #endcard {
        position: absolute; inset: 0; z-index: 100; opacity: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 60px; padding: 0 120px; text-align: center;
        background:
          radial-gradient(95% 55% at 50% 40%, rgba(156, 212, 255, 0.10) 0%, rgba(6, 40, 76, 0) 60%),
          var(--brand-navy);
      }
      /* Warm brand bloom low in the frame for depth behind the CTA. */
      #endcard::before {
        content: ""; position: absolute; left: -10%; bottom: -18%; width: 120%; height: 55%;
        background: var(--brand-gradient-2); filter: blur(90px); opacity: 0.34; z-index: -1;
      }
      #endcard-logo { width: 560px; height: auto; }
      #endcard-cta {
        display: inline-flex; align-items: center; gap: 20px;
        font-family: 'Rethink Sans', sans-serif; font-weight: 700; font-size: 40px;
        letter-spacing: -0.01em; color: var(--brand-white);
        background: var(--brand-flame);
        padding: 32px 56px; border-radius: 999px; max-width: 840px; line-height: 1.05;
        box-shadow: 0 24px 72px -16px rgba(255, 76, 50, 0.6);
      }
      #endcard-cta .arrow { font-size: 42px; line-height: 1; transform: translateY(-1px); }
    </style>
  </head>
  <body>
    <!-- Render Contract: root needs id, data-composition-id, data-start=0,
         data-width, data-height. -->
    <div
      id="root"
      data-composition-id="ecomiq-bootcamp-short"
      data-start="0"
      data-duration="30.27"
      data-width="1080"
      data-height="1920"
    >
      <!-- Footage: <video> is muted and never gets class="clip"; audio rides a
           sibling <audio> element for the mixer. -->
      <div id="footage-wrapper">
        <video
          id="footage"
          data-start="0"
          data-duration="30.27"
          data-track-index="0"
          src="assets/bootcamp-9x16-edit.mp4"
          muted
          playsinline
        ></video>
      </div>

      <audio
        id="footage-audio"
        data-start="0"
        data-duration="30.27"
        data-track-index="1"
        data-volume="1"
        src="assets/bootcamp-audio-clean.m4a"
      ></audio>

      <!-- Persistent EcomIQ logo, top-left, every frame -->
      <div id="logo-bug">
        <img
          id="logo"
          class="clip"
          data-start="0"
          data-duration="30.27"
          data-track-index="2"
          src="assets/ecomiq-logo-white.svg"
          alt="EcomIQ"
        />
      </div>

      <!-- Branded end card — covers the final ~2s -->
      <div id="endcard" class="clip" data-start="0" data-duration="30.27" data-track-index="3">
        <img id="endcard-logo" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
        <div id="endcard-cta">Join our Free Profitability Bootcamp <span class="arrow">&rarr;</span></div>
      </div>
    </div>

    <script>
      // Render Contract: exactly one paused GSAP timeline, keyed to the
      // data-composition-id, registered on window.__timelines.
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const DUR = 30.27;
      const END = DUR - 2; // end card owns the last ~2s

      // Brand bug fades in over the opening beat. fromTo because it starts hidden.
      tl.fromTo(
        "#logo-bug",
        { opacity: 0, y: -12 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.3,
      );

      // Corner brand bug persists through the whole video, then clears as the end
      // card takes over (the end card carries its own centered logo).
      tl.to("#logo-bug", { opacity: 0, duration: 0.3, ease: "power2.out" }, END);

      // End card: navy scrim fades up over the footage, then logo + CTA land.
      tl.fromTo("#endcard", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.out" }, END)
        .fromTo(
          "#endcard-logo",
          { opacity: 0, y: 24, scale: 0.92 },
          { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" },
          END + 0.22,
        )
        .fromTo(
          "#endcard-cta",
          { opacity: 0, scale: 0.85 },
          { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.7)" },
          END + 0.6,
        )
        // CTA breathes to hold the eye through the outro.
        .to("#endcard-cta", { scale: 1.03, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 2 }, END + 1.3);

      // Pad so tl.duration() matches root data-duration exactly (Law #7).
      tl.set({}, {}, DUR);
      window.__timelines["ecomiq-bootcamp-short"] = tl;
    </script>
  </body>
</html>
