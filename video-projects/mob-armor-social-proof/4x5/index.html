    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      /* LOCAL fonts — no network dependency at render time */
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      @font-face { font-family: 'Hedvig Letters Serif'; font-style: normal; font-weight: 400;
        font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1350px; overflow: hidden;
        background: var(--brand-navy);
        font-family: 'Rethink Sans', system-ui, sans-serif;
        color: var(--brand-white);
      }

      /* ── ground ─────────────────────────────────────────────── */
      #bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(78% 46% at 50% 30%, rgba(156,212,255,.11) 0%, rgba(6,40,76,0) 62%),
          var(--brand-navy);
      }

      /* ── footage ──────────────────────────────────────────────────────
         The <video> IS the animated element — no timed wrapper. A wrapper that
         also carries data-start makes the frame extractor and the visibility
         window disagree, which shows the wrong source frames. Transform/filter
         on a <video> is fine; width/height/top/left is what freezes it. */
      .shot {
        position: absolute; inset: 0; width: 1080px; height: 1350px;
        object-fit: cover; object-position: 50% 42%; z-index: 1; will-change: transform, filter;
      }
      /* One navy scrim for the whole runtime, stacked above the footage and below
         the type — holds nine cuts together as one piece instead of a reel. */
      #scrim {
        position: absolute; inset: 0; pointer-events: none; z-index: 2;
        background: linear-gradient(180deg, rgba(6,40,76,.34) 0%, rgba(6,40,76,.12) 40%, rgba(6,40,76,.30) 100%);
      }

      /* ── cards: content lives in the top 1344px, bottom 30% stays clear ── */
      .card {
        position: absolute; left: 0; right: 0; top: 190px; height: 770px; z-index: 6;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 25px; padding: 0 78px; text-align: center; will-change: transform, filter;
      }
      .eyebrow {
        font-weight: 800; font-size: 25px; letter-spacing: .30em; text-transform: uppercase;
        color: var(--brand-blue-tint);
      }
      .stat {
        font-weight: 800; letter-spacing: -.045em; line-height: .86;
        color: var(--brand-white); position: relative;
      }
      .stat.xl  { font-size: 268px; }
      .stat.lg  { font-size: 212px; }
      .bloom {                            /* flame heat behind the numeral — light, not colour */
        position: absolute; left: 50%; top: 50%; width: 736px; height: 506px;
        transform: translate(-50%,-50%); pointer-events: none; z-index: -1;
        background: radial-gradient(50% 50% at 50% 50%, rgba(255,76,50,.42) 0%, rgba(255,76,50,0) 70%);
        filter: blur(28px);
      }
      .rule { width: 344px; height: 7px; background: var(--brand-flame); transform-origin: 50% 50%; }
      .sub {
        font-weight: 800; font-size: 39px; line-height: 1.14; letter-spacing: -.02em;
        text-transform: uppercase; color: var(--brand-white); max-width: 780px;
      }

      /* Mob Armor wordmark — their guide allows white-on-black only, so it sits on a black chip */
      .ma-chip {
        display: flex; align-items: center; gap: 18px;
        background: #101820; padding: 18px 30px; border-radius: 9px;
      }
      .ma-chip img { width: 248px; height: auto; display: block; }
      .ma-chip.shield img { width: 62px; }
      .ma-chip .lbl {
        font-weight: 800; font-size: 16px; letter-spacing: .22em; text-transform: uppercase;
        color: #7f8b99; border-left: 2px solid #2a3644; padding-left: 18px;
      }

      /* ── channel diagram ─────────────────────────────────────── */
      .dots { display: flex; align-items: center; justify-content: center; gap: 34px; height: 108px; }
      .dot {
        width: 78px; height: 78px; border-radius: 50%; position: relative;
        border: 4px solid #2f588a; background: rgba(156,212,255,.05);
      }
      .dot .core {
        position: absolute; inset: 13px; border-radius: 50%; background: var(--brand-blue-tint);
        opacity: 0; transform: scale(.4);
      }
      .dot.hot { border-color: var(--brand-flame); }
      .dot.hot .core { background: var(--brand-flame); }
      .dot .halo {
        position: absolute; inset: -24px; border-radius: 50%; pointer-events: none; opacity: 0;
        background: radial-gradient(50% 50% at 50% 50%, rgba(156,212,255,.55) 0%, rgba(156,212,255,0) 70%);
      }
      .dot.hot .halo {
        background: radial-gradient(50% 50% at 50% 50%, rgba(255,76,50,.65) 0%, rgba(255,76,50,0) 70%);
      }
      .wire {
        width: 414px; height: 4px; background: #3f6fa8; position: relative; overflow: hidden;
      }
      .wire .pulse {
        position: absolute; top: 0; left: 0; width: 122px; height: 4px;
        background: linear-gradient(90deg, rgba(255,76,50,0), var(--brand-flame), rgba(255,76,50,0));
      }

      /* ── end card ────────────────────────────────────────────── */
      #endcard img.logo { width: 458px; height: auto; }
      #endcard .head {
        font-weight: 800; font-size: 75px; line-height: .98; letter-spacing: -.032em;
        max-width: 690px;
      }
      #endcard .head .em {
        font-family: 'Hedvig Letters Serif', Georgia, serif; font-style: italic; font-weight: 400;
        color: var(--brand-blue-tint);
      }
      #endcard .cta {
        font-weight: 800; font-size: 33px; letter-spacing: -.01em; color: var(--brand-white);
        background: var(--brand-flame); padding: 25px 52px; border-radius: 999px;
        box-shadow: 0 26px 78px -20px rgba(255,76,50,.72);
      }

      /* ── persistent logo — positioned, NOT a clip (render engine repositions clips) ── */
      #logo-slot { position: absolute; top: 68px; left: 58px; width: 262px; z-index: 7; }
      #logo-slot img { width: 100%; height: auto; display: block; }

      /* ── unifying texture ────────────────────────────────────── */
      #grid {
        position: absolute; inset: -120px; pointer-events: none; z-index: 3;
        background:
          repeating-linear-gradient(0deg,  rgba(255,255,255,.062) 0 1px, transparent 1px 90px),
          repeating-linear-gradient(90deg, rgba(255,255,255,.062) 0 1px, transparent 1px 90px);
      }
      #crosshairs { position: absolute; inset: 0; pointer-events: none; opacity: .5; z-index: 4; }
      #crosshairs i {
        position: absolute; width: 26px; height: 26px;
      }
      #crosshairs i::before, #crosshairs i::after {
        content: ""; position: absolute; background: rgba(255,255,255,.46);
      }
      #crosshairs i::before { left: 50%; top: 0; width: 1px; height: 100%; }
      #crosshairs i::after  { top: 50%; left: 0; height: 1px; width: 100%; }
      #vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 8;
        background: radial-gradient(ellipse 88% 74% at 50% 46%, rgba(0,0,0,0) 34%, rgba(0,0,0,.44) 100%);
      }
      #grain {                          /* deterministic CSS grain — no PNG, no randomness */
        position: absolute; inset: 0; pointer-events: none; opacity: .34; mix-blend-mode: overlay; z-index: 9;
        background-image:
          radial-gradient(rgba(255,255,255,.030) .5px, transparent .5px),
          radial-gradient(rgba(255,255,255,.020) .5px, transparent .5px),
          radial-gradient(rgba(0,0,0,.030)       .5px, transparent .5px);
        background-size: 3px 3px, 5px 5px, 7px 7px;
        background-position: 0 0, 1px 2px, 3px 1px;
      }

      /* ── whip streaks fired at the two hero cuts ─────────────── */
      .streak {
        position: absolute; left: -60%; top: 44%; width: 220%; height: 10px; z-index: 7;
        background: linear-gradient(90deg, rgba(255,76,50,0), rgba(255,255,255,.95) 45%, rgba(255,76,50,.9) 60%, rgba(255,76,50,0));
        filter: blur(7px); pointer-events: none; opacity: 0;
      }
    </style>

    <script>
      window.__timelines = window.__timelines || {};
      (() => {
        const DUR = 38.6;
        const tl = gsap.timeline({ paused: true });

        /* ── Cut-the-curve vertical whip ────────────────────────────────────
           Every seam uses the same pair: the outgoing beat rides UP with blur,
           the incoming beat rises from below with matching blur. Same direction
           both sides, velocity matched at the cut, so no seam reads as a stall. */
        const IN_D = 0.45, OUT_D = 0.30, BLUR = 24;
        function beat(sel, tIn, tOut) {
          // ENTRY — matches the previous beat's -140px / 24px exit, in the same direction.
          tl.fromTo(sel,
            { y: 140, opacity: 0, filter: "blur(" + BLUR + "px)" },
            { y: 0, opacity: 1, filter: "blur(0px)", duration: IN_D, ease: "power2.out" }, tIn);
          // EXIT — matches the next beat's +140px / 24px entry. Starts 0.10s early so the
          // two blurs overlap and the cut hides inside the motion rather than beside it.
          tl.to(sel,
            { y: -140, opacity: 0, filter: "blur(" + BLUR + "px)", duration: OUT_D, ease: "power2.in" },
            tOut - 0.10);
        }

        /* ── 00 · cold open ─────────────────────────────────────────────── */
        tl.fromTo("#logo-slot", { opacity: 0, y: -18 },
          { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.25);

        /* Camera never sleeps: the grid drifts and the vignette breathes for the
           whole runtime, so even the held end card is never a frozen frame. */
        tl.fromTo("#grid", { backgroundPosition: "0px 0px, 0px 0px" },
          { backgroundPosition: "0px -90px, -90px 0px", duration: DUR, ease: "none" }, 0);
        tl.to("#vignette", { opacity: 0.88, duration: 5.2, repeat: 7, yoyo: true, ease: "sine.inOut" }, 0);
        tl.fromTo("#crosshairs", { opacity: 0 }, { opacity: 0.5, duration: 1.0, ease: "power2.out" }, 0.4);

        /* ── 01 · CARD A — 500% ─────────────────────────────────────────── */
        // Streak fires ON the cut, not before it — the numeral lands inside the flash.
        tl.fromTo("#streakA", { xPercent: -60, opacity: 0, scaleX: 0.6 },
          { xPercent: 40, opacity: 1, scaleX: 1.4, duration: 0.20, ease: "power3.in" }, 0.80)
          .to("#streakA", { xPercent: 130, opacity: 0, duration: 0.22, ease: "power3.out" }, 1.00);

        beat("#cardA", 0.900, 4.400);
        // Numeral snaps 0.20s AHEAD of the spoken "500%" at 1.90 — the visual leads, so it reads
        // as inevitable rather than reactive.
        tl.fromTo("#statA", { scale: 1.34, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.42, ease: "expo.out" }, 1.700);
        tl.fromTo("#cardA .eyebrow", { y: 24, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.36, ease: "power2.out" }, 1.060);
        tl.fromTo("#ruleA", { scaleX: 0 }, { scaleX: 1, duration: 0.40, ease: "power3.out" }, 2.100);
        // "In a single year" lands on the phrase at 3.21.
        tl.fromTo("#subA", { y: 26, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.38, ease: "power2.out" }, 3.100);
        tl.fromTo("#chipA", { y: 22, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.40, ease: "power2.out" }, 3.450);

        /* ── 02–06b · footage run ───────────────────────────────────────── */
        beat("#s02",  4.400,  6.033);
        beat("#s03",  6.033,  8.100);
        beat("#s04",  8.100, 10.267);
        beat("#s05", 10.267, 11.733);
        beat("#s06a", 11.733, 12.733);
        beat("#s06b", 12.733, 14.700);
        // Slow push on the hero dune shot so the drone move reads as OUR camera too.
        tl.fromTo("#s04", { scale: 1.0 }, { scale: 1.08, duration: 2.417, ease: "none" }, 8.100);

        /* ── 07/08/09 · CARD B→C — one card, no cut ─────────────────────── */
        beat("#cardCh", 14.700, 21.733);

        // 07 — "one channel". The lone flame dot carries everything; the other three are dark.
        tl.fromTo("#chStat", { scale: 1.3, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.40, ease: "expo.out" }, 14.760);
        tl.fromTo("#d0 .core", { scale: 0.4, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.36, ease: "back.out(1.6)" }, 14.900);
        tl.fromTo("#d0 .halo", { opacity: 0 }, { opacity: 1, duration: 0.40, ease: "power2.out" }, 14.900);
        // Overload pulse on the single channel — it is visibly doing too much.
        tl.to("#d0", { scale: 1.10, duration: 0.52, repeat: 3, yoyo: true, ease: "sine.inOut" }, 15.300);
        tl.fromTo("#chSub", { y: 22, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.36, ease: "power2.out" }, 15.400);

        // 08 — "we found three more". Recolour-in-place: the numeral swaps, the card does not cut.
        tl.to("#chStat", { scale: 0.82, opacity: 0, duration: 0.22, ease: "power2.in" }, 17.100);
        tl.to("#chSub", { y: -18, opacity: 0, duration: 0.22, ease: "power2.in" }, 17.100);
        tl.call(() => {
          document.getElementById("chStat").childNodes[1].nodeValue = "+3";
          document.getElementById("chSub").textContent = "Three more that fit the brand";
          document.getElementById("chEyebrow").textContent = "What we added";
        }, null, 17.340);
        tl.fromTo("#chStat", { scale: 1.26, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.36, ease: "expo.out" }, 17.400);
        tl.fromTo("#chSub", { y: 20, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.32, ease: "power2.out" }, 17.480);
        // Three dots ignite on "three more" (17.69) and the two beats after it.
        ["#d1", "#d2", "#d3"].forEach((d, i) => {
          tl.fromTo(d + " .core", { scale: 0.4, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.32, ease: "back.out(1.7)" }, 17.690 + i * 0.260);
          tl.fromTo(d + " .halo", { opacity: 0 },
            { opacity: 0.85, duration: 0.36, ease: "power2.out" }, 17.690 + i * 0.260);
        });

        // 09 — "in the right order". Energy pulse runs the wire left→right, in sequence.
        tl.call(() => {
          document.getElementById("chSub").textContent = "Working in the right order";
          document.getElementById("chEyebrow").textContent = "The plan";
        }, null, 19.560);
        tl.fromTo("#chSub", { opacity: 0.15 }, { opacity: 1, duration: 0.30, ease: "power2.out" }, 19.560);
        tl.fromTo("#chPulse", { x: -130, opacity: 0 },
          { x: 414, opacity: 1, duration: 1.30, ease: "power1.inOut" }, 19.700);
        tl.to("#chPulse", { opacity: 0, duration: 0.24, ease: "power2.in" }, 21.000);
        [0, 1, 2, 3].forEach((i) => {
          tl.to("#d" + i, { scale: 1.14, duration: 0.18, ease: "power2.out" }, 19.860 + i * 0.320)
            .to("#d" + i, { scale: 1.0, duration: 0.26, ease: "power2.inOut" }, 20.040 + i * 0.320);
        });

        /* ── 10 · footage — a year later ────────────────────────────────── */
        beat("#s10", 21.733, 23.867);
        tl.fromTo("#s10", { scale: 1.0 }, { scale: 1.06, duration: 2.383, ease: "none" }, 21.733);

        /* ── 11 · CARD D — the 500% callback ────────────────────────────── */
        tl.fromTo("#streakD", { xPercent: -60, opacity: 0, scaleX: 0.6 },
          { xPercent: 40, opacity: 1, scaleX: 1.4, duration: 0.20, ease: "power3.in" }, 23.767)
