<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>mob-armor-social-proof-4x5</title>
    <!-- GSAP vendored locally — a CDN <script> cert-fails in the render env and freezes renders -->
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      /* LOCAL fonts — no network dependency at render time */
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      @font-face { font-family: 'Hedvig Letters Serif'; font-style: normal; font-weight: 400;
        font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1350px; overflow: hidden;
        background: var(--brand-navy);
        font-family: 'Rethink Sans', system-ui, sans-serif;
        color: var(--brand-white);
      }

      /* ── ground ─────────────────────────────────────────────── */
      #bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(78% 46% at 50% 30%, rgba(156,212,255,.11) 0%, rgba(6,40,76,0) 62%),
          var(--brand-navy);
      }

      /* ── footage ──────────────────────────────────────────────────────
         Every <video> is a direct child of the stage — a wrapper that also
         carries data-start makes the frame extractor and the visibility window
         disagree, which shows the wrong source frames. Transform/filter on a
         <video> is fine; width/height/top/left is what freezes it. */
      .shot, .aroll {
        position: absolute; inset: 0; width: 1080px; height: 1350px;
        object-fit: cover; object-position: 50% 42%; will-change: transform, filter;
      }
      .shot  { z-index: 1; }   /* b-roll — sits UNDER the scrim */
      .aroll { z-index: 3; }   /* Sean — sits OVER it, so his face is never dimmed */

      /* One navy scrim for the whole runtime, above the b-roll and below Sean.
         Holds six cuts of client footage together as one piece instead of a reel. */
      #scrim {
        position: absolute; inset: 0; pointer-events: none; z-index: 2;
        background: linear-gradient(180deg, rgba(6,40,76,.34) 0%, rgba(6,40,76,.12) 40%, rgba(6,40,76,.30) 100%);
      }

      /* ── cards: content centres on y=820, bottom 30% stays clear ── */
      .card {
        position: absolute; left: 0; right: 0; top: 190px; height: 770px; z-index: 6;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 25px; padding: 0 78px; text-align: center; will-change: transform, filter;
      }
      .eyebrow {
        font-weight: 800; font-size: 25px; letter-spacing: .30em; text-transform: uppercase;
        color: var(--brand-white);
      }
      .stat {
        font-weight: 800; letter-spacing: -.045em; line-height: .86;
        color: var(--brand-white); position: relative;
      }
      .stat.xl  { font-size: 217px; }
      .stat.lg  { font-size: 212px; }
      .bloom {                            /* flame heat behind the numeral — light, not colour */
        position: absolute; left: 50%; top: 50%; width: 736px; height: 506px;
        transform: translate(-50%,-50%); pointer-events: none; z-index: -1;
        background: radial-gradient(50% 50% at 50% 50%, rgba(255,76,50,.42) 0%, rgba(255,76,50,0) 70%);
        filter: blur(28px);
      }
      .rule { width: 344px; height: 7px; background: var(--brand-flame); transform-origin: 50% 50%; }
      .sub {
        font-weight: 800; font-size: 39px; line-height: 1.14; letter-spacing: -.02em;
        text-transform: uppercase; color: var(--brand-white); max-width: 780px;
      }

      /* Mob Armor wordmark — their guide allows white-on-black only, so it sits on a black chip */
      .ma-chip {
        display: flex; align-items: center; gap: 18px;
        background: #101820; padding: 18px 30px; border-radius: 9px;
      }
      .ma-chip img { width: 248px; height: auto; display: block; }
      .ma-chip.shield img { width: 62px; }
      .ma-chip .lbl {
        font-weight: 800; font-size: 16px; letter-spacing: .22em; text-transform: uppercase;
        color: var(--brand-white); border-left: 2px solid #2a3644; padding-left: 18px;
      }

      /* ── channel diagram ─────────────────────────────────────── */
      .dots { display: flex; align-items: center; justify-content: center; gap: 34px; height: 108px; }
      .dot {
        width: 78px; height: 78px; border-radius: 50%; position: relative;
        border: 4px solid #2f588a; background: rgba(156,212,255,.05);
      }
      .dot .core {
        position: absolute; inset: 13px; border-radius: 50%; background: var(--brand-blue-tint);
        opacity: 0; transform: scale(.4);
      }
      .dot.hot { border-color: var(--brand-flame); }
      .dot.hot .core { background: var(--brand-flame); }
      .dot .halo {
        position: absolute; inset: -24px; border-radius: 50%; pointer-events: none; opacity: 0;
        background: radial-gradient(50% 50% at 50% 50%, rgba(156,212,255,.55) 0%, rgba(156,212,255,0) 70%);
      }
      .dot.hot .halo {
        background: radial-gradient(50% 50% at 50% 50%, rgba(255,76,50,.65) 0%, rgba(255,76,50,0) 70%);
      }
      .wire {
        width: 414px; height: 4px; background: #3f6fa8; position: relative; overflow: hidden;
      }
      .wire .pulse {
        position: absolute; top: 0; left: 0; width: 122px; height: 4px;
        background: linear-gradient(90deg, rgba(255,76,50,0), var(--brand-flame), rgba(255,76,50,0));
      }

      /* ── 00/01 · opening card ─────────────────────────────────
         The client's mark and the headline figure are one card. Transparent, so the
         navy #bg and the vignette read through it exactly as they do behind every
         other motion-graphic card. */
      #cardA { position: absolute; inset: 0; z-index: 6; }
      #maHero { width: 505px; height: auto; display: block; }

      /* ── 14 · summary card — both spoken figures, side by side ── */
      .stat.md { font-size: 128px; }
      .duo { display: flex; align-items: center; justify-content: center; gap: 45px; }
      .duo-col { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .duo-rule { width: 3px; height: 122px; background: #2f588a; }
      .duo-lbl {
        font-weight: 800; font-size: 22px; letter-spacing: .22em; text-transform: uppercase;
        color: var(--brand-white);
      }

      /* ── end card ────────────────────────────────────────────── */
      #endcard img.logo { width: 458px; height: auto; }
      #endcard .head {
        font-weight: 800; font-size: 75px; line-height: .98; letter-spacing: -.032em;
        max-width: 690px;
      }
      #endcard .cta {
        font-weight: 800; font-size: 33px; letter-spacing: -.01em; color: var(--brand-white);
        background: var(--brand-flame); padding: 25px 52px; border-radius: 999px;
        box-shadow: 0 26px 78px -20px rgba(255,76,50,.72);
      }

      /* ── persistent logo — positioned, NOT a clip (render engine repositions clips) ── */
      #logo-slot { position: absolute; top: 68px; left: 58px; width: 262px; z-index: 7; }
      #logo-slot img { width: 100%; height: auto; display: block; }

      /* ── unifying texture ────────────────────────────────────── */
      #vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 8;
        background: radial-gradient(ellipse 88% 74% at 50% 46%, rgba(0,0,0,0) 34%, rgba(0,0,0,.44) 100%);
      }
      #grain {                          /* deterministic CSS grain — no PNG, no randomness */
        position: absolute; inset: 0; pointer-events: none; opacity: .34; mix-blend-mode: overlay; z-index: 9;
        background-image:
          radial-gradient(rgba(255,255,255,.030) .5px, transparent .5px),
          radial-gradient(rgba(255,255,255,.020) .5px, transparent .5px),
          radial-gradient(rgba(0,0,0,.030)       .5px, transparent .5px);
        background-size: 3px 3px, 5px 5px, 7px 7px;
        background-position: 0 0, 1px 2px, 3px 1px;
      }

      /* ── whip streaks fired at the two hero cuts ─────────────── */
      .streak {
        position: absolute; left: -60%; top: 44%; width: 220%; height: 10px; z-index: 7;
        background: linear-gradient(90deg, rgba(255,76,50,0), rgba(255,255,255,.95) 45%, rgba(255,76,50,.9) 60%, rgba(255,76,50,0));
        filter: blur(7px); pointer-events: none; opacity: 0;
      }
    </style>
  </head>

  <body>
    <div id="root" data-composition-id="mob-armor-social-proof-4x5"
         data-start="0" data-duration="36.0" data-width="1080" data-height="1350">

      <div id="bg" class="clip" data-start="0" data-duration="36.0" data-track-index="0"></div>

      <div id="scrim" class="clip" data-start="0" data-duration="36.0" data-track-index="10"></div>

      <!-- ══ A-ROLL — Sean to camera ═════════════════════════════
           MEASURED OFFSET: the picture lags the sound by 5 frames (0.167s) in this
           recording — cross-correlating mouth-opening contrast against the audio
           envelope over 303 frames peaks cleanly at -5. So every segment is cut from
           source (composition-time + 0.167) and placed at composition-time, which
           advances the video by exactly that. Do not re-cut these without
           re-applying the offset. -->
      <video id="aMain" class="aroll" src="assets/aroll45/a-main.mp4" muted
             data-start="4.280" data-duration="10.670" data-track-index="11"></video>
      <video id="a10" class="aroll" src="assets/aroll45/a10.mp4" muted
             data-start="21.733" data-duration="2.384" data-track-index="14"></video>
      <video id="a13" class="aroll" src="assets/aroll45/a13.mp4" muted
             data-start="27.200" data-duration="2.617" data-track-index="15"></video>
      <video id="a15" class="aroll" src="assets/aroll45/a15.mp4" muted
             data-start="31.650" data-duration="2.100" data-track-index="16"></video>

      <!-- ══ CARDS ═══════════════════════════════════════════════ -->
      <!-- 00 · the opening card — client's mark and the headline figure together,
           full-bleed on Mob Armor's own black. Logo holds alone until 1.700. -->
      <div id="cardA" class="clip" data-start="0.000" data-duration="4.530" data-track-index="21">
        <div class="card">
          <img id="maHero" src="assets/mobarmor-wordmark-hero.png" alt="Mob Armor" />
          <div class="eyebrow">Total sales</div>
          <div class="stat xl" id="statA"><span class="bloom"></span>+500%</div>
          <div class="rule" id="ruleA"></div>
          <div class="sub" id="subA">In a single year</div>
        </div>
      </div>

      <!-- B/C · 14.700 → 21.733 · one continuous card, no cut -->
      <div id="cardCh" class="card clip" data-start="14.700" data-duration="7.283" data-track-index="23">
        <div class="eyebrow" id="chEyebrow">Where the revenue came from</div>
        <div class="stat lg" id="chStat"><span class="bloom" id="chBloom"></span>1</div>
        <div class="dots" id="chDots">
          <div class="dot hot" id="d0"><span class="halo"></span><span class="core"></span></div>
          <div class="dot" id="d1"><span class="halo"></span><span class="core"></span></div>
          <div class="dot" id="d2"><span class="halo"></span><span class="core"></span></div>
          <div class="dot" id="d3"><span class="halo"></span><span class="core"></span></div>
        </div>
        <div class="wire" id="chWire"><span class="pulse" id="chPulse"></span></div>
        <div class="sub" id="chSub">One channel doing all the work</div>
      </div>

      <!-- D · 23.867 → 25.233 · the 500% callback -->
      <div id="cardD" class="card clip" data-start="23.867" data-duration="1.617" data-track-index="24">
        <div class="eyebrow">A year later</div>
        <div class="stat xl" id="statD"><span class="bloom"></span>+500%</div>
        <div class="rule" id="ruleD"></div>
        <div class="ma-chip shield" id="chipD">
          <img id="maShield" src="assets/mobarmor-shield-white.png" alt="Mob Armor" />
          <span class="lbl">Mob Armor</span>
        </div>
      </div>

      <!-- E · 25.233 → 27.200 · the four channels resolve -->
      <div id="cardE" class="card clip" data-start="25.233" data-duration="2.217" data-track-index="25">
        <div class="eyebrow">Working together</div>
        <div class="stat lg" id="statE"><span class="bloom"></span>4</div>
        <div class="dots" id="eDots">
          <div class="dot hot"><span class="halo"></span><span class="core"></span></div>
          <div class="dot"><span class="halo"></span><span class="core"></span></div>
          <div class="dot"><span class="halo"></span><span class="core"></span></div>
          <div class="dot"><span class="halo"></span><span class="core"></span></div>
        </div>
        <div class="sub" id="subE">Channels &mdash; not one</div>
      </div>

      <!-- F · 29.567 → 31.650 · "This is a real brand with real numbers."
           Both spoken figures together, under the client's mark — a callback to beat 00. -->
      <div id="cardF" class="card clip" data-start="29.567" data-duration="2.333" data-track-index="26">
        <div class="eyebrow">Real numbers</div>
        <div class="duo" id="duo">
          <div class="duo-col"><div class="stat md" id="fStat1">+500%</div><div class="duo-lbl">Total sales</div></div>
          <div class="duo-rule" id="fRule"></div>
          <div class="duo-col"><div class="stat md" id="fStat2">4</div><div class="duo-lbl">Channels</div></div>
        </div>
        <div class="ma-chip" id="chipF">
          <img id="maWordmarkSm" src="assets/mobarmor-wordmark-sm.png" alt="Mob Armor" />
          <span class="lbl">Client</span>
        </div>
      </div>

      <!-- 16 · end card -->
      <div id="endcard" class="card clip" data-start="33.500" data-duration="2.500" data-track-index="27">
        <img class="logo" id="ecLogo" src="assets/ecomiq-logo-white.png" alt="EcomIQ" />
        <div class="head" id="ecHead">See what&rsquo;s possible for yours.</div>
        <div class="cta" id="ecCta">Tap the link</div>
      </div>

      <!-- ══ TOP LAYERS ══════════════════════════════════════════ -->
      <div class="streak clip" id="streakA" data-start="1.600" data-duration="0.600" data-track-index="28"></div>
      <div class="streak clip" id="streakD" data-start="23.767" data-duration="0.600" data-track-index="29"></div>
      <div id="vignette" class="clip" data-start="0" data-duration="36.0" data-track-index="32"></div>
      <div id="grain"    class="clip" data-start="0" data-duration="36.0" data-track-index="33"></div>

      <!-- Logo lives in a positioned, non-clip div so the engine can't reposition it -->
      <div id="logo-slot"><img id="maLogo" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" /></div>

      <audio id="vo" src="assets/vo.m4a" data-start="0" data-duration="36.0" data-track-index="40" data-volume="1"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      (() => {
        const DUR = 36.0;
        const tl = gsap.timeline({ paused: true });

        /* ── Cut-the-curve vertical whip ────────────────────────────────────
           Every seam uses the same pair: the outgoing beat rides UP with blur,
           the incoming beat rises from below with matching blur. Same direction
           both sides, velocity matched at the cut, so no seam reads as a stall. */
        const IN_D = 0.45, OUT_D = 0.30, BLUR = 24;
        function beat(sel, tIn, tOut) {
          // ENTRY — matches the previous beat's -140px / 24px exit, in the same direction.
          tl.fromTo(sel,
            { y: 140, opacity: 0, filter: "blur(" + BLUR + "px)" },
            { y: 0, opacity: 1, filter: "blur(0px)", duration: IN_D, ease: "power2.out" }, tIn);
          // EXIT — matches the next beat's +140px / 24px entry. Starts 0.10s early so the
          // two blurs overlap and the cut hides inside the motion rather than beside it.
          tl.to(sel,
            { y: -140, opacity: 0, filter: "blur(" + BLUR + "px)", duration: OUT_D, ease: "power2.in" },
            tOut - 0.10);
        }
        /* ── Face cut ────────────────────────────────────────────────────────
           A-roll does NOT get the whip. The whip runs 0.45s, and Sean starts speaking
           the moment he cuts in, so the slide-and-blur was covering his first words —
           you heard speech over an unreadable face, which reads as bad lip sync even
           though the A/V is frame-accurate. His face is readable in 4 frames instead. */
        function beatFace(sel, tIn, tOut) {
          tl.fromTo(sel, { opacity: 0, filter: "blur(12px)" },
            { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out" }, tIn);
          tl.to(sel, { opacity: 0, filter: "blur(12px)", duration: 0.10, ease: "power2.in" },
            tOut - 0.06);
        }
        // Slow push. Sean is a locked-off talking head, so every A-roll beat gets one —
        // Law 4: a static frame is a dead frame.
        function push(sel, tIn, dur, to) {
          tl.fromTo(sel, { scale: 1 }, { scale: to, duration: dur, ease: "none" }, tIn);
        }


        /* ── 00/01 · the opening card ───────────────────────────────────
           The client's mark lands first and holds alone for 1.6s (Nate: "first screen
           should be the mob armor logo"), then the figure snaps in above the rule.
           Full-bleed on Mob Armor black, so the logo sits on the ground their guide
           asks for and the ad gets a distinct opening frame. */
        tl.fromTo("#cardA", { opacity: 0 }, { opacity: 1, duration: 0.30, ease: "power2.out" }, 0);
        tl.to("#cardA", { y: -140, opacity: 0, filter: "blur(24px)", duration: OUT_D,
          ease: "power2.in" }, 4.280 - 0.10);
        tl.fromTo("#maHero", { scale: 0.94, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.70, ease: "power3.out" }, 0.10);
        tl.to("#maHero", { scale: 1.03, duration: 1.50, ease: "none" }, 0.80);

        // The vignette breathes for the whole runtime so held frames never freeze.
        tl.to("#vignette", { opacity: 0.88, duration: 5.2, repeat: 6, yoyo: true, ease: "sine.inOut" }, 0);
        // EcomIQ's mark holds off until Sean — the opening frame belongs to the client.
        tl.fromTo("#logo-slot", { opacity: 0, y: -18 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 4.320);

        tl.fromTo("#streakA", { xPercent: -60, opacity: 0, scaleX: 0.6 },
          { xPercent: 40, opacity: 1, scaleX: 1.4, duration: 0.20, ease: "power3.in" }, 1.60)
          .to("#streakA", { xPercent: 130, opacity: 0, duration: 0.22, ease: "power3.out" }, 1.80);

        // Numeral snaps 0.20s AHEAD of the spoken "500%" at 1.90 — the visual leads.
        tl.fromTo("#statA", { scale: 1.34, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.42, ease: "expo.out" }, 1.700);
        tl.fromTo("#cardA .eyebrow", { y: 24, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.36, ease: "power2.out" }, 1.820);
        tl.fromTo("#ruleA", { scaleX: 0 }, { scaleX: 1, duration: 0.40, ease: "power3.out" }, 2.100);
        tl.fromTo("#subA", { y: 26, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.38, ease: "power2.out" }, 3.100);

        /* ── Sean, unbroken 4.280 → 14.700 ──────────────────────────────
           No cut and no re-framing anywhere in here. 4.280 to 14.700 is one
           continuous stretch of the take, so it is one clip with a slow push —
           the only movement on him is the push itself. */
        beatFace("#aMain", 4.280, 14.700);
        push("#aMain", 4.280, 10.420, 1.06);

        /* ── 07/08/09 · CARD B→C — one card, no cut ─────────────────────── */
        beat("#cardCh", 14.700, 21.733);
        tl.fromTo("#chStat", { scale: 1.3, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.40, ease: "expo.out" }, 14.760);
        tl.fromTo("#d0 .core", { scale: 0.4, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.36, ease: "back.out(1.6)" }, 14.900);
        tl.fromTo("#d0 .halo", { opacity: 0 }, { opacity: 1, duration: 0.40, ease: "power2.out" }, 14.900);
        tl.to("#d0", { scale: 1.10, duration: 0.52, repeat: 3, yoyo: true, ease: "sine.inOut" }, 15.300);
        tl.fromTo("#chSub", { y: 22, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.36, ease: "power2.out" }, 15.400);

        tl.to("#chStat", { scale: 0.82, opacity: 0, duration: 0.22, ease: "power2.in" }, 17.100);
        tl.to("#chSub", { y: -18, opacity: 0, duration: 0.22, ease: "power2.in" }, 17.100);
        tl.call(() => {
          document.getElementById("chStat").childNodes[1].nodeValue = "+3";
          document.getElementById("chSub").textContent = "Three more that fit the brand";
          document.getElementById("chEyebrow").textContent = "What we added";
        }, null, 17.340);
        tl.fromTo("#chStat", { scale: 1.26, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.36, ease: "expo.out" }, 17.400);
        tl.fromTo("#chSub", { y: 20, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.32, ease: "power2.out" }, 17.480);
        ["#d1", "#d2", "#d3"].forEach((d, i) => {
          tl.fromTo(d + " .core", { scale: 0.4, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.32, ease: "back.out(1.7)" }, 17.690 + i * 0.260);
          tl.fromTo(d + " .halo", { opacity: 0 },
            { opacity: 0.85, duration: 0.36, ease: "power2.out" }, 17.690 + i * 0.260);
        });

        tl.call(() => {
          document.getElementById("chSub").textContent = "Working in the right order";
          document.getElementById("chEyebrow").textContent = "The plan";
        }, null, 19.560);
        tl.fromTo("#chSub", { opacity: 0.15 }, { opacity: 1, duration: 0.30, ease: "power2.out" }, 19.560);
        tl.fromTo("#chPulse", { x: -150, opacity: 0 },
          { x: 414, opacity: 1, duration: 1.30, ease: "power1.inOut" }, 19.700);
        tl.to("#chPulse", { opacity: 0, duration: 0.24, ease: "power2.in" }, 21.000);
        [0, 1, 2, 3].forEach((i) => {
          tl.to("#d" + i, { scale: 1.14, duration: 0.18, ease: "power2.out" }, 19.860 + i * 0.320)
            .to("#d" + i, { scale: 1.0, duration: 0.26, ease: "power2.inOut" }, 20.040 + i * 0.320);
        });

        /* ── 10 · Sean, "A year later, sales are up over" ───────────────── */
        beatFace("#a10", 21.733, 23.867);
        push("#a10", 21.733, 2.134, 1.03);

        /* ── 11 · CARD D — the 500% callback ────────────────────────────── */
        tl.fromTo("#streakD", { xPercent: -60, opacity: 0, scaleX: 0.6 },
          { xPercent: 40, opacity: 1, scaleX: 1.4, duration: 0.20, ease: "power3.in" }, 23.767)
          .to("#streakD", { xPercent: 130, opacity: 0, duration: 0.22, ease: "power3.out" }, 23.967);

        beat("#cardD", 23.867, 25.233);
        tl.fromTo("#statD", { scale: 1.28, opacity: 0 },
