<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>mob-armor-social-proof</title>
    <!-- GSAP vendored locally — a CDN <script> cert-fails in the render env and freezes renders -->
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      /* LOCAL fonts — no network dependency at render time */
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      @font-face { font-family: 'Hedvig Letters Serif'; font-style: normal; font-weight: 400;
        font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: var(--brand-navy);
        font-family: 'Rethink Sans', system-ui, sans-serif;
        color: var(--brand-white);
      }

      /* ── ground ─────────────────────────────────────────────── */
      #bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(78% 46% at 50% 30%, rgba(156,212,255,.11) 0%, rgba(6,40,76,0) 62%),
          var(--brand-navy);
      }

      /* ── footage ──────────────────────────────────────────────────────
         Every <video> is a direct child of the stage — a wrapper that also
         carries data-start makes the frame extractor and the visibility window
         disagree, which shows the wrong source frames. Transform/filter on a
         <video> is fine; width/height/top/left is what freezes it. */
      .shot, .aroll {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        object-fit: cover; will-change: transform, filter;
      }
      .shot  { z-index: 1; }   /* b-roll — sits UNDER the scrim */
      .aroll { z-index: 3; }   /* Sean — sits OVER it, so his face is never dimmed */

      /* One navy scrim for the whole runtime, above the b-roll and below Sean.
         Holds six cuts of client footage together as one piece instead of a reel. */
      #scrim {
        position: absolute; inset: 0; pointer-events: none; z-index: 2;
        background: linear-gradient(180deg, rgba(6,40,76,.34) 0%, rgba(6,40,76,.12) 40%, rgba(6,40,76,.30) 100%);
      }

      /* ── cards: content centres on y=820, bottom 30% stays clear ── */
      .card {
        position: absolute; left: 0; right: 0; top: 300px; height: 1040px; z-index: 6;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 30px; padding: 0 96px; text-align: center; will-change: transform, filter;
      }
      .eyebrow {
        font-weight: 800; font-size: 30px; letter-spacing: .30em; text-transform: uppercase;
        color: var(--brand-blue-tint);
      }
      .stat {
        font-weight: 800; letter-spacing: -.045em; line-height: .86;
        color: var(--brand-white); position: relative;
      }
      .stat.xl  { font-size: 330px; }
      .stat.lg  { font-size: 260px; }
      .bloom {                            /* flame heat behind the numeral — light, not colour */
        position: absolute; left: 50%; top: 50%; width: 900px; height: 620px;
        transform: translate(-50%,-50%); pointer-events: none; z-index: -1;
        background: radial-gradient(50% 50% at 50% 50%, rgba(255,76,50,.42) 0%, rgba(255,76,50,0) 70%);
        filter: blur(28px);
      }
      .rule { width: 420px; height: 8px; background: var(--brand-flame); transform-origin: 50% 50%; }
      .sub {
        font-weight: 800; font-size: 46px; line-height: 1.14; letter-spacing: -.02em;
        text-transform: uppercase; color: var(--brand-white); max-width: 780px;
      }

      /* Mob Armor wordmark — their guide allows white-on-black only, so it sits on a black chip */
      .ma-chip {
        display: flex; align-items: center; gap: 22px;
        background: #101820; padding: 22px 38px; border-radius: 10px;
      }
      .ma-chip img { width: 300px; height: auto; display: block; }
      .ma-chip.shield img { width: 74px; }
      .ma-chip .lbl {
        font-weight: 800; font-size: 19px; letter-spacing: .22em; text-transform: uppercase;
        color: #7f8b99; border-left: 2px solid #2a3644; padding-left: 22px;
      }

      /* ── channel diagram ─────────────────────────────────────── */
      .dots { display: flex; align-items: center; justify-content: center; gap: 42px; height: 132px; }
      .dot {
        width: 96px; height: 96px; border-radius: 50%; position: relative;
        border: 4px solid #2f588a; background: rgba(156,212,255,.05);
      }
      .dot .core {
        position: absolute; inset: 16px; border-radius: 50%; background: var(--brand-blue-tint);
        opacity: 0; transform: scale(.4);
      }
      .dot.hot { border-color: var(--brand-flame); }
      .dot.hot .core { background: var(--brand-flame); }
      .dot .halo {
        position: absolute; inset: -30px; border-radius: 50%; pointer-events: none; opacity: 0;
        background: radial-gradient(50% 50% at 50% 50%, rgba(156,212,255,.55) 0%, rgba(156,212,255,0) 70%);
      }
      .dot.hot .halo {
        background: radial-gradient(50% 50% at 50% 50%, rgba(255,76,50,.65) 0%, rgba(255,76,50,0) 70%);
      }
      .wire {
        width: 510px; height: 4px; background: #3f6fa8; position: relative; overflow: hidden;
      }
      .wire .pulse {
        position: absolute; top: 0; left: 0; width: 150px; height: 4px;
        background: linear-gradient(90deg, rgba(255,76,50,0), var(--brand-flame), rgba(255,76,50,0));
      }

      /* ── end card ────────────────────────────────────────────── */
      #endcard img.logo { width: 560px; height: auto; }
      #endcard .head {
        font-weight: 800; font-size: 92px; line-height: .98; letter-spacing: -.032em;
        max-width: 830px;
      }
      #endcard .head .em {
        font-family: 'Hedvig Letters Serif', Georgia, serif; font-style: italic; font-weight: 400;
        color: var(--brand-blue-tint);
      }
      #endcard .cta {
        font-weight: 800; font-size: 40px; letter-spacing: -.01em; color: var(--brand-white);
        background: var(--brand-flame); padding: 30px 62px; border-radius: 999px;
        box-shadow: 0 26px 78px -20px rgba(255,76,50,.72);
      }

      /* ── persistent logo — positioned, NOT a clip (render engine repositions clips) ── */
      #logo-slot { position: absolute; top: 96px; left: 72px; width: 320px; z-index: 7; }
      #logo-slot img { width: 100%; height: auto; display: block; }

      /* ── unifying texture ────────────────────────────────────── */
      #grid {
        position: absolute; inset: -120px; pointer-events: none; z-index: 4;
        background:
          repeating-linear-gradient(0deg,  rgba(255,255,255,.062) 0 1px, transparent 1px 90px),
          repeating-linear-gradient(90deg, rgba(255,255,255,.062) 0 1px, transparent 1px 90px);
      }
      #crosshairs { position: absolute; inset: 0; pointer-events: none; opacity: .5; z-index: 5; }
      #crosshairs i { position: absolute; width: 26px; height: 26px; }
      #crosshairs i::before, #crosshairs i::after {
        content: ""; position: absolute; background: rgba(255,255,255,.46);
      }
      #crosshairs i::before { left: 50%; top: 0; width: 1px; height: 100%; }
      #crosshairs i::after  { top: 50%; left: 0; height: 1px; width: 100%; }
      #vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 8;
        background: radial-gradient(ellipse 82% 66% at 50% 44%, rgba(0,0,0,0) 34%, rgba(0,0,0,.44) 100%);
      }
      #grain {                          /* deterministic CSS grain — no PNG, no randomness */
        position: absolute; inset: 0; pointer-events: none; opacity: .34; mix-blend-mode: overlay; z-index: 9;
        background-image:
          radial-gradient(rgba(255,255,255,.030) .5px, transparent .5px),
          radial-gradient(rgba(255,255,255,.020) .5px, transparent .5px),
          radial-gradient(rgba(0,0,0,.030)       .5px, transparent .5px);
        background-size: 3px 3px, 5px 5px, 7px 7px;
        background-position: 0 0, 1px 2px, 3px 1px;
      }

      /* ── whip streaks fired at the two hero cuts ─────────────── */
      .streak {
        position: absolute; left: -60%; top: 44%; width: 220%; height: 10px; z-index: 7;
        background: linear-gradient(90deg, rgba(255,76,50,0), rgba(255,255,255,.95) 45%, rgba(255,76,50,.9) 60%, rgba(255,76,50,0));
        filter: blur(7px); pointer-events: none; opacity: 0;
      }
    </style>
  </head>

  <body>
    <div id="root" data-composition-id="mob-armor-social-proof"
         data-start="0" data-duration="38.6" data-width="1080" data-height="1920">

      <div id="bg" class="clip" data-start="0" data-duration="38.6" data-track-index="0"></div>

      <!-- ══ B-ROLL ══════════════════════════════════════════════ -->
      <!-- 00 · cold open. The first ~1.05s of Sean's take is him setting up at the
           recorder, so the silent lead belongs to the strongest shot in the folder. -->
      <video id="s00" class="shot" src="assets/broll/dunes-drone.mp4" muted
             data-start="0.000" data-duration="1.950" data-track-index="1"></video>
      <!-- 03 · "…total sales after they started working with us." -->
      <video id="s03" class="shot" src="assets/broll/tablet-wall.mp4" muted
             data-start="6.033" data-duration="2.437" data-track-index="2"></video>
      <!-- 05 · "When they came to us," -->
      <video id="s05" class="shot" src="assets/broll/incab-dash.mp4" muted
             data-start="11.733" data-duration="1.717" data-track-index="3"></video>
      <!-- 06 · "almost everything ran through Facebook." -->
      <video id="s06" class="shot" src="assets/broll/load-test.mp4" muted
             data-start="13.200" data-duration="1.750" data-track-index="4"></video>
      <!-- 10a · "A year later," -->
      <video id="s10a" class="shot" src="assets/broll/facility-floor.mp4" muted
             data-start="21.733" data-duration="1.317" data-track-index="5"></video>
      <!-- 10b · "sales are up over" -->
      <video id="s10b" class="shot" src="assets/broll/cnc-sparks.mp4" muted
             data-start="22.800" data-duration="1.317" data-track-index="6"></video>
      <!-- 14 · "This is a real brand with real numbers." -->
      <video id="s14" class="shot" src="assets/broll/radio-guy.mp4" muted
             data-start="29.567" data-duration="2.333" data-track-index="7"></video>

      <div id="scrim" class="clip" data-start="0" data-duration="38.6" data-track-index="10"></div>

      <!-- ══ A-ROLL — Sean to camera ═════════════════════════════
           Each segment's data-start equals its source timecode, and the VO is one
           continuous track from the same file, so the lips stay locked with no offset.
           Never re-trim these to a start that differs from their source time.
           Each also starts ~0.2s BEFORE its first word, so his face is settled and
           readable before he speaks rather than arriving mid-syllable. -->
      <!-- 02 · "That's what happened to Mob Armor's…" (first word 4.44) -->
      <video id="a02" class="aroll" src="assets/aroll/a02.mp4" muted
             data-start="4.280" data-duration="2.000" data-track-index="15"></video>
      <!-- 04 · "And it wasn't a lucky viral moment. It wasn't a magic ad." (first word 8.52) -->
      <video id="a04" class="aroll" src="assets/aroll/a04.mp4" muted
             data-start="8.220" data-duration="3.763" data-track-index="16"></video>
      <!-- 13 · "And that's what the right plan does." (first word 27.43) -->
      <video id="a13" class="aroll" src="assets/aroll/a13.mp4" muted
             data-start="27.200" data-duration="2.617" data-track-index="17"></video>
      <!-- 15 · "If you wanna see what's possible for yours," (first word 31.83) -->
      <video id="a15" class="aroll" src="assets/aroll/a15.mp4" muted
             data-start="31.650" data-duration="2.100" data-track-index="18"></video>

      <!-- ══ TEXTURE (over footage, under type) ══════════════════ -->
      <div id="grid" class="clip" data-start="0" data-duration="38.6" data-track-index="19"></div>
      <div id="crosshairs" class="clip" data-start="0" data-duration="38.6" data-track-index="20">
        <i style="left:264px;  top:474px"></i><i style="left:804px;  top:474px"></i>
        <i style="left:264px;  top:1014px"></i><i style="left:804px; top:1014px"></i>
        <i style="left:534px;  top:744px"></i>
      </div>

      <!-- ══ STAT CARDS ══════════════════════════════════════════ -->
      <!-- A · 1.700 → 4.400 · "…500% in a single year." -->
      <div id="cardA" class="card clip" data-start="1.700" data-duration="2.830" data-track-index="21">
        <div class="eyebrow">Total sales</div>
        <div class="stat xl" id="statA"><span class="bloom"></span>500%</div>
        <div class="rule" id="ruleA"></div>
        <div class="sub" id="subA">In a single year</div>
        <div class="ma-chip" id="chipA">
          <img id="maWordmark" src="assets/mobarmor-logo-white.png" alt="Mob Armor" />
          <span class="lbl">Client</span>
        </div>
      </div>

      <!-- B/C · 14.700 → 21.733 · one continuous card, no cut -->
      <div id="cardCh" class="card clip" data-start="14.700" data-duration="7.283" data-track-index="22">
        <div class="eyebrow" id="chEyebrow">Where the revenue came from</div>
        <div class="stat lg" id="chStat"><span class="bloom" id="chBloom"></span>1</div>
        <div class="dots" id="chDots">
          <div class="dot hot" id="d0"><span class="halo"></span><span class="core"></span></div>
          <div class="dot" id="d1"><span class="halo"></span><span class="core"></span></div>
          <div class="dot" id="d2"><span class="halo"></span><span class="core"></span></div>
          <div class="dot" id="d3"><span class="halo"></span><span class="core"></span></div>
        </div>
        <div class="wire" id="chWire"><span class="pulse" id="chPulse"></span></div>
        <div class="sub" id="chSub">One channel doing all the work</div>
      </div>

      <!-- D · 23.867 → 25.233 · the 500% callback -->
      <div id="cardD" class="card clip" data-start="23.867" data-duration="1.617" data-track-index="23">
        <div class="eyebrow">A year later</div>
        <div class="stat xl" id="statD"><span class="bloom"></span>500%</div>
        <div class="rule" id="ruleD"></div>
        <div class="ma-chip shield" id="chipD">
          <img id="maShield" src="assets/mobarmor-shield-white.png" alt="Mob Armor" />
          <span class="lbl">Mob Armor</span>
        </div>
      </div>

      <!-- E · 25.233 → 27.500 · the four channels resolve -->
      <div id="cardE" class="card clip" data-start="25.233" data-duration="2.217" data-track-index="24">
        <div class="eyebrow">Working together</div>
        <div class="stat lg" id="statE"><span class="bloom"></span>4</div>
        <div class="dots" id="eDots">
          <div class="dot hot"><span class="halo"></span><span class="core"></span></div>
          <div class="dot"><span class="halo"></span><span class="core"></span></div>
          <div class="dot"><span class="halo"></span><span class="core"></span></div>
          <div class="dot"><span class="halo"></span><span class="core"></span></div>
        </div>
        <div class="sub" id="subE">Channels &mdash; not one</div>
      </div>

      <!-- 16 · end card -->
      <div id="endcard" class="card clip" data-start="33.500" data-duration="5.100" data-track-index="25">
        <img class="logo" id="ecLogo" src="assets/ecomiq-logo-white.png" alt="EcomIQ" />
        <div class="head" id="ecHead">See what&rsquo;s <span class="em">possible</span> for yours.</div>
        <div class="cta" id="ecCta">Tap the link &rarr;</div>
      </div>

      <!-- ══ TOP LAYERS ══════════════════════════════════════════ -->
      <div class="streak clip" id="streakA" data-start="1.600" data-duration="0.600" data-track-index="27"></div>
      <div class="streak clip" id="streakD" data-start="23.767" data-duration="0.600" data-track-index="28"></div>
      <div id="vignette" class="clip" data-start="0" data-duration="38.6" data-track-index="32"></div>
      <div id="grain"    class="clip" data-start="0" data-duration="38.6" data-track-index="33"></div>

      <!-- Logo lives in a positioned, non-clip div so the engine can't reposition it -->
      <div id="logo-slot"><img id="maLogo" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" /></div>

      <audio id="vo" src="assets/vo.m4a" data-start="0" data-duration="38.6" data-track-index="40" data-volume="1"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      (() => {
        const DUR = 38.6;
        const tl = gsap.timeline({ paused: true });

        /* ── Cut-the-curve vertical whip ────────────────────────────────────
           Every seam uses the same pair: the outgoing beat rides UP with blur,
           the incoming beat rises from below with matching blur. Same direction
           both sides, velocity matched at the cut, so no seam reads as a stall. */
        const IN_D = 0.45, OUT_D = 0.30, BLUR = 24;
        function beat(sel, tIn, tOut) {
          // ENTRY — matches the previous beat's -140px / 24px exit, in the same direction.
          tl.fromTo(sel,
            { y: 140, opacity: 0, filter: "blur(" + BLUR + "px)" },
            { y: 0, opacity: 1, filter: "blur(0px)", duration: IN_D, ease: "power2.out" }, tIn);
          // EXIT — matches the next beat's +140px / 24px entry. Starts 0.10s early so the
          // two blurs overlap and the cut hides inside the motion rather than beside it.
          tl.to(sel,
            { y: -140, opacity: 0, filter: "blur(" + BLUR + "px)", duration: OUT_D, ease: "power2.in" },
            tOut - 0.10);
        }
        /* ── Face cut ────────────────────────────────────────────────────────
           A-roll does NOT get the whip. The whip runs 0.45s, and Sean starts speaking
           the moment he cuts in, so the slide-and-blur was covering his first words —
           you heard speech over an unreadable face, which reads as bad lip sync even
           though the A/V is frame-accurate. His face is readable in 4 frames instead. */
        function beatFace(sel, tIn, tOut) {
          tl.fromTo(sel, { opacity: 0, filter: "blur(12px)" },
            { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out" }, tIn);
          tl.to(sel, { opacity: 0, filter: "blur(12px)", duration: 0.10, ease: "power2.in" },
            tOut - 0.06);
        }
        // Slow push. Sean is a locked-off talking head, so every A-roll beat gets one —
        // Law 4: a static frame is a dead frame.
        function push(sel, tIn, dur, to) {
          tl.fromTo(sel, { scale: 1 }, { scale: to, duration: dur, ease: "none" }, tIn);
        }

        /* ── 00 · cold open ─────────────────────────────────────────────── */
        // Sean's take opens with him setting up at the recorder — head down, mic not yet
        // raised — so the silent 1.7s lead goes to the strongest shot in the folder
        // instead. He enters properly at 4.280, introducing his own client.
        beat("#s00", 0.000, 1.700);
        push("#s00", 0.000, 1.700, 1.07);
        tl.fromTo("#logo-slot", { opacity: 0, y: -18 },
          { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.25);

        /* Camera never sleeps: the grid drifts and the vignette breathes for the
           whole runtime, so even the held end card is never a frozen frame. */
        tl.fromTo("#grid", { backgroundPosition: "0px 0px, 0px 0px" },
          { backgroundPosition: "0px -90px, -90px 0px", duration: DUR, ease: "none" }, 0);
        tl.to("#vignette", { opacity: 0.88, duration: 5.2, repeat: 7, yoyo: true, ease: "sine.inOut" }, 0);
        tl.fromTo("#crosshairs", { opacity: 0 }, { opacity: 0.5, duration: 1.0, ease: "power2.out" }, 0.4);

        /* ── 01 · CARD A — 500% ─────────────────────────────────────────── */
        // Streak fires ON the cut, not before it — the numeral lands inside the flash.
        tl.fromTo("#streakA", { xPercent: -60, opacity: 0, scaleX: 0.6 },
          { xPercent: 40, opacity: 1, scaleX: 1.4, duration: 0.20, ease: "power3.in" }, 1.60)
          .to("#streakA", { xPercent: 130, opacity: 0, duration: 0.22, ease: "power3.out" }, 1.80);

        beat("#cardA", 1.700, 4.280);
        // Numeral snaps 0.20s AHEAD of the spoken "500%" at 1.90 — the visual leads, so it
        // reads as inevitable rather than reactive.
        tl.fromTo("#statA", { scale: 1.34, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.42, ease: "expo.out" }, 1.700);
        tl.fromTo("#cardA .eyebrow", { y: 24, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.36, ease: "power2.out" }, 1.820);
        tl.fromTo("#ruleA", { scaleX: 0 }, { scaleX: 1, duration: 0.40, ease: "power3.out" }, 2.100);
        // "In a single year" lands on the phrase at 3.21.
        tl.fromTo("#subA", { y: 26, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.38, ease: "power2.out" }, 3.100);
        tl.fromTo("#chipA", { y: 22, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.40, ease: "power2.out" }, 3.450);

        /* ── 02 · Sean's entrance, 0.16s before his first word ──────────── */
        beatFace("#a02", 4.280, 6.033);
        push("#a02", 4.280, 1.753, 1.03);

        /* ── 03 · b-roll on the payoff ──────────────────────────────────── */
        beat("#s03", 6.033, 8.220);
        push("#s03", 6.033, 2.187, 1.06);

        /* ── 04 · Sean's direct-address block ───────────────────────────── */
        // The two "it wasn't…" lines are opinion, so they belong on a face. 3.2s is long at
        // this cut rate, so the sentence boundary at 10.16 gets a punch-in: a deliberate jump
        // hidden inside a 3-frame blur, which re-energises the shot without a second angle.
        beatFace("#a04", 8.220, 11.733);
        tl.fromTo("#a04", { scale: 1 }, { scale: 1.045, duration: 1.940, ease: "none" }, 8.220);
        tl.to("#a04", { filter: "blur(14px)", duration: 0.060, ease: "power2.in" }, 10.100);
        tl.set("#a04", { scale: 1.16 }, 10.160);
        tl.to("#a04", { filter: "blur(0px)", duration: 0.100, ease: "power2.out" }, 10.160);
        tl.to("#a04", { scale: 1.205, duration: 1.573, ease: "none" }, 10.160);

        /* ── 05/06 · client texture under the setup ─────────────────────── */
        beat("#s05", 11.733, 13.200);
        beat("#s06", 13.200, 14.700);

        /* ── 07/08/09 · CARD B→C — one card, no cut ─────────────────────── */
        beat("#cardCh", 14.700, 21.733);

        // 07 — "one channel". The lone flame dot carries everything; the other three are dark.
        tl.fromTo("#chStat", { scale: 1.3, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.40, ease: "expo.out" }, 14.760);
        tl.fromTo("#d0 .core", { scale: 0.4, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.36, ease: "back.out(1.6)" }, 14.900);
        tl.fromTo("#d0 .halo", { opacity: 0 }, { opacity: 1, duration: 0.40, ease: "power2.out" }, 14.900);
        // Overload pulse on the single channel — it is visibly doing too much.
        tl.to("#d0", { scale: 1.10, duration: 0.52, repeat: 3, yoyo: true, ease: "sine.inOut" }, 15.300);
        tl.fromTo("#chSub", { y: 22, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.36, ease: "power2.out" }, 15.400);

        // 08 — "we found three more". Recolour-in-place: the numeral swaps, the card does not cut.
        tl.to("#chStat", { scale: 0.82, opacity: 0, duration: 0.22, ease: "power2.in" }, 17.100);
        tl.to("#chSub", { y: -18, opacity: 0, duration: 0.22, ease: "power2.in" }, 17.100);
        tl.call(() => {
          document.getElementById("chStat").childNodes[1].nodeValue = "+3";
          document.getElementById("chSub").textContent = "Three more that fit the brand";
          document.getElementById("chEyebrow").textContent = "What we added";
        }, null, 17.340);
        tl.fromTo("#chStat", { scale: 1.26, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.36, ease: "expo.out" }, 17.400);
        tl.fromTo("#chSub", { y: 20, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.32, ease: "power2.out" }, 17.480);
        // Three dots ignite on "three more" (17.69) and the two beats after it.
        ["#d1", "#d2", "#d3"].forEach((d, i) => {
          tl.fromTo(d + " .core", { scale: 0.4, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.32, ease: "back.out(1.7)" }, 17.690 + i * 0.260);
          tl.fromTo(d + " .halo", { opacity: 0 },
            { opacity: 0.85, duration: 0.36, ease: "power2.out" }, 17.690 + i * 0.260);
        });

        // 09 — "in the right order". Energy pulse runs the wire left→right, in sequence.
        tl.call(() => {
          document.getElementById("chSub").textContent = "Working in the right order";
          document.getElementById("chEyebrow").textContent = "The plan";
        }, null, 19.560);
        tl.fromTo("#chSub", { opacity: 0.15 }, { opacity: 1, duration: 0.30, ease: "power2.out" }, 19.560);
        tl.fromTo("#chPulse", { x: -150, opacity: 0 },
          { x: 510, opacity: 1, duration: 1.30, ease: "power1.inOut" }, 19.700);
        tl.to("#chPulse", { opacity: 0, duration: 0.24, ease: "power2.in" }, 21.000);
        [0, 1, 2, 3].forEach((i) => {
          tl.to("#d" + i, { scale: 1.14, duration: 0.18, ease: "power2.out" }, 19.860 + i * 0.320)
            .to("#d" + i, { scale: 1.0, duration: 0.26, ease: "power2.inOut" }, 20.040 + i * 0.320);
        });

        /* ── 10a/10b · two quick shots accelerating into the callback ───── */
        beat("#s10a", 21.733, 22.800);
        beat("#s10b", 22.800, 23.867);
        push("#s10a", 21.733, 1.067, 1.05);

        /* ── 11 · CARD D — the 500% callback ────────────────────────────── */
        tl.fromTo("#streakD", { xPercent: -60, opacity: 0, scaleX: 0.6 },
          { xPercent: 40, opacity: 1, scaleX: 1.4, duration: 0.20, ease: "power3.in" }, 23.767)
          .to("#streakD", { xPercent: 130, opacity: 0, duration: 0.22, ease: "power3.out" }, 23.967);

        beat("#cardD", 23.867, 25.233);
        // Faster than Card A — a callback should feel recognised, not re-explained.
        tl.fromTo("#statD", { scale: 1.28, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.34, ease: "expo.out" }, 23.867);
        tl.fromTo("#ruleD", { scaleX: 0 }, { scaleX: 1, duration: 0.32, ease: "power3.out" }, 24.100);
        tl.fromTo("#cardD .eyebrow", { y: 20, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.30, ease: "power2.out" }, 23.960);
        tl.fromTo("#chipD", { y: 18, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.32, ease: "power2.out" }, 24.320);

        /* ── 12 · CARD E — four channels ────────────────────────────────── */
        beat("#cardE", 25.233, 27.200);
        tl.fromTo("#statE", { scale: 1.26, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.36, ease: "expo.out" }, 25.300);
        // All four already lit — the payoff of the diagram built in beats 07–09.
        tl.fromTo("#cardE .dot .core", { scale: 0.5, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(1.6)", stagger: 0.075 }, 25.450);
        tl.fromTo("#cardE .dot .halo", { opacity: 0 },
          { opacity: 0.85, duration: 0.38, ease: "power2.out", stagger: 0.075 }, 25.450);
        tl.fromTo("#subE", { y: 22, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.34, ease: "power2.out" }, 26.100);

        /* ── 13 · Sean draws the conclusion, 0.23s before his first word ── */
        beatFace("#a13", 27.200, 29.567);
        push("#a13", 27.200, 2.367, 1.035);

        /* ── 14 · a real customer, to land "real brand" ─────────────────── */
        beat("#s14", 29.567, 31.650);

        /* ── 15 · Sean hands off to the CTA, 0.18s before his first word ── */
        beatFace("#a15", 31.650, 33.500);
        push("#a15", 31.650, 1.850, 1.03);

        /* ── 16 · end card — the piece stops moving and lets the CTA land ── */
        // Top-left logo hands off to the centred lockup, so the mark is never doubled.
        tl.to("#logo-slot", { opacity: 0, duration: 0.32, ease: "power2.in" }, 33.360);
        // ENTRY only — matches beat 15's -140px / 24px exit. There is no exit tween: this is
        // the held final frame, and blurring it away would eat the outro's stillness.
        tl.fromTo("#endcard", { y: 140, opacity: 0, filter: "blur(24px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power2.out" }, 33.500);
        tl.fromTo("#ecLogo", { y: 26, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.52, ease: "power3.out" }, 33.600);
        tl.fromTo("#ecHead", { y: 30, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.58, ease: "power3.out" }, 33.820);
        // CTA lands while "tap the link to find out more" is still being said.
        tl.fromTo("#ecCta", { scale: 0.86, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.46, ease: "back.out(1.7)" }, 34.200);
        tl.to("#ecCta", { scale: 1.035, duration: 1.5, repeat: 2, yoyo: true, ease: "sine.inOut" }, 35.000);

        // Law 11 — anchor the timeline to the full slot so no tail frame goes black.
        tl.to({}, { duration: DUR }, 0);
        window.__timelines["mob-armor-social-proof"] = tl;
      })();
    </script>
