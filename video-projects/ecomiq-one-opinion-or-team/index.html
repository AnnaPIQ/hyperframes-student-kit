<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>EcomIQ — One opinion, or a whole team? (4:5 Meta feed)</title>
    <!-- GSAP vendored locally — a CDN script cert-fails in the render env -->
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      /* LOCAL font — no network at render time (a CDN fetch is non-deterministic) */
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1350px; overflow: hidden;
        background: #06284C; font-family: 'Rethink Sans', system-ui, sans-serif;
        color: #FFFFFF; }

      /* --- founder A-roll ------------------------------------------------ */
      /* Non-timed wrapper: NEVER animate the <video> itself (frames freeze). */
      #founder-wrap { position: absolute; inset: 0; overflow: hidden; z-index: 1;
        will-change: transform; }
      #founder { position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; display: block; }
      /* navy scrim so the white lockup always separates from the lit backdrop */
      #scrim { position: absolute; inset: 0; z-index: 2; pointer-events: none;
        background:
          linear-gradient(160deg, rgba(6,40,76,.80) 0%, rgba(6,40,76,.30) 26%, rgba(6,40,76,0) 46%),
          radial-gradient(ellipse 86% 62% at 50% 46%, rgba(2,14,30,0) 46%, rgba(2,14,30,.5) 100%); }

      /* Graphic cards stack ABOVE the A-roll. Without an explicit z-index they
         paint behind #founder-wrap (z-index:1) and never appear. */
      .scene-slot { position: absolute; inset: 0; }

      /* --- persistent brand lockup (rides above every scene) -------------- */
      #logo-pin { position: absolute; top: 56px; left: 60px;
        z-index: 60; width: 292px; }
      #logo-pin img { width: 100%; height: auto; display: block;
        filter: drop-shadow(0 6px 22px rgba(0,0,0,.55)); }

      /* --- client b-roll -------------------------------------------------- */
      /* Untimed wrapper carries the drift; never animate the <video> itself. */
      .br-wrap { position: absolute; inset: 0; overflow: hidden; opacity: 0; z-index: 30;
        will-change: transform, filter; }
      .br-wrap video { width: 1080px; height: 1350px; object-fit: cover; display: block; }
      .br-scrim { position: absolute; inset: 0; z-index: 31; pointer-events: none;
        background:
          linear-gradient(180deg, rgba(6,40,76,.88) 0%, rgba(6,40,76,.72) 10%, rgba(6,40,76,0) 30%),
          linear-gradient(0deg,  rgba(6,40,76,.80) 0%, rgba(6,40,76,0) 42%); }
      .br-chip { position: absolute; left: 96px; right: 96px;
        bottom: 330px; z-index: 32; display: flex; flex-direction: column;
        align-items: flex-start; gap: 14px; }
      .br-chip .brname { display: inline-block; padding: 13px 28px; border-radius: 999px;
        background: rgba(6,40,76,.72); border: 1.5px solid rgba(156,212,255,.5);
        font-size: 24px; font-weight: 700; letter-spacing: .2em;
        text-transform: uppercase; color: #FFFFFF; }
      .br-chip .brline { font-size: 44px; font-weight: 800; letter-spacing: -.02em;
        color: #FFFFFF; text-shadow: 0 4px 30px rgba(0,0,0,.7); }

      /* --- act-break light streaks --------------------------------------- */
      .seam { position: absolute; left: -30%; width: 60%; height: 7px; z-index: 70;
        background: linear-gradient(90deg, transparent, #FFFFFF, rgba(255,76,50,.9), transparent);
        filter: blur(9px); top: 46%; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="ecomiq-one-opinion-or-team" data-start="0"
         data-duration="69.0000" data-width="1080" data-height="1350">

      <!-- A-roll runs continuously underneath so lips never drift from the VO.
           Graphic scenes sit on top and reveal it at each seam. -->
      <div id="founder-wrap">
        <video id="founder" src="assets/founder.mp4" data-start="0" data-duration="66.5000"
               data-track-index="0" muted playsinline></video>
      </div>
      <div id="scrim" class="clip" data-start="0" data-duration="69.0000" data-track-index="1"></div>

      <!-- VO: the founder's own audio, trimmed at 6.12s and loudness-normalised -->
      <audio id="vo" src="assets/vo-founder.m4a" data-start="0"
             data-duration="69.0000" data-track-index="2" data-volume="1"></audio>

      <!-- Real client b-roll (aug-general-ad-5 footage). Each <video> is the
           timed element; its wrapper is untimed and carries the drift. -->
      <div id="br0-wrap" class="br-wrap">
        <video id="br0" src="assets/broll-sweetes.mp4" data-start="54.5333"
               data-duration="2.5667" data-track-index="50" muted playsinline></video>
      </div>
      <div id="br0-scrim" class="clip br-scrim" data-start="54.5333" data-duration="2.5667" data-track-index="52"></div>
      <div id="br0-chip" class="clip br-chip" data-start="54.5333" data-duration="2.5667" data-track-index="54"><span class="brname">Sweet E’s</span><span class="brline">real client work</span></div>
      <div id="br1-wrap" class="br-wrap">
        <video id="br1" src="assets/broll-dryft.mp4" data-start="57.1000"

      </div>
      <div id="br1-scrim" class="clip br-scrim" data-start="57.1000" data-duration="2.3000" data-track-index="53"></div>
      <div id="br1-chip" class="clip br-chip" data-start="57.1000" data-duration="2.3000" data-track-index="55"><span class="brname">Dryft Sleep</span></div>

      <!-- graphic beats -->
      <div id="clip-s02-hook-one-brand" class="scene-slot" data-composition-id="s02-hook-one-brand"
           data-composition-src="compositions/s02-hook-one-brand.html"
           data-start="4.8667" data-duration="4.1000"
           data-track-index="10" data-width="1080" data-height="1350"
           style="z-index:10"></div>
      <div id="clip-s03-partner-reveal" class="scene-slot" data-composition-id="s03-partner-reveal"

      <div id="clip-s04-team-grid" class="scene-slot" data-composition-id="s04-team-grid"
           data-composition-src="compositions/s04-team-grid.html"
           data-start="16.3667" data-duration="4.8333"
           data-track-index="12" data-width="1080" data-height="1350"

      <div id="clip-s05-live-brands" class="scene-slot" data-composition-id="s05-live-brands"

           data-start="20.7000" data-duration="3.9333"
           data-track-index="13" data-width="1080" data-height="1350"

      <div id="clip-s06-step-strategy" class="scene-slot" data-composition-id="s06-step-strategy"

           data-track-index="14" data-width="1080" data-height="1350"

      <div id="clip-s07-step-calls" class="scene-slot" data-composition-id="s07-step-calls"

           data-start="36.4333" data-duration="5.7667"
           data-track-index="15" data-width="1080" data-height="1350"

      <div id="clip-s08-step-community" class="scene-slot" data-composition-id="s08-step-community"

           data-track-index="16" data-width="1080" data-height="1350"

      <div id="clip-s10-payoff" class="scene-slot" data-composition-id="s10-payoff"

           data-start="61.4333" data-duration="4.4000"

           style="z-index:17"></div>
      <div id="clip-s11-cta" class="scene-slot" data-composition-id="s11-cta"

           style="z-index:18"></div>

      <!-- act-break streaks -->
      <div id="seam0" class="clip seam" data-start="8.8000" data-duration="0.5000" data-track-index="40"></div>
      <div id="seam1" class="clip seam" data-start="28.5000" data-duration="0.5000" data-track-index="41"></div>
      <div id="seam2" class="clip seam" data-start="54.3667" data-duration="0.5000" data-track-index="42"></div>
      <div id="seam3" class="clip seam" data-start="59.2333" data-duration="0.5000" data-track-index="43"></div>
      <div id="seam4" class="clip seam" data-start="65.1667" data-duration="0.5000" data-track-index="44"></div>

      <!-- persistent lockup, above everything -->
      <div id="logo-pin">
        <img src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
      </div>
    </div>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // lockup settles in over the cold open and holds for the whole piece —
        // except on the CTA card, where the hero lockup takes over. Two wordmarks
        // on one frame reads as a mistake, so the pinned one hands off.
        tl.fromTo("#logo-pin", { opacity: 0, y: -18 },
          { opacity: 1, y: 0, duration: .6, ease: "power3.out" }, .25);
        tl.to("#logo-pin", { opacity: 0, duration: .3, ease: "power2.in" }, 65.3000);

        // slow push on the A-roll for each founder segment (camera never sleeps).
        // Resets between segments are hidden under whichever card is covering.
        tl.fromTo("#founder-wrap", { scale: 1.000 },
          { scale: 1.030, duration: 4.8667, ease: "none", transformOrigin: "50% 42%" }, 0.0000);
        tl.fromTo("#founder-wrap", { scale: 1.030 },
          { scale: 1.000, duration: 3.3333, ease: "none", transformOrigin: "50% 42%" }, 8.9667);
        tl.fromTo("#founder-wrap", { scale: 1.000 },
          { scale: 1.030, duration: 4.0333, ease: "none", transformOrigin: "50% 42%" }, 24.6333);
        tl.fromTo("#founder-wrap", { scale: 1.030 },
          { scale: 1.000, duration: 2.0000, ease: "none", transformOrigin: "50% 42%" }, 34.4333);
        tl.fromTo("#founder-wrap", { scale: 1.000 },
          { scale: 1.030, duration: 2.8667, ease: "none", transformOrigin: "50% 42%" }, 42.2000);
        tl.fromTo("#founder-wrap", { scale: 1.030 },
          { scale: 1.000, duration: 2.9333, ease: "none", transformOrigin: "50% 42%" }, 51.6000);
        tl.fromTo("#founder-wrap", { scale: 1.000 },
          { scale: 1.030, duration: 2.0333, ease: "none", transformOrigin: "50% 42%" }, 59.4000);

        // client b-roll
        tl.set("#br0-wrap", { opacity: 1 }, 54.5333);
        tl.fromTo("#br0-wrap", { scale: 1.07, filter: "blur(16px)" },
          { scale: 1, filter: "blur(0px)", duration: .36, ease: "power3.out" }, 54.5333);
        tl.to("#br0-wrap", { scale: 1.05, duration: 2.2000, ease: "none" }, 54.9000);
        // hard cut out — a fade would ghost the A-roll through for a few frames;
        // the seam streak carries the cut instead
        tl.set("#br0-wrap", { opacity: 0 }, 57.1000);
        tl.fromTo("#br0-chip", { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: .32, ease: "expo.out" }, 54.7000);
        tl.to("#br0-chip", { opacity: 0, duration: .2, ease: "power2.in" }, 56.8333);
        tl.set("#br1-wrap", { opacity: 1 }, 57.1000);
        tl.fromTo("#br1-wrap", { scale: 1.05, filter: "blur(16px)" },
          { scale: 1, filter: "blur(0px)", duration: .36, ease: "power3.out" }, 57.1000);
        tl.to("#br1-wrap", { scale: 1.05, duration: 1.9333, ease: "none" }, 57.4667);
        // hard cut out — a fade would ghost the A-roll through for a few frames;
        // the seam streak carries the cut instead
        tl.set("#br1-wrap", { opacity: 0 }, 59.4000);
        tl.fromTo("#br1-chip", { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: .32, ease: "expo.out" }, 57.2667);
        tl.to("#br1-chip", { opacity: 0, duration: .2, ease: "power2.in" }, 59.1333);

        // act-break light streaks
        tl.fromTo("#seam0", { xPercent: -70, opacity: 0, scaleX: .6 },
          { xPercent: 260, opacity: 1, scaleX: 1.5, duration: .34, ease: "power3.in" }, 8.8000);
        tl.to("#seam0", { opacity: 0, duration: .14 }, 9.2000);
        tl.fromTo("#seam1", { xPercent: -70, opacity: 0, scaleX: .6 },
          { xPercent: 260, opacity: 1, scaleX: 1.5, duration: .34, ease: "power3.in" }, 28.5000);
        tl.to("#seam1", { opacity: 0, duration: .14 }, 28.9000);
        tl.fromTo("#seam2", { xPercent: -70, opacity: 0, scaleX: .6 },
          { xPercent: 260, opacity: 1, scaleX: 1.5, duration: .34, ease: "power3.in" }, 54.3667);
        tl.to("#seam2", { opacity: 0, duration: .14 }, 54.7667);
        tl.fromTo("#seam3", { xPercent: -70, opacity: 0, scaleX: .6 },
          { xPercent: 260, opacity: 1, scaleX: 1.5, duration: .34, ease: "power3.in" }, 59.2333);
        tl.to("#seam3", { opacity: 0, duration: .14 }, 59.6333);
        tl.fromTo("#seam4", { xPercent: -70, opacity: 0, scaleX: .6 },
          { xPercent: 260, opacity: 1, scaleX: 1.5, duration: .34, ease: "power3.in" }, 65.1667);
        tl.to("#seam4", { opacity: 0, duration: .14 }, 65.5667);

        // Law #11 anchor — keep the root alive for its full slot
        tl.to({}, { duration: 69.0000 }, 0);
        window.__timelines['ecomiq-one-opinion-or-team'] = tl;
      })();
    </script>
  </body>
</html>
