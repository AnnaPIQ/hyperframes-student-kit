        };
        // ENTRY — rises from +160px with 28px blur (matches whipOut's -160px/28px on the other side of the seam).

          tl.fromTo(sel, { opacity: 0, y: 160, filter: "blur(28px)" },
            { opacity: 1, y: 0, filter: "blur(0px)", duration: dur, ease: "expo.out", ...nf }, t);

        // EXIT — rides up -160px into 28px blur (matches whipIn's entry).

            { opacity: 0, y: -160, filter: "blur(28px)", duration: dur, ease: "power2.in", ...nf }, t);

        const count = (el, from, to, t, d, ease, fmt) => {

        tl.set("#mg2", { opacity: 0, y: 0, scale: 1, filter: "blur(0px)" }, 0);

        tl.set("#margin-fill", { scaleX: 1, backgroundColor: "#9CD4FF" }, 0);

        // ---- MG1 · 0.35–2.10 · "double your revenue this Black Friday" ---

        tl.fromTo("#mg1 .fig", { scale: 0.7 }, { scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.35);
        count("#mg1-num", 1.0, 2.0, 0.49, 0.75, "power2.inOut", (v) => v.toFixed(1));        // "double" @0.49
        tl.fromTo("#mg1-fill", { scaleX: 0.5 }, { scaleX: 1, duration: 0.75, ease: "power2.inOut" }, 0.49);
        tl.fromTo("#mg1-bf", { color: "#9fb6d4" }, { color: "#FF4C32", duration: 0.2, ease: "power1.out" }, 1.44); // "Black Friday"
        tl.fromTo("#mg1 .fig", { scale: 1 }, { scale: 1.06, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut", ...nf }, 1.44);
        whipOut("#mg1", 2.1);
        tl.fromTo("#scrim", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", ...nf }, 2.1);
        streak(2.2); pulse(2.2);

        // ---- MG2 · 3.18–5.22 · "a bigger discount is not going to get you there" ----
        streak(3.18);
        tl.fromTo("#mg2", { opacity: 0, filter: "blur(24px)", scale: 1.08 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.35, ease: "expo.out" }, 3.14);
        tl.fromTo("#mg2-grid", { backgroundPositionY: "0px" }, { backgroundPositionY: "360px", duration: 2.1, ease: "none" }, 3.14);
        tl.fromTo("#mg2-eyebrow", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 3.25);
        tl.fromTo("#gauge", { scale: 0.6, rotation: -30, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.45, ease: "back.out(1.4)" }, 3.2);
        // discount climbs 10% → 60% across "bigger discount" (3.28–3.92)
        tl.fromTo("#gauge-arc", { attr: { "stroke-dashoffset": 721 } }, { attr: { "stroke-dashoffset": 320.4 }, duration: 0.8, ease: "power2.in" }, 3.3);
        count("#gauge-num", 10, 60, 3.3, 0.8, "power2.in", (v) => `${Math.round(v)}%`);
        tl.fromTo("#margin", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 3.45);
        // …while contribution margin drains 38% → 4%
        tl.fromTo("#margin-fill", { scaleX: 1 }, { scaleX: 0.1, duration: 0.9, ease: "power2.in" }, 3.55);
        count("#margin-val", 38, 4, 3.55, 0.9, "power2.in", (v) => `${Math.round(v)}%`);
        tl.fromTo("#margin-fill", { backgroundColor: "#9CD4FF" }, { backgroundColor: "#FF4C32", duration: 0.5, ease: "none" }, 3.9);
        tl.fromTo("#margin-val", { color: "#FFFFFF" }, { color: "#FF4C32", duration: 0.3, ease: "none" }, 4.1);
        // "not going to get you there" — the 2× goal (callback to MG1) gets struck out
        tl.fromTo("#goal", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 4.0);
        tl.fromTo("#goal-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power4.out" }, 4.42);
        tl.fromTo("#goal b, #goal span", { opacity: 1 }, { opacity: 0.6, duration: 0.25, ease: "power1.out" }, 4.5);
        tl.fromTo("#gauge", { x: 0 }, { x: 14, duration: 0.05, yoyo: true, repeat: 5, ease: "sine.inOut", ...nf }, 4.45);
        // exit whip: takeover rides up, stage b-roll rises in beneath
        tl.fromTo("#mg2", { opacity: 1, y: 0, filter: "blur(0px)" }, { opacity: 0, y: -200, filter: "blur(28px)", duration: 0.3, ease: "power2.in", ...nf }, 5.18);
        streak(5.25);

        // ---- B-roll: stage (5.22–6.52) --------------------------------------
        whipIn("#w-stage", 5.18); drift("#w-stage", 5.18, 1.7, 1.0, 1.08);
        whipOut("#w-stage", 6.42); streak(6.5); pulse(6.5);

        // ---- MG3 · 6.55–7.62 · "completely free webinar" ---------------
        const freeIn = (t0, tFree, tPill) => {
          tl.fromTo("#scrim", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", ...nf }, t0);
          tl.fromTo("#mgfree", { opacity: 0, y: 0, filter: "blur(0px)" }, { opacity: 1, duration: 0.01, ...nf }, t0);
          tl.fromTo("#free-eyebrow", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", ...nf }, t0 + 0.02);
          tl.fromTo("#free-word", { opacity: 0, scale: 2.4, filter: "blur(18px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "expo.out", ...nf }, tFree - 0.08);
          tl.fromTo("#free-pill", { opacity: 0, scale: 0.4, rotation: -20 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.4, ease: "back.out(2.2)", ...nf }, tPill);
        };
        freeIn(6.62, 7.12, 7.28);                                                  // "completely" 6.57 · "free" 7.12 · "webinar" 7.28
        whipOut("#mgfree", 7.64);
        tl.fromTo("#scrim", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", ...nf }, 7.64);

        // ---- B-roll: mentor (9.02–10.76) → cake → dryft (B→B whips) -------
        streak(9.02); pulse(9.02);
        whipIn("#w-mentor", 8.98); drift("#w-mentor", 8.98, 2.0);
        streak(10.78); whipIn("#w-cake", 10.74, 0.35); drift("#w-cake", 10.74, 1.1, 1.06, 1.14);
        streak(11.44); whipIn("#w-dryft", 11.4, 0.35); drift("#w-dryft", 11.4, 1.1, 1.04, 1.12);
        whipOut("#w-dryft", 12.12); streak(12.18); pulse(12.18);
        // the empty wrappers underneath are cleared at the same seam
        tl.set("#w-mentor, #w-cake", { opacity: 0 }, 12.2);

        // ---- MG4 · 10.78–12.12 · "eight and nine figure brands" -------------
        tl.fromTo("#scrim", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", ...nf }, 10.72);
        whipIn("#mg4", 10.76, 0.4);
        tl.fromTo("#mg4 .fig", { x: 90 }, { x: 0, duration: 0.4, ease: "expo.out" }, 10.76);
        // "eight" 10.80 → $10,000,000 · "nine" 11.12 → the extra zero drops in = $100,000,000
        tl.fromTo("#mg4-f8", { opacity: 1 }, { opacity: 0, duration: 0.08, ease: "none" }, 11.1);
        tl.fromTo("#mg4-f9", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 11.1);
        tl.fromTo("#mg4-z", { scale: 2.6, y: -60 }, { scale: 1, y: 0, duration: 0.32, ease: "back.out(2)" }, 11.1);
        tl.fromTo("#mg4-lab8", { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "none" }, 11.12);
        tl.fromTo("#mg4-lab9", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, 11.14);
        tl.fromTo("#mg4-tag", { scale: 1 }, { scale: 1.12, duration: 0.14, yoyo: true, repeat: 1, ease: "sine.inOut" }, 11.14);
        tl.fromTo("#mg4-tag", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", ...nf }, 10.92);
        whipOut("#mg4", 12.12);
        tl.fromTo("#scrim", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", ...nf }, 12.12);

        // ---- B-roll: store (13.00–14.50) -----------------------------------
        streak(13.02); pulse(13.02);
        whipIn("#w-store", 12.98); drift("#w-store", 12.98, 1.9);
        whipOut("#w-store", 14.5); streak(14.55); pulse(14.55);

        // ---- MG5 · 15.50–16.45 · "It's completely free" — FREE callback -----
        freeIn(15.5, 16.0, 16.12);
        whipOut("#mgfree", 16.46);
        tl.fromTo("#scrim", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", ...nf }, 16.46);

        // ---- END CARD · 16.55 → 20.5 · "click the link below" ------------
        streak(16.6);
        tl.fromTo("#card", { opacity: 0, filter: "blur(24px)", scale: 1.06 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.4, ease: "expo.out" }, 16.55);
        tl.fromTo("#card-grid", { backgroundPositionY: "0px" }, { backgroundPositionY: "240px", duration: 3.95, ease: "none" }, 16.55);
        tl.fromTo("#card-logo", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 16.65);
        tl.fromTo("#card-head .em", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.55, ease: "expo.out" }, 16.8);
        tl.fromTo("#card-head", { y: 36 }, { y: 0, duration: 0.6, ease: "power3.out" }, 16.8);
        tl.fromTo("#card-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 17.15);
        // subtle pop-in on "sign up" (18.00), then a finite breathing pulse through the hold
        tl.fromTo("#card-cta", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 17.45);
        tl.fromTo("#card-cta", { scale: 1 }, { scale: 1.05, duration: 0.6, yoyo: true, repeat: 3, ease: "sine.inOut", ...nf }, 18.1);

        // Head words fade in with the serif emphasis (non-em text starts hidden via the parent tween above)
        tl.fromTo("#card-head", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 16.8);

        tl.to({}, { duration: DUR }, 0); // anchor: timeline fills the 20.5s slot
        window.__timelines["bf-webinar-9x16"] = tl;
      })();
    </script>
  </body>
