<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>s2-offer</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Rethink Sans"; font-style:normal; font-weight:400 800; font-display:block;
        src:url(assets/fonts/RethinkSans.woff2) format("woff2"); }
      [data-composition-id="s2-offer"] * { margin:0; padding:0; box-sizing:border-box; }
      [data-composition-id="s2-offer"] { position:absolute; inset:0; overflow:hidden;
        font-family:"Rethink Sans", system-ui, sans-serif; }
      [data-composition-id="s2-offer"] .zone {
        position:absolute; left:70px; right:70px; top:190px; height:660px;
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; }
      [data-composition-id="s2-offer"] .eyebrow {
        font-weight:700; font-size:26px; letter-spacing:.3em; text-transform:uppercase; color:#9cd4ff; }
      [data-composition-id="s2-offer"] .dial { position:relative; width:560px; height:300px; }
      [data-composition-id="s2-offer"] svg { position:absolute; inset:0; overflow:visible; }
      [data-composition-id="s2-offer"] .track { fill:none; stroke:rgba(156,212,255,.26); stroke-width:26; stroke-linecap:round; }
      [data-composition-id="s2-offer"] .fill  { fill:none; stroke:#9cd4ff; stroke-width:26; stroke-linecap:round; }
      [data-composition-id="s2-offer"] .over  { fill:none; stroke:#ff4c32; stroke-width:26; stroke-linecap:round; opacity:.34; }
      [data-composition-id="s2-offer"] .needle { stroke:#ffffff; stroke-width:7; stroke-linecap:round; }
      [data-composition-id="s2-offer"] .cap {
        position:absolute; left:50%; top:214px; transform:translateX(-50%); text-align:center; }
      [data-composition-id="s2-offer"] .cap .lab {
        font-weight:800; font-size:44px; letter-spacing:-.01em; color:#ffffff; }
      [data-composition-id="s2-offer"] .ceil {
        display:inline-flex; align-items:center; gap:14px; padding:14px 26px; border-radius:999px;
        background:#ff4c32; color:#fff; font-weight:800; font-size:26px; letter-spacing:.14em;
        text-transform:uppercase; box-shadow:0 16px 46px -12px rgba(255,76,50,.9); }
      [data-composition-id="s2-offer"] .sub {
        font-weight:600; font-size:30px; color:#dceaf8; text-align:center; max-width:760px; }

      /* ── format overrides (generated) ─────────────────────── */
      [data-composition-id="s2-offer"] .zone { top: 96px; height: 400px; gap: 12px; }
      [data-composition-id="s2-offer"] .eyebrow { font-size: 22px; }
      [data-composition-id="s2-offer"] .dial { width: 420px; height: 226px; }
      [data-composition-id="s2-offer"] .cap { top: 160px; }
      [data-composition-id="s2-offer"] .cap .lab { font-size: 34px; }
      [data-composition-id="s2-offer"] .ceil { padding: 11px 21px; font-size: 21px; }
      [data-composition-id="s2-offer"] .sub { font-size: 24px; max-width: 640px; }
    </style>
  </head>
  <body>
    <div data-composition-id="s2-offer" data-width="1080" data-height="1350" data-duration="3.12">
      <div class="zone">
        <div class="eyebrow" id="s2-eye">Your offer</div>
        <div class="dial">
          <svg viewBox="0 0 560 300">
            <path class="track" d="M50 270 A 230 230 0 0 1 510 270" />
            <path class="over"  id="s2-over" d="M50 270 A 230 230 0 0 1 510 270" />
            <path class="fill"  id="s2-fill" d="M50 270 A 230 230 0 0 1 510 270" />
            <line class="needle" id="s2-needle" x1="280" y1="270" x2="280" y2="86" />
          </svg>
          <div class="cap"><div class="lab" id="s2-lab">Discount</div></div>
        </div>
        <div><span class="ceil" id="s2-ceil">Your ceiling</span></div>
        <div class="sub" id="s2-sub">An offer your margin can actually carry</div>
      </div>
    </div>
    <script>
      (() => {
        window.__timelines = window.__timelines || {};
        const S = '[data-composition-id="s2-offer"] ';
        const SLOT = 3.12;
        const tl = gsap.timeline({ paused: true });
        const LEN = 723; // arc length of the 230r half-circle

        tl.set(S + "#s2-fill", { strokeDasharray: LEN, strokeDashoffset: LEN }, 0);
        tl.set(S + "#s2-over", { strokeDasharray: LEN, strokeDashoffset: LEN }, 0);

        tl.fromTo(S + "#s2-eye", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: .26, ease: "power2.out" }, .12);
        tl.fromTo(S + ".dial", { y: 30, opacity: 0, scale: .94 },
          { y: 0, opacity: 1, scale: 1, duration: .46, ease: "power3.out" }, .2);

        // The affordable band fills; past it the arc is already flame.
        tl.to(S + "#s2-fill", { strokeDashoffset: LEN * 0.46, duration: .78, ease: "power2.out" }, .62);
        tl.to(S + "#s2-over", { strokeDashoffset: 0, duration: .5, ease: "power2.out" }, .62);
        tl.fromTo(S + "#s2-needle",
          { rotation: -90, transformOrigin: "280px 270px" },
          { rotation: 7, duration: .86, ease: "power3.out" }, .62);

        // "support." lands at local 2.60 — the ceiling chip arrives just before it.
        tl.fromTo(S + "#s2-ceil",
          { scale: .8, opacity: 0 },
          { scale: 1, opacity: 1, duration: .34, ease: "back.out(2)" }, 1.52);
        tl.fromTo(S + "#s2-sub", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: .3, ease: "power2.out" }, 1.76);

        // Secondary motion so the tail of the scene is not static.
        tl.to(S + "#s2-needle", { rotation: 2.5, duration: .62, ease: "sine.inOut" }, 1.9);
        tl.to(S + "#s2-needle", { rotation: 7, duration: .6, ease: "sine.inOut" }, 2.52);
        tl.to(S + "#s2-ceil", { scale: 1.045, duration: .5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.0);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines["s2-offer"] = tl;
      })();
    </script>
  </body>
</html>
