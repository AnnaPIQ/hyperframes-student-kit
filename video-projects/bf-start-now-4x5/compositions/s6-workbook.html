<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>s6-workbook</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Rethink Sans"; font-style:normal; font-weight:400 800; font-display:block;
        src:url(assets/fonts/RethinkSans.woff2) format("woff2"); }
      @font-face { font-family:"Hedvig Letters Serif"; font-style:normal; font-weight:400; font-display:block;
        src:url(assets/fonts/HedvigLettersSerif.woff2) format("woff2"); }
      [data-composition-id="s6-workbook"] * { margin:0; padding:0; box-sizing:border-box; }
      [data-composition-id="s6-workbook"] { position:absolute; inset:0; overflow:hidden;
        font-family:"Rethink Sans", system-ui, sans-serif; }
      [data-composition-id="s6-workbook"] .zone {
        position:absolute; left:0; right:0; top:170px; height:690px; }
      [data-composition-id="s6-workbook"] .stack {
        position:absolute; left:50%; top:96px; width:0; height:0; }
      [data-composition-id="s6-workbook"] .sheet {
        position:absolute; width:300px; height:388px; margin:-194px 0 0 -150px; top:194px;
        border-radius:3px; overflow:hidden; background:#fff;
        box-shadow:0 18px 44px -16px rgba(1,8,18,.92), 0 0 0 1px rgba(156,212,255,.2); }
      [data-composition-id="s6-workbook"] .sheet img { display:block; width:100%; height:100%; object-fit:cover; }
      [data-composition-id="s6-workbook"] .cover {
        position:absolute; width:340px; height:440px; margin:-220px 0 0 -170px; top:194px;
        border-radius:4px; overflow:hidden; background:#fff; z-index:5;
        box-shadow:0 30px 70px -20px rgba(1,8,18,.95), 0 0 0 1px rgba(156,212,255,.24); }
      [data-composition-id="s6-workbook"] .cover img { display:block; width:100%; height:100%; object-fit:cover; }
      [data-composition-id="s6-workbook"] .free {
        position:absolute; left:50%; top:0px; transform:translateX(-50%);
        display:inline-flex; align-items:center; gap:12px; padding:14px 30px; border-radius:999px;
        background:#ff4c32; color:#fff; font-weight:800; font-size:26px; letter-spacing:.2em;
        text-transform:uppercase; white-space:nowrap; z-index:9;
        box-shadow:0 18px 48px -14px rgba(255,76,50,.95); }
      [data-composition-id="s6-workbook"] .title {
        position:absolute; left:60px; right:60px; top:532px; text-align:center;
        font-family:"Hedvig Letters Serif", Georgia, serif; font-size:64px; line-height:1.04; color:#fff;
        text-shadow:0 6px 28px rgba(2,14,28,.9); }
      [data-composition-id="s6-workbook"] .meta {
        position:absolute; left:60px; right:60px; top:664px; text-align:center;
        font-weight:800; font-size:23px; letter-spacing:.18em; text-transform:uppercase; color:#9cd4ff; }

      /* ── format overrides (generated) ─────────────────────── */
      [data-composition-id="s6-workbook"] .zone { top: 76px; height: 430px; }
      [data-composition-id="s6-workbook"] .stack { top: 74px; }
      [data-composition-id="s6-workbook"] .cover { width: 230px; height: 298px; margin: -149px 0 0 -115px; top: 132px; }
      [data-composition-id="s6-workbook"] .sheet { width: 204px; height: 264px; margin: -132px 0 0 -102px; top: 132px; }
      [data-composition-id="s6-workbook"] .free { font-size: 21px; padding: 11px 24px; }
      /* The title must clear the bottom of the fanned sheets, not sit on them. */
      [data-composition-id="s6-workbook"] .title { top: 378px; font-size: 44px; }
      [data-composition-id="s6-workbook"] .meta { top: 448px; font-size: 18px; }
    </style>
  </head>
  <body>
    <div data-composition-id="s6-workbook" data-width="1080" data-height="1350" data-duration="4.88">
      <div class="zone">
        <div class="stack">
          <div class="sheet sh" id="s6-sh1" style="transform:translate(-238px,44px) rotate(-13deg)"><img src="assets/print-fulfilment.png" alt="" /></div>
          <div class="sheet sh" id="s6-sh2" style="transform:translate(238px,52px) rotate(13deg)"><img src="assets/print-repeat.png" alt="" /></div>
          <div class="sheet sh" id="s6-sh3" style="transform:translate(0px,86px) rotate(2deg)"><img src="assets/print-mobile.png" alt="" /></div>
          <div class="cover" id="s6-cover"><img src="assets/cover.png" alt="The Black Friday Profit Plan" /></div>
        </div>
        <div class="free" id="s6-free">Free workbook</div>
        <div class="title" id="s6-title">The Black Friday Profit Plan</div>
        <div class="meta" id="s6-meta">8 Parts &middot; 32 Worksheets &middot; 19 Free tools</div>
      </div>
    </div>
    <script>
      (() => {
        window.__timelines = window.__timelines || {};
        const S = '[data-composition-id="s6-workbook"] ';
        const SLOT = 4.88;
        const tl = gsap.timeline({ paused: true });

        tl.fromTo(S + "#s6-cover",
          { y: 120, scale: .86, opacity: 0, filter: "blur(16px)" },
          { y: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: .68, ease: "expo.out" }, .22);
        tl.fromTo(S + ".sh",
          { y: 70, scale: .8, opacity: 0 },
          { y: 0, scale: 1, opacity: 1, duration: .6, ease: "power3.out", stagger: .09 }, .5);

        // "free" is spoken at local 2.69 — the flame chip lands just after it.
        tl.fromTo(S + "#s6-free",
          { scale: .76, opacity: 0 },
          { scale: 1, opacity: 1, duration: .34, ease: "back.out(2.2)" }, 2.8);
        // "Black Friday workbook." runs 3.19–4.17.
        tl.fromTo(S + "#s6-title", { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: .42, ease: "expo.out" }, 3.16);
        tl.fromTo(S + "#s6-meta", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: .32, ease: "power2.out" }, 3.5);

        // The stack keeps breathing.
        tl.fromTo(S + ".stack", { rotate: -1.2 }, { rotate: 1, duration: SLOT, ease: "sine.inOut" }, 0);
        tl.to(S + "#s6-free", { scale: 1.05, duration: .5, ease: "sine.inOut", yoyo: true, repeat: 2 }, 3.3);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines["s6-workbook"] = tl;
      })();
    </script>
  </body>
</html>
