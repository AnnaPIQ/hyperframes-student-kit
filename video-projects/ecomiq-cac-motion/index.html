<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ecomiq-cac-motion</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      @font-face { font-family: 'Hedvig Letters Serif'; font-style: italic; font-weight: 400;
        font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden;
        background: var(--brand-navy); font-family: 'Rethink Sans', system-ui, sans-serif; color: var(--brand-white); }

      #bg { position: absolute; inset: 0; background: var(--brand-navy); }
      .footage { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; transform-origin: center center; display: block; }

      /* Sub-composition layer (the reveal) fills the frame. */
      .scene { position: absolute; inset: 0; }

      /* Unifying texture: breathing vignette + deterministic CSS grain (philosophy 2.1). */
      #vignette { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 78% 62% at 50% 42%, transparent 55%, rgba(2,14,28,.72) 100%); }
      #grain { position: absolute; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: overlay;
        background-image:
          radial-gradient(rgba(255,255,255,.05) 0.5px, transparent 0.6px),
          radial-gradient(rgba(255,255,255,.04) 0.5px, transparent 0.6px),
          radial-gradient(rgba(0,0,0,.05) 0.5px, transparent 0.6px);
        background-size: 3px 3px, 5px 5px, 7px 7px;
        background-position: 0 0, 1px 2px, 2px 1px; }

      /* Persistent logo (scrim keeps the white lockup legible on bright shots). */
      #logo-wrap { position: absolute; top: 0; left: 0; width: 560px; height: 360px; pointer-events: none; }
      #logo-scrim { position: absolute; inset: 0;
        background: radial-gradient(120% 120% at 8% 12%, rgba(3,20,40,.55) 0%, rgba(3,20,40,.30) 34%, rgba(3,20,40,0) 66%); }
      #logo { position: absolute; top: 92px; left: 64px; width: 300px; height: auto; filter: drop-shadow(0 6px 18px rgba(0,0,0,.45)); }

      /* "Free Profitability Bootcamp" graphic on the bootcamp VO line (~17s).
         Sits mid-lower so the very bottom stays clear for captions later. */
      #bootcamp { position: absolute; left: 90px; right: 90px; bottom: 470px; overflow: hidden;
        background: rgba(6,40,76,.72); border: 1px solid var(--brand-border); border-radius: 26px;
        backdrop-filter: blur(10px); padding: 34px 42px 38px; }
      #bootcamp::before { content:""; position:absolute; left:0; top:0; bottom:0; width:10px; background: var(--brand-flame); }
      #bootcamp .eb { font-size: 26px; font-weight:600; letter-spacing:.26em; text-transform:uppercase; color: var(--brand-blue-tint); margin-bottom: 14px; }
      #bootcamp .ttl { font-size: 62px; font-weight: 800; line-height: 1.03; letter-spacing:-.02em; color: var(--brand-white); }
      #bootcamp .ttl b { color: var(--brand-flame); }
      #bootcamp .ul { margin-top: 20px; height: 8px; width: 160px; background: var(--brand-flame); border-radius: 4px; transform-origin: left center; }

      /* ---- END CARD ---- */
      #endcard { position: absolute; inset: 0; overflow: hidden;
        background: radial-gradient(90% 50% at 50% 16%, rgba(156,212,255,.10) 0%, rgba(6,40,76,0) 55%), var(--brand-navy);
        display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 120px; }
      #ec-grid { position: absolute; inset: -20% -20% 0 -20%; height: 120%;
        transform: perspective(900px) rotateX(58deg) translateY(6%); transform-origin: 50% 100%;
        background:
          repeating-linear-gradient(0deg,  rgba(156,212,255,.10) 0 1px, transparent 1px 92px),
          repeating-linear-gradient(90deg, rgba(156,212,255,.10) 0 1px, transparent 1px 92px);
        mask-image: linear-gradient(to top, #000 0%, transparent 72%);
        -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 72%); }
      #ec-bloom { position: absolute; left: -10%; bottom: -18%; width: 120%; height: 55%; background: var(--brand-gradient-2); filter: blur(90px); opacity: .34; }
      #ec-logo { width: 460px; height: auto; margin-bottom: 90px; position: relative; }
      #ec-eyebrow { position: relative; font-size: 30px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: var(--brand-blue-tint); margin-bottom: 34px; }
      #ec-headline { position: relative; font-size: 84px; font-weight: 800; line-height: 1.0; letter-spacing: -.03em; color: var(--brand-white); }
      #ec-cta { position: relative; margin-top: 74px; display: inline-flex; align-items: center; gap: 20px;
        font-size: 44px; font-weight: 700; color: var(--brand-white); background: var(--brand-flame);
        padding: 34px 68px; border-radius: 999px; box-shadow: 0 24px 72px -16px rgba(255,76,50,.62); }
      #ec-cta .arrow { font-size: 46px; line-height: 1; transform: translateY(-2px); }
    </style>
  </head>
  <body>
    <!-- MOTION-GRAPHICS version of the short (~24.5s). Founder VO is the spine;
         the reveal beat (6.6-12.8s) is a hand-built animated sub-composition;
         branded texture (grid/vignette/grain) + a callback tag carry the MG feel. -->
    <div id="root" data-composition-id="ecomiq-cac-motion" data-start="0" data-duration="24.5" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="24.5" data-track-index="0"></div>

      <!-- 1 · Founder VO spine (supercut hook + close) -->
      <video class="footage" id="aroll-video" data-start="0" data-duration="22.6" data-track-index="1"
             src="assets/aroll-short.mp4" muted playsinline></video>

      <!-- 2 · HERO reveal — hand-built motion graphics, covers the splice -->
      <div id="reveal" class="scene clip" data-composition-id="reveal-mg" data-composition-src="compositions/reveal-mg.html"
           data-start="6.6" data-duration="6.2" data-track-index="2" data-width="1080" data-height="1920"></div>

      <!-- 3 · Texture over the founder beats (not over the end card) -->
      <div id="vignette" class="clip" data-start="0" data-duration="20" data-track-index="3"></div>
      <div id="grain" class="clip" data-start="0" data-duration="20" data-track-index="4"></div>

      <!-- 5 · "Free Profitability Bootcamp" graphic on the bootcamp VO line -->
      <div id="bootcamp" class="clip" data-start="16.6" data-duration="3.2" data-track-index="5">
        <div class="eb">More insights inside</div>
        <div class="ttl">The <b>Free</b> Profitability Bootcamp</div>
        <div class="ul"></div>
      </div>

      <!-- 6 & 7 · Persistent logo -->
      <div id="logo-wrap">
        <div id="logo-scrim" class="clip" data-start="0" data-duration="20" data-track-index="6"></div>
        <img id="logo" class="clip" data-start="0" data-duration="20" data-track-index="7" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
      </div>

      <!-- 8 · END CARD -->
      <div id="endcard" class="clip" data-start="20" data-duration="4.5" data-track-index="8">
        <div id="ec-grid"></div>
        <div id="ec-bloom"></div>
        <img id="ec-logo" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
        <div id="ec-eyebrow">More insights like this?</div>
        <div id="ec-headline">The Free<br />Profitability<br />Bootcamp.</div>
        <div id="ec-cta">Sign up here <span class="arrow">&rarr;</span></div>
      </div>

      <!-- 9 · VO -->
      <audio id="aroll-audio" data-start="0" data-duration="22.6" data-track-index="9" data-volume="1" src="assets/aroll-short.mp4"></audio>
      <!-- 10 · Duckable music placeholder (silent, pre-ducked) -->
      <audio id="music-bed" data-start="0" data-duration="24.5" data-track-index="10" data-volume="0.18" src="assets/music-bed-PLACEHOLDER.m4a"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Texture breathes so "still" founder frames stay alive.
      tl.fromTo("#vignette", { opacity:.8 }, { opacity:1, duration:5, ease:"sine.inOut", yoyo:true, repeat:3 }, 0);

      // Logo in; out just before the end card.
      tl.fromTo("#logo-wrap", { opacity:0, y:-18 }, { opacity:1, y:0, duration:.6, ease:"power3.out" }, 0.3)
        .to("#logo-wrap", { opacity:0, duration:.4, ease:"power1.in" }, 19.6)
        .set("#logo-wrap", { opacity:0 }, 20.0);

      // "Free Profitability Bootcamp" graphic slides up on the bootcamp VO line, then clears.
      tl.fromTo("#bootcamp", { opacity:0, y:40 }, { opacity:1, y:0, duration:.55, ease:"power3.out" }, 16.7)
        .fromTo("#bootcamp .ul", { scaleX:0 }, { scaleX:1, duration:.5, ease:"power3.out" }, 17.0)
        .to("#bootcamp", { opacity:0, y:-20, duration:.4, ease:"power1.in" }, 19.4)
        .set("#bootcamp", { opacity:0 }, 19.8);

      // End card: dissolve in, stagger content, shimmer sweep, CTA breathes.
      tl.fromTo("#endcard", { opacity:0 }, { opacity:1, duration:.5, ease:"power2.out" }, 20.0)
        .fromTo("#ec-logo", { opacity:0, y:-18 }, { opacity:1, y:0, duration:.6, ease:"power3.out" }, 20.4)
        .fromTo("#ec-eyebrow", { opacity:0, y:16 }, { opacity:1, y:0, duration:.5, ease:"power2.out" }, 20.6)
        .fromTo("#ec-headline", { opacity:0, y:30 }, { opacity:1, y:0, duration:.7, ease:"power3.out" }, 20.8)
        .fromTo("#ec-cta", { opacity:0, scale:.85 }, { opacity:1, scale:1, duration:.6, ease:"back.out(1.7)" }, 21.2)
        .to("#ec-cta", { scale:1.045, duration:.7, ease:"sine.inOut", yoyo:true, repeat:2 }, 22.0);

      tl.to({}, { duration: 24.5 }, 0); // Law #11 anchor
      window.__timelines["ecomiq-cac-motion"] = tl;
    </script>
  </body>
</html>
