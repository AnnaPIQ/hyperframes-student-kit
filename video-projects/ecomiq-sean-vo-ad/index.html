<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EcomIQ — Behind our coaching (9:16)</title>
    <!-- GSAP vendored locally — CDN cert-fails in the render env and freezes renders -->
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      /* LOCAL fonts — no network dependency at render time */
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      @font-face { font-family: 'Hedvig Letters Serif'; font-style: normal; font-weight: 400;
        font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: var(--brand-bg);
        font-family: 'Rethink Sans', system-ui, sans-serif;
        color: var(--brand-text);
      }

      /* The picture bed: Block A (reel straight) + Block B (authority reprise),
         pre-cut by scripts/build-assets.sh. Muted — Sean's VO is the only voice. */
      #bed { position: absolute; inset: 0; width: 1080px; height: 1920px; z-index: 0; }


      /* ---- A-ROLL PiP ------------------------------------------------------
         Sean's head, circle-masked, top right over the montage. The wrapper is
         what GSAP animates — never the <video> itself (render contract #9). */
      #pip-wrap {
        position: absolute; top: 150px; right: 58px;
        width: 360px; height: 360px;
        border-radius: 50%; overflow: hidden;
        border: 6px solid var(--brand-blue-tint);
        box-shadow: 0 20px 54px -12px rgba(0, 0, 0, 0.62);
        z-index: 5;
      }
      #pip { display: block; width: 100%; height: 100%; object-fit: cover;
        border-radius: 50%; }
      /* ---- END CARD -------------------------------------------------------
         Cross-dissolves in on the word "want" (t=33.70). Navy canvas + the
         house radial bloom, white logo lockup, flame pill. Brand tokens only. */
      #card {
        position: absolute; inset: 0; z-index: 10;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background:
          radial-gradient(90% 50% at 50% 34%, rgba(156, 212, 255, 0.12) 0%, rgba(6, 40, 76, 0) 58%),
          var(--brand-navy);
      }
      #card-bloom {
        position: absolute; left: -10%; bottom: -34%;
        width: 120%; height: 42%;
        background: var(--brand-gradient-2);
        filter: blur(130px); opacity: 0.17;
      }
      /* Logo sits in its own positioned, non-clip wrapper so the render engine
         cannot reposition it (LESSONS.md — "logo drifts"). */
      #logo-wrap { position: relative; z-index: 2; }
      #logo { display: block; width: 560px; height: auto; }
      #rule {
        position: relative; z-index: 2;
        width: 132px; height: 6px; margin-top: 74px;
        background: var(--brand-flame); border-radius: 3px;
        transform-origin: center;
      }
      #cta {
        position: relative; z-index: 2;
        margin-top: 74px;
        display: inline-flex; align-items: center; gap: 20px;
        font-size: 52px; font-weight: 700; letter-spacing: -0.02em;
        color: var(--brand-white); background: var(--brand-flame);
        padding: 36px 76px; border-radius: 999px;
        box-shadow: 0 26px 80px -18px rgba(255, 76, 50, 0.7);
      }
      #cta .arrow { font-size: 54px; line-height: 1; }
    </style>
  </head>
  <body>
    <!-- Render Contract: root carries id, data-composition-id, data-start="0",
         data-width, data-height. Timed children carry data-start/-duration;
         <video>/<audio> never get class="clip". -->
    <div
      id="root"
      data-composition-id="ecomiq-sean-vo-ad"
      data-start="0"
      data-duration="37.6"
      data-width="1080"
      data-height="1920"
    >
      <!-- Picture bed — 34.067s, runs under the dissolve. Montage audio dropped. -->
      <video
        id="bed"
        src="assets/bed-916.mp4"
        muted
        data-start="0"
        data-duration="34.03"
        data-track-index="0"
      ></video>

      <!-- A-roll — Sean's head over the montage, cut from the same in-point as
           the VO so his lips track his voice. Covered by the end card. -->
      <div id="pip-wrap">
        <video
          id="pip"
          src="assets/sean-pip.mp4"
          muted
          data-start="0"
          data-duration="34.03"
          data-track-index="4"
        ></video>
      </div>

      <!-- End card — "want" lands at 33.70; holds to the end. -->
      <div id="card" class="clip" data-start="33.7" data-duration="3.9" data-track-index="1">
        <div id="card-bloom"></div>
        <div id="logo-wrap"><img id="logo" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" /></div>
        <div id="rule"></div>
        <div id="cta">Find out more <span class="arrow">&rarr;</span></div>
      </div>

      <!-- Sean's voiceover — the spine. Source 3.100 -> 39.300. -->
      <audio
        id="vo"
        src="assets/sean-vo.wav"
        data-start="0"
        data-duration="36.2"
        data-volume="1"
        data-track-index="2"
      ></audio>

      <!-- Music-bed placeholder — silent stand-in, swap the file and keep the name.
           Duck target: data-volume="0.13" under speech (~-18 dB), lift to "0.35"
           (~-9 dB) once the card is up at 33.7. -->
      <audio
        id="music"
        src="assets/music-bed.wav"
        data-start="0"
        data-duration="37.6"
        data-volume="0"
        data-track-index="3"
      ></audio>
    </div>

    <script>
      // Render Contract: exactly one paused GSAP timeline keyed to data-composition-id.
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const CARD = 33.7;   // "want" — the end-card trigger
      const DISSOLVE = 0.35;

      // fromTo throughout: these elements start hidden, and gsap.from() on a
      // hidden element resolves to invisible (LESSONS.md).
      // A-roll pops in just after the first shot lands, then holds.
      tl.fromTo("#pip-wrap",
          { opacity: 0, scale: 0.72 },
          { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.35)
        .fromTo("#card", { opacity: 0 }, { opacity: 1, duration: DISSOLVE, ease: "power1.inOut" }, CARD)
        .fromTo("#logo-wrap",
          { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, CARD + 0.16)
        .fromTo("#rule",
          { opacity: 0, scaleX: 0 },
          { opacity: 1, scaleX: 1, duration: 0.45, ease: "power3.out" }, CARD + 0.44)
        .fromTo("#cta",
          { opacity: 0, scale: 0.86 },
          { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, CARD + 0.6)
        // The pill breathes so the card holds attention through the outro.
        .to("#cta", { scale: 1.035, duration: 0.75, ease: "sine.inOut", yoyo: true, repeat: 3 }, CARD + 1.3)
        .fromTo("#cta .arrow", { x: 0 }, { x: 12, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 4 }, CARD + 1.3);

      // Composition duration == tl.duration() (Law #7). Pad to the root value.
      tl.to({}, { duration: 37.6 }, 0);
      window.__timelines["ecomiq-sean-vo-ad"] = tl;
    </script>
  </body>
</html>
