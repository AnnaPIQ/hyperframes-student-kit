<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>EcomIQ — Behind our coaching (1:1)</title>
    <!-- GSAP vendored locally — CDN cert-fails in the render env and freezes renders -->
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      /* LOCAL fonts — no network dependency at render time */
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      @font-face { font-family: 'Hedvig Letters Serif'; font-style: normal; font-weight: 400;
        font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1080px; overflow: hidden;
        background: var(--brand-bg);
        font-family: 'Rethink Sans', system-ui, sans-serif;
        color: var(--brand-text);
      }

      /* Picture bed — the natively-square montage master, same cut list as 9:16. */
      #bed { position: absolute; inset: 0; width: 1080px; height: 1080px; z-index: 0; }

      /* ---- END CARD — same beats as 9:16, scaled for the square frame ---- */
      #card {
        position: absolute; inset: 0; z-index: 10;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background:
          radial-gradient(90% 55% at 50% 32%, rgba(156, 212, 255, 0.12) 0%, rgba(6, 40, 76, 0) 58%),
          var(--brand-navy);
      }
      #card-bloom {
        position: absolute; left: -10%; bottom: -36%;
        width: 120%; height: 46%;
        background: var(--brand-gradient-2);
        filter: blur(120px); opacity: 0.17;
      }
      /* Logo in a positioned, non-clip wrapper so the engine can't move it. */
      #logo-wrap { position: relative; z-index: 2; }
      #logo { display: block; width: 460px; height: auto; }
      #rule {
        position: relative; z-index: 2;
        width: 112px; height: 6px; margin-top: 48px;
        background: var(--brand-flame); border-radius: 3px;
        transform-origin: center;
      }
      #cta {
        position: relative; z-index: 2;
        margin-top: 48px;
        display: inline-flex; align-items: center; gap: 18px;
        font-size: 44px; font-weight: 700; letter-spacing: -0.02em;
        color: var(--brand-white); background: var(--brand-flame);
        padding: 30px 64px; border-radius: 999px;
        box-shadow: 0 22px 70px -16px rgba(255, 76, 50, 0.7);
      }
      #cta .arrow { font-size: 46px; line-height: 1; }
      #sub {
        position: relative; z-index: 2;
        margin-top: 32px;
        font-size: 33px; font-weight: 500; letter-spacing: 0.02em;
        color: var(--brand-blue-tint);
      }
      #sub .em {
        font-family: 'Hedvig Letters Serif', Georgia, serif;
        font-style: italic; font-weight: 400;
        color: var(--brand-blue-tint);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="ecomiq-sean-vo-ad-square"
      data-start="0"
      data-duration="37.6"
      data-width="1080"
      data-height="1080"
    >
      <video
        id="bed"
        src="assets/bed-square.mp4"
        muted
        data-start="0"
        data-duration="34.066"
        data-track-index="0"
      ></video>

      <div id="card" class="clip" data-start="33.7" data-duration="3.9" data-track-index="1">
        <div id="card-bloom"></div>
        <div id="logo-wrap"><img id="logo" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" /></div>
        <div id="rule"></div>
        <div id="cta">Tap the link <span class="arrow">&darr;</span></div>
        <div id="sub">Find out <span class="em">more</span></div>
      </div>

      <audio
        id="vo"
        src="assets/sean-vo.wav"
        data-start="0"
        data-duration="36.2"
        data-volume="1"
        data-track-index="2"
      ></audio>

      <!-- Music-bed placeholder — silent stand-in, swap the file and keep the name.
           Duck target: data-volume="0.13" under speech (~-18 dB), lift to "0.35"
           (~-9 dB) once the card is up at 33.7. -->
      <audio
        id="music"
        src="assets/music-bed.wav"
        data-start="0"
        data-duration="37.6"
        data-volume="0"
        data-track-index="3"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const CARD = 33.7;   // "want" — the end-card trigger
      const DISSOLVE = 0.35;

      tl.fromTo("#card", { opacity: 0 }, { opacity: 1, duration: DISSOLVE, ease: "power1.inOut" }, CARD)
        .fromTo("#logo-wrap",
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, CARD + 0.16)
        .fromTo("#rule",
          { opacity: 0, scaleX: 0 },
          { opacity: 1, scaleX: 1, duration: 0.45, ease: "power3.out" }, CARD + 0.44)
        .fromTo("#cta",
          { opacity: 0, scale: 0.86 },
          { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, CARD + 0.6)
        .fromTo("#sub",
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, CARD + 0.92)
        .to("#cta", { scale: 1.035, duration: 0.75, ease: "sine.inOut", yoyo: true, repeat: 3 }, CARD + 1.3)
        .fromTo("#cta .arrow", { y: -2 }, { y: 10, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 4 }, CARD + 1.3);

      tl.to({}, { duration: 37.6 }, 0);
      window.__timelines["ecomiq-sean-vo-ad-square"] = tl;
    </script>
  </body>
</html>
