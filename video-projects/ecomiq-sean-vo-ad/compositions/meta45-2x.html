<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=2700" />
    <title>EcomIQ — Behind our coaching (4:5 @ 2x)</title>
    <!-- GSAP vendored locally — CDN cert-fails in the render env and freezes renders -->
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      /* LOCAL fonts — no network dependency at render time */
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      @font-face { font-family: 'Hedvig Letters Serif'; font-style: normal; font-weight: 400;
        font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 2160px; height: 2700px; overflow: hidden;
        background: var(--brand-bg);
        font-family: 'Rethink Sans', system-ui, sans-serif;
        color: var(--brand-text);
      }

      /* Picture bed — the 9:16 master centre-cropped to 4:5 (see EDIT-PLAN.md),
         same cut list, same 0.813x retime. */
      #bed { position: absolute; inset: 0; width: 2160px; height: 2700px; z-index: 0; }


      /* ---- A-ROLL PiP ------------------------------------------------------
         Sean's head, circle-masked, top right over the montage. The wrapper is
         what GSAP animates — never the <video> itself (render contract #9). */
      #pip-wrap {
        position: absolute; top: 184px; right: 116px;
        width: 660px; height: 660px;
        border-radius: 50%; overflow: hidden;
        border: 12px solid var(--brand-blue-tint);
        box-shadow: 0 36px 96px -24px rgba(0, 0, 0, 0.62);
        z-index: 5;
      }
      #pip { display: block; width: 100%; height: 100%; object-fit: cover;
        border-radius: 50%; }

      /* 2x sibling of meta45.html — every px doubled so Chrome lays the page
         out at 2160x2700 and rasterises type, SVG and CSS at true 2x. Keep the
         two files in step; this one is generated, not hand-tuned. */

      /* ---- BRAND BUG -------------------------------------------------------
         Small white lockup, top left, mirroring the PiP's top offset. Wrapped
         in a positioned, non-clip div so the render engine can't move it
         (LESSONS.md — "logo drifts"). Drop shadow keeps it legible over the
         reel's bright shots. */
      #bug-wrap {
        position: absolute; top: 184px; left: 116px;
        z-index: 5;
        filter: drop-shadow(0 10px 32px rgba(0,0,0,0.55));
      }
      #bug { display: block; width: 440px; height: auto; }
      /* ---- END CARD — same beats as 9:16, scaled for the square frame ---- */
      #card {
        position: absolute; inset: 0; z-index: 10;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background:
          radial-gradient(90% 55% at 50% 32%, rgba(156, 212, 255, 0.12) 0%, rgba(6, 40, 76, 0) 58%),
          var(--brand-navy);
      }
      #card-bloom {
        position: absolute; left: -10%; bottom: -36%;
        width: 120%; height: 46%;
        background: var(--brand-gradient-2);
        filter: blur(240px); opacity: 0.17;
      }
      /* Logo in a positioned, non-clip wrapper so the engine can't move it. */
      #logo-wrap { position: relative; z-index: 2; }
      #logo { display: block; width: 1040px; height: auto; }
      #rule {
        position: relative; z-index: 2;
        width: 248px; height: 12px; margin-top: 124px;
        background: var(--brand-flame); border-radius: 6px;
        transform-origin: center;
      }
      #cta {
        position: relative; z-index: 2;
        margin-top: 124px;
        display: inline-flex; align-items: center; gap: 36px;
        font-size: 96px; font-weight: 700; letter-spacing: -0.02em;
        color: var(--brand-white); background: var(--brand-flame);
        padding: 66px 140px; border-radius: 1998px;
        box-shadow: 0 44px 140px -32px rgba(255, 76, 50, 0.7);
      }
      #cta .arrow { font-size: 100px; line-height: 1; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="ecomiq-sean-vo-ad-45-2x"
      data-start="0"
      data-duration="37.6"
      data-width="2160"
      data-height="2700"
    >
      <video
        id="bed"
        src="assets/bed-45.mp4"
        muted
        data-start="0"
        data-duration="34.03"
        data-track-index="0"
      ></video>

      <!-- Brand bug — small white lockup, top left, over the montage.
           Covered by the end card, which carries the full-size lockup. -->
      <div id="bug-wrap"><img id="bug" src="assets/ecomiq-logo-white.png" alt="EcomIQ" /></div>

      <!-- A-roll — Sean's head over the montage, cut from the same in-point as
           the VO so his lips track his voice. Covered by the end card. -->
      <div id="pip-wrap">
        <video
          id="pip"
          src="assets/sean-pip.mp4"
          muted
          data-start="0"
          data-duration="34.03"
          data-track-index="4"
        ></video>
      </div>

      <div id="card" class="clip" data-start="33.7" data-duration="3.9" data-track-index="1">
        <div id="card-bloom"></div>
        <div id="logo-wrap"><img id="logo" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" /></div>
        <div id="rule"></div>
        <div id="cta">Find out more <span class="arrow">&rarr;</span></div>
      </div>

      <audio
        id="vo"
        src="assets/sean-vo.wav"
        data-start="0"
        data-duration="36.2"
        data-volume="1"
        data-track-index="2"
      ></audio>

      <!-- Music-bed placeholder — silent stand-in, swap the file and keep the name.
           Duck target: data-volume="0.13" under speech (~-18 dB), lift to "0.35"
           (~-9 dB) once the card is up at 33.7. -->
      <audio
        id="music"
        src="assets/music-bed.wav"
        data-start="0"
        data-duration="37.6"
        data-volume="0"
        data-track-index="3"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const CARD = 33.7;   // "want" — the end-card trigger
      const DISSOLVE = 0.35;

      // A-roll pops in just after the first shot lands, then holds.
      tl.fromTo("#bug-wrap",
          { opacity: 0, y: -28 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.25)
        .fromTo("#pip-wrap",
          { opacity: 0, scale: 0.72 },
          { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.35)
        .fromTo("#card", { opacity: 0 }, { opacity: 1, duration: DISSOLVE, ease: "power1.inOut" }, CARD)
        .fromTo("#logo-wrap",
          { opacity: 0, y: 52 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, CARD + 0.16)
        .fromTo("#rule",
          { opacity: 0, scaleX: 0 },
          { opacity: 1, scaleX: 1, duration: 0.45, ease: "power3.out" }, CARD + 0.44)
        .fromTo("#cta",
          { opacity: 0, scale: 0.86 },
          { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, CARD + 0.6)
        .to("#cta", { scale: 1.035, duration: 0.75, ease: "sine.inOut", yoyo: true, repeat: 3 }, CARD + 1.3)
        .fromTo("#cta .arrow", { x: 0 }, { x: 24, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 4 }, CARD + 1.3);

      tl.to({}, { duration: 37.6 }, 0);
      window.__timelines["ecomiq-sean-vo-ad-45-2x"] = tl;
    </script>
  </body>
</html>
