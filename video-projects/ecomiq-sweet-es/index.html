<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ecomiq-sweet-es</title>
    <!-- GSAP vendored locally — a CDN script cert-fails in the render env and freezes renders -->
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      /* LOCAL fonts only — no render-time network fetch. Named literally, not via
         var(), because the linter does not resolve custom properties. */
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      /* ---- ratio metrics · make-ratios.py rewrites this block ---------- */
      :root { --inner-top: 190px; --inner-h: 1150px; --end-logo: 720px; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden;
        background: var(--brand-navy);
        font-family: 'Rethink Sans', system-ui, sans-serif; color: var(--brand-white); }

      /* ---- canvas ------------------------------------------------------- */
      #bg { position: absolute; inset: 0;
        background: radial-gradient(90% 50% at 50% 18%, rgba(156,212,255,.10) 0%, rgba(6,40,76,0) 58%), var(--brand-navy); }

      /* ---- footage ------------------------------------------------------
         The wrapper is a plain positioned div (never a clip, so the engine
         cannot reposition it) and is what GSAP animates. Rule 9: never
         animate width/height/top/left on a <video> itself. */
      .shot { position: absolute; inset: 0; overflow: hidden; }
      .drift { position: absolute; inset: 0; }
      .drift video { width: 100%; height: 100%; object-fit: cover; display: block; }

      /* ---- cards --------------------------------------------------------
         Full-bleed navy: position:absolute + inset:0 (z-index is inert
         without it). Content is confined to the top 70% so the bottom ~30%
         stays clear for platform subtitles. */
      .cardwrap { position: absolute; inset: 0; }
      .card { position: absolute; inset: 0; background: var(--brand-navy); }
      .card::after { content: ''; position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(78% 44% at 50% 30%, rgba(156,212,255,.11) 0%, rgba(6,40,76,0) 60%); }
      .inner { position: absolute; left: 0; right: 0; top: var(--inner-top); height: var(--inner-h);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 0 96px; text-align: center; }

      /* Hidden states live in CSS as opacity:0 — tl.set(…, 0) does not render
         on frame 0. Entrances all use gsap.fromTo. */
      .eyebrow, .figure, .label, .row, .name, .barrow, .ecap { opacity: 0; }

      .eyebrow { font-weight: 800; font-size: 34px; letter-spacing: .18em;
        text-transform: uppercase; color: var(--brand-white); opacity: 0; }
      .figure { font-weight: 800; font-size: 230px; line-height: .92; letter-spacing: -.03em;
        margin-top: 30px; font-variant-numeric: tabular-nums; }
      .hair { width: 168px; height: 4px; background: var(--brand-flame); margin: 26px 0 24px;
        border-radius: 2px; transform-origin: 50% 50%; }
      .label { font-weight: 800; font-size: 40px; letter-spacing: .06em; text-transform: uppercase;
        color: var(--brand-white); }

      /* card B — the client roster as real logos. Each brand's own file, used
         unmodified: never redrawn, never recoloured. They are dark marks, so
         each sits on a white chip rather than being inverted to suit the navy. */
      .logos { display: grid; grid-template-columns: repeat(2, 420px); gap: 28px;
        justify-content: center; margin-top: 28px; }
      /* Generous chips with tight padding: these marks have to read on a phone
         in-feed, so each logo fills its chip on whichever axis constrains it. */
      .chip { width: 420px; height: 250px; background: var(--brand-white);
        border-radius: 24px; display: flex; align-items: center; justify-content: center;
        padding: 18px 22px; opacity: 0; }
      /* width/height 100% + object-fit:contain so each mark scales UP to fill
         its chip. With width:auto a logo only ever renders at its intrinsic
         size, which left them far too small to read in-feed. */
      .chip img { width: 100%; height: 100%; object-fit: contain; display: block; }

      /* card D — three measured results, rule of threes */
      .row { display: flex; align-items: center; gap: 40px; width: 100%; max-width: 860px;
        margin: 14px auto; }
      .row b { flex: 0 0 400px; text-align: right; font-weight: 800; font-size: 132px;
        line-height: 1; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
      .row span { flex: 1; text-align: left; font-weight: 800; font-size: 36px;
        letter-spacing: .10em; text-transform: uppercase; color: var(--brand-white); }

      /* card E — labelled bars at the true 1:3 ratio */
      .bars { width: 100%; max-width: 860px; margin: 6px auto 0; }
      /* flex: 0 0 auto everywhere — the row must never shrink a bar, or the
         1:3 ratio silently stops being the real ratio. */
      .barrow { display: flex; align-items: center; gap: 26px; margin: 24px 0; }
      .barrow .cap { flex: 0 0 210px; width: 210px; font-weight: 800; font-size: 27px;
        letter-spacing: .10em; text-transform: uppercase; text-align: right; color: var(--brand-white); }
      .bar { flex: 0 0 auto; height: 76px; background: var(--brand-blue-tint); border-radius: 6px;
        transform: scaleX(0); transform-origin: 0 50%; }
      .barrow .mult { flex: 0 0 auto; font-weight: 800; font-size: 44px; }
      #eBar1 { width: 170px; }   /* 1x */
      #eBar3 { width: 510px; }   /* 3x — exactly three times #eBar1 */

      /* ---- end card ------------------------------------------------------ */
      #eCap { font-size: 150px; text-transform: uppercase; margin-top: 8px; }
      #endLogo { width: var(--end-logo); height: auto; opacity: 0; }
      #endLine { font-weight: 800; font-size: 44px; letter-spacing: .22em; text-transform: uppercase;
        margin-top: 60px; opacity: 0; }
      #endPill { margin-top: 60px; font-weight: 800; font-size: 40px; color: var(--brand-white);
        background: var(--brand-flame); padding: 30px 66px; border-radius: 999px;
        box-shadow: 0 26px 70px -18px rgba(255,76,50,.62); opacity: 0; }

      /* ---- constants on every frame -------------------------------------- */
      #vignette { position: absolute; inset: 0; pointer-events: none;
        /* Deliberately gentle: a heavy navy vignette turns bright bakery
           footage muddy blue-grey (measured against the source clip). */
        background: radial-gradient(ellipse 90% 74% at 50% 44%,
          rgba(3,16,32,0) 56%, rgba(3,16,32,.18) 83%, rgba(2,10,20,.44) 100%); }
      /* Deterministic CSS grain — three tiles, no PNG, no repeat:-1 */
      #grain { position: absolute; inset: 0; pointer-events: none;
        background-image:
          radial-gradient(rgba(255,255,255,.030) 1px, transparent 1px),
          radial-gradient(rgba(255,255,255,.020) 1px, transparent 1px),
          radial-gradient(rgba(255,255,255,.015) 1px, transparent 1px);
        background-size: 3px 3px, 5px 5px, 7px 7px;
        background-position: 0 0, 1px 2px, 3px 1px; }
      /* Logo lives inside a positioned non-clip wrapper so it cannot drift. */
      #logoWrap { position: absolute; top: 74px; left: 74px; width: 300px; }
      #logoWrap img { width: 100%; height: auto; display: block; }
      /* Transitions carry no bright element at all: the energy is movement.
         Each cut is a short scale-and-slide push with just enough blur to
         soften the join — a heavy blur reads as a smear, not as speed. */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="ecomiq-sweet-es" data-start="0" data-duration="46.6"
         data-width="1080" data-height="1920">

      <div id="bg" class="clip" data-start="0" data-duration="46.6" data-track-index="0"></div>

      <!-- ================= FOOTAGE ================= -->
      <div class="shot" id="w-s1"><div class="drift" id="d-s1"><video id="v-s1" src="assets/broll/b1-cake-9x16.mp4" muted
        data-start="0.00" data-duration="3.42" data-track-index="1" data-media-start="0.00"></video></div></div>
      <div class="shot" id="w-s2"><div class="drift" id="d-s2"><video id="v-s2" src="assets/broll/aroll-9x16.mp4" muted

      <div class="shot" id="w-s3"><div class="drift" id="d-s3"><video id="v-s3" src="assets/broll/b2-cookies-9x16.mp4" muted
        data-start="4.65" data-duration="2.87" data-track-index="3" data-media-start="0.00"></video></div></div>
      <div class="shot" id="w-s5"><div class="drift" id="d-s5"><video id="v-s5" src="assets/broll/aroll-9x16.mp4" muted
        data-start="10.85" data-duration="1.32" data-track-index="4" data-media-start="10.85"></video></div></div>
      <div class="shot" id="w-s7"><div class="drift" id="d-s7"><video id="v-s7" src="assets/broll/b3-sprinkle-9x16.mp4" muted
        data-start="15.25" data-duration="2.90" data-track-index="5" data-media-start="0.00"></video></div></div>
      <div class="shot" id="w-s8"><div class="drift" id="d-s8"><video id="v-s8" src="assets/broll/aroll-9x16.mp4" muted
        data-start="17.45" data-duration="2.72" data-track-index="6" data-media-start="17.45"></video></div></div>
      <div class="shot" id="w-s9"><div class="drift" id="d-s9"><video id="v-s9" src="assets/broll/b4-box-9x16.mp4" muted
        data-start="20.05" data-duration="3.57" data-track-index="7" data-media-start="0.00"></video></div></div>
      <div class="shot" id="w-s11"><div class="drift" id="d-s11"><video id="v-s11" src="assets/broll/b7-sean-erica-9x16.mp4" muted
        data-start="23.50" data-duration="2.57" data-track-index="8" data-media-start="0.00"></video></div></div>
      <div class="shot" id="w-s13"><div class="drift" id="d-s13"><video id="v-s13" src="assets/broll/aroll-9x16.mp4" muted
        data-start="29.15" data-duration="2.67" data-track-index="9" data-media-start="29.15"></video></div></div>
      <div class="shot" id="w-s15"><div class="drift" id="d-s15"><video id="v-s15" src="assets/broll/b5-erica-box-9x16.mp4" muted
        data-start="34.90" data-duration="3.80" data-track-index="10" data-media-start="0.00"></video></div></div>
      <div class="shot" id="w-s16"><div class="drift" id="d-s16"><video id="v-s16" src="assets/broll/aroll-9x16.mp4" muted
        data-start="37.95" data-duration="1.87" data-track-index="11" data-media-start="37.95"></video></div></div>

      <!-- ================= FIGURE CARDS ================= -->
      <div class="cardwrap" id="wrapA">
        <div class="card clip" id="cardA" data-start="7.40" data-duration="3.45" data-track-index="20">
          <div class="inner">
            <div class="eyebrow" id="aEye">Your logo. Your photo.</div>
            <div class="figure" id="aFig">0</div>
            <div class="hair" id="aHair"></div>
            <div class="label" id="aLab">Cookies. No problem.</div>
          </div>
        </div>
      </div>

      <div class="cardwrap" id="wrapB">
        <div class="card clip" id="cardB" data-start="12.05" data-duration="3.20" data-track-index="21">
          <div class="inner">
            <div class="eyebrow" id="bEye">They&rsquo;ve made for</div>
            <div class="hair" id="bHair"></div>
            <div class="logos">
              <div class="chip" id="bN1"><img src="assets/logos/nordstrom.svg" alt="Nordstrom" /></div>
              <div class="chip" id="bN2"><img src="assets/logos/tory-burch.png" alt="Tory Burch" /></div>
              <div class="chip" id="bN3"><img src="assets/logos/beyond-yoga.svg" alt="Beyond Yoga" /></div>
              <div class="chip" id="bN4"><img src="assets/logos/lakers.svg" alt="Los Angeles Lakers" /></div>
            </div>
          </div>
        </div>
      </div>

      <div class="cardwrap" id="wrapD">
        <div class="card clip" id="cardD" data-start="25.95" data-duration="3.20" data-track-index="23">
          <div class="inner">
            <div class="eyebrow" id="dEye">Four years with EcomIQ</div>
            <div class="hair" id="dHair"></div>
            <div class="row" id="dR1"><b id="dV1">7&times;</b><span>Sessions</span></div>
            <div class="row" id="dR2"><b id="dV2">+115%</b><span>Total sales</span></div>
            <div class="row" id="dR3"><b id="dV3">+15%</b><span>Avg order value</span></div>
          </div>
        </div>
      </div>

      <div class="cardwrap" id="wrapE">
        <div class="card clip" id="cardE" data-start="31.70" data-duration="3.20" data-track-index="24">
          <div class="inner">
            <div class="eyebrow" id="eEye">They outgrew the old space</div>
            <div class="figure ecap" id="eCap">3&times; the size</div>
            <div class="hair" id="eHair"></div>
            <div class="bars">
              <div class="barrow" id="eRow1"><div class="cap">Old facility</div>
                <div class="bar" id="eBar1"></div><div class="mult">1&times;</div></div>
              <div class="barrow" id="eRow2"><div class="cap">New facility</div>
                <div class="bar" id="eBar3"></div><div class="mult">3&times;</div></div>
            </div>
          </div>
        </div>
      </div>

      <!-- ================= END CARD ================= -->
      <div class="cardwrap" id="wrapEnd">
        <div class="card clip" id="endCard" data-start="39.70" data-duration="6.90" data-track-index="25">
          <div class="inner">
            <img id="endLogo" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
            <div id="endLine">See if we can help you</div>
            <div id="endPill">Find out more</div>
          </div>
        </div>
      </div>

      <!-- ================= CONSTANTS ================= -->
      <div id="vignette" class="clip" data-start="0" data-duration="46.6" data-track-index="30"></div>
      <div id="grain" class="clip" data-start="0" data-duration="46.6" data-track-index="31"></div>
      <div id="logoWrap"><img id="logo" class="clip" data-start="0" data-duration="39.70"
        data-track-index="32" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" /></div>

      <!-- The voiceover. Audio and video share one track-index space. -->
      <audio id="vo" src="assets/vo.m4a" data-start="0" data-duration="41.90" data-track-index="41"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const DUR = 46.6;
      const tl = gsap.timeline({ paused: true });

      /* No figure is ever counted up from 0: a counter puts values on screen
         that are not the real number (a 0->115 tween reads "+110% TOTAL SALES"
         for several frames). Figures land whole, on the spoken word. The one
         text change in the piece (10,000 -> 20,000) is driven by an onUpdate
         that is a pure function of card-local time, so every seek is correct.
         tl.call() never fires under render and is used nowhere. */

      /* Entrance: rises into place. Never a fade-only, never letterSpacing
         (lint rejects it) — tracking is static in CSS. */
      function rise(sel, at, y, dur) {
        tl.fromTo(sel, { opacity: 0, y: y === undefined ? 26 : y },
          { opacity: 1, y: 0, duration: dur || 0.44, ease: 'power3.out' }, at);
      }
      function hair(sel, at) {
        tl.fromTo(sel, { opacity: 0, scaleX: 0 },
          { opacity: 1, scaleX: 1, duration: 0.42, ease: 'power3.out' }, at);
      }

      /* Cards push in on the same beat as the footage cuts. */
      [['#wrapA', 7.40], ['#wrapB', 12.05], ['#wrapD', 25.95],
       ['#wrapE', 31.70], ['#wrapEnd', 39.70]].forEach(([sel, at]) => {
        tl.fromTo(sel, { yPercent: 6, scale: 1.04, filter: 'blur(6px)' },
          { yPercent: 0, scale: 1, filter: 'blur(0px)', duration: 0.22, ease: 'power3.out' }, at);
      });

      /* ---- footage: push in, then the camera never sleeps -------------- */
      const SHOTS = [
        ['#w-s1', '#d-s1', 0.00, 3.42],
        ['#w-s2', '#d-s2', 3.30, 1.47],
        ['#w-s3', '#d-s3', 4.65, 2.87],
        ['#w-s5', '#d-s5', 10.85, 1.32],
        ['#w-s7', '#d-s7', 15.25, 2.90],
        ['#w-s8', '#d-s8', 17.45, 2.72, 'fade'],
        ['#w-s9', '#d-s9', 20.05, 3.57],
        ['#w-s11', '#d-s11', 23.50, 2.57],
        ['#w-s13', '#d-s13', 29.15, 2.67],
        ['#w-s15', '#d-s15', 34.90, 3.80],
        ['#w-s16', '#d-s16', 37.95, 1.87, 'fade']
      ];
      SHOTS.forEach(([wrap, drift, at, dur, mode]) => {
        if (mode === 'fade') {
          /* Two cuts dissolve rather than push, both back into Sean: out of the
             cupcakes and out of Erica. In each case the outgoing shot keeps
             playing underneath on a lower track. */
          tl.fromTo(wrap, { opacity: 0 }, { opacity: 1, duration: 0.50, ease: 'sine.inOut' }, at);
        } else {
          tl.fromTo(wrap, { yPercent: 6, scale: 1.05, filter: 'blur(6px)' },
            { yPercent: 0, scale: 1, filter: 'blur(0px)', duration: 0.22, ease: 'power3.out' }, at);
        }
        tl.fromTo(drift, { scale: 1.0 }, { scale: 1.05, duration: dur, ease: 'none' }, at);
      });

      /* ================= CARD A · 10,000 → 20,000 ================= */
      const A = 7.40;
      rise('#aEye', A + 0.02, 16, 0.24);
      /* Text is a pure function of card-local time, so any seek is correct and
         the render stays deterministic. "10,000" is spoken at 7.46, "20,000"
         at 8.48 — the figure swaps on the second word. */
      (function () {
        const el = document.querySelector('#aFig'), o = { p: 0 }, SPAN = 3.45;
        el.textContent = '10,000';
        tl.to(o, { p: 1, duration: SPAN, ease: 'none',
          onUpdate() { el.textContent = o.p * SPAN < 1.08 ? '10,000' : '20,000'; } }, A);
      })();
      tl.fromTo('#aFig', { opacity: 0, scale: .84, y: 24 },
        { opacity: 1, scale: 1, y: 0, duration: .42, ease: 'back.out(1.6)' }, A + 0.06);
      hair('#aHair', A + 0.40);
      rise('#aLab', A + 0.50, 16, 0.30);
      tl.to('#aFig', { scale: 1.09, duration: .20, yoyo: true, repeat: 1,
        ease: 'sine.inOut' }, A + 1.06);
      tl.to('#aFig', { scale: 1.012, duration: 1.5, ease: 'sine.inOut' }, A + 1.55);

      /* ================= CARD B · client roster ================= */
      const B = 12.05;
      rise('#bEye', B + 0.02, 16, 0.24);
      hair('#bHair', B + 0.14);
      /* each logo lands on the moment its brand is spoken */
      [['#bN1', 0.01], ['#bN2', 0.73], ['#bN3', 1.81], ['#bN4', 2.65]].forEach(([sel, off]) => {
        tl.fromTo(sel, { opacity: 0, y: 26, scale: .94 },
          { opacity: 1, y: 0, scale: 1, duration: .42, ease: 'back.out(1.4)' }, B + off);
      });

      /* ================= CARD D · the hero results card ================= */
      const D = 25.95;
      rise('#dEye', D + 0.02, 16, 0.24);
      hair('#dHair', D + 0.18);
      /* Whole values, punched in on a stagger — never counted up. */
      [['#dR1', 0.30], ['#dR2', 0.58], ['#dR3', 0.86]].forEach(([sel, off]) => {
        tl.fromTo(sel, { opacity: 0, y: 30, scale: .92 },
          { opacity: 1, y: 0, scale: 1, duration: .42, ease: 'back.out(1.5)' }, D + off);
      });

      /* ================= CARD E · 3x the size ================= */
      const E = 31.70;
      rise('#eEye', E + 0.02, 16, 0.24);
      tl.fromTo('#eCap', { opacity: 0, y: 30, scale: .90 },
        { opacity: 1, y: 0, scale: 1, duration: .52, ease: 'back.out(1.5)' }, E + 0.14);
      hair('#eHair', E + 0.52);
      tl.fromTo('#eRow1', { opacity: 0, x: -26 },
        { opacity: 1, x: 0, duration: .40, ease: 'power3.out' }, E + 0.62);
      tl.fromTo('#eBar1', { scaleX: 0 }, { scaleX: 1, duration: .40, ease: 'power2.out' }, E + 0.68);
      tl.fromTo('#eRow2', { opacity: 0, x: -26 },
        { opacity: 1, x: 0, duration: .40, ease: 'power3.out' }, E + 0.90);
      tl.fromTo('#eBar3', { scaleX: 0 }, { scaleX: 1, duration: .78, ease: 'power2.out' }, E + 0.96);
      tl.to('#eCap', { scale: 1.016, duration: 1.3, ease: 'sine.inOut' }, E + 1.7);

      /* ================= END CARD ================= */
      const X = 39.70;
      tl.fromTo('#endLogo', { opacity: 0, scale: .94, y: 16 },
        { opacity: 1, scale: 1, y: 0, duration: .40, ease: 'power3.out' }, X + 0.00);
      rise('#endLine', X + 0.46, 20, 0.42);
      tl.fromTo('#endPill', { opacity: 0, scale: .86 },
        { opacity: 1, scale: 1, duration: .52, ease: 'back.out(1.7)' }, X + 0.82);
      /* Breathing hold — bounded repeats only, never repeat:-1 */
      tl.to('#endPill', { scale: 1.035, duration: 1.15, yoyo: true, repeat: 3,
        ease: 'sine.inOut' }, X + 1.70);
      tl.to('#endLogo', { scale: 1.018, duration: 5.6, ease: 'sine.inOut' }, X + 0.9);

      /* Duration anchor — the composition must fill its slot exactly. */
      tl.to({}, { duration: DUR }, 0);
      window.__timelines['ecomiq-sweet-es'] = tl;
    </script>
  </body>
