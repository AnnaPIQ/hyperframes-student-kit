<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EcomIQ — About Us (30s)</title>
    <!-- GSAP vendored locally — CDN cert-fails in the render env and freezes renders -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      @font-face { font-family: 'Hedvig Letters Serif'; font-style: italic; font-weight: 400;
        font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden;
        background: #06284C; font-family: 'Rethink Sans', system-ui, sans-serif; color: #FFFFFF; }
      #root { position: absolute; inset: 0; background: #06284C; overflow: hidden; }

      /* ---------- footage (clean, no overlays) ---------- */
      .shot { position: absolute; inset: 0; overflow: hidden; opacity: 0; will-change: transform, opacity; }
      .shot video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

      /* ---------- end card only ---------- */
      #outro { position: absolute; inset: 0; z-index: 60; background: #06284C;
        display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 34px; opacity: 0; }
      #outro #bloom { position: absolute; z-index: -1; width: 92%; height: 44%; top: 28%;
        background: radial-gradient(50% 60% at 50% 50%, rgba(156,212,255,.20) 0%, rgba(255,76,50,.10) 55%, transparent 78%); filter: blur(8px); }
      #o-logo { width: 640px; height: auto; }
      #o-tag { font-weight: 700; font-size: 52px; letter-spacing: -.02em; color: #FFFFFF; }
      #o-tag .serif { font-family: 'Hedvig Letters Serif', Georgia, serif; font-style: italic; font-weight: 400; color: #9CD4FF; }
      #o-cta { margin-top: 8px; font-weight: 800; font-size: 44px; color: #FFFFFF; background: #FF4C32;
        padding: 30px 62px; border-radius: 999px; box-shadow: 0 26px 70px -18px rgba(255,76,50,.65); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="ecomiq-about-us" data-start="0" data-duration="30" data-width="1080" data-height="1920">

      <!-- FOOTAGE MONTAGE (video timed; wrapper animated for crossfade + ken-burns) -->
      <div class="shot" id="s1"><video id="v1" src="assets/video/aroll-stage.mp4" muted playsinline data-start="0.0" data-duration="2.9" data-track-index="0" data-media-start="0.6"></video></div>
      <div class="shot" id="s2"><video id="v2" src="assets/video/thinking.mp4" muted playsinline data-start="2.5" data-duration="2.9" data-track-index="1" data-media-start="0.0"></video></div>
      <div class="shot" id="s3"><video id="v3" src="assets/video/klaviyo.mp4" muted playsinline data-start="5.0" data-duration="2.9" data-track-index="0" data-media-start="0.1"></video></div>
      <div class="shot" id="s4"><video id="v4" src="assets/video/laptop-man.mp4" muted playsinline data-start="7.5" data-duration="2.9" data-track-index="1" data-media-start="0.2"></video></div>
      <div class="shot" id="s5"><video id="v5" src="assets/video/women.mp4" muted playsinline data-start="10.0" data-duration="2.9" data-track-index="0" data-media-start="0.4"></video></div>
      <div class="shot" id="s6"><video id="v6" src="assets/video/laughing.mp4" muted playsinline data-start="12.5" data-duration="2.4" data-track-index="1" data-media-start="0.1"></video></div>
      <div class="shot" id="s7"><video id="v7" src="assets/video/industrial.mp4" muted playsinline data-start="14.5" data-duration="2.4" data-track-index="0" data-media-start="0.1"></video></div>
      <div class="shot" id="s8"><video id="v8" src="assets/video/car-la.mp4" muted playsinline data-start="16.5" data-duration="2.9" data-track-index="1" data-media-start="0.3"></video></div>
      <div class="shot" id="s9"><video id="v9" src="assets/video/hotel-couch.mp4" muted playsinline data-start="19.0" data-duration="2.9" data-track-index="0" data-media-start="0.2"></video></div>
      <div class="shot" id="s10"><video id="v10" src="assets/video/aroll-stage.mp4" muted playsinline data-start="21.5" data-duration="3.3" data-track-index="1" data-media-start="1.2"></video></div>

      <!-- END CARD -->
      <div id="outro">
        <div id="bloom"></div>
        <img id="o-logo" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
        <div id="o-tag">E-commerce, <span class="serif">clarified</span>.</div>
        <div id="o-cta">Get started &rarr;</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* footage shot: crossfade in + slow ken-burns (animate wrapper, never the <video>) */
      function shot(sel, start, dur) {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: .45, ease: 'power2.out' }, start);
        tl.fromTo(sel, { scale: 1.06 }, { scale: 1.14, duration: dur + .45, ease: 'none' }, start);
      }
      shot('#s1', 0.0, 2.9);  shot('#s2', 2.5, 2.9);  shot('#s3', 5.0, 2.9);
      shot('#s4', 7.5, 2.9);  shot('#s5', 10.0, 2.9); shot('#s6', 12.5, 2.4);
      shot('#s7', 14.5, 2.4); shot('#s8', 16.5, 2.9); shot('#s9', 19.0, 2.9);
      shot('#s10', 21.5, 3.3);

      /* END CARD (24.4–30) — hold ~5.6s */
      tl.fromTo('#outro', { opacity: 0 }, { opacity: 1, duration: .5 }, 24.4)
        .fromTo('#o-logo', { opacity: 0, y: 30, scale: .92 }, { opacity: 1, y: 0, scale: 1, duration: .9, ease: 'power3.out' }, 24.6)
        .fromTo('#o-tag', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .6, ease: 'power2.out' }, 25.1)
        .fromTo('#o-cta', { opacity: 0, scale: .88 }, { opacity: 1, scale: 1, duration: .6, ease: 'back.out(1.6)' }, 25.4)
        .fromTo('#bloom', { opacity: .4, scale: .9 }, { opacity: 1, scale: 1.08, duration: 3.4, ease: 'sine.inOut' }, 25.5)
        .to('#o-cta', { scale: 1.05, duration: 1.0, ease: 'sine.inOut', repeat: 2, yoyo: true }, 26.4);

      /* Law #11 duration anchor */
      tl.to({}, { duration: 30 }, 0);
      window.__timelines['ecomiq-about-us'] = tl;
    </script>
  </body>
</html>
