<!doctype html>
<html><head><meta charset="utf-8"><title>EcomIQ End Card</title>
<style>
@font-face{font-family:"Rethink Sans";src:url(assets/RethinkSans.woff2) format("woff2");font-weight:400 800}
@font-face{font-family:"Hedvig Letters Serif";src:url(assets/HedvigLettersSerif.woff2) format("woff2")}
:root{--navy:#06284C;--sky:#9CD4FF;--flame:#FF4C32;--white:#fff}
html,body{margin:0;width:1080px;height:1920px;background:var(--navy)}
.card{width:1080px;height:1920px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 75% 50% at 50% 46%,#0f4a80 0%,#0a3764 40%,var(--navy) 80%);text-align:center}
.logo{width:520px;margin-bottom:64px}
h1{font:700 88px/1.08 "Rethink Sans",sans-serif;color:var(--white);margin:0;letter-spacing:-0.5px}
.accent{font:400 84px/1.1 "Hedvig Letters Serif",serif;font-style:italic;color:var(--sky);margin:28px 0 80px}
.btn{font:600 52px/1 "Rethink Sans",sans-serif;color:var(--white);background:var(--flame);padding:38px 76px;border-radius:999px;
  box-shadow:0 0 60px rgba(255,76,50,.55),0 0 140px rgba(255,76,50,.28)}
</style></head>
<body><div class="card">
  <img class="logo" src="assets/ecomiq-logo-white.svg" alt="EcomIQ">
  <h1>You don't have to<br>decide alone</h1>
  <div class="accent">Talk to us</div>
  <div class="btn">Link Below</div>
</div></body></html>
