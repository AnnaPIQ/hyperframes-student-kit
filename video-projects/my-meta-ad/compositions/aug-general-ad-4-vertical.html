<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Aug-General ad 4 — 9:16</title>

    <!-- LESSONS.md: GSAP is vendored locally. A CDN <script> cert-fails in the
         render env and freezes the render. Never swap this for a CDN URL. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />

    <style>
      /* Local .woff2 — no render-time network fetch (render contract rule 11).
         Families are named literally, not via var(), because the linter does not
         resolve custom properties and would false-warn on a missing font. */
      @font-face {
        font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Hedvig Letters Serif'; font-style: normal; font-weight: 400;
        font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2');
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: var(--brand-navy);
        font-family: 'Rethink Sans', system-ui, sans-serif;
        color: var(--brand-text);
      }

      /* ---------------------------------------------------------------------
         VERTICAL LAYOUT MAP (1080x1920)
           y    0 – 1920   A-roll, FULL BLEED (1080x1920). Do not shrink this to
                           "zoom out" — the crop already uses the source's whole
                           2160 height, so this is the widest FOV available, and
                           anything narrower leaves a navy strip that reads as an
                           overlay sitting on the speaker.
           y    0 –  300   logo zone (top-left lockup)
           y  300 – 1050   speaker's face — never covered
           y 1080 – 1400   motion-graphics band
           y 1420 – 1700   CAPTION SAFE ZONE — deliberately left empty
           y 1700 – 1920   platform-UI margin (Reels/TikTok chrome) — left empty
         ------------------------------------------------------------------ */

      /* Never animate width/height/top/left on a <video> (render contract #9). */
      #video {
        position: absolute; inset: 0;
        width: 1080px; height: 1920px; object-fit: cover;
      }

      /* Grade scrim: pulls the blue-lit studio toward the EcomIQ navy and darkens
         top + bottom so the logo and the (later) captions always have contrast. */
      #grade {
        position: absolute; inset: 0; z-index: 2; pointer-events: none;
        background:
          linear-gradient(180deg,
            rgba(6,40,76,.62) 0%, rgba(6,40,76,.16) 18%,
            rgba(6,40,76,.04) 45%, rgba(6,40,76,.42) 78%, rgba(6,40,76,.72) 100%);
      }
      /* Unifying texture #1 — registration crosshairs at the safe-area corners. */
      #marks { position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: .5; }
      /* Unifying texture #2 — vignette on every scene. */
      #vignette {
        position: absolute; inset: 0; z-index: 4; pointer-events: none;
        background: radial-gradient(ellipse 78% 58% at 50% 42%, rgba(0,0,0,0) 42%, rgba(3,18,36,.78) 100%);
      }
      /* Unifying texture #3 — deterministic CSS grain (no PNG, no PRNG). */
      #grain {
        position: absolute; inset: 0; z-index: 9; pointer-events: none; opacity: .055;
        background-image:
          radial-gradient(rgba(255,255,255,.9) .5px, transparent .6px),
          radial-gradient(rgba(255,255,255,.7) .5px, transparent .6px),
          radial-gradient(rgba(0,0,0,.8) .5px, transparent .6px);
        background-size: 3px 3px, 5px 5px, 7px 7px;
        background-position: 0 0, 1px 2px, 3px 1px;
      }

      /* Persistent logo. LESSONS.md: the engine repositions class="clip" nodes, so
         the lockup lives in a positioned NON-clip wrapper and stays put. */
      #logo-wrap { position: absolute; left: 72px; top: 84px; z-index: 8; width: 216px; }
      #logo { display: block; width: 100%; height: auto;
              filter: drop-shadow(0 6px 22px rgba(0,0,0,.72)); }

      /* ---- Motion-graphics band ---- */
      .band {
        position: absolute; left: 72px; right: 72px; top: 1080px; z-index: 5;
        opacity: 0; will-change: transform, opacity, filter;
      }
      .eyebrow {
        font-size: 26px; font-weight: 600; letter-spacing: .34em;
        text-transform: uppercase; color: var(--brand-blue-tint); margin-bottom: 20px;
      }
      .line {
        font-size: 88px; font-weight: 800; line-height: .98; letter-spacing: -.03em;
        color: var(--brand-white); text-shadow: 0 8px 40px rgba(0,0,0,.55);
      }
      .line .em {
        font-family: 'Hedvig Letters Serif', Georgia, serif;
        font-style: italic; font-weight: 400; letter-spacing: -.01em;
        color: var(--brand-blue-tint);
      }
      /* Flame strike-through that wipes across (scaleX 0 -> 1). */
      .strike {
        position: absolute; left: 0; height: 9px; border-radius: 5px;
        background: var(--brand-flame); transform-origin: left center;
        box-shadow: 0 0 26px rgba(255,76,50,.75);
      }

      /* Beat 1 — "MOST ADVICE" */
      #g1 { }
      #g1 .line { position: relative; display: inline-block; }
      #g1 .strike { top: 52px; width: 100%; }

      /* Beat 3 — "DOZENS OF LIVE BRANDS" + store-tile grid */
      /* ---- Beat 3 · client-logo wall + Shopify Premier Partner badge ----
         Mirrors Shopify_Partner_Hero_v2.mp4: real client marks as low-opacity
         white silhouettes drifting on navy, hero badge landing centre. Two
         layers drift at different speeds for parallax. */
      #g3-scrim {
        position: absolute; inset: 0; z-index: 5; opacity: 0; pointer-events: none;
        background:
          radial-gradient(ellipse 82% 56% at 50% 44%, rgba(6,40,76,.80) 0%, rgba(4,24,48,.95) 100%);
      }
      #g3-wall {
        position: absolute; left: 0; top: -220px; width: 1080px; height: 2500px;
        z-index: 6; opacity: 0; pointer-events: none; overflow: hidden;
        /* The wall drifts upward, so without this any logo eventually lands
           behind the persistent EcomIQ lockup. The mask sits on the wrapper
           (which does NOT move — only .lyr children do), so it stays pinned to
           the frame: fully clear over the logo zone, ramping in by frame y 300. */
        -webkit-mask-image: linear-gradient(180deg,
          transparent 0px, transparent 300px, #000 520px, #000 100%);
        mask-image: linear-gradient(180deg,
          transparent 0px, transparent 300px, #000 520px, #000 100%);
      }
      #g3-wall .lyr { position: absolute; inset: 0; }
      #g3-wall img {
        position: absolute; display: block; height: auto;
        filter: brightness(0) invert(1);   /* belt-and-braces: force pure white */
      }
      #g3-wall .a img { opacity: .13; }
      #g3-wall .b img { opacity: .22; }
      #g3-badge {
        position: absolute; left: 0; right: 0; top: 820px; z-index: 7;
        text-align: center; opacity: 0;
      }
      #g3-badge img {
        width: 560px; height: auto; border-radius: 14px;
        box-shadow: 0 30px 90px -20px rgba(0,0,0,.75);
      }
      #g3-eyebrow {
        position: absolute; left: 96px; right: 96px; top: 1030px; z-index: 7;
        text-align: center; opacity: 0;
        font-size: 26px; font-weight: 600; letter-spacing: .34em;
        text-transform: uppercase; color: var(--brand-blue-tint);
      }
      /* Beat 4 — "right now." */
      #g4 .line { font-size: 96px; }

      /* ---- Full-frame type beats (the rule-of-threes act) ---- */
      #scrim {
        position: absolute; inset: 0; z-index: 5; opacity: 0; pointer-events: none;
        background:
          radial-gradient(ellipse 70% 50% at 50% 46%, rgba(6,40,76,.72) 0%, rgba(4,24,48,.93) 100%);
      }
      .hero {
        position: absolute; left: 96px; right: 96px; top: 760px; z-index: 6;
        text-align: center; opacity: 0; will-change: transform, opacity, filter;
      }
      .hero .big {
        position: relative; display: inline-block;
        font-size: 132px; font-weight: 800; line-height: .96; letter-spacing: -.035em;
        color: var(--brand-white); text-shadow: 0 0 60px rgba(0,0,0,.6);
      }
      .hero .strike { top: 80px; width: 100%; }
      #g7 .big { font-size: 104px; }
      /* "profitable" reads as part of the line — same sans, same weight, same
         white. The flame accent on this beat is carried by the rule alone. */
      #g7 .em {
        font-family: 'Rethink Sans', system-ui, sans-serif;
        font-style: normal; font-weight: 800; color: var(--brand-white);
      }
      #g7 .rule {
        width: 180px; height: 8px; border-radius: 4px; margin: 40px auto 0;
        background: var(--brand-flame); transform-origin: center;
        box-shadow: 0 0 30px rgba(255,76,50,.7);
      }

      /* Motion-blur whip streak that masks the beat cuts. */
      #streak {
        position: absolute; left: 0; top: 50%; z-index: 7; width: 46%; height: 10px;
        margin-top: -5px; opacity: 0; pointer-events: none; filter: blur(7px);
        background: linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent);
      }

      /* ---- End card ---- */
      #endcard {
        position: absolute; inset: 0; z-index: 7; opacity: 0;
        background:
          radial-gradient(88% 52% at 50% 22%, rgba(156,212,255,.12) 0%, rgba(6,40,76,0) 58%),
          var(--brand-navy);
      }
      #ec-bloom {
        position: absolute; left: -12%; bottom: -20%; width: 124%; height: 58%;
        background: var(--brand-gradient-2); filter: blur(96px); opacity: .40;
      }
      #ec-copy {
        position: absolute; left: 96px; right: 96px; top: 1010px; text-align: center;
      }
      #ec-head {
        font-size: 84px; font-weight: 800; line-height: 1.0; letter-spacing: -.03em;
        color: var(--brand-white); opacity: 0;
      }
      /* End-card headline reads as one white line — no italic, no tint. */
      #ec-head .em {
        font-family: 'Rethink Sans', system-ui, sans-serif;
        font-style: normal; font-weight: 800; color: var(--brand-white);
      }
      #ec-cta {
        display: inline-flex; align-items: center; gap: 18px; margin-top: 56px;
        font-size: 40px; font-weight: 700; color: var(--brand-white);
        background: var(--brand-flame); padding: 30px 62px; border-radius: 999px;
        box-shadow: 0 22px 70px -16px rgba(255,76,50,.68); opacity: 0;
      }
      #ec-cta .arrow { font-size: 42px; line-height: 1; transform: translateY(-2px); }
    </style>
  </head>

  <body>
    <!-- Render contract: root carries id + data-composition-id + data-start=0 +
         data-width/height. Timed visible children are class="clip" with
         data-start / data-duration / data-track-index. <video> and <audio> are
         the two exceptions that must NOT get class="clip". -->
    <div
      id="root"
      data-composition-id="aug-general-ad-4-vertical"
      data-start="0"
      data-duration="36"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <!-- A-roll: 9:16 centre-punch, silent. VO rides as a sibling <audio>. -->
      <video id="video" src="assets/aroll-vertical.mp4"
             data-start="0" data-duration="31.1" data-track-index="0" muted></video>
      <audio id="vo" src="assets/aroll-vo.m4a"
             data-start="0" data-duration="31.1" data-track-index="1" data-volume="1"></audio>

      <div id="grade" class="clip" data-start="0" data-duration="31.1" data-track-index="2"></div>

      <svg id="marks" class="clip" data-start="0" data-duration="31.1" data-track-index="3"
           width="1080" height="1920" viewBox="0 0 1080 1920" fill="none">
        <g stroke="#9CD4FF" stroke-width="2" opacity=".34">
          <path d="M56 300h34M73 283v34" /><path d="M990 300h34M1007 283v34" />
          <path d="M56 1400h34M73 1383v34" /><path d="M990 1400h34M1007 1383v34" />
        </g>
      </svg>

      <div id="vignette" class="clip" data-start="0" data-duration="31.1" data-track-index="4"></div>

      <!-- Beat 1 · "Most ecommerce advice…" (VO 0.27–5.02) -->
      <div id="g1" class="band clip" data-start="1.0333" data-duration="3.4" data-track-index="5">
        <div class="eyebrow">The problem</div>
        <div class="line">Most advice<span class="strike"></span></div>
      </div>

      <!-- Beat 3 · "…coaching side of a Shopify agency…" (VO 6.72–13.46) -->
      <div id="g3-scrim" class="clip" data-start="6.9333" data-duration="6.4" data-track-index="6"></div>
      <div id="g3-wall" class="clip" data-start="6.9333" data-duration="6.4" data-track-index="15">
        <div class="lyr a">
          <img src="assets/brands/allstora.png" alt="" style="left:40px; top:60px; width:190px" />
          <img src="assets/brands/kos.png" alt="" style="left:770px; top:30px; width:130px" />
          <img src="assets/brands/duckhorn.png" alt="" style="left:400px; top:310px; width:165px" />
          <img src="assets/brands/sonoma-cutrer.png" alt="" style="left:60px; top:600px; width:200px" />
          <img src="assets/brands/skinny-mixes.png" alt="" style="left:700px; top:540px; width:185px" />
          <img src="assets/brands/far-niente.png" alt="" style="left:330px; top:860px; width:150px" />
          <img src="assets/brands/bricoleur.png" alt="" style="left:860px; top:920px; width:120px" />
          <img src="assets/brands/mp.png" alt="" style="left:110px; top:1180px; width:160px" />
          <img src="assets/brands/cats-pajamas.png" alt="" style="left:570px; top:1240px; width:175px" />
          <img src="assets/brands/trew.png" alt="" style="left:850px; top:1480px; width:165px" />
          <img src="assets/brands/biosyntropy.png" alt="" style="left:150px; top:1760px; width:200px" />
        </div>
        <div class="lyr b">
          <img src="assets/brands/ozium.png" alt="" style="left:30px; top:470px; width:235px" />
          <img src="assets/brands/flaming-estate.png" alt="" style="left:610px; top:180px; width:190px" />
          <img src="assets/brands/folk-potions.png" alt="" style="left:890px; top:440px; width:140px" />
          <img src="assets/brands/mob-armor.png" alt="" style="left:250px; top:680px; width:150px" />
          <img src="assets/brands/dryft.png" alt="" style="left:70px; top:980px; width:215px" />
          <img src="assets/brands/naturally-linda.png" alt="" style="left:640px; top:1060px; width:205px" />
          <img src="assets/brands/sweet-e.png" alt="" style="left:890px; top:1280px; width:145px" />
          <img src="assets/brands/bedrock.png" alt="" style="left:220px; top:1520px; width:220px" />
          <img src="assets/brands/sothebys.png" alt="" style="left:620px; top:1700px; width:185px" />
          <img src="assets/brands/harmless-harvest.png" alt="" style="left:100px; top:2080px; width:210px" />
        </div>
      </div>
      <div id="g3-badge" class="clip" data-start="6.9333" data-duration="6.4" data-track-index="16">
        <img src="assets/brands/shopify-premier-partner.png" alt="Shopify Premier Partner" />
      </div>
      <div id="g3-eyebrow" class="clip" data-start="6.9333" data-duration="6.4" data-track-index="17">
        Inside dozens of live brands
      </div>

      <!-- Beat 4 · "…we're doing it right now." (VO 14.73–22.00) -->
      <div id="g4" class="band clip" data-start="17.4" data-duration="4.5" data-track-index="7">
        <div class="eyebrow">Not theory — practice</div>
        <div class="line">We're doing it<br /><span class="em">right now.</span></div>
      </div>

      <!-- Rule-of-threes act: scrim + three full-frame type hits (VO 22.49–26.81) -->
      <div id="scrim" class="clip" data-start="22.4667" data-duration="4.9333" data-track-index="8"></div>

      <div id="g5" class="hero clip" data-start="22.4667" data-duration="1.3333" data-track-index="9">
        <div class="big">No gurus.<span class="strike"></span></div>
      </div>
      <div id="g6" class="hero clip" data-start="23.8" data-duration="0.9667" data-track-index="10">
        <div class="big">No theory.<span class="strike"></span></div>
      </div>
      <div id="g7" class="hero clip" data-start="24.7667" data-duration="2.6333" data-track-index="11">
        <div class="big">Just what grows a<br /><span class="em">profitable</span> brand.</div>
        <div class="rule"></div>
      </div>

      <div id="streak" class="clip" data-start="22.2" data-duration="9" data-track-index="12"></div>

      <!-- End card · holds 5.13s after the VO ends -->
      <div id="endcard" class="clip" data-start="30.8667" data-duration="5.1333" data-track-index="13">
        <div id="ec-bloom"></div>
        <div id="ec-copy">
          <div id="ec-head">Advice from people<br /><span class="em">doing it</span></div>
          <div id="ec-cta">Learn More <span class="arrow">&rarr;</span></div>
        </div>
      </div>

      <!-- Persistent lockup, top-left on every frame. Non-clip wrapper (LESSONS.md)
           so the engine can't reposition it; it flies to centre for the end card,
           which is the piece's one callback. -->
      <div id="logo-wrap">
        <img id="logo" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
      </div>

      <div id="grain" class="clip" data-start="0" data-duration="36" data-track-index="14"></div>
    </div>

    <script>
      // Render contract: exactly one paused GSAP timeline, keyed to
      // data-composition-id. Deterministic — no Date.now(), no Math.random().
      (() => {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const SLOT = 36;

        /* ---- Beat 1 · "Most advice" + flame strike ---- */
        tl.fromTo("#g1", { opacity: 0, y: 46, filter: "blur(18px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.0333)
          .fromTo("#g1 .strike", { scaleX: 0 },
            { scaleX: 1, duration: 0.4667, ease: "power3.inOut" }, 2.6)
          .to("#g1", { opacity: 0, y: -60, filter: "blur(22px)", duration: 0.3, ease: "power2.in" }, 4.1333);

        /* ---- Beat 3 · client-logo wall, then the Shopify Premier Partner badge ----
           VO: "EcomIQ is the coaching side of a Shopify agency, working inside
           dozens of live brands every single day." (6.72–13.46)
           The wall answers "dozens of live brands", the badge answers "Shopify
           agency" — so the badge lands on the word, not at the top of the beat. */
        tl.fromTo("#g3-scrim", { opacity: 0 },
            { opacity: 1, duration: 0.3667, ease: "power2.out" }, 6.9333)
          .fromTo("#g3-wall", { opacity: 0 },
            { opacity: 1, duration: 0.5333, ease: "power2.out" }, 7.0333)
          // Parallax: the two layers drift at different rates, so the wall never
          // reads as one flat sheet sliding past.
          .fromTo("#g3-wall .a", { y: 0 }, { y: -150, duration: 6.4, ease: "none" }, 6.9333)
          .fromTo("#g3-wall .b", { y: 0 }, { y: -280, duration: 6.4, ease: "none" }, 6.9333)
          // Hero badge lands on "Shopify agency".
          .fromTo("#g3-badge", { opacity: 0, scale: 0.82, filter: "blur(14px)" },
            { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5333, ease: "back.out(1.5)" }, 8.4)
          // Copy lands on "dozens of live brands".
          .fromTo("#g3-eyebrow", { opacity: 0, y: 18 },
            { opacity: 1, y: 0, duration: 0.4333, ease: "power2.out" }, 10.4)
          .to("#g3-badge",   { opacity: 0, scale: 0.94, filter: "blur(16px)", duration: 0.3, ease: "power2.in" }, 12.9333)
          .to("#g3-eyebrow", { opacity: 0, y: -20, duration: 0.2667, ease: "power2.in" }, 12.9333)
          .to("#g3-wall",    { opacity: 0, duration: 0.3333, ease: "power2.in" }, 12.9333)
          .to("#g3-scrim",   { opacity: 0, duration: 0.3667, ease: "power2.in" }, 12.9667);

        /* ---- Beat 4 · "right now." scales as the line lands ---- */
        tl.fromTo("#g4", { opacity: 0, y: 46, filter: "blur(18px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 17.4)
          .fromTo("#g4 .em", { scale: 0.86, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.4333, ease: "back.out(1.5)" }, 17.7333)
          .to("#g4", { opacity: 0, y: -60, filter: "blur(22px)", duration: 0.3, ease: "power2.in" }, 21.6);

        /* ---- Rule-of-threes act ---- */
        tl.fromTo("#scrim", { opacity: 0 }, { opacity: 1, duration: 0.2667, ease: "power2.out" }, 22.4667)
          .to("#scrim", { opacity: 0, duration: 0.3333, ease: "power2.in" }, 27.0667);

        // Cut-the-curve vertical whip: each hit exits up with blur while the next
        // rises from below with matching blur — velocity matched across the seam.
        const hit = (sel, tIn, tOut) => {
          tl.fromTo(sel, { opacity: 0, y: 130, filter: "blur(26px)" },
            { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3667, ease: "expo.out" }, tIn)
            .to(sel, { opacity: 0, y: -120, filter: "blur(26px)", duration: 0.2333, ease: "power2.in" }, tOut);
        };
        hit("#g5", 22.4667, 23.6667);
        hit("#g6", 23.8, 24.6333);
        tl.fromTo("#g7", { opacity: 0, y: 130, filter: "blur(26px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4333, ease: "expo.out" }, 24.7667)
          .to("#g7", { opacity: 0, y: -120, filter: "blur(26px)", duration: 0.2667, ease: "power2.in" }, 27.1333);

        tl.fromTo("#g5 .strike", { scaleX: 0 }, { scaleX: 1, duration: 0.2667, ease: "power3.inOut" }, 22.8)
          .fromTo("#g6 .strike", { scaleX: 0 }, { scaleX: 1, duration: 0.2333, ease: "power3.inOut" }, 24.0667)
          .fromTo("#g7 .rule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 25.3333);

        /* ---- Whip streaks masking the three cuts ---- */
        const whip = (t) => {
          tl.fromTo("#streak", { xPercent: -120, opacity: 0, scaleX: 0.6 },
            { xPercent: 250, opacity: 1, scaleX: 1.5, duration: 0.3333, ease: "power3.in" }, t)
            .to("#streak", { opacity: 0, duration: 0.1333, ease: "power2.out" }, t + 0.2333);
        };
        whip(22.3333); whip(23.7); whip(24.6667);

        /* ---- End card · logo flies from top-left to centre (the callback) ---- */
        tl.to("#logo-wrap", { x: 360, y: 690, scale: 2.3, duration: 0.7667,
              ease: "power3.inOut", transformOrigin: "center center" }, 30.5333)
          .fromTo("#endcard", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 30.8667)
          .fromTo("#ec-head", { opacity: 0, y: 34 },
            { opacity: 1, y: 0, duration: 0.5667, ease: "power3.out" }, 31.5333)
