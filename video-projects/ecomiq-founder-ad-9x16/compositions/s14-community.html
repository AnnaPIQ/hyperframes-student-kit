    (function(){
      const SLOT = 4.9, S = '[data-composition-id="s14-community"] ';
      const tl = gsap.timeline({ paused: true });

      // on its leading edge; the content rides in behind it under matching blur.
      tl.fromTo(S+'.plate', { y: 1920 }, { y: 0, duration: 0.24, ease: 'power3.out' }, 0);
      tl.fromTo(S+'.edge-t', { opacity: 0 }, { opacity: 1, duration: 0.07, ease: 'sine.out' }, 0);

      tl.fromTo(S+'.hd .no', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: .46, ease: 'power3.out' }, 0);
      tl.fromTo(S+'.hd .ti', { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: .44, ease: 'expo.out' }, 0.06);
      tl.fromTo(S+'.hd .su', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .40, ease: 'power2.out' }, 0.26);
      // meter completes — segment 3 is the last of the three steps
      tl.fromTo(S+'.meter i', { scaleX: 0 }, { scaleX: 1, duration: .42, stagger: .06, ease: 'power2.out' }, 0.30);

      // edges draw themselves in, so the network assembles rather than appearing
      gsap.utils.toArray(S+'.ln').forEach(function(ln, i){
        const L = ln.getTotalLength();
        gsap.set(ln, { strokeDasharray: L, strokeDashoffset: L });
        tl.to(ln, { strokeDashoffset: 0, duration: .50, ease: 'power2.out' }, 1.62 + i * 0.055);
      });
      tl.fromTo(S+'#r1', { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: .46, ease: 'power3.out' }, 2.90);
