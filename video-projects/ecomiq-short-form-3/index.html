<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ecomiq-short-form-3</title>
    <!-- GSAP vendored locally — CDN cert-fails in the render env and freezes renders -->
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      /* LOCAL fonts — no network dependency at render time (latin subset) */
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      @font-face { font-family: 'Hedvig Letters Serif'; font-style: italic; font-weight: 400;
        font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden;
        background: var(--brand-navy); font-family: 'Rethink Sans', system-ui, sans-serif; color: var(--brand-text); }

      /* A-roll spine fills the vertical frame (source is native 1080x1920) */
      #aroll { position: absolute; inset: 0; width: 1080px; height: 1920px;
        object-fit: cover; z-index: 10; }

      /* Persistent brand logo — small, top-left (matches the reference ad) */
      #brand-logo { position: absolute; top: 4%; left: 5%; width: 20%; z-index: 50; }
      #brand-logo::before { content: ''; position: absolute; inset: -22% -16%; z-index: -1;
        background: radial-gradient(62% 62% at 38% 50%, rgba(6,40,76,.5) 0%, rgba(6,40,76,0) 72%); }
      #brand-logo img { display: block; width: 100%; height: auto;
        filter: drop-shadow(0 3px 12px rgba(0,0,0,.6)) drop-shadow(0 0 3px rgba(0,0,0,.45)); }

      /* Full-frame motion-graphic overlays cover the video on beats; end card on top */
      .cutaway { position: absolute; inset: 0; z-index: 40; }

      /* "Free Profitability Bootcamp" emphasis banner over the footage (~37s) */
      #promo-wrap { position: absolute; inset: 0; z-index: 60; pointer-events: none;
        display: flex; align-items: center; justify-content: center; }
      #promo-banner { margin-top: 12%; font-weight: 800; font-size: 52px; letter-spacing: .01em;
        text-transform: uppercase; color: #FFFFFF; white-space: nowrap; text-align: center;
        background: #FF4C32; padding: 30px 56px; border-radius: 22px;
        box-shadow: 0 26px 70px -14px rgba(255,76,50,.75), inset 0 0 0 2px rgba(255,160,130,.35); }

      #end-card-clip { position: absolute; inset: 0; z-index: 100; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="ecomiq-short-form-3" data-start="0" data-duration="44.8" data-width="1080" data-height="1920">

      <!-- A-roll spine: full original take (~44.8s), plays uninterrupted. Muted video
           (track 0) + sibling VO audio (track 1). -->
      <video id="aroll" data-start="0" data-duration="44.8" data-media-start="0" data-track-index="0"
             src="assets/aroll-video3.mp4" muted playsinline></video>
      <audio id="aroll-vo" data-start="0" data-duration="44.8" data-media-start="0" data-track-index="1"
             src="assets/aroll-video3.mp4" data-volume="1"></audio>

      <!-- Music-bed placeholder (track 2): silent for now, sits at a ducked-under-VO level.
           Swap the src for your track later; raise data-volume when it should carry. -->
      <audio id="music-bed" data-start="0" data-duration="44.8" data-track-index="2"
             src="assets/music-bed-placeholder.m4a" data-volume="0.18"></audio>

      <!-- Persistent brand logo (track 3) — over the A-roll spine -->
      <div id="brand-logo" class="clip" data-start="0" data-duration="44.8" data-track-index="3">
        <img src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
      </div>

      <!-- Full-frame motion-graphic overlays (track 4) — content + timing track Sean's VO,
           reference-style data cards. Cover the picture; VO continues underneath. -->
      <!-- ~7s: "the growth already lives inside your business" -->
      <div id="cut1" class="cutaway clip" data-composition-id="cutaway-1" data-composition-src="compositions/cutaway-1.html"
           data-start="7.0" data-duration="2.0" data-track-index="4"></div>
      <!-- ~15s: "they cost you next to nothing to reach again" -->
      <div id="cut2" class="cutaway clip" data-composition-id="cutaway-2" data-composition-src="compositions/cutaway-2.html"
           data-start="14.6" data-duration="2.4" data-track-index="4"></div>
      <!-- ~21s: "your repeat rate, how often they come back" -->
      <div id="cut3" class="cutaway clip" data-composition-id="cutaway-3" data-composition-src="compositions/cutaway-3.html"
           data-start="21.2" data-duration="2.2" data-track-index="4"></div>
      <!-- ~25s: "average order value, how much they spend" -->
      <div id="cut4" class="cutaway clip" data-composition-id="cutaway-4" data-composition-src="compositions/cutaway-4.html"
           data-start="25.3" data-duration="2.2" data-track-index="4"></div>
      <!-- ~30s: "retention is the hidden lever ... bottom line" -->
      <div id="cut5" class="cutaway clip" data-composition-id="cutaway-5" data-composition-src="compositions/cutaway-5.html"
           data-start="30.0" data-duration="2.2" data-track-index="4"></div>

      <!-- ~37s: emphasise the offer as he says "completely free profitability bootcamp" -->
      <div id="promo-wrap" class="clip" data-start="37.0" data-duration="3.7" data-track-index="6">
        <div id="promo-banner">Free Profitability Bootcamp</div>
      </div>

      <!-- End card (track 5) — overlays the tail so total runtime ≈ the original length -->
      <div id="end-card-clip" class="clip" data-composition-id="end-card" data-composition-src="compositions/end-card.html"
           data-start="40.8" data-duration="4.0" data-track-index="5"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Logo entrance (media + sub-comp overlays drive their own timelines)
      tl.from("#brand-logo", { opacity: 0, y: -20, filter: "blur(6px)", duration: .6, ease: "power3.out" }, .3);

      // "Free Profitability Bootcamp" banner — pop in on the offer, pulse, pop out into end card
      tl.fromTo("#promo-banner", { opacity: 0, scale: .8, y: 28 },
                                 { opacity: 1, scale: 1, y: 0, duration: .5, ease: "back.out(1.7)" }, 37.15)
        .to("#promo-banner", { scale: 1.045, duration: .6, ease: "sine.inOut", yoyo: true, repeat: 2 }, 37.8)
        .to("#promo-banner", { opacity: 0, scale: .94, duration: .3, ease: "power2.in" }, 40.3);

      tl.set({}, {}, 44.8); // composition duration
      window.__timelines["ecomiq-short-form-3"] = tl;
    </script>
  </body>
</html>
