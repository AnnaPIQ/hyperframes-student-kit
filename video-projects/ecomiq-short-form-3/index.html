<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ecomiq-short-form-3</title>
    <!-- GSAP vendored locally — CDN cert-fails in the render env and freezes renders -->
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      /* LOCAL fonts — no network dependency at render time (latin subset) */
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      @font-face { font-family: 'Hedvig Letters Serif'; font-style: italic; font-weight: 400;
        font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden;
        background: var(--brand-navy); font-family: 'Rethink Sans', system-ui, sans-serif; color: var(--brand-text); }

      /* A-roll spine fills the vertical frame (source is native 1080x1920) */
      #aroll { position: absolute; inset: 0; width: 1080px; height: 1920px;
        object-fit: cover; z-index: 10; }

      /* Persistent brand logo — top-left, subtle scrim + shadow so it reads on any shot */
      #brand-logo { position: absolute; top: 5.5%; left: 6%; width: 40%; z-index: 50; }
      #brand-logo::before { content: ''; position: absolute; inset: -22% -16%; z-index: -1;
        background: radial-gradient(62% 62% at 38% 50%, rgba(6,40,76,.5) 0%, rgba(6,40,76,0) 72%); }
      #brand-logo img { display: block; width: 100%; height: auto;
        filter: drop-shadow(0 3px 12px rgba(0,0,0,.6)) drop-shadow(0 0 3px rgba(0,0,0,.45)); }

      /* Animated lower-third callouts — bottom-left, clear of the face/mic */
      .callout { position: absolute; left: 6%; bottom: 13%; z-index: 45;
        display: inline-flex; flex-direction: column; align-items: flex-start; gap: 12px;
        padding: 24px 44px 26px 36px; border-radius: 28px;
        background: rgba(6,40,76,.88); border: 1.5px solid rgba(156,212,255,.30);
        box-shadow: 0 18px 50px -14px rgba(0,0,0,.6); white-space: nowrap; overflow: hidden; }
      .callout .row { display: inline-flex; align-items: center; gap: 20px; }
      .callout .dot { width: 22px; height: 22px; border-radius: 50%;
        background: var(--brand-flame); box-shadow: 0 0 20px -2px rgba(255,76,50,.85); flex: none; }
      .callout .txt { font-weight: 700; font-size: 46px; letter-spacing: -.01em; color: #FFFFFF; }
      .callout .bar { height: 6px; width: 100%; border-radius: 999px; transform-origin: 0 50%;
        background: linear-gradient(90deg, #FF4C32, #FF8A4C); box-shadow: 0 0 16px -2px rgba(255,76,50,.7); }

      /* End card sits above everything */
      #end-card-clip { position: absolute; inset: 0; z-index: 100; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="ecomiq-short-form-3" data-start="0" data-duration="44.8" data-width="1080" data-height="1920">

      <!-- A-roll spine: full original take (~44.8s), plays uninterrupted. Muted video
           (track 0) + sibling VO audio (track 1). -->
      <video id="aroll" data-start="0" data-duration="44.8" data-media-start="0" data-track-index="0"
             src="assets/aroll-video3.mp4" muted playsinline></video>
      <audio id="aroll-vo" data-start="0" data-duration="44.8" data-media-start="0" data-track-index="1"
             src="assets/aroll-video3.mp4" data-volume="1"></audio>

      <!-- Music-bed placeholder (track 2): silent for now, sits at a ducked-under-VO level.
           Swap the src for your track later; raise data-volume when it should carry. -->
      <audio id="music-bed" data-start="0" data-duration="44.8" data-track-index="2"
             src="assets/music-bed-placeholder.m4a" data-volume="0.18"></audio>

      <!-- Persistent brand logo (track 3) — over the A-roll spine -->
      <div id="brand-logo" class="clip" data-start="0" data-duration="44.8" data-track-index="3">
        <img src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
      </div>

      <!-- Animated lower-third callouts (track 4) across the video — slide in, the
           accent bar draws, hold with a pulsing dot, slide out. Presenter stays visible. -->
      <div id="callout1" class="callout clip" data-start="3.5" data-duration="3.4" data-track-index="4">
        <div class="row"><span class="dot"></span><span class="txt">Clarity, not guesswork</span></div><div class="bar"></div>
      </div>
      <div id="callout2" class="callout clip" data-start="11.5" data-duration="3.4" data-track-index="4">
        <div class="row"><span class="dot"></span><span class="txt">Know your real profit</span></div><div class="bar"></div>
      </div>
      <div id="callout3" class="callout clip" data-start="19.5" data-duration="3.4" data-track-index="4">
        <div class="row"><span class="dot"></span><span class="txt">See your true margins</span></div><div class="bar"></div>
      </div>
      <div id="callout4" class="callout clip" data-start="27.5" data-duration="3.4" data-track-index="4">
        <div class="row"><span class="dot"></span><span class="txt">Turn data into decisions</span></div><div class="bar"></div>
      </div>
      <div id="callout5" class="callout clip" data-start="35.5" data-duration="3.4" data-track-index="4">
        <div class="row"><span class="dot"></span><span class="txt">Grow with confidence</span></div><div class="bar"></div>
      </div>

      <!-- End card (track 5) — overlays the tail so total runtime ≈ the original length -->
      <div id="end-card-clip" class="clip" data-composition-id="end-card" data-composition-src="compositions/end-card.html"
           data-start="40.8" data-duration="4.0" data-track-index="5"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Logo entrance
      tl.from("#brand-logo", { opacity: 0, y: -20, filter: "blur(6px)", duration: .6, ease: "power3.out" }, .3);

      // Lower-third callouts — slide in with overshoot, accent bar draws, dot pulses
      // during the hold, then slide out (each within its own clip window).
      [["#callout1", 3.5], ["#callout2", 11.5], ["#callout3", 19.5],
       ["#callout4", 27.5], ["#callout5", 35.5]].forEach(([sel, t]) => {
        tl.fromTo(sel, { x: -90, opacity: 0, filter: "blur(8px)" },
                       { x: 0, opacity: 1, filter: "blur(0px)", duration: .55, ease: "back.out(1.5)" }, t)
          .fromTo(`${sel} .dot`, { scale: 0 }, { scale: 1, duration: .4, ease: "back.out(2.4)" }, t + .1)
          .fromTo(`${sel} .bar`, { scaleX: 0, opacity: 0 },
                                 { scaleX: 1, opacity: 1, duration: .5, ease: "power3.out" }, t + .25)
          .to(`${sel} .dot`, { scale: 1.28, duration: .5, ease: "sine.inOut", yoyo: true, repeat: 2 }, t + .8)
          .to(sel, { x: -50, opacity: 0, filter: "blur(8px)", duration: .4, ease: "power2.in" }, t + 3.0);
      });

      tl.set({}, {}, 44.8); // composition duration
      window.__timelines["ecomiq-short-form-3"] = tl;
    </script>
  </body>
</html>
