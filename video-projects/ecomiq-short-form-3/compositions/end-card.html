<template id="end-card-template">
  <div id="end-card-root" data-composition-id="end-card" data-width="1080" data-height="1920">
    <div class="ec-bg"></div>
    <div class="ec-wrap">
      <img class="ec-logo" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
      <div class="ec-head">
        <span class="ec-line">Join our Free</span>
        <span class="ec-line">Profitability</span>
        <span class="ec-line">Bootcamp</span>
        <span class="ec-underline"></span>
      </div>
      <div class="ec-cta">Start free &rarr;</div>
    </div>
    <div class="ec-shimmer"></div>
    <style>
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      #end-card-root { position: absolute; inset: 0; overflow: hidden;
        background: #06284C; font-family: 'Rethink Sans', system-ui, sans-serif; color: #FFFFFF; }
      #end-card-root .ec-bg { position: absolute; inset: 0;
        background: radial-gradient(85% 55% at 50% 34%, rgba(156,212,255,.16) 0%, rgba(6,40,76,0) 58%), #06284C; }
      #end-card-root .ec-wrap { position: absolute; inset: 0; z-index: 2;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 50px; padding: 12% 9%; text-align: center; }
      #end-card-root .ec-logo { width: 60%; height: auto;
        filter: drop-shadow(0 8px 40px rgba(156,212,255,.28)); }
      #end-card-root .ec-head { position: relative; display: flex; flex-direction: column;
        align-items: center; gap: 4px; }
      #end-card-root .ec-line { display: block; font-weight: 800; font-size: 92px;
        line-height: 1.0; letter-spacing: -.03em; color: #FFFFFF; }
      #end-card-root .ec-underline { margin-top: 26px; width: 300px; height: 10px; border-radius: 999px;
        background: #FF4C32; box-shadow: 0 0 30px -2px rgba(255,76,50,.75); transform-origin: 0 50%; }
      #end-card-root .ec-cta { margin-top: 6px; font-weight: 700; font-size: 44px;
        color: #FFFFFF; background: #FF4C32; padding: 34px 66px; border-radius: 999px;
        box-shadow: 0 24px 72px -16px rgba(255,76,50,.6); }
      #end-card-root .ec-shimmer { position: absolute; top: -12%; left: 0; width: 34%; height: 124%;
        z-index: 3; pointer-events: none; transform: skewX(-12deg);
        background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.16) 50%, rgba(255,255,255,0) 100%); }
    </style>
    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#end-card-root .ec-bg", { opacity: 0, filter: "blur(10px)", duration: .3, ease: "power2.out" }, 0)
        .from("#end-card-root .ec-logo", { opacity: 0, y: -30, scale: .9, filter: "blur(8px)", duration: .55, ease: "power3.out" }, .15)
        .from("#end-card-root .ec-line", { opacity: 0, y: 46, filter: "blur(12px)", duration: .5, ease: "expo.out", stagger: .12 }, .4)
        .fromTo("#end-card-root .ec-underline", { scaleX: 0, opacity: 0 },
               { scaleX: 1, opacity: 1, duration: .55, ease: "power3.out" }, .95)
        .from("#end-card-root .ec-cta", { opacity: 0, scale: .82, duration: .5, ease: "back.out(1.7)" }, 1.25)
        // light shimmer sweeps across the card once, right after the copy lands
        .fromTo("#end-card-root .ec-shimmer", { x: -520 }, { x: 1500, duration: 1.15, ease: "power2.inOut" }, 1.35)
        // gentle life during the hold — CTA glow pulse
        .to("#end-card-root .ec-cta", { scale: 1.04, duration: .85, ease: "sine.inOut", yoyo: true, repeat: 2 }, 2.05);
      tl.set({}, {}, 4.0); // pad to data-duration (final scene holds)
      window.__timelines["end-card"] = tl;
    </script>
  </div>
</template>
