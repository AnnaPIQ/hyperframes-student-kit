<template id="cutaway-1-template">
  <div id="cutaway-1-root" data-composition-id="cutaway-1" data-width="1080" data-height="1920">
    <div class="c1-bg"></div>
    <div class="c1-grid"></div>
    <div class="c1-wrap">
      <div class="c1-eyebrow">Meta Ads &middot; Last 90 Days</div>
      <div class="c1-rule"></div>
      <div class="c1-stat">
        <div class="c1-label">Ad Spend</div>
        <div class="c1-row"><span class="c1-num up" id="c1-spend">$0K</span><span class="c1-tri up">&#9650;</span></div>
      </div>
      <div class="c1-rule"></div>
      <div class="c1-stat">
        <div class="c1-label">Net Profit</div>
        <div class="c1-row"><span class="c1-num down" id="c1-profit">0%</span><span class="c1-tri down">&#9660;</span></div>
      </div>
      <div class="c1-rule"></div>
    </div>
    <style>
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      #cutaway-1-root { position: absolute; inset: 0; overflow: hidden;
        background: #06284C; font-family: 'Rethink Sans', system-ui, sans-serif; color: #FFFFFF; }
      #cutaway-1-root .c1-bg { position: absolute; inset: 0;
        background: radial-gradient(80% 50% at 50% 40%, rgba(156,212,255,.14) 0%, rgba(6,40,76,0) 60%), #06284C; }
      #cutaway-1-root .c1-grid { position: absolute; inset: 0; opacity: .5;
        background-image:
          repeating-linear-gradient(0deg, rgba(156,212,255,.06) 0 1.5px, transparent 1.5px 68px),
          repeating-linear-gradient(90deg, rgba(156,212,255,.06) 0 1.5px, transparent 1.5px 68px);
        -webkit-mask-image: radial-gradient(75% 60% at 50% 45%, #000 0%, transparent 85%);
                mask-image: radial-gradient(75% 60% at 50% 45%, #000 0%, transparent 85%); }
      #cutaway-1-root .c1-wrap { position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: stretch; justify-content: center;
        gap: 30px; padding: 12% 11%; }
      #cutaway-1-root .c1-eyebrow { font-weight: 700; font-size: 34px; letter-spacing: .3em;
        text-transform: uppercase; color: #7ea6cf; text-align: center; margin-bottom: 6px; }
      #cutaway-1-root .c1-rule { height: 2px; background: linear-gradient(90deg, rgba(156,212,255,0), rgba(156,212,255,.35), rgba(156,212,255,0)); }
      #cutaway-1-root .c1-stat { display: flex; flex-direction: column; gap: 6px; }
      #cutaway-1-root .c1-label { font-weight: 700; font-size: 36px; letter-spacing: .04em;
        text-transform: uppercase; color: #a9c4e0; }
      #cutaway-1-root .c1-row { display: flex; align-items: center; justify-content: space-between; }
      #cutaway-1-root .c1-num { font-weight: 800; font-size: 172px; line-height: .9; letter-spacing: -.03em;
        font-variant-numeric: tabular-nums; }
      #cutaway-1-root .c1-num.up { color: #9CD4FF; }
      #cutaway-1-root .c1-num.down { color: #FF5A3C; }
      #cutaway-1-root .c1-tri { font-size: 84px; line-height: 1; }
      #cutaway-1-root .c1-tri.up { color: #9CD4FF; }
      #cutaway-1-root .c1-tri.down { color: #FF5A3C; }
    </style>
    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const spend = { v: 0 }, profit = { v: 0 };
      const spendEl = document.getElementById('c1-spend');
      const profitEl = document.getElementById('c1-profit');
      tl.from("#cutaway-1-root .c1-bg", { opacity: 0, duration: .2, ease: "power1.out" }, 0)
        .from("#cutaway-1-root .c1-grid", { opacity: 0, duration: .4, ease: "power1.out" }, 0)
        .from("#cutaway-1-root .c1-eyebrow", { opacity: 0, y: 20, duration: .35, ease: "power3.out" }, .05)
        .from("#cutaway-1-root .c1-rule", { scaleX: 0, opacity: 0, duration: .4, ease: "power2.out", stagger: .06 }, .12)
        .from("#cutaway-1-root .c1-stat", { opacity: 0, y: 24, filter: "blur(8px)", duration: .4, ease: "power3.out", stagger: .12 }, .2)
        .to(spend, { v: 36, duration: .7, ease: "power2.out", onUpdate: () => { spendEl.textContent = '$' + Math.round(spend.v) + 'K'; } }, .25)
        .to(profit, { v: -18, duration: .7, ease: "power2.out", onUpdate: () => { profitEl.textContent = Math.round(profit.v) + '%'; } }, .35)
        .from("#cutaway-1-root .c1-tri", { opacity: 0, scale: 0, duration: .3, ease: "back.out(2)", stagger: .1 }, .5)
        .to("#cutaway-1-root .c1-wrap", { opacity: 0, filter: "blur(12px)", scale: 1.03, duration: .25, ease: "power2.in" }, 1.5)
        .to("#cutaway-1-root .c1-grid", { opacity: 0, duration: .22, ease: "power2.in" }, 1.52);
      tl.set({}, {}, 1.8); // pad to data-duration
      window.__timelines["cutaway-1"] = tl;
    </script>
  </div>
</template>
