<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>s02-deck</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      [data-composition-id="s02-deck"] * { margin: 0; padding: 0; box-sizing: border-box; }
      [data-composition-id="s02-deck"] {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      [data-composition-id="s02-deck"] .s02-enter { position: absolute; inset: 0; }
      [data-composition-id="s02-deck"] .s02-fan { position: absolute; inset: 0; }
      [data-composition-id="s02-deck"] .s02-stage {
        position: absolute;
        inset: 0;
      }
      [data-composition-id="s02-deck"] .s02-pool {
        position: absolute;
        left: 50%;
        top: 56%;
        width: 1560px;
        height: 560px;
        margin: -280px 0 0 -780px;
        border-radius: 50%;
        background: radial-gradient(50% 50% at 50% 50%, rgba(156, 212, 255, 0.26) 0%, rgba(156, 212, 255, 0) 70%);
        filter: blur(30px);
      }
      /* Slot = static arc position (CSS is the ground truth for layout) */
      [data-composition-id="s02-deck"] .s02-slot {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 308px;
        height: 399px;
        margin: -199px 0 0 -154px;
      }
      [data-composition-id="s02-deck"] .s02-p1 { z-index: 1; transform: translateX(-534px) translateY(112px) rotate(-24deg) scale(0.865); }
      [data-composition-id="s02-deck"] .s02-p2 { z-index: 2; transform: translateX(-356px) translateY(50px) rotate(-16deg) scale(0.91); }
      [data-composition-id="s02-deck"] .s02-p3 { z-index: 3; transform: translateX(-178px) translateY(13px) rotate(-8deg) scale(0.955); }
      [data-composition-id="s02-deck"] .s02-p4 { z-index: 4; transform: translateX(0px) translateY(0px) rotate(0deg) scale(1); }
      [data-composition-id="s02-deck"] .s02-p5 { z-index: 3; transform: translateX(178px) translateY(13px) rotate(8deg) scale(0.955); }
      [data-composition-id="s02-deck"] .s02-p6 { z-index: 2; transform: translateX(356px) translateY(50px) rotate(16deg) scale(0.91); }
      [data-composition-id="s02-deck"] .s02-p7 { z-index: 1; transform: translateX(534px) translateY(112px) rotate(24deg) scale(0.865); }
      /* Card = the animated element */
      [data-composition-id="s02-deck"] .s02-card {
        position: absolute;
        inset: 0;
        border-radius: 3px;
        overflow: hidden;
        background: #ffffff;
        box-shadow:
          0 34px 70px -22px rgba(1, 10, 22, 0.9),
          0 0 0 1px rgba(156, 212, 255, 0.2);
      }
      [data-composition-id="s02-deck"] .s02-card img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* Depth wash — outer cards sit further back in the light */
      [data-composition-id="s02-deck"] .s02-card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(6, 40, 76, 0.42);
      }
      [data-composition-id="s02-deck"] .s02-slot[data-depth="0"] .s02-card::after { background: rgba(6, 40, 76, 0); }
      [data-composition-id="s02-deck"] .s02-slot[data-depth="1"] .s02-card::after { background: rgba(6, 40, 76, 0.16); }
      [data-composition-id="s02-deck"] .s02-slot[data-depth="2"] .s02-card::after { background: rgba(6, 40, 76, 0.3); }

      /* ── format overrides (generated) ─────────────────────── */
      [data-composition-id="s02-deck"] .s02-slot { width: 360px; height: 467px; margin: -233px 0 0 -180px; }
      [data-composition-id="s02-deck"] .s02-p1 { transform: translateX(-345px) translateY(172px) rotate(-26deg) scale(0.85); }
      [data-composition-id="s02-deck"] .s02-p2 { transform: translateX(-225px) translateY(76px)  rotate(-17deg) scale(0.9); }
      [data-composition-id="s02-deck"] .s02-p3 { transform: translateX(-110px) translateY(18px)  rotate(-8.5deg) scale(0.95); }
      [data-composition-id="s02-deck"] .s02-p4 { transform: translateX(0px)    translateY(0px)   rotate(0deg) scale(1); }
      [data-composition-id="s02-deck"] .s02-p5 { transform: translateX(110px)  translateY(18px)  rotate(8.5deg) scale(0.95); }
      [data-composition-id="s02-deck"] .s02-p6 { transform: translateX(225px)  translateY(76px)  rotate(17deg) scale(0.9); }
      [data-composition-id="s02-deck"] .s02-p7 { transform: translateX(345px)  translateY(172px) rotate(26deg) scale(0.85); }
      [data-composition-id="s02-deck"] .s02-pool { width: 1040px; height: 520px; margin: -260px 0 0 -520px; }
    </style>
  </head>
  <body>
    <div data-composition-id="s02-deck" data-width="1080" data-height="1920" data-duration="2.7">
      <div class="s02-enter" id="s02-enter">
      <div class="s02-stage" id="s02-stage">
        <div class="s02-pool" id="s02-pool"></div>
        <div class="s02-fan" id="s02-fan">
          <!-- Arc: 7 pages, centre page upright and forward -->
          <div class="s02-slot s02-p1" data-depth="3">
            <div class="s02-card"><img src="assets/pages/deck-1.png" alt="" /></div>
          </div>
          <div class="s02-slot s02-p2" data-depth="2">
            <div class="s02-card"><img src="assets/pages/deck-2.png" alt="" /></div>
          </div>
          <div class="s02-slot s02-p3" data-depth="1">
            <div class="s02-card"><img src="assets/pages/deck-3.png" alt="" /></div>
          </div>
          <div class="s02-slot s02-p4" data-depth="0">
            <div class="s02-card"><img src="assets/pages/deck-4.png" alt="" /></div>
          </div>
          <div class="s02-slot s02-p5" data-depth="1">
            <div class="s02-card"><img src="assets/pages/deck-5.png" alt="" /></div>
          </div>
          <div class="s02-slot s02-p6" data-depth="2">
            <div class="s02-card"><img src="assets/pages/deck-6.png" alt="" /></div>
          </div>
          <div class="s02-slot s02-p7" data-depth="3">
            <div class="s02-card"><img src="assets/pages/deck-7.png" alt="" /></div>
          </div>
        </div>
      </div>
      </div>
    </div>

    <script>
      (() => {
        window.__timelines = window.__timelines || {};
        const S = '[data-composition-id="s02-deck"] ';
        const SLOT = 2.7;
        const tl = gsap.timeline({ paused: true });

        // Scene arrives over the outgoing shot — blur-rise, never a hard cut.
        tl.fromTo(S + "#s02-enter",
          { y: 90, opacity: 0, filter: "blur(18px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.36, ease: "power2.out" }, 0);

        // The fan deals out from the centre page outwards.
        tl.fromTo(S + ".s02-card",
          { y: 220, scale: 0.82, opacity: 0, filter: "blur(20px)" },
          { y: 0, scale: 1, opacity: 1, filter: "blur(0px)",
            duration: 0.62, ease: "expo.out",
            stagger: { each: 0.05, from: "center" } }, 0.08);

        // Light pool opens with them.
        tl.fromTo(S + "#s02-pool",
          { scale: 0.6, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.8, ease: "power2.out" }, 0.14);

        // Camera pushes through the whole shot.
        tl.fromTo(S + "#s02-stage",
          { scale: 1.02 },
          { scale: 1.09, duration: SLOT, ease: "none" }, 0);

        // The fan breathes — a slow tilt keeps the tail of the shot alive.
        tl.fromTo(S + "#s02-fan",
          { rotate: -1.4, y: 8 },
          { rotate: 1.2, y: -12, duration: SLOT, ease: "sine.inOut" }, 0);

        tl.to({}, { duration: SLOT }, 0); // Law #11 anchor
        window.__timelines["s02-deck"] = tl;
      })();
    </script>
  </body>
</html>
