      [data-composition-id="s06-sheets"] .s06-glow {

        background: radial-gradient(50% 50% at 50% 50%, rgba(156, 212, 255, 0.2) 0%, rgba(156, 212, 255, 0) 70%);

    <script>
      (() => {
        window.__timelines = window.__timelines || {};
        const S = '[data-composition-id="s06-sheets"] ';
        const SLOT = 2.8;
        const tl = gsap.timeline({ paused: true });

        // Scene arrives over the outgoing shot — blur-rise, never a hard cut.
        tl.fromTo(S + "#s06-enter",
          { y: 90, opacity: 0, filter: "blur(18px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.36, ease: "power2.out" }, 0);

        tl.fromTo(S + "#s06-rule",
          { scaleX: 0, opacity: 0 },
          { scaleX: 1, opacity: 1, duration: 0.3, ease: "power3.out" }, 0.06);
        tl.fromTo(S + "#s06-eyebrow",
          { y: 14, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 0.16);
        tl.fromTo(S + "#s06-glow",
          { scale: 0.7, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.85, ease: "sine.out" }, 0.14);

        // Cards land from the middle of the grid outwards.
        tl.fromTo(S + ".s06-card",
          { y: 52, scale: 0.9, opacity: 0, filter: "blur(10px)" },
          { y: 0, scale: 1, opacity: 1, filter: "blur(0px)",
            duration: 0.46, ease: "back.out(1.2)",
            stagger: { each: 0.042, from: "center" } }, 0.26);

        // The flame cells fill last — the figure each sheet is really for.
        tl.fromTo(S + "i.hot",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.26, ease: "power3.out", stagger: 0.035 }, 0.82);

        // Grid holds a slight tilt and keeps pushing.
        tl.fromTo(S + "#s06-grid",
          { rotateX: 9, y: 14 },
          { rotateX: 2, y: 0, duration: 1.5, ease: "power2.out" }, 0.26);
        tl.fromTo(S + "#s06-stage",
          { scale: 0.99 },
          { scale: 1.03, duration: SLOT, ease: "none" }, 0);

        tl.to({}, { duration: SLOT }, 0); // Law #11 anchor
        window.__timelines["s06-sheets"] = tl;
      })();
    </script>
