<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>ecomiq-how-it-works-ad — 4:5</title>
    <!-- GSAP vendored locally — a CDN <script> cert-fails in the render env and
         freezes the render (docs/LESSONS.md, render-breaking) -->
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <link rel="stylesheet" href="assets/ad.css" />
    <style>
      /* ---- 4:5 geometry (1080x1350) — derived from the 1:1 master — see EDIT-PLAN.md §6 */
      html, body { width: 1080px; height: 1350px; }
      :root {
        --ov-top: 70px;
        --ov-side: 54px;
        --bug-w: 250px;
        --pip-d: 230px;
        --card-logo: 497px;   /* 46% of 1080 */
        --card-gap: 32px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="ecomiq-how-it-works-ad-45"
      data-start="0"
      data-duration="76.433333"
      data-width="1080"
      data-height="1350"
    >
      <!-- PICTURE BED — montage, once, per-shot retimed. 2143 frames.
           Hard cuts are baked into the bed. No class="clip" on <video>. -->
      <video
        id="montage"
        class="montage"
        data-start="0"
        data-duration="71.433333"
        data-track-index="20"
        src="assets/montage-45.mp4"
        muted
        playsinline
      ></video>

      <!-- BRAND BUG — top left -->
      <div class="bug-wrap" id="bug-wrap">
        <img
          id="bug"
          class="clip"
          data-start="0"
          data-duration="71.433333"
          data-track-index="21"
          src="assets/ecomiq-logo-white.svg"
          alt="EcomIQ"
        />
      </div>

      <!-- SPEAKER PiP — top right, circular, never full frame -->
      <div class="pip-wrap" id="pip-wrap">
        <video
          id="pip"
          data-start="0"
          data-duration="71.433333"
          data-track-index="22"
          src="assets/pip.mp4"
          muted
          playsinline
        ></video>
      </div>

      <!-- END CARD — resolves out of the one dissolve, one frame before "Tap" -->
      <div
        id="card"
        class="clip card"
        data-start="71.05"
        data-duration="5.383333"
        data-track-index="23"
      >
        <img id="card-logo" class="card-logo" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
        <div id="card-rule" class="card-rule"></div>
        <div id="card-pill" class="card-pill">Find out more &rarr;</div>
      </div>

      <!-- VOICEOVER — the spine. Head-trimmed 1.854s so speech lands at 0.200s.
           Montage audio is discarded entirely; the beds are muted. -->
      <audio
        id="vo"
        data-start="0"
        data-duration="76.433333"
        data-track-index="24"
        src="assets/vo.wav"
        data-volume="1"
      ></audio>

      <!-- MUSIC — silent placeholder at volume 0. Drop a real bed at this path
           and raise data-volume. Duck targets: 0.13 under speech, 0.35 over the
           card. -->
      <audio
        id="music"
        data-start="0"
        data-duration="76.433333"
        data-track-index="25"
        src="assets/music-bed.wav"
        data-volume="0"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Overlays fade in together, done by 0.42s — inside the first 0.5s.
      // fromTo, not from: these start hidden (docs/LESSONS.md, Animation).
      tl.fromTo("#bug-wrap", { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "power2.out" }, 0.08)
        .fromTo("#pip-wrap", { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "power2.out" }, 0.08);

      // THE one dissolve in the whole ad. Linear, 0.35s, across the 0.681s
      // silence gap, so the card is fully opaque at 71.40 — one frame before
      // "Tap the link below and book a call." starts at 71.4333.
      tl.fromTo("#card", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "none" }, 71.05);

      // Card stack rides in on the dissolve and is settled by 71.80, so the
      // card sits perfectly still for its 5s hold.
      tl.fromTo("#card-logo", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" }, 71.18)
        .fromTo("#card-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.34, ease: "power2.out" }, 71.34)
        .fromTo("#card-pill", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(1.6)" }, 71.46);

      // Hold the card to the end of the VO (render contract rule 7).
      tl.set("#card-pill", { opacity: 1 }, 76.433333);

      window.__timelines["ecomiq-how-it-works-ad-45"] = tl;
    </script>
  </body>
</html>
