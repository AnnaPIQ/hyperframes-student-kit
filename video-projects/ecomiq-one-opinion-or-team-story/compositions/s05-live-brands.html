    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const root = '[data-composition-id="s05-live-brands"]';
        const tl = gsap.timeline({ paused: true });

      // --- ambient: grid parallax + vignette breath (camera never sleeps) ---
      tl.fromTo(root + " .grid", { backgroundPositionY: 0, backgroundPositionX: 0 },
        { backgroundPositionY: 28, backgroundPositionX: -16,
          duration: 3.9333, ease: "none" }, 0);
      tl.fromTo(root + " .vig", { opacity: .82 }, { opacity: 1, duration: 1.9667,
        ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo(root + " .marks", { opacity: .2 }, { opacity: .40,
        duration: 1.9667, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

      // ENTRY — rises from below under blur; matches the
      // previous beat's exit velocity. Opacity snaps early so the A-roll never ghosts through.
      gsap.set(root + " .wrap", { opacity: 0, y: 170, filter: "blur(30px)" });
      tl.to(root + " .wrap", { opacity: 1, duration: .12, ease: "none" }, 0);
      tl.to(root + " .wrap", { y: 0, filter: "blur(0px)", duration: .46, ease: "power2.out" }, 0);

      // the wall drifts up for the whole beat — dozens of real brands, always moving
      tl.fromTo(root + " #s5-track", { y: 0 },
        { y: -470, duration: 3.9333, ease: "none" }, 0);
      // with no type competing, the marks can carry full strength
      tl.fromTo(root + " #s5-track img", { opacity: 0, y: 24 },
        { opacity: .42, y: 0, duration: .42, ease: "power2.out", stagger: .008 }, 0.06666666666666667);
      tl.to(root + " #s5-track img", { opacity: .64, duration: .8, ease: "power2.out" }, 1.1);

      // in-scene light streak — motion blur across the seam, never a hard cut
      tl.fromTo(root + " #s05-live-brands-streak", { xPercent: -60, opacity: 0, scaleX: .6 },
        { xPercent: 260, opacity: .9, scaleX: 1.4, duration: .34, ease: "power3.in" }, 0.06);
      tl.to(root + " #s05-live-brands-streak", { opacity: 0, duration: .16 }, 0.4000);

      // EXIT (local 3.5733) — rides up under blur, handing the
      // frame back to the founder A-roll. Matches the next beat's entry blur.
      tl.to(root + " .wrap", { y: -170, filter: "blur(30px)", duration: .36, ease: "power2.in" }, 3.5733);
      tl.to(root + " .wrap", { opacity: 0, duration: .18, ease: "power1.in" }, 3.7533);

        // Law #11 — anchor the timeline to the full slot or HyperFrames hides
        // the composition early and you get a black-frame flash at the tail.
        tl.to({}, { duration: 3.9333 }, 0);
        window.__timelines['s05-live-brands'] = tl;
      })();
