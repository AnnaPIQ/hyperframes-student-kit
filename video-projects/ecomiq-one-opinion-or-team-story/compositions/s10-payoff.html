    <!-- GSAP vendored locally — a CDN script cert-fails in the render env -->
    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const root = '[data-composition-id="s10-payoff"]';
        const tl = gsap.timeline({ paused: true });

      // --- ambient: grid parallax + vignette breath (camera never sleeps) ---
      tl.fromTo(root + " .grid", { backgroundPositionY: 0, backgroundPositionX: 0 },
        { backgroundPositionY: -28, backgroundPositionX: 16,
          duration: 4.4000, ease: "none" }, 0);
      tl.fromTo(root + " .vig", { opacity: .82 }, { opacity: 1, duration: 2.2000,
        ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo(root + " .marks", { opacity: .2 }, { opacity: .40,
        duration: 2.2000, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

      // ENTRY — rises in from the left under blur; matches the
      // previous beat's exit velocity. Opacity snaps early so the A-roll never ghosts through.
      gsap.set(root + " .wrap", { opacity: 0, x: -190, filter: "blur(30px)" });
      tl.to(root + " .wrap", { opacity: 1, duration: .12, ease: "none" }, 0);
      tl.to(root + " .wrap", { x: 0, filter: "blur(0px)", duration: .46, ease: "power2.out" }, 0);

      tl.fromTo(root + " #s10-q", { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: .48, ease: "power3.out" }, 0.06666666666666667);
      // CALLBACK — the lone bar from the cold open returns, still struck through
      tl.fromTo(root + " #s10-left", { opacity: 0, x: -40 },
        { opacity: 1, x: 0, duration: .5, ease: "power2.out" }, 1.3666666666666667);
      tl.fromTo(root + " #s10-lb", { scaleY: 0 },
        { scaleY: 1, duration: .46, ease: "power3.out" }, 1.4466666666666668);
      gsap.set(root + " #s10-ls", { scaleX: 0 });
      tl.to(root + " #s10-ls", { scaleX: 1, duration: .28, ease: "expo.out" }, 1.7066666666666668);
      // HERO — the team cluster lights up
      tl.fromTo(root + " #s10-right", { opacity: 0, x: 44 },
        { opacity: 1, x: 0, duration: .5, ease: "power2.out" }, 2.533333333333333);
      tl.fromTo(root + " #s10-cl", { scale: .84 },
        { scale: 1, duration: .56, ease: "back.out(1.6)" }, 2.533333333333333);
      tl.fromTo(root + " #s10-cl .cn", { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: .36, ease: "back.out(2.4)", stagger: .036 }, 2.6333333333333333);

      // in-scene light streak — motion blur across the seam, never a hard cut
      tl.fromTo(root + " #s10-payoff-streak", { xPercent: -60, opacity: 0, scaleX: .6 },
        { xPercent: 260, opacity: .9, scaleX: 1.4, duration: .34, ease: "power3.in" }, 0.06);
      tl.to(root + " #s10-payoff-streak", { opacity: 0, duration: .16 }, 0.4000);

      // NO EXIT — the next card lands on this frame and rides in over the top.
      // Whipping out here would expose the A-roll for a beat (a stray flash-cut).

        // Law #11 — anchor the timeline to the full slot or HyperFrames hides
        // the composition early and you get a black-frame flash at the tail.
        tl.to({}, { duration: 4.4000 }, 0);
        window.__timelines['s10-payoff'] = tl;
      })();
