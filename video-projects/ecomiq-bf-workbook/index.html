<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EcomIQ — Black Friday Profit Plan workbook (9:16)</title>
    <!-- GSAP vendored locally — a CDN tag cert-fails in the render env and
         freezes renders (docs/LESSONS.md). -->
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <link rel="stylesheet" href="assets/ad.css" />
    <style>
      /* LOCAL fonts — no network at render time. Named literally, not via
         var(), because the linter doesn't resolve CSS variables. */
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      @font-face { font-family: 'Hedvig Letters Serif'; font-style: normal; font-weight: 400;
        font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }
    </style>
  </head>
  <body class="r-916">
    <!-- =====================================================================
         Render contract: root carries id, data-composition-id, data-start="0",
         data-duration, data-width, data-height. Timed visible children carry
         class="clip" + data-start / data-duration / data-track-index, except
         <video> and <audio>, which take the data-* but never class="clip".

         Secondary ratio cuts are GENERATED from this file — run
         scripts/gen-ratio.sh <ratio> after editing, never hand-edit them.

         Source is trimmed 2.75s via data-media-start on the video AND the
         audio equally, dropping the dead air before Sean's first word without
         breaking lip sync.
         ===================================================================== -->
    <div
      id="root"
      data-composition-id="ecomiq-bf-workbook"
      data-start="0"
      data-duration="52.33"
      data-width="1080"
      data-height="1920"
    >
      <!-- A-roll spine. Non-timed wrapper so the <video> is never transformed. -->
      <div id="aroll-wrap">
        <video id="aroll" data-start="0" data-duration="45.20" data-track-index="0"
               data-media-start="2.75" src="assets/aroll-916.mp4" muted playsinline></video>
      </div>
      <div id="aroll-scrim"></div>

      <!-- the audio spine: full take, same trim so lips stay in sync -->
      <audio id="vo" data-start="0" data-duration="52.33" data-track-index="1"
             data-media-start="2.75" src="assets/aroll-audio.m4a" data-volume="1"></audio>

      <!-- 1 · HOOK — "a record Black Friday can still be an unprofitable one" -->
      <div id="hook" class="clip scene" data-start="1.20" data-duration="3.25" data-track-index="2">
        <div class="bloom"></div>
        <div class="sc"><div class="sc-mid">
          <div id="hook-eyebrow" class="eyebrow eyebrow--flame">Black Friday</div>
          <div id="hook-l1">Record sales.</div>
          <div id="hook-l2wrap">
            <div id="hook-l2">Record profit.</div>
            <div id="hook-strike"></div>
          </div>
        </div></div>
      </div>

      <!-- 2 · COST STACK — discounts, ads, fulfilment, returns eat the order -->
      <div id="cost" class="clip scene" data-start="4.15" data-duration="8.55" data-track-index="3">
        <div class="bloom"></div>
        <div class="sc"><div class="sc-mid">
          <div class="eyebrow" style="margin-bottom: 22px">One Black Friday order</div>
          <div class="revrow">
            <span class="label">Revenue</span>
            <span class="figure">$114.70</span>
          </div>
          <div class="bar">
            <div id="seg-base" class="seg"></div>
            <div id="seg-disc" class="seg"></div>
            <div id="seg-ads" class="seg"></div>
            <div id="seg-ful" class="seg"></div>
            <div id="seg-ret" class="seg"></div>
            <div id="seg-left" class="seg"></div>
          </div>
          <div class="leftrow">
            <span class="label">Left per order</span>
            <span id="cost-left-fig" class="figure">$77.40</span>
          </div>
          <div class="chips">
            <div id="chip-disc" class="chip"><span>Discounts</span><span>&minus;$28.68</span></div>
            <div id="chip-ads" class="chip"><span>Advertising</span><span>&minus;$18.00</span></div>
            <div id="chip-ful" class="chip"><span>Fulfilment + delivery</span><span>&minus;$13.10</span></div>
            <div id="chip-ret" class="chip"><span>Returns</span><span>&minus;$8.00</span></div>
          </div>
        </div></div>
      </div>

      <!-- Sean carries 12.4–19.1 on camera: the contribution-margin and
           break-even ROAS line. Its graphic was cut at Anna's request. -->

      <!-- 3 · CONTRAST — sales up, profit down. Arrows only, no percentages. -->
      <div id="contrast" class="clip scene" data-start="19.10" data-duration="4.05" data-track-index="4">
        <div class="bloom"></div>
        <div class="sc"><div class="sc-mid sc-mid--center">
          <div class="eyebrow" style="margin-bottom: 34px">Sell more, keep less</div>
          <div class="contrast">
            <div>
              <svg id="arrow-up" viewBox="0 0 118 150" fill="none" aria-hidden="true">
                <path d="M59 146V16M59 8l44 48H15L59 8z" stroke="#9CD4FF" stroke-width="13"
                      stroke-linecap="round" stroke-linejoin="round" fill="#9CD4FF" />
              </svg>
              <div class="cname" style="color: var(--brand-blue-tint)">Sales</div>
            </div>
            <div class="divider"></div>
            <div>
              <svg id="arrow-down" viewBox="0 0 118 150" fill="none" aria-hidden="true">
                <path d="M59 4v130M59 142l44-48H15l44 48z" stroke="#FF4C32" stroke-width="13"
                      stroke-linecap="round" stroke-linejoin="round" fill="#FF4C32" />
              </svg>
              <div class="cname" style="color: var(--brand-flame)">Profit</div>
            </div>
          </div>
        </div></div>
      </div>

      <!-- Sean carries 23.15–26.20 on camera: "you can have nothing left".
           Its comparison graphic was cut at Anna's request. -->

      <!-- 5 · WORKBOOK B-ROLL — 26.20 → 45.20, the whole workbook stretch.
           Four graphic scenes (cover, max-discount dial, checklist, FREE) were
           replaced with EcomIQ's own 30s workbook b-roll at Anna's request. It
           is 16:9, so it plays full-width and floats in the navy field rather
           than being cropped: every board in it (the margin worksheet, the
           calendar, the spreadsheet grid) is laid out edge to edge and a
           portrait crop would cut columns off. Its edges are feathered into the
           backdrop so it reads as one navy field, not a letterbox.

           Two trims of one source, cut on Sean's lines:
             bw1  b-roll 0.30– 5.40  cover lifts in, pages fan out
             bw2  b-roll 10.65–25.30 contribution worksheet → $59.43 →
                                     Black Friday calendar → companion
                                     spreadsheets → free tools
           bw2 runs continuously, so every internal cut is the b-roll's own. -->
      <div id="broll-bg" class="clip scene" data-start="26.20" data-duration="19.30"
           data-track-index="6"><div class="bloom"></div></div>
      <!-- non-clip wrappers: the render engine repositions class="clip"
           elements, and a <video> must never be transformed directly. -->
      <div id="bw1" class="brollwrap">
        <video id="bwv1" data-start="26.20" data-duration="5.10" data-track-index="8"
               data-media-start="0.30" src="assets/workbook-broll.mp4" muted playsinline></video>
      </div>
      <div id="bw2" class="brollwrap">
        <video id="bwv2" data-start="30.85" data-duration="14.65" data-track-index="9"
               data-media-start="10.65" src="assets/workbook-broll.mp4" muted playsinline></video>
      </div>

      <!-- 10 · END CARD — fires on "links below", holds past the last word -->
      <div id="endcard" class="clip scene" data-start="45.20" data-duration="7.13" data-track-index="11">
        <div class="bloom"></div>
        <div class="sc"><div class="sc-mid sc-mid--center">
          <div id="end-head">Get your free Black Friday workbook</div>
          <div id="end-pill">Sign up free</div>
        </div></div>
      </div>

      <!-- persistent logo, top-left on every frame. Non-clip wrapper on purpose. -->
      <div id="logo-wrap"><img src="assets/ecomiq-logo-white.svg" alt="EcomIQ" /></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ---- cost-stack bar geometry ------------------------------------
         Laid out from the dollar figures rather than hardcoded pixels, and
         measured off the live element, so the same script drives both cuts
         with no ratio constants to keep in sync. Revenue is the 2025 Shopify
         BFCM AOV the workbook cites; the costs are the workbook's own worked
         example (Part 01, page 8), scaled for Black Friday. */
      const BAR_W = document.querySelector(".bar").clientWidth;
      const AOV = 114.7;
      const COST_ROWS = [
        { id: "base", usd: 37.3 },   // landed product + payment charges
        { id: "disc", usd: 28.68 },  // discounts, 25% off
        { id: "ads", usd: 18.0 },    // advertising
        { id: "ful", usd: 13.1 },    // fulfilment + delivery
        { id: "ret", usd: 8.0 },     // returns
      ];
      const w = (usd) => (usd / AOV) * BAR_W;
      let cursor = 0;
      COST_ROWS.forEach((r) => {
        const el = document.getElementById("seg-" + r.id);
        el.style.left = cursor + "px";
        el.style.width = w(r.usd) + "px";
        cursor += w(r.usd);
      });
      // "left per order" rides the right-hand end and recedes as costs land
      const LEFT_X = w(COST_ROWS[0].usd);
      const LEFT_W = BAR_W - LEFT_X;
      const segLeft = document.getElementById("seg-left");
      segLeft.style.left = LEFT_X + "px";
      segLeft.style.width = LEFT_W + "px";

      // Scene crossfades. Each scene fades up over FADE and fades out across
      // its 0.30s overlap tail, so the incoming scene is already visible
      // before the outgoing one clears — a real crossfade, not a pop.
      const FADE = 0.3;
      function fadeIn(sel, at, dur) {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: dur || FADE, ease: "sine.out" }, at);
      }
      function fadeOut(sel, at, dur) {
        tl.to(sel, { opacity: 0, duration: dur || FADE, ease: "sine.in" }, at);
      }
      // Seekable numeric count-up/down: tween a proxy, write the formatted value.
      function countTo(sel, at, dur, from, to, fmt) {
        const p = { v: from };
        tl.to(p, {
          v: to, duration: dur, ease: "power2.out",
          onUpdate() { document.querySelector(sel).textContent = fmt(p.v); },
        }, at);
      }
      const usd = (v) => "$" + v.toFixed(2);
      const pct = (v) => Math.round(v) + "%";

      /* ---- 1 · HOOK  1.20 → 4.45 ------------------------------------- */
      fadeIn("#hook", 1.2);
      tl.fromTo("#hook-eyebrow", { opacity: 0, x: -24 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 1.35);
      tl.fromTo("#hook-l1", { opacity: 0, y: 44 },
        { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" }, 1.5);
      tl.fromTo("#hook-l2", { opacity: 0, y: 44 },
        { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" }, 1.95);
      // the strike lands on "unprofitable"
      tl.fromTo("#hook-strike", { scaleX: 0 },
        { scaleX: 1, duration: 0.42, ease: "power4.out" }, 2.55);
      fadeOut("#hook", 4.15);

      /* ---- 2 · COST STACK  4.15 → 12.70 ------------------------------ */
      fadeIn("#cost", 4.15);
      tl.fromTo("#cost .eyebrow", { opacity: 0, x: -22 },
        { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 4.3);
      tl.fromTo("#cost .revrow", { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.4);
      tl.fromTo("#cost .leftrow", { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 4.6);
      // the bar fills once: base costs, then the contribution that's left
      tl.fromTo("#seg-base", { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 4.45);
      tl.fromTo("#seg-left", { scaleX: 0 },
        { scaleX: 1, duration: 0.62, ease: "power2.out" }, 4.6);
      // four costs stack in, one per line Sean says. Each eats the bar and
      // knocks the running "left per order" figure down.
      let remaining = LEFT_W;
      let prevLeft = AOV - COST_ROWS[0].usd;
      const BEATS = [4.15, 6.23, 7.85, 9.0];
      COST_ROWS.slice(1).forEach((r, i) => {
        // first chip waits for the bar to finish filling
        const t = i === 0 ? 5.25 : BEATS[i];
        remaining -= w(r.usd);
        const left = prevLeft - r.usd;
        tl.fromTo("#seg-" + r.id, { scaleX: 0 },
          { scaleX: 1, duration: 0.42, ease: "power3.out" }, t);
        tl.to("#seg-left", { scaleX: remaining / LEFT_W, duration: 0.42, ease: "power3.out" }, t);
        tl.fromTo("#chip-" + r.id, { opacity: 0, x: 46 },
          { opacity: 1, x: 0, duration: 0.4, ease: "back.out(1.5)" }, t);
        countTo("#cost-left-fig", t, 0.42, prevLeft, left, usd);
        prevLeft = left;
      });
      fadeOut("#cost", 12.4);

      /* ---- Sean on camera 12.40 → 19.10 ------------------------------
         He carries the contribution-margin / break-even ROAS line himself. */

      /* ---- 3 · CONTRAST  19.10 → 23.15 ------------------------------- */
      fadeIn("#contrast", 19.1);
      tl.fromTo("#contrast .eyebrow", { opacity: 0, x: -22 },
        { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 19.25);
      tl.fromTo("#contrast .divider", { opacity: 0, scaleY: 0 },
        { opacity: 1, scaleY: 1, duration: 0.5, ease: "power2.out" }, 19.35);
      tl.fromTo("#arrow-up", { opacity: 0, y: 66 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 19.45);
      tl.fromTo("#contrast .contrast > div:first-child .cname", { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 19.75);
      tl.fromTo("#arrow-down", { opacity: 0, y: -66 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power3.in" }, 20.25);
      tl.fromTo("#contrast .contrast > div:last-child .cname", { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 20.55);
      fadeOut("#contrast", 22.85);

      /* ---- 5 · WORKBOOK B-ROLL  26.20 → 45.20 -----------------------
         Backdrop fades up under both trims; the trims crossfade into each
         other at 31.00, which is the only cut I make — every other cut in this
         stretch is the b-roll's own. Opacity only: these wrappers carry a
         centring transform that a y-tween would clobber. */
      fadeIn("#broll-bg", 26.2, 0.42);
      fadeIn("#bw1", 26.2, 0.42);
      // cover/page-fan hands off to the worksheet on "calculate the numbers"
      fadeIn("#bw2", 30.87, 0.26);
      fadeOut("#bw1", 30.87, 0.26);
      // Out by 45.05: the b-roll carries its own end lockup from ~24.8s of
      // source, and a second EcomIQ logo bleeding in under ours would fight
      // the CTA. The 0.15s of clean backdrop it leaves is a breath, not a gap.
      fadeOut("#bw2", 44.75, 0.3);
      fadeOut("#broll-bg", 45.2);

      /* ---- 10 · END CARD  45.20 → 52.33 ------------------------------ */
      fadeIn("#endcard", 45.2, 0.4);
      tl.fromTo("#end-head", { opacity: 0, y: 46 },
        { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" }, 45.45);
      tl.fromTo("#end-pill", { opacity: 0, scale: 0.82 },
        { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.7)" }, 46.15);
      // the pill breathes through the hold, finite repeats only
      tl.to("#end-pill", { scale: 1.045, duration: 0.85, ease: "sine.inOut",
        yoyo: true, repeat: 5 }, 47.4);

      // Pad to the root data-duration.
      tl.to({}, { duration: 52.33 }, 0);
      window.__timelines["ecomiq-bf-workbook"] = tl;
    </script>
  </body>
</html>
