<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EcomIQ — Short-Form 9:16</title>
    <script src="assets/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      /* Self-hosted brand fonts — no render-time network fetch (deterministic). */
      @font-face {
        font-family: "Rethink Sans";
        font-weight: 400 800;
        font-display: block;
        src: url(assets/fonts/RethinkSans.woff2) format("woff2");
      }
      @font-face {
        font-family: "Hedvig Letters Serif";
        font-weight: 400;
        font-display: block;
        src: url(assets/fonts/HedvigLettersSerif.woff2) format("woff2");
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--brand-navy);
        font-family: "Rethink Sans", system-ui, sans-serif;
        color: var(--brand-white);
      }

      /* ------- Footage layers (full-frame, footage-forward) ------- */
      .vid-wrap {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      /* Video B stays hidden until the cut at 38s (set to opaque by GSAP). */
      #vidB-wrap { opacity: 0; }
      .vid-wrap video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 50%;
        /* Subtle grade so footage reads premium against the navy brand world. */
        filter: contrast(1.05) saturate(1.06) brightness(0.99);
      }

      /* ------- Persistent EcomIQ logo bug (top-left, white) ------- */
      #bug {
        position: absolute;
        top: 52px;
        left: 52px;
        --bug-w: 520px; /* large persistent top-left logo (~48% width) */
      }
      /* Soft dark halo so the white wordmark reads over bright shots. */
      #bug::before {
        content: "";
        position: absolute;
        left: -26px;
        top: -22px;
        right: -30px;
        bottom: -20px;
        background: radial-gradient(
          120% 145% at 32% 42%,
          rgba(4, 20, 40, 0.55) 0%,
          rgba(4, 20, 40, 0) 72%
        );
        border-radius: 44px;
      }
      #bug img {
        position: relative;
        display: block;
        width: var(--bug-w);
        height: auto;
        filter: drop-shadow(0 2px 7px rgba(0, 0, 0, 0.55));
      }

      /* ------- Branded end card ------- */
      #endcard { position: absolute; inset: 0; }
      #endcard .ec-bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(88% 52% at 50% 30%, rgba(156, 212, 255, 0.12) 0%, rgba(6, 40, 76, 0) 58%),
          var(--brand-navy);
      }
      #endcard .ec-bloom {
        position: absolute;
        left: -12%;
        bottom: -20%;
        width: 124%;
        height: 58%;
        background: var(--brand-gradient-2);
        filter: blur(96px);
        opacity: 0.36;
      }
      #endcard .ec-content {
        position: absolute;
        left: 96px;
        right: 96px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      #endcard .ec-logo { width: 500px; height: auto; }
      #endcard .ec-rule {
        width: 132px;
        height: 6px;
        background: var(--brand-flame);
        border-radius: 3px;
        margin: 58px 0 46px;
      }
      #endcard .ec-cta {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: "Rethink Sans", sans-serif;
        color: var(--brand-white);
        max-width: 900px;
      }
      #endcard .ec-cta-top {
        font-size: 46px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: rgba(255, 255, 255, 0.92);
        margin-bottom: 20px;
      }
      #endcard .ec-offer-wrap { position: relative; display: inline-block; text-align: center; }
      /* Flame energy-bloom behind the offer phrase (animated in). */
      #endcard .ec-cta-glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 124%;
        height: 172%;
        transform: translate(-50%, -50%);
        background: radial-gradient(60% 60% at 50% 50%, rgba(255, 96, 52, 0.74) 0%, rgba(255, 96, 52, 0) 70%);
        filter: blur(40px);
        opacity: 0;
        pointer-events: none;
      }
      #endcard .ec-offer {
        position: relative;
        font-size: 80px;
        font-weight: 800;
        line-height: 1.03;
        letter-spacing: -0.02em;
        color: var(--brand-white);
      }
      #endcard .ec-offer .w { display: inline-block; will-change: transform; }
      #endcard .ec-offer-underline {
        height: 9px;
        width: 100%;
        margin-top: 18px;
        background: var(--brand-flame);
        border-radius: 5px;
        transform: scaleX(0);
        transform-origin: 0% 50%;
        box-shadow: 0 0 20px rgba(255, 90, 50, 0.65);
      }

      /* ------- Full-frame animated brand overlay (edge frame + corners + sweep) ------- */
      #overlay { position: absolute; inset: 0; pointer-events: none; }
      #overlay .ov-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(122% 100% at 50% 44%, rgba(0, 0, 0, 0) 56%, rgba(2, 10, 24, 0.44) 100%);
      }
      #overlay .ov-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      #overlay .ov-rect {
        fill: none;
        stroke: rgba(255, 110, 60, 0.62);
        stroke-width: 2.5;
        stroke-dasharray: 5776;
        stroke-dashoffset: 5776;
      }
      #overlay .ov-corner {
        position: absolute;
        width: 92px;
        height: 92px;
        filter: drop-shadow(0 0 8px rgba(255, 90, 50, 0.5));
      }
      #overlay .ov-corner.tr { top: 26px; right: 26px; border-top: 5px solid var(--brand-flame); border-right: 5px solid var(--brand-flame); border-top-right-radius: 12px; }
      #overlay .ov-corner.bl { bottom: 26px; left: 26px; border-bottom: 5px solid var(--brand-flame); border-left: 5px solid var(--brand-flame); border-bottom-left-radius: 12px; }
      #overlay .ov-corner.br { bottom: 26px; right: 26px; border-bottom: 5px solid var(--brand-flame); border-right: 5px solid var(--brand-flame); border-bottom-right-radius: 12px; }
      #overlay .ov-sweep {
        position: absolute;
        top: -20%;
        left: 0;
        width: 42%;
        height: 140%;
        background: linear-gradient(90deg, rgba(255, 120, 70, 0) 0%, rgba(255, 150, 90, 0.10) 45%, rgba(255, 185, 130, 0.18) 50%, rgba(255, 150, 90, 0.10) 55%, rgba(255, 120, 70, 0) 100%);
      }
      /* Flame CTA pill under the headline (with an expanding glow ring). */
      #endcard .ec-pill-wrap { position: relative; display: inline-flex; margin-top: 52px; }
      #endcard .ec-pill-ring {
        position: absolute;
        inset: -6px;
        border-radius: 999px;
        border: 3px solid rgba(255, 90, 50, 0.85);
        opacity: 0;
        pointer-events: none;
      }
      #endcard .ec-pill {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        font-family: "Rethink Sans", sans-serif;
        font-size: 44px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--brand-white);
        background: var(--brand-flame);
        padding: 30px 66px;
        border-radius: 999px;
        box-shadow:
          0 20px 60px -12px rgba(255, 76, 50, 0.65),
          0 0 44px rgba(255, 76, 50, 0.35);
      }
      #endcard .ec-pill .ec-arrow { font-size: 44px; line-height: 1; transform: translateY(-2px); }
    </style>
  </head>
  <body>
    <!-- Render Contract: root needs id, data-composition-id, data-start=0,
         data-width, data-height. Footage-forward short: two clips full-frame,
         persistent white logo bug top-left, branded end card at the close.
         No captions, no kinetic type. -->
    <div
      id="root"
      data-composition-id="ecomiq-short-9x16"
      data-start="0"
      data-duration="48"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <!-- Video A: 0–38s (talking head, footage's own audio via sibling <audio>).
           Both clips share track-index 0 (sequential, back-to-back) and the
           cut is driven by wrapper opacity so only the active clip is visible. -->
      <div class="vid-wrap" id="vidA-wrap">
        <video
          id="vidA916"
          data-start="0"
          data-duration="38.5"
          data-track-index="0"
          src="assets/videoA-1080.mp4"
          muted
          playsinline
        ></video>
      </div>

      <!-- Video B: 38–46s -->
      <div class="vid-wrap" id="vidB-wrap">
        <video
          id="vidB916"
          data-start="38"
          data-duration="8"
          data-track-index="1"
          src="assets/videoB-1080.mp4"
          muted
          playsinline
        ></video>
      </div>

      <!-- Footage audio — separate elements so the mixer owns them -->
      <audio
        id="audA916"
        data-start="0"
        data-duration="38"
        data-track-index="6"
        data-volume="1"
        src="assets/videoA-1080.mp4"
      ></audio>
      <audio
        id="audB916"
        data-start="38"
        data-duration="8"
        data-track-index="7"
        data-volume="1"
        src="assets/videoB-1080.mp4"
      ></audio>

      <!-- Persistent logo bug (covered by the opaque end card at the close) -->
      <div id="bug" class="clip" data-start="0" data-duration="46" data-track-index="8">
        <img id="bug-logo-916" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
      </div>

      <!-- Full-frame animated brand overlay (edge frame + corners + flame sweep) -->
      <div id="overlay" class="clip" data-start="0" data-duration="46" data-track-index="11">
        <div class="ov-vignette"></div>
        <svg class="ov-svg" viewBox="0 0 1080 1920" preserveAspectRatio="none">
          <rect class="ov-rect" x="28" y="28" width="1024" height="1864" rx="12" ry="12" />
        </svg>
        <div class="ov-corner tr"></div>
        <div class="ov-corner bl"></div>
        <div class="ov-corner br"></div>
        <div class="ov-sweep"></div>
      </div>

      <!-- End card — last ~3.4s (given room for the animated reveal) -->
      <div id="endcard" class="clip" data-start="44.6" data-duration="3.4" data-track-index="9">
        <div class="ec-bg"></div>
        <div class="ec-bloom"></div>
        <div class="ec-content">
          <img id="ec-logo-916" class="ec-logo" src="assets/ecomiq-logo-white.png" alt="EcomIQ" />
          <div class="ec-rule"></div>
          <div class="ec-cta">
            <div class="ec-cta-top">Join our</div>
            <div class="ec-offer-wrap">
              <div class="ec-cta-glow"></div>
              <div class="ec-offer"><span class="w">Free</span> <span class="w">Profitability</span> <span class="w">Bootcamp</span></div>
              <div class="ec-offer-underline"></div>
            </div>
          </div>
          <div class="ec-pill-wrap">
            <div class="ec-pill-ring"></div>
            <div class="ec-pill">Join now</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Render Contract: exactly one paused GSAP timeline keyed to the
      // data-composition-id, registered on window.__timelines.
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Logo bug settles in at the top.
      tl.from("#bug", { opacity: 0, y: -10, duration: 0.5, ease: "power2.out" }, 0.25);

      // Smooth 0.5s crossfade A→B at 38s. The clips sit on separate tracks so
      // they can overlap; Video A holds an extra 0.5s to cover the dissolve.
      tl.to("#vidA-wrap", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 38);
      tl.to("#vidB-wrap", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 38);

      // ---- Full-frame brand overlay: draw the frame on, corners pop, slow flame sweep ----
      tl.to("#overlay .ov-rect", { strokeDashoffset: 0, duration: 1.2, ease: "power2.inOut" }, 0.4);
      tl.from("#overlay .ov-corner", { opacity: 0, scale: 0.4, duration: 0.5, ease: "back.out(2)", stagger: 0.12, transformOrigin: "50% 50%" }, 0.9);
      tl.set("#overlay .ov-sweep", { rotation: 8, xPercent: -170 }, 0);
      tl.to("#overlay .ov-sweep", { xPercent: 260, duration: 1.7, ease: "power1.inOut", repeat: 4, repeatDelay: 7.3 }, 3);

      // ---- End card: the big motion moment ----
      const ec = 44.6; // end-card start (matches data-start)
      tl.from("#endcard", { opacity: 0, duration: 0.45, ease: "power1.inOut" }, ec);
      tl.from("#endcard .ec-bloom", { opacity: 0, scale: 0.9, duration: 0.9, ease: "power2.out" }, ec + 0.1);
      tl.from("#endcard .ec-logo", { opacity: 0, y: -24, scale: 0.9, duration: 0.55, ease: "back.out(1.6)" }, ec + 0.15);
      tl.from("#endcard .ec-rule", { scaleX: 0, duration: 0.4, ease: "power3.inOut", transformOrigin: "50% 50%" }, ec + 0.4);
      tl.from("#endcard .ec-cta-top", { opacity: 0, y: 20, duration: 0.4, ease: "power3.out" }, ec + 0.5);
      // Offer words SLAM in big, staggered.
      tl.from("#endcard .ec-offer .w", { opacity: 0, scale: 1.6, y: 6, duration: 0.5, ease: "back.out(2.2)", stagger: 0.12, transformOrigin: "50% 50%" }, ec + 0.7);
      // Flame energy-bloom blooms behind the offer, then settles to a warm halo.
      tl.fromTo("#endcard .ec-cta-glow", { opacity: 0, scale: 0.7 }, { opacity: 0.72, scale: 1, duration: 0.4, ease: "power2.out" }, ec + 0.85);
      tl.to("#endcard .ec-cta-glow", { opacity: 0.2, duration: 0.7, ease: "power2.inOut" }, ec + 1.4);
      // Flame underline sweeps in under the offer phrase.
      tl.fromTo("#endcard .ec-offer-underline", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, ec + 1.15);
      // Pill pops, then an expanding glow ring pulses out (twice).
      tl.from("#endcard .ec-pill", { opacity: 0, scale: 0.6, y: 12, duration: 0.5, ease: "back.out(2.4)", transformOrigin: "50% 50%" }, ec + 1.35);
      tl.fromTo("#endcard .ec-pill-ring", { opacity: 0.85, scale: 0.92 }, { opacity: 0, scale: 1.5, duration: 0.8, ease: "power2.out", repeat: 1, immediateRender: false }, ec + 1.65);

      // Pad the timeline so tl.duration() matches root data-duration.
      tl.to({}, { duration: 48 }, 0);

      window.__timelines["ecomiq-short-9x16"] = tl;
    </script>
  </body>
</html>
