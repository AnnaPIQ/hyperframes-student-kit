<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EcomIQ — Short-Form 9:16</title>
    <script src="assets/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      /* Self-hosted brand fonts — no render-time network fetch (deterministic). */
      @font-face {
        font-family: "Rethink Sans";
        font-weight: 400 800;
        font-display: block;
        src: url(assets/fonts/RethinkSans.woff2) format("woff2");
      }
      @font-face {
        font-family: "Hedvig Letters Serif";
        font-weight: 400;
        font-display: block;
        src: url(assets/fonts/HedvigLettersSerif.woff2) format("woff2");
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--brand-navy);
        font-family: "Rethink Sans", system-ui, sans-serif;
        color: var(--brand-white);
      }

      /* ------- Footage layers (full-frame, footage-forward) ------- */
      .vid-wrap {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      /* Video B stays hidden until the cut at 38s (set to opaque by GSAP). */
      #vidB-wrap { opacity: 0; }
      .vid-wrap video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 50%;
        /* Subtle grade so footage reads premium against the navy brand world. */
        filter: contrast(1.05) saturate(1.06) brightness(0.99);
      }

      /* ------- Persistent EcomIQ logo bug (top-left, white) ------- */
      #bug {
        position: absolute;
        top: 52px;
        left: 52px;
        --bug-w: 520px; /* large persistent top-left logo (~48% width) */
      }
      /* Soft dark halo so the white wordmark reads over bright shots. */
      #bug::before {
        content: "";
        position: absolute;
        left: -26px;
        top: -22px;
        right: -30px;
        bottom: -20px;
        background: radial-gradient(
          120% 145% at 32% 42%,
          rgba(4, 20, 40, 0.55) 0%,
          rgba(4, 20, 40, 0) 72%
        );
        border-radius: 44px;
      }
      #bug img {
        position: relative;
        display: block;
        width: var(--bug-w);
        height: auto;
        filter: drop-shadow(0 2px 7px rgba(0, 0, 0, 0.55));
      }

      /* ------- Branded end card ------- */
      #endcard { position: absolute; inset: 0; }
      #endcard .ec-bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(88% 52% at 50% 30%, rgba(156, 212, 255, 0.12) 0%, rgba(6, 40, 76, 0) 58%),
          var(--brand-navy);
      }
      #endcard .ec-bloom {
        position: absolute;
        left: -12%;
        bottom: -20%;
        width: 124%;
        height: 58%;
        background: var(--brand-gradient-2);
        filter: blur(96px);
        opacity: 0.36;
      }
      #endcard .ec-content {
        position: absolute;
        left: 96px;
        right: 96px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      #endcard .ec-logo { width: 500px; height: auto; }
      #endcard .ec-rule {
        width: 132px;
        height: 6px;
        background: var(--brand-flame);
        border-radius: 3px;
        margin: 58px 0 46px;
      }
      #endcard .ec-cta {
        font-family: "Rethink Sans", sans-serif;
        font-size: 66px;
        font-weight: 700;
        line-height: 1.06;
        letter-spacing: -0.02em;
        color: var(--brand-white);
        max-width: 860px;
      }
      /* Wrap + flame energy-bloom behind the offer phrase (animated in). */
      #endcard .ec-cta-wrap { position: relative; display: flex; justify-content: center; }
      #endcard .ec-cta-glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 118%;
        height: 150%;
        transform: translate(-50%, -50%);
        background: radial-gradient(60% 60% at 50% 50%, rgba(255, 96, 52, 0.6) 0%, rgba(255, 96, 52, 0) 70%);
        filter: blur(36px);
        opacity: 0;
        pointer-events: none;
      }
      #endcard .ec-cta .w { display: inline-block; will-change: transform; }
      /* Flame CTA pill under the headline. */
      #endcard .ec-pill {
        margin-top: 54px;
        display: inline-flex;
        align-items: center;
        gap: 16px;
        font-family: "Rethink Sans", sans-serif;
        font-size: 44px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--brand-white);
        background: var(--brand-flame);
        padding: 30px 66px;
        border-radius: 999px;
        box-shadow:
          0 20px 60px -12px rgba(255, 76, 50, 0.65),
          0 0 44px rgba(255, 76, 50, 0.35);
      }
      #endcard .ec-pill .ec-arrow { font-size: 44px; line-height: 1; transform: translateY(-2px); }
    </style>
  </head>
  <body>
    <!-- Render Contract: root needs id, data-composition-id, data-start=0,
         data-width, data-height. Footage-forward short: two clips full-frame,
         persistent white logo bug top-left, branded end card at the close.
         No captions, no kinetic type. -->
    <div
      id="root"
      data-composition-id="ecomiq-short-9x16"
      data-start="0"
      data-duration="48"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <!-- Video A: 0–38s (talking head, footage's own audio via sibling <audio>).
           Both clips share track-index 0 (sequential, back-to-back) and the
           cut is driven by wrapper opacity so only the active clip is visible. -->
      <div class="vid-wrap" id="vidA-wrap">
        <video
          id="vidA916"
          data-start="0"
          data-duration="38.5"
          data-track-index="0"
          src="assets/videoA-1080.mp4"
          muted
          playsinline
        ></video>
      </div>

      <!-- Video B: 38–46s -->
      <div class="vid-wrap" id="vidB-wrap">
        <video
          id="vidB916"
          data-start="38"
          data-duration="8"
          data-track-index="1"
          src="assets/videoB-1080.mp4"
          muted
          playsinline
        ></video>
      </div>

      <!-- Footage audio — separate elements so the mixer owns them -->
      <audio
        id="audA916"
        data-start="0"
        data-duration="38"
        data-track-index="6"
        data-volume="1"
        src="assets/videoA-1080.mp4"
      ></audio>
      <audio
        id="audB916"
        data-start="38"
        data-duration="8"
        data-track-index="7"
        data-volume="1"
        src="assets/videoB-1080.mp4"
      ></audio>

      <!-- Persistent logo bug (covered by the opaque end card at the close) -->
      <div id="bug" class="clip" data-start="0" data-duration="46" data-track-index="8">
        <img id="bug-logo-916" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
      </div>

      <!-- End card — last ~3.4s (given room for the animated reveal) -->
      <div id="endcard" class="clip" data-start="44.6" data-duration="3.4" data-track-index="9">
        <div class="ec-bg"></div>
        <div class="ec-bloom"></div>
        <div class="ec-content">
          <img id="ec-logo-916" class="ec-logo" src="assets/ecomiq-logo-white.png" alt="EcomIQ" />
          <div class="ec-rule"></div>
          <div class="ec-cta-wrap">
            <div class="ec-cta-glow"></div>
            <div class="ec-cta"><span class="w">Join</span> <span class="w">our</span> <span class="w hot">Free</span> <span class="w hot">Profitability</span> <span class="w hot">Bootcamp</span></div>
          </div>
          <div class="ec-pill">Join now</div>
        </div>
      </div>
    </div>

    <script>
      // Render Contract: exactly one paused GSAP timeline keyed to the
      // data-composition-id, registered on window.__timelines.
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Logo bug settles in at the top.
      tl.from("#bug", { opacity: 0, y: -10, duration: 0.5, ease: "power2.out" }, 0.25);

      // Smooth 0.5s crossfade A→B at 38s. The clips sit on separate tracks so
      // they can overlap; Video A holds an extra 0.5s to cover the dissolve.
      tl.to("#vidA-wrap", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 38);
      tl.to("#vidB-wrap", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 38);

      // ---- End card: the one big motion moment (restrained everywhere else) ----
      const ec = 44.6; // end-card start (matches data-start)
      tl.from("#endcard", { opacity: 0, duration: 0.45, ease: "power1.inOut" }, ec);
      tl.from("#endcard .ec-bloom", { opacity: 0, scale: 0.9, duration: 0.9, ease: "power2.out" }, ec + 0.1);
      tl.from("#endcard .ec-logo", { opacity: 0, y: 18, scale: 0.92, duration: 0.55, ease: "back.out(1.4)" }, ec + 0.2);
      tl.from("#endcard .ec-rule", { scaleX: 0, duration: 0.45, ease: "power3.inOut", transformOrigin: "50% 50%" }, ec + 0.45);
      // Headline assembles; the offer words get the hero pop + a flame bloom behind them.
      tl.from("#endcard .ec-cta .w:not(.hot)", { opacity: 0, y: 20, duration: 0.45, ease: "power3.out", stagger: 0.06 }, ec + 0.55);
      tl.from("#endcard .ec-cta .hot", { opacity: 0, y: 24, scale: 0.6, duration: 0.5, ease: "back.out(1.9)", stagger: 0.09 }, ec + 0.8);
      tl.fromTo("#endcard .ec-cta-glow", { opacity: 0, scale: 0.7 }, { opacity: 0.6, scale: 1, duration: 0.45, ease: "power2.out" }, ec + 0.95);
      tl.to("#endcard .ec-cta-glow", { opacity: 0.16, duration: 0.7, ease: "power2.inOut" }, ec + 1.45);
      // CTA pill pops in, then one subtle pulse.
      tl.from("#endcard .ec-pill", { opacity: 0, scale: 0.7, y: 10, duration: 0.5, ease: "back.out(2)", transformOrigin: "50% 50%" }, ec + 1.15);
      tl.to("#endcard .ec-pill", { scale: 1.04, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, ec + 1.85);

      // Pad the timeline so tl.duration() matches root data-duration.
      tl.to({}, { duration: 48 }, 0);

      window.__timelines["ecomiq-short-9x16"] = tl;
    </script>
  </body>
</html>
