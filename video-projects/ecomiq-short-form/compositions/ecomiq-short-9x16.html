<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EcomIQ — Short-Form 9:16</title>
    <script src="assets/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      /* Self-hosted brand fonts — no render-time network fetch (deterministic). */
      @font-face {
        font-family: "Rethink Sans";
        font-weight: 400 800;
        font-display: block;
        src: url(assets/fonts/RethinkSans.woff2) format("woff2");
      }
      @font-face {
        font-family: "Hedvig Letters Serif";
        font-weight: 400;
        font-display: block;
        src: url(assets/fonts/HedvigLettersSerif.woff2) format("woff2");
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--brand-navy);
        font-family: "Rethink Sans", system-ui, sans-serif;
        color: var(--brand-white);
      }

      /* ------- Footage layers (full-frame talking head) ------- */
      .vid-wrap {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #vidB-wrap { opacity: 0; } /* Video B revealed at the 38s cut by GSAP. */
      .vid-wrap video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 50%;
        /* Cinematic grade so the face seats into the navy brand world. */
        filter: contrast(1.08) saturate(1.05) brightness(0.95);
      }
      /* Persistent vignette over the footage (covered by full-screen scenes). */
      #face-vig {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(128% 92% at 50% 40%, rgba(0, 0, 0, 0) 52%, rgba(3, 12, 26, 0.62) 100%),
          linear-gradient(180deg, rgba(3, 12, 26, 0.36) 0%, rgba(3, 12, 26, 0) 22%);
      }

      /* ------- Persistent EcomIQ logo bug (top-left, small — matches ref) ------- */
      #bug {
        position: absolute;
        top: 46px;
        left: 50px;
        --bug-w: 188px;
      }
      #bug::before {
        content: "";
        position: absolute;
        left: -18px; top: -14px; right: -20px; bottom: -14px;
        background: radial-gradient(120% 145% at 32% 42%, rgba(4, 20, 40, 0.5) 0%, rgba(4, 20, 40, 0) 72%);
        border-radius: 30px;
      }
      #bug img {
        position: relative;
        display: block;
        width: var(--bug-w);
        height: auto;
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.55));
      }

      /* =====================================================================
         Full-screen graphic scenes — shared chrome (navy world + grid + vig)
         ===================================================================== */
      .scene { position: absolute; inset: 0; opacity: 0; }
      .scene .sc-bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(92% 58% at 50% 34%, rgba(64, 132, 214, 0.22) 0%, rgba(6, 26, 52, 0) 60%),
          linear-gradient(180deg, #0a2138 0%, #071627 100%);
      }
      .scene .sc-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(120, 172, 232, 0.075) 1px, transparent 1px),
          linear-gradient(90deg, rgba(120, 172, 232, 0.075) 1px, transparent 1px);
        background-size: 94px 94px;
        -webkit-mask-image: radial-gradient(102% 80% at 50% 46%, #000 52%, transparent 100%);
        mask-image: radial-gradient(102% 80% at 50% 46%, #000 52%, transparent 100%);
      }
      .scene .sc-vig {
        position: absolute;
        inset: 0;
        background: radial-gradient(122% 100% at 50% 42%, rgba(0, 0, 0, 0) 54%, rgba(2, 10, 22, 0.5) 100%);
      }
      .sc-center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 92px;
      }
      .sc-eyebrow {
        font-family: "Rethink Sans", sans-serif;
        font-weight: 700;
        font-size: 34px;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: rgba(150, 196, 240, 0.8);
      }

      /* ---- Scene 1 — big ROAS number, stamped DOESN'T MATTER ---- */
      #s1 .s1-eb { margin-bottom: 46px; }
      #s1 .s1-num {
        font-family: "Rethink Sans", sans-serif;
        font-weight: 800;
        font-size: 300px;
        line-height: 0.9;
        letter-spacing: -0.03em;
        color: #c4e2ff;
        text-shadow: 0 0 64px rgba(96, 172, 255, 0.45);
      }
      #s1 .s1-arrow { font-size: 118px; color: #8fc4ff; vertical-align: middle; margin-right: 14px; }
      #s1 .s1-x { font-size: 172px; color: #7fb4f0; }
      #s1 .s1-sub {
        margin-top: 10px;
        font-weight: 700;
        font-size: 40px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(150, 196, 240, 0.72);
      }
      #s1 .s1-stamp {
        position: relative;
        margin-top: 74px;
        font-family: "Rethink Sans", sans-serif;
        font-weight: 800;
        font-size: 98px;
        letter-spacing: -0.01em;
        color: var(--brand-flame);
        transform: rotate(-7deg);
        text-shadow: 0 6px 30px rgba(255, 80, 40, 0.4);
      }
      #s1 .s1-strike {
        position: absolute;
        left: -5%;
        top: 52%;
        width: 110%;
        height: 10px;
        background: var(--brand-flame);
        border-radius: 5px;
        transform: scaleX(0);
        transform-origin: 0 50%;
        box-shadow: 0 0 22px rgba(255, 90, 50, 0.7);
      }

      /* ---- Scene 2 — Great ROAS / Thin margins / = $0 profit ---- */
      #s2 .sc-eyebrow { margin-bottom: 50px; }
      #s2 .s2-l {
        font-family: "Rethink Sans", sans-serif;
        font-weight: 800;
        font-size: 106px;
        line-height: 1.14;
        letter-spacing: -0.02em;
      }
      #s2 .s2-l.white { color: #ffffff; }
      #s2 .s2-l.blue { color: #c4e2ff; text-shadow: 0 0 40px rgba(96, 172, 255, 0.32); }
      #s2 .s2-eq {
        margin-top: 30px;
        font-family: "Rethink Sans", sans-serif;
        font-weight: 800;
        font-size: 124px;
        letter-spacing: -0.02em;
      }
      #s2 .s2-eq .eqsign { color: rgba(150, 196, 240, 0.55); }
      #s2 .s2-eq .flame { color: var(--brand-flame); text-shadow: 0 6px 30px rgba(255, 80, 40, 0.42); }

      /* ---- Scene 3 — rising spend bars, flat profit line, $0 LEFT ---- */
      #s3 .s3-top {
        position: absolute;
        top: 236px;
        left: 0; right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
      }
      #s3 .s3-pills { display: flex; gap: 22px; }
      #s3 .s3-pill {
        font-family: "Rethink Sans", sans-serif;
        font-weight: 800;
        font-size: 40px;
        letter-spacing: 0.01em;
        padding: 15px 34px;
        border-radius: 999px;
        border: 2px solid;
      }
      #s3 .s3-pill.blue { color: #c4e2ff; border-color: rgba(120, 180, 255, 0.5); background: rgba(90, 150, 230, 0.12); }
      #s3 .s3-pill.flame { color: var(--brand-flame); border-color: rgba(255, 110, 60, 0.55); background: rgba(255, 90, 50, 0.1); }
      #s3 .s3-chart {
        position: absolute;
        left: 112px; right: 112px;
        bottom: 560px;
        height: 640px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 26px;
      }
      #s3 .s3-bar {
        flex: 1;
        border-radius: 14px 14px 0 0;
        background: linear-gradient(180deg, #c4e2ff 0%, #4d86c8 100%);
        transform: scaleY(0);
        transform-origin: 50% 100%;
        box-shadow: 0 0 30px rgba(120, 180, 255, 0.22);
      }
      #s3 .s3-baseline {
        position: absolute;
        left: 112px; right: 112px;
        bottom: 560px;
        height: 3px;
        background: rgba(150, 196, 240, 0.3);
        transform: scaleX(0);
        transform-origin: 0 50%;
      }
      #s3 .s3-profit {
        position: absolute;
        left: 112px; right: 112px;
        bottom: 610px;
        height: 7px;
        background: var(--brand-flame);
        border-radius: 4px;
        transform: scaleX(0);
        transform-origin: 0 50%;
        box-shadow: 0 0 20px rgba(255, 90, 50, 0.6);
      }
      #s3 .s3-profit-label {
        position: absolute;
        bottom: 548px;
        right: 122px;
        font-weight: 800;
        font-size: 32px;
        letter-spacing: 0.12em;
        color: var(--brand-flame);
      }
      #s3 .s3-months {
        position: absolute;
        left: 112px; right: 112px;
        bottom: 520px;
        display: flex;
        justify-content: space-between;
      }
      #s3 .s3-month {
        flex: 1;
        text-align: center;
        font-weight: 700;
        font-size: 30px;
        color: rgba(150, 196, 240, 0.7);
      }
      #s3 .s3-stamp {
        position: absolute;
        left: 0; right: 0;
        bottom: 330px;
        text-align: center;
        font-family: "Rethink Sans", sans-serif;
        font-weight: 800;
        font-size: 132px;
        letter-spacing: -0.02em;
        color: var(--brand-flame);
        text-shadow: 0 8px 34px rgba(255, 80, 40, 0.45);
      }

      /* ---- Scene 4 — THE SIMPLE ANSWER ---- */
      #s4 .sc-eyebrow { margin-bottom: 46px; }
      #s4 .s4-l1 {
        font-family: "Rethink Sans", sans-serif;
        font-weight: 800;
        font-size: 120px;
        line-height: 1.05;
        letter-spacing: -0.02em;
        color: #ffffff;
      }
      #s4 .s4-l1 .flame { color: #ffffff; }
      #s4 .s4-l2 {
        margin-top: 20px;
        font-family: "Rethink Sans", sans-serif;
        font-weight: 800;
        font-size: 96px;
        line-height: 1.05;
        letter-spacing: -0.02em;
        color: #c4e2ff;
        text-shadow: 0 0 40px rgba(96, 172, 255, 0.3);
      }

      /* ------- Flame CTA band over clip B ("free profitability bootcamp") ------- */
      #cta-band { position: absolute; left: 0; right: 0; top: 300px; display: flex; justify-content: center; }
      #cta-band .cb-pill {
        display: inline-flex;
        align-items: center;
        font-family: "Rethink Sans", sans-serif;
        font-weight: 800;
        font-size: 50px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--brand-white);
        background: var(--brand-flame);
        padding: 30px 56px;
        border-radius: 16px;
        white-space: nowrap;
        box-shadow: 0 22px 60px -18px rgba(255, 76, 50, 0.7), 0 0 42px rgba(255, 76, 50, 0.3);
      }

      /* ------- Branded end card ------- */
      #endcard { position: absolute; inset: 0; }
      #endcard .ec-bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(88% 52% at 50% 30%, rgba(156, 212, 255, 0.12) 0%, rgba(6, 40, 76, 0) 58%),
          var(--brand-navy);
      }
      #endcard .ec-bloom {
        position: absolute;
        left: -12%; bottom: -20%;
        width: 124%; height: 58%;
        background: var(--brand-gradient-2);
        filter: blur(96px);
        opacity: 0.36;
      }
      #endcard .ec-content {
        position: absolute;
        left: 96px; right: 96px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      #endcard .ec-logo { width: 500px; height: auto; }
      #endcard .ec-rule {
        width: 132px; height: 6px;
        background: var(--brand-flame);
        border-radius: 3px;
        margin: 58px 0 46px;
      }
      #endcard .ec-cta {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: "Rethink Sans", sans-serif;
        color: var(--brand-white);
        max-width: 900px;
      }
      #endcard .ec-cta-top {
        font-size: 46px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: rgba(255, 255, 255, 0.92);
        margin-bottom: 20px;
      }
      #endcard .ec-offer-wrap { position: relative; display: inline-block; text-align: center; }
      #endcard .ec-cta-glow {
        position: absolute;
        left: 50%; top: 50%;
        width: 124%; height: 172%;
        transform: translate(-50%, -50%);
        background: radial-gradient(60% 60% at 50% 50%, rgba(255, 96, 52, 0.74) 0%, rgba(255, 96, 52, 0) 70%);
        filter: blur(40px);
        opacity: 0;
        pointer-events: none;
      }
      #endcard .ec-offer {
        position: relative;
        font-size: 80px;
        font-weight: 800;
        line-height: 1.03;
        letter-spacing: -0.02em;
        color: var(--brand-white);
      }
      #endcard .ec-offer .w { display: inline-block; will-change: transform; }
      #endcard .ec-offer-underline {
        height: 9px; width: 100%;
        margin-top: 18px;
        background: var(--brand-flame);
        border-radius: 5px;
        transform: scaleX(0);
        transform-origin: 0% 50%;
        box-shadow: 0 0 20px rgba(255, 90, 50, 0.65);
      }
      #endcard .ec-pill-wrap { position: relative; display: inline-flex; margin-top: 52px; }
      #endcard .ec-pill-ring {
        position: absolute;
        inset: -6px;
        border-radius: 999px;
        border: 3px solid rgba(255, 90, 50, 0.85);
        opacity: 0;
        pointer-events: none;
      }
      #endcard .ec-pill {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        font-family: "Rethink Sans", sans-serif;
        font-size: 44px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--brand-white);
        background: var(--brand-flame);
        padding: 30px 66px;
        border-radius: 999px;
        box-shadow:
          0 20px 60px -12px rgba(255, 76, 50, 0.65),
          0 0 44px rgba(255, 76, 50, 0.35);
      }
      #endcard .ec-pill .ec-arrow { font-size: 44px; line-height: 1; transform: translateY(-2px); }
    </style>
  </head>
  <body>
    <!-- Render Contract: root needs id, data-composition-id, data-start=0,
         data-width, data-height. Reference style: talking head punctuated by
         full-screen graphic scenes cut to the VO, small logo bug, end card.
         Captions are added downstream, so the lower third is kept clear. -->
    <div
      id="root"
      data-composition-id="ecomiq-short-9x16"
      data-start="0"
      data-duration="48"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <!-- Video A: 0–38s -->
      <div class="vid-wrap" id="vidA-wrap">
        <video id="vidA916" data-start="0" data-duration="38.5" data-track-index="0"
          src="assets/videoA-1080.mp4" muted playsinline></video>
      </div>
      <!-- Video B: 38–46s -->
      <div class="vid-wrap" id="vidB-wrap">
        <video id="vidB916" data-start="38" data-duration="8" data-track-index="1"
          src="assets/videoB-1080.mp4" muted playsinline></video>
      </div>

      <!-- Footage audio — separate elements so the mixer owns them -->
      <audio id="audA916" data-start="0" data-duration="38" data-track-index="6" data-volume="1" src="assets/videoA-1080.mp4"></audio>
      <audio id="audB916" data-start="38" data-duration="8" data-track-index="7" data-volume="1" src="assets/videoB-1080.mp4"></audio>

      <!-- Persistent footage vignette (below scenes) -->
      <div id="face-vig" class="clip" data-start="0" data-duration="46" data-track-index="2"></div>

      <!-- ================= Full-screen graphic scenes ================= -->
      <!-- S1: ROAS number, stamped DOESN'T MATTER (2.55–9.10) -->
      <div id="s1" class="scene clip" data-start="2.55" data-duration="6.55" data-track-index="4">
        <div class="sc-bg"></div><div class="sc-grid"></div><div class="sc-vig"></div>
        <div class="sc-center">
          <div class="sc-eyebrow s1-eb">Return on ad spend</div>
          <div class="s1-num"><span class="s1-arrow">&#9650;</span>4.8<span class="s1-x">x</span></div>
          <div class="s1-sub">Meta&nbsp;&nbsp;&middot;&nbsp;&nbsp;Google</div>
          <div class="s1-stamp"><span>DOESN&rsquo;T MATTER</span><i class="s1-strike"></i></div>
        </div>
      </div>

      <!-- S3: rising spend bars, flat profit line, $0 LEFT (18.85–29.30) -->
      <div id="s3" class="scene clip" data-start="18.85" data-duration="10.45" data-track-index="4">
        <div class="sc-bg"></div><div class="sc-grid"></div><div class="sc-vig"></div>
        <div class="s3-top">
          <div class="sc-eyebrow s3-eb">$10K&ndash;$50K / month in ad spend</div>
          <div class="s3-pills">
            <div class="s3-pill blue">SPEND &#9650;</div>
            <div class="s3-pill flame">PROFIT &#9660;</div>
          </div>
        </div>
        <div class="s3-chart">
          <div class="s3-bar" style="height:132px"></div>
          <div class="s3-bar" style="height:204px"></div>
          <div class="s3-bar" style="height:288px"></div>
          <div class="s3-bar" style="height:378px"></div>
          <div class="s3-bar" style="height:476px"></div>
          <div class="s3-bar" style="height:580px"></div>
        </div>
        <div class="s3-baseline"></div>
        <div class="s3-profit"></div>
        <div class="s3-months">
          <div class="s3-month">Jan</div><div class="s3-month">Feb</div><div class="s3-month">Mar</div>
          <div class="s3-month">Apr</div><div class="s3-month">May</div><div class="s3-month">Jun</div>
        </div>
        <div class="s3-stamp">$0 LEFT</div>
      </div>

      <!-- S4: THE SIMPLE ANSWER (32.85–38.00) -->
      <div id="s4" class="scene clip" data-start="32.85" data-duration="5.15" data-track-index="5">
        <div class="sc-bg"></div><div class="sc-grid"></div><div class="sc-vig"></div>
        <div class="sc-center">
          <div class="sc-eyebrow">The simple answer</div>
          <div class="s4-l1">Not enough <span class="flame">profit</span></div>
          <div class="s4-l2">built into the products.</div>
        </div>
      </div>

      <!-- Persistent logo bug (above scenes; covered by the end card) -->
      <div id="bug" class="clip" data-start="0" data-duration="43.4" data-track-index="8">
        <img id="bug-logo-916" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
      </div>

      <!-- Flame CTA band — lands on "free profitability bootcamp" (~41s) -->
      <div id="cta-band" class="clip" data-start="40.5" data-duration="2.9" data-track-index="10">
        <div class="cb-pill">Free Profitability Bootcamp</div>
      </div>

      <!-- End card — CTA close -->
      <div id="endcard" class="clip" data-start="43.4" data-duration="4.6" data-track-index="9">
        <div class="ec-bg"></div>
        <div class="ec-bloom"></div>
        <div class="ec-content">
          <img id="ec-logo-916" class="ec-logo" src="assets/ecomiq-logo-white.png" alt="EcomIQ" />
          <div class="ec-rule"></div>
          <div class="ec-cta">
            <div class="ec-cta-top">Join our</div>
            <div class="ec-offer-wrap">
              <div class="ec-cta-glow"></div>
              <div class="ec-offer"><span class="w">Free</span> <span class="w">Profitability</span> <span class="w">Bootcamp</span></div>
              <div class="ec-offer-underline"></div>
            </div>
          </div>
          <div class="ec-pill-wrap">
            <div class="ec-pill-ring"></div>
            <div class="ec-pill">Apply free</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Logo bug settles in.
      tl.from("#bug", { opacity: 0, y: -10, duration: 0.5, ease: "power2.out" }, 0.25);
      // Slow Ken Burns on the footage so the face never sits still.
      tl.fromTo(".vid-wrap video", { scale: 1.0 }, { scale: 1.05, duration: 46, ease: "none" }, 0);

      // A→B cut at 38s (separate tracks; A holds an extra 0.5s under the dissolve).
      tl.to("#vidA-wrap", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 38);
      tl.to("#vidB-wrap", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 38);

      // ===================== Scene 1 — 2.55s =====================
      tl.fromTo("#s1", { opacity: 0 }, { opacity: 1, duration: 0.30, ease: "power2.out" }, 2.55);
      tl.from("#s1 .s1-eb", { opacity: 0, y: 18, duration: 0.4, ease: "power3.out" }, 2.75);
      tl.from("#s1 .s1-num", { opacity: 0, scale: 1.4, duration: 0.55, ease: "back.out(1.7)", transformOrigin: "50% 50%" }, 2.95);
      tl.from("#s1 .s1-sub", { opacity: 0, y: 14, duration: 0.4, ease: "power2.out" }, 3.35);
      // Stamp lands AFTER the number is fully visible ("it doesn't matter" ~7.0–8.5).
      tl.fromTo("#s1 .s1-stamp", { opacity: 0, scale: 1.6, rotation: -15 }, { opacity: 1, scale: 1, rotation: -7, duration: 0.42, ease: "back.out(2.2)", transformOrigin: "50% 50%" }, 6.7);
      tl.fromTo("#s1 .s1-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, 7.05);
      tl.to("#s1", { opacity: 0, duration: 0.28, ease: "power2.in" }, 8.82);

      // ===================== Scene 3 — 18.85s =====================
      tl.fromTo("#s3", { opacity: 0 }, { opacity: 1, duration: 0.32, ease: "power2.out" }, 18.85);
      tl.from("#s3 .s3-eb", { opacity: 0, y: 16, duration: 0.4, ease: "power3.out" }, 19.05);
      tl.from("#s3 .s3-pill", { opacity: 0, y: 18, scale: 0.8, duration: 0.4, ease: "back.out(2)", stagger: 0.12, transformOrigin: "50% 50%" }, 19.4);
      tl.fromTo("#s3 .s3-baseline", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 19.7);
      tl.from("#s3 .s3-month", { opacity: 0, duration: 0.3, stagger: 0.06 }, 19.85);
      // Bars rise during "3 to 5x ... $10k to $50k a month" (20.2–24.7).
