<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EcomIQ — Short-form 9:16 (overlays)</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      @font-face { font-family: 'Hedvig Letters Serif'; font-style: normal; font-weight: 400;
        font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden;
        background: var(--brand-navy); font-family: 'Rethink Sans', system-ui, sans-serif; color: var(--brand-white); }

      /* ---- Footage (stays full-screen the whole time) ---- */
      #footage-wrap { position: absolute; inset: 0; z-index: 0; }
      #footage { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center center;
        filter: contrast(1.05) saturate(1.05) brightness(0.97); }
      #footage-wrap::after { content: ""; position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 82% 86% at 50% 46%, transparent 60%, rgba(6,40,76,0.30) 100%); }
      #top-scrim { position: absolute; top: 0; left: 0; width: 1080px; height: 360px; z-index: 1; pointer-events: none;
        background: linear-gradient(180deg, rgba(6,40,76,0.6) 0%, rgba(6,40,76,0.26) 52%, rgba(6,40,76,0) 100%); }

      /* ---- Persistent brand chrome ---- */
      #logo { position: absolute; top: 72px; left: 66px; width: 304px; height: auto; z-index: 7;
        filter: drop-shadow(0 3px 12px rgba(0,0,0,0.55)); }

      /* ---- Flame-pill banners over the footage ---- */
      #pills { position: absolute; top: 176px; left: 0; width: 1080px; z-index: 5; pointer-events: none; }
      .pill { position: absolute; top: 0; left: 0; right: 0; margin-inline: auto; width: fit-content; max-width: 972px;
        opacity: 0; white-space: nowrap; text-align: center; transform-origin: center center;
        background: var(--brand-flame); color: var(--brand-white);
        font-weight: 800; font-size: 46px; letter-spacing: 0.015em; text-transform: uppercase; line-height: 1;
        padding: 28px 52px; border-radius: 999px;
        box-shadow: 0 16px 54px -8px rgba(255,76,50,0.6), inset 0 1px 0 rgba(255,255,255,0.22); }

      /* ---- End card ---- */
      #endcard { position: absolute; inset: 0; z-index: 8; opacity: 0;
        background: radial-gradient(88% 52% at 50% 24%, rgba(156,212,255,0.12) 0%, rgba(6,40,76,0) 55%), var(--brand-navy);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; }
      #endcard::before { content: ""; position: absolute; left: -12%; bottom: -20%; width: 124%; height: 58%;
        background: var(--brand-gradient-2); filter: blur(96px); opacity: 0.34; pointer-events: none; }
      #ec-logo { width: 520px; height: auto; position: relative; }
      #ec-kicker { position: relative; font-weight: 700; font-size: 30px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--brand-blue-tint); }
      #ec-cta { position: relative; font-weight: 700; font-size: 34px; letter-spacing: -0.01em; color: var(--brand-white);
        background: var(--brand-flame); padding: 30px 56px; border-radius: 999px; white-space: nowrap;
        box-shadow: 0 22px 70px -16px rgba(255,76,50,0.65); margin-top: 10px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="ecomiq-short-9x16-overlays" data-start="0" data-duration="49.6"
         data-width="1080" data-height="1920">

      <div id="footage-wrap">
        <video id="footage" data-start="0" data-duration="47.0" data-track-index="0"
               src="assets/script5-pricing.mp4" muted playsinline></video>
      </div>
      <audio id="footage-audio" data-start="0" data-duration="47.0" data-track-index="9"
             data-volume="1" src="assets/script5-pricing.m4a"></audio>

      <div id="top-scrim" class="clip" data-start="0" data-duration="47.2" data-track-index="1"></div>
      <img id="logo" class="clip" data-start="0" data-duration="47.2" data-track-index="7"
           src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />

      <!-- Flame pill banners (GSAP-driven; built in JS) -->
      <div id="pills"></div>

      <!-- End card -->
      <div id="endcard">
        <img id="ec-logo" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
        <div id="ec-kicker">Ready to lift your profit?</div>
        <div id="ec-cta">Join our Free Profitability Bootcamp</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const FOOT = 47.0, TOTAL = 49.6;
      const tl = gsap.timeline({ paused: true });

      // ---- Brand chrome ----
      tl.fromTo("#logo", { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2)
        .fromTo("#top-scrim", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "sine.out" }, 0)
        .to(["#logo", "#top-scrim"], { opacity: 0, duration: 0.35, ease: "power2.in" }, FOOT - 0.5);

      // ---- Flame pill banners, one per beat (footage stays visible) ----
      const PILLS = [
        { t: "Put your prices up",         tIn: 5.0,  tOut: 8.4 },
        { t: "Test your highest price",    tIn: 9.0,  tOut: 12.0 },
        { t: "Priced on a guess",          tIn: 15.1, tOut: 19.4 },
        { t: "Someone charges more",       tIn: 27.0, tOut: 32.1 },
        { t: "Test your ceiling",          tIn: 32.5, tOut: 35.5 },
        { t: "You're charging too little", tIn: 35.9, tOut: 38.6 },
        { t: "Lift your profit",           tIn: 38.9, tOut: 43.2 },
        { t: "Free Profitability Bootcamp",tIn: 43.5, tOut: 46.3 }
      ];
      const pillsRoot = document.getElementById("pills");
      PILLS.forEach((p) => {
        const el = document.createElement("div");
        el.className = "pill";
        el.textContent = p.t;
        pillsRoot.appendChild(el);
        tl.fromTo(el, { opacity: 0, y: -26, scale: 0.9 },
          { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.5)" }, p.tIn);
        tl.to(el, { opacity: 0, y: -18, scale: 0.97, duration: 0.28, ease: "power2.in" }, p.tOut);
      });

      // ---- End card ----
      tl.fromTo("#endcard", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, FOOT - 0.5)
        .fromTo("#ec-logo", { opacity: 0, y: 24, scale: 0.96 },
          { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, FOOT - 0.1)
        .fromTo("#ec-kicker", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, FOOT + 0.3)
        .fromTo("#ec-cta", { opacity: 0, scale: 0.85 },
          { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.7)" }, FOOT + 0.55)
        .to("#ec-cta", { scale: 1.035, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 2 }, FOOT + 1.3);

      tl.set({}, {}, TOTAL); // Law #11 anchor
      window.__timelines["ecomiq-short-9x16-overlays"] = tl;
    </script>
  </body>
</html>
