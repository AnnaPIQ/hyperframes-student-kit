<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>EcomIQ — Short-Form 4:5</title>
    <script src="assets/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      /* Self-hosted brand fonts — no render-time network fetch (deterministic). */
      @font-face {
        font-family: "Rethink Sans";
        font-weight: 400 800;
        font-display: block;
        src: url(assets/fonts/RethinkSans.woff2) format("woff2");
      }
      @font-face {
        font-family: "Hedvig Letters Serif";
        font-weight: 400;
        font-display: block;
        src: url(assets/fonts/HedvigLettersSerif.woff2) format("woff2");
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: var(--brand-navy);
        font-family: "Rethink Sans", system-ui, sans-serif;
        color: var(--brand-white);
      }

      /* ------- Footage layers (full-frame, center-cropped to 4:5) ------- */
      .vid-wrap {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
      }
      /* Video B stays hidden until the cut at 38s (set to opaque by GSAP). */
      #vidB-wrap { opacity: 0; }
      .vid-wrap video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* 9:16 source cropped to 4:5 — bias slightly up to hold the face. */
        object-position: 50% 44%;
        filter: contrast(1.05) saturate(1.06) brightness(0.99);
      }

      /* ------- Persistent EcomIQ logo bug (top-left, white) ------- */
      #bug {
        position: absolute;
        top: 48px;
        left: 48px;
        --bug-w: 520px; /* large persistent top-left logo (~48% width) */
      }
      #bug::before {
        content: "";
        position: absolute;
        left: -26px;
        top: -22px;
        right: -30px;
        bottom: -20px;
        background: radial-gradient(
          120% 145% at 32% 42%,
          rgba(4, 20, 40, 0.55) 0%,
          rgba(4, 20, 40, 0) 72%
        );
        border-radius: 44px;
      }
      #bug img {
        position: relative;
        display: block;
        width: var(--bug-w);
        height: auto;
        filter: drop-shadow(0 2px 7px rgba(0, 0, 0, 0.55));
      }

      /* ------- Branded end card ------- */
      #endcard { position: absolute; inset: 0; }
      #endcard .ec-bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(90% 54% at 50% 30%, rgba(156, 212, 255, 0.12) 0%, rgba(6, 40, 76, 0) 58%),
          var(--brand-navy);
      }
      #endcard .ec-bloom {
        position: absolute;
        left: -12%;
        bottom: -22%;
        width: 124%;
        height: 62%;
        background: var(--brand-gradient-2);
        filter: blur(92px);
        opacity: 0.36;
      }
      #endcard .ec-content {
        position: absolute;
        left: 92px;
        right: 92px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      #endcard .ec-logo { width: 460px; height: auto; }
      #endcard .ec-rule {
        width: 124px;
        height: 6px;
        background: var(--brand-flame);
        border-radius: 3px;
        margin: 46px 0 38px;
      }
      #endcard .ec-cta {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: "Rethink Sans", sans-serif;
        color: var(--brand-white);
        max-width: 860px;
      }
      #endcard .ec-cta-top {
        font-size: 42px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: rgba(255, 255, 255, 0.92);
        margin-bottom: 18px;
      }
      #endcard .ec-offer-wrap { position: relative; display: inline-block; text-align: center; }
      /* Flame energy-bloom behind the offer phrase (animated in). */
      #endcard .ec-cta-glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 124%;
        height: 172%;
        transform: translate(-50%, -50%);
        background: radial-gradient(60% 60% at 50% 50%, rgba(255, 96, 52, 0.74) 0%, rgba(255, 96, 52, 0) 70%);
        filter: blur(38px);
        opacity: 0;
        pointer-events: none;
      }
      #endcard .ec-offer {
        position: relative;
        font-size: 74px;
        font-weight: 800;
        line-height: 1.03;
        letter-spacing: -0.02em;
        color: var(--brand-white);
      }
      #endcard .ec-offer .w { display: inline-block; will-change: transform; }
      #endcard .ec-offer-underline {
        height: 8px;
        width: 100%;
        margin-top: 16px;
        background: var(--brand-flame);
        border-radius: 4px;
        transform: scaleX(0);
        transform-origin: 0% 50%;
        box-shadow: 0 0 20px rgba(255, 90, 50, 0.65);
      }

      /* ------- Animated lower-third callouts over the footage (sparingly) ------- */
      .callout {
        position: absolute;
        left: 52px;
        bottom: 150px;
        display: inline-flex;
        align-items: center;
        gap: 20px;
        padding: 24px 40px 24px 32px;
        background: rgba(6, 24, 48, 0.86);
        border: 1px solid rgba(156, 212, 255, 0.22);
        border-radius: 18px;
        box-shadow: 0 22px 64px -22px rgba(0, 0, 0, 0.82);
        max-width: 90%;
      }
      .callout .co-tick {
        width: 11px;
        height: 50px;
        border-radius: 6px;
        background: var(--brand-flame);
        box-shadow: 0 0 16px rgba(255, 90, 50, 0.6);
        flex: none;
        transform-origin: 50% 0%;
      }
      .callout .co-txt {
        font-family: "Rethink Sans", sans-serif;
        font-weight: 700;
        font-size: 46px;
        letter-spacing: -0.01em;
        color: var(--brand-white);
        white-space: nowrap;
      }
      /* Flame CTA pill under the headline (with an expanding glow ring). */
      #endcard .ec-pill-wrap { position: relative; display: inline-flex; margin-top: 40px; }
      #endcard .ec-pill-ring {
        position: absolute;
        inset: -6px;
        border-radius: 999px;
        border: 3px solid rgba(255, 90, 50, 0.85);
        opacity: 0;
        pointer-events: none;
      }
      #endcard .ec-pill {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        font-family: "Rethink Sans", sans-serif;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--brand-white);
        background: var(--brand-flame);
        padding: 26px 58px;
        border-radius: 999px;
        box-shadow:
          0 18px 54px -12px rgba(255, 76, 50, 0.65),
          0 0 40px rgba(255, 76, 50, 0.35);
      }
      #endcard .ec-pill .ec-arrow { font-size: 40px; line-height: 1; transform: translateY(-2px); }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="ecomiq-short-4x5"
      data-start="0"
      data-duration="48"
      data-width="1080"
      data-height="1350"
      data-fps="30"
    >
      <!-- Video A: 0–38s. Both clips share track-index 0 (sequential); the cut
           is driven by wrapper opacity so only the active clip is visible. -->
      <div class="vid-wrap" id="vidA-wrap">
        <video
          id="vidA45"
          data-start="0"
          data-duration="38.5"
          data-track-index="0"
          src="assets/videoA-1080.mp4"
          muted
          playsinline
        ></video>
      </div>

      <!-- Video B: 38–46s -->
      <div class="vid-wrap" id="vidB-wrap">
        <video
          id="vidB45"
          data-start="38"
          data-duration="8"
          data-track-index="1"
          src="assets/videoB-1080.mp4"
          muted
          playsinline
        ></video>
      </div>

      <!-- Footage audio -->
      <audio
        id="audA45"
        data-start="0"
        data-duration="38"
        data-track-index="6"
        data-volume="1"
        src="assets/videoA-1080.mp4"
      ></audio>
      <audio
        id="audB45"
        data-start="38"
        data-duration="8"
        data-track-index="7"
        data-volume="1"
        src="assets/videoB-1080.mp4"
      ></audio>

      <!-- Persistent logo bug -->
      <div id="bug" class="clip" data-start="0" data-duration="46" data-track-index="8">
        <img id="bug-logo-45" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
      </div>

      <!-- Animated lower-third callouts (slide in/out over the footage) -->
      <div id="co1" class="callout clip" data-start="7" data-duration="5" data-track-index="10">
        <span class="co-tick"></span><span class="co-txt">Free Profitability Bootcamp</span>
      </div>
      <div id="co2" class="callout clip" data-start="20" data-duration="5" data-track-index="10">
        <span class="co-tick"></span><span class="co-txt">Master your margins</span>
      </div>
      <div id="co3" class="callout clip" data-start="32" data-duration="5.5" data-track-index="10">
        <span class="co-tick"></span><span class="co-txt">Join free today</span>
      </div>

      <!-- End card — last ~3.4s (given room for the animated reveal) -->
      <div id="endcard" class="clip" data-start="44.6" data-duration="3.4" data-track-index="9">
        <div class="ec-bg"></div>
        <div class="ec-bloom"></div>
        <div class="ec-content">
          <img id="ec-logo-45" class="ec-logo" src="assets/ecomiq-logo-white.png" alt="EcomIQ" />
          <div class="ec-rule"></div>
          <div class="ec-cta">
            <div class="ec-cta-top">Join our</div>
            <div class="ec-offer-wrap">
              <div class="ec-cta-glow"></div>
              <div class="ec-offer"><span class="w">Free</span> <span class="w">Profitability</span> <span class="w">Bootcamp</span></div>
              <div class="ec-offer-underline"></div>
            </div>
          </div>
          <div class="ec-pill-wrap">
            <div class="ec-pill-ring"></div>
            <div class="ec-pill">Join now</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#bug", { opacity: 0, y: -10, duration: 0.5, ease: "power2.out" }, 0.25);
      // Smooth 0.5s crossfade A→B at 38s (separate tracks so they overlap).
      tl.to("#vidA-wrap", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 38);
      tl.to("#vidB-wrap", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 38);
      // ---- Body: animated lower-third callouts (slide in, hold, slide out) ----
      function callout(sel, s, dur) {
        tl.from(sel, { x: -90, opacity: 0, duration: 0.5, ease: "power3.out" }, s);
        tl.from(sel + " .co-tick", { scaleY: 0, duration: 0.4, ease: "back.out(2)" }, s + 0.12);
        tl.to(sel, { x: -90, opacity: 0, duration: 0.45, ease: "power2.in" }, s + dur - 0.5);
      }
      callout("#co1", 7, 5);
      callout("#co2", 20, 5);
      callout("#co3", 32, 5.5);

      // ---- End card: the big motion moment ----
      const ec = 44.6; // end-card start (matches data-start)
      tl.from("#endcard", { opacity: 0, duration: 0.45, ease: "power1.inOut" }, ec);
      tl.from("#endcard .ec-bloom", { opacity: 0, scale: 0.9, duration: 0.9, ease: "power2.out" }, ec + 0.1);
      tl.from("#endcard .ec-logo", { opacity: 0, y: -24, scale: 0.9, duration: 0.55, ease: "back.out(1.6)" }, ec + 0.15);
      tl.from("#endcard .ec-rule", { scaleX: 0, duration: 0.4, ease: "power3.inOut", transformOrigin: "50% 50%" }, ec + 0.4);
      tl.from("#endcard .ec-cta-top", { opacity: 0, y: 20, duration: 0.4, ease: "power3.out" }, ec + 0.5);
      // Offer words SLAM in big, staggered.
      tl.from("#endcard .ec-offer .w", { opacity: 0, scale: 1.6, y: 6, duration: 0.5, ease: "back.out(2.2)", stagger: 0.12, transformOrigin: "50% 50%" }, ec + 0.7);
      // Flame energy-bloom blooms behind the offer, then settles to a warm halo.
      tl.fromTo("#endcard .ec-cta-glow", { opacity: 0, scale: 0.7 }, { opacity: 0.72, scale: 1, duration: 0.4, ease: "power2.out" }, ec + 0.85);
      tl.to("#endcard .ec-cta-glow", { opacity: 0.2, duration: 0.7, ease: "power2.inOut" }, ec + 1.4);
      // Flame underline sweeps in under the offer phrase.
      tl.fromTo("#endcard .ec-offer-underline", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, ec + 1.15);
      // Pill pops, then an expanding glow ring pulses out (twice).
      tl.from("#endcard .ec-pill", { opacity: 0, scale: 0.6, y: 12, duration: 0.5, ease: "back.out(2.4)", transformOrigin: "50% 50%" }, ec + 1.35);
      tl.fromTo("#endcard .ec-pill-ring", { opacity: 0.85, scale: 0.92 }, { opacity: 0, scale: 1.5, duration: 0.8, ease: "power2.out", repeat: 1, immediateRender: false }, ec + 1.65);

      tl.to({}, { duration: 48 }, 0);

      window.__timelines["ecomiq-short-4x5"] = tl;
    </script>
  </body>
</html>
