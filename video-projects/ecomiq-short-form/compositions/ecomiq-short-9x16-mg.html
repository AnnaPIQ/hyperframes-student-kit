<html lang="en">

    <style>
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      @font-face { font-family: 'Hedvig Letters Serif'; font-style: normal; font-weight: 400;
        font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: var(--brand-navy);
        font-family: 'Rethink Sans', system-ui, sans-serif;
        color: var(--brand-white);
      }

      /* ---- Footage ---- */
      #footage-wrap { position: absolute; inset: 0; z-index: 0; }
      #footage {
        display: block; width: 100%; height: 100%;
        object-fit: cover; object-position: center center;
        filter: contrast(1.05) saturate(1.06) brightness(0.99);
      }
      #footage-wrap::after {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 80% 84% at 50% 44%, transparent 58%, rgba(6, 40, 76, 0.34) 100%);
      }

      /* ---- Scrims ---- */
      #top-scrim {
        position: absolute; top: 0; left: 0; width: 1080px; height: 300px; z-index: 1; pointer-events: none;
        background: linear-gradient(180deg, rgba(6,40,76,0.62) 0%, rgba(6,40,76,0.28) 45%, rgba(6,40,76,0) 100%);
      }
      #bottom-scrim {
        position: absolute; left: 0; bottom: 0; width: 1080px; height: 640px; z-index: 1; pointer-events: none;
        background: linear-gradient(0deg, rgba(6,40,76,0.82) 0%, rgba(6,40,76,0.5) 42%, rgba(6,40,76,0) 100%);
      }
      /* Deterministic faint grain — the unifying texture, kept subtle over footage. */
      #grain {
        position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0.5; mix-blend-mode: overlay;
        background-image:
          radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1.5px),
          radial-gradient(rgba(0,0,0,0.05) 1px, transparent 1.5px);
        background-size: 3px 3px, 5px 5px; background-position: 0 0, 1px 2px;
      }

      /* ---- Persistent brand chrome (logo + flame accent) ---- */
      #logo { position: absolute; top: 70px; left: 66px; width: 152px; height: auto; z-index: 6;
        filter: drop-shadow(0 3px 10px rgba(0,0,0,0.55)); }
      #logo-rule { position: absolute; top: 116px; left: 68px; width: 96px; height: 5px; z-index: 6;
        background: var(--brand-flame); border-radius: 3px; transform-origin: left center;
        box-shadow: 0 0 16px rgba(255,76,50,0.6); }

      /* ---- Kinetic callouts (upper third, above the head) ---- */
      #callouts { position: absolute; top: 296px; left: 0; width: 1080px; z-index: 5;
        display: flex; justify-content: center; pointer-events: none; }
      .callout { position: absolute; top: 0; left: 50%; transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; opacity: 0; }
      .co-kicker { font-weight: 700; font-size: 30px; letter-spacing: 0.32em; text-transform: uppercase;
        color: var(--brand-white); text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
      .co-big {
        font-weight: 800; font-size: 92px; line-height: 0.94; letter-spacing: -0.03em;
        color: var(--brand-flame);
        text-shadow: 0 3px 22px rgba(255,76,50,0.5), 0 2px 6px rgba(0,0,0,0.55);
      }
      .co-big .em { font-family: 'Hedvig Letters Serif', serif; font-style: italic; font-weight: 400;
        color: var(--brand-blue-tint); text-shadow: 0 2px 18px rgba(156,212,255,0.45); }
      /* Rising-bars motif (callback: appears on "prices up" and returns on "lift profit") */
      .bars { display: flex; align-items: flex-end; gap: 12px; height: 96px; margin-top: 6px; }
      .bars i { display: block; width: 26px; border-radius: 6px 6px 2px 2px;
        background: linear-gradient(180deg, #FF8A4C 0%, #FF4C32 100%);
        box-shadow: 0 0 18px rgba(255,76,50,0.5); transform-origin: bottom center; transform: scaleY(0); }
      .bars i:nth-child(1) { height: 34px; } .bars i:nth-child(2) { height: 54px; }
      .bars i:nth-child(3) { height: 74px; } .bars i:nth-child(4) { height: 96px; }

      /* ---- Karaoke captions ---- */
      #captions { position: absolute; left: 90px; right: 90px; bottom: 232px; z-index: 4;
        display: flex; justify-content: center; pointer-events: none; }
      .cap-line { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
        width: 900px; text-align: center; opacity: 0;
        font-weight: 800; font-size: 60px; line-height: 1.16; letter-spacing: -0.015em; }
      .cap-word { display: inline-block; color: var(--brand-white); transform-origin: center bottom;
        text-shadow: 0 3px 5px rgba(0,0,0,0.6), 0 0 3px rgba(3,18,38,0.75), 2px 2px 0 rgba(3,18,38,0.45); }

      /* ---- End card ---- */
      #endcard { position: absolute; inset: 0; z-index: 8; opacity: 0;
        background: radial-gradient(88% 52% at 50% 22%, rgba(156,212,255,0.12) 0%, rgba(6,40,76,0) 55%), var(--brand-navy);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 46px; }
      #endcard::before { content: ""; position: absolute; left: -12%; bottom: -20%; width: 124%; height: 58%;
        background: var(--brand-gradient-2); filter: blur(96px); opacity: 0.34; pointer-events: none; }
      #ec-logo { width: 520px; height: auto; position: relative; }
      #ec-bars { display: flex; align-items: flex-end; gap: 14px; height: 92px; position: relative; }
      #ec-bars i { display: block; width: 28px; border-radius: 6px 6px 2px 2px;
        background: linear-gradient(180deg, #FF8A4C 0%, #FF4C32 100%); box-shadow: 0 0 18px rgba(255,76,50,0.5);
        transform-origin: bottom center; transform: scaleY(0); }
      #ec-bars i:nth-child(1){height:36px;} #ec-bars i:nth-child(2){height:58px;}
      #ec-bars i:nth-child(3){height:76px;} #ec-bars i:nth-child(4){height:92px;}
      #ec-cta { position: relative; display: inline-flex; align-items: center; gap: 20px;
        font-weight: 700; font-size: 34px; letter-spacing: -0.01em; color: var(--brand-white);
        background: var(--brand-flame); padding: 30px 56px; border-radius: 999px; white-space: nowrap;
        box-shadow: 0 22px 70px -16px rgba(255,76,50,0.65); }
      #ec-cta .arrow { font-size: 36px; line-height: 1; transform: translateY(-1px); }

  <body>
    <div id="root" data-composition-id="ecomiq-short-9x16-mg" data-start="0" data-duration="49.6"
         data-width="1080" data-height="1920">

      <div id="footage-wrap">

      </div>

      <audio id="footage-audio" data-start="0" data-duration="47.0" data-track-index="9"

      <!-- Kinetic callouts (GSAP-driven; always in DOM, revealed at their beat) -->

        <div class="callout" id="co-prices">
          <span class="co-kicker">Put your</span>

          <span class="co-big">TEST YOUR <span class="em">ceiling</span></span>
        </div>
        <div class="callout" id="co-profit">
          <span class="co-kicker">There's more</span>
          <span class="co-big">LIFT YOUR PROFIT</span>
          <div class="bars"><i></i><i></i><i></i><i></i></div>
        </div>
      </div>

      <!-- Karaoke captions (spans built in JS from the transcript) -->

      <!-- End card -->
      <div id="endcard">
        <img id="ec-logo" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
        <div id="ec-bars"><i></i><i></i><i></i><i></i></div>
        <div id="ec-cta">Join our Free Profitability Bootcamp <span class="arrow">&rarr;</span></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const FLAME = "#FF4C32", WHITE = "#FFFFFF";
      const FOOT = 47.0, TOTAL = 49.6;

      // Word-level transcript (edited-time, from whisper small.en).
      const WORDS = [
        {t:"Every",s:0.26},{t:"guru",s:0.44},{t:"is",s:0.78},{t:"probably",s:0.96},{t:"telling",s:1.72},
        {t:"you",s:2.28},{t:"to",s:2.64},{t:"discount",s:2.78,e:3.14},{t:"and",s:3.63},{t:"here's",s:3.68},
        {t:"our",s:4.07},{t:"advice.",s:4.27,e:4.73},{t:"Try",s:5.06},{t:"the",s:5.08},{t:"opposite.",s:5.36,e:6.4},
        {t:"Put",s:6.4},{t:"your",s:6.72},{t:"prices",s:7.18},{t:"up.",s:7.77,e:8.04},{t:"Have",s:8.04},
        {t:"you",s:8.31},{t:"ever",s:8.42},{t:"tested",s:8.71},{t:"the",s:8.97},{t:"highest",s:9.16},
        {t:"price",s:9.52,e:9.82},{t:"your",s:9.84},{t:"product",s:10.04},{t:"will",s:10.42},{t:"actually",s:10.69},
        {t:"sell",s:11.32},{t:"for?",s:11.67,e:12.0},{t:"The",s:12.0},{t:"reality",s:12.27},{t:"is",s:12.79},
        {t:"most",s:12.95},{t:"founders",s:13.27},{t:"just",s:13.9},{t:"haven't.",s:14.22,e:14.84},{t:"They've",s:15.1},
        {t:"set",s:15.35},{t:"a",s:15.57},{t:"price",s:15.64},{t:"early",s:16.03},{t:"on",s:16.38},
        {t:"using",s:16.56},{t:"a",s:17.12},{t:"guess,",s:17.23,e:17.95},{t:"never",s:17.95},{t:"touched",s:18.48},
        {t:"it",s:18.95},{t:"again",s:19.1,e:19.55},{t:"and",s:20.56},{t:"you've",s:20.56},{t:"never",s:20.92},
        {t:"taken",s:21.19},{t:"the",s:21.48},{t:"time",s:21.65,e:21.8},{t:"to",s:21.9},{t:"actually",s:22.2},
        {t:"sit",s:22.45},{t:"down",s:22.61,e:22.74},{t:"and",s:22.86},{t:"look",s:23.19},{t:"at",s:23.46},
        {t:"how",s:23.8},{t:"you",s:24.07},{t:"compare",s:24.3,e:24.84},{t:"against",s:24.92},{t:"your",s:25.52},
        {t:"competitors.",s:25.82,e:26.8},{t:"And",s:26.8},{t:"half",s:27.07},{t:"the",s:27.35},{t:"time",s:27.58},
        {t:"there's",s:27.92},{t:"someone",s:28.28,e:28.64},{t:"charging",s:28.64},{t:"more",s:29.07},{t:"than",s:29.44},
        {t:"you",s:29.45,e:29.64},{t:"for",s:29.9},{t:"an",s:29.99},{t:"inferior",s:30.21},{t:"product.",s:31.15,e:32.32},
        {t:"So",s:32.32},{t:"the",s:32.58},{t:"lesson",s:32.68},{t:"is",s:33.11},{t:"test",s:33.25},
        {t:"your",s:33.54},{t:"ceiling,",s:33.83,e:34.52},{t:"do",s:34.52},{t:"the",s:34.7},{t:"research.",s:34.96,e:35.56},
        {t:"You're",s:35.79},{t:"probably",s:36.02},{t:"charging",s:36.68},{t:"less",s:37.28},{t:"than",s:37.59},
        {t:"you",s:37.94},{t:"could",s:38.2,e:38.55},{t:"and",s:38.55},{t:"there",s:38.83},{t:"are",s:39.06},
        {t:"plenty",s:39.25},{t:"more",s:39.68},{t:"ways",s:39.92},{t:"to",s:40.16},{t:"lift",s:40.28},
        {t:"your",s:40.53},{t:"profit",s:40.78,e:41.16},{t:"in",s:41.16},{t:"our",s:41.42},{t:"free",s:41.52},
        {t:"profitability",s:41.8},{t:"bootcamp.",s:42.77,e:43.56},{t:"If",s:43.6},{t:"you",s:43.68},{t:"tap",s:43.87},
        {t:"the",s:43.97},{t:"link",s:44.11},{t:"below,",s:44.3,e:44.6},{t:"you'll",s:44.6},{t:"be",s:44.8},
        {t:"able",s:44.87},{t:"to",s:45.01},{t:"sign",s:45.08},{t:"up",s:45.22},{t:"for",s:45.32},
        {t:"free",s:45.47},{t:"and",s:45.68},{t:"I'll",s:45.79},{t:"see",s:45.95},{t:"you",s:46.04},
        {t:"on",s:46.15},{t:"the",s:46.22},{t:"inside.",s:46.35,e:46.68}
      ];
      // End-time fallback: next word's start.
      WORDS.forEach((w, i) => { if (w.e == null) w.e = (i < WORDS.length - 1) ? WORDS[i+1].s : FOOT; });

      // Caption line groupings (inclusive word-index ranges).
      const GROUPS = [
        [0,7],[8,11],[12,14],[15,18],[19,25],[26,31],[32,38],[39,47],[48,51],[52,57],
        [58,61],[62,67],[68,70],[71,76],[77,80],[81,84],[85,91],[92,94],[95,101],[102,107],
        [108,111],[112,116],[117,122],[123,130],[131,137]
      ];

      const tl = gsap.timeline({ paused: true });
      const capRoot = document.getElementById("captions");

      // Build caption lines + words, and schedule reveal + per-word karaoke highlight.
      GROUPS.forEach((g, gi) => {
        const [a, b] = g;
        const line = document.createElement("div");
        line.className = "cap-line";
        const spans = [];
        for (let i = a; i <= b; i++) {
          const sp = document.createElement("span");
          sp.className = "cap-word";
          sp.textContent = WORDS[i].t;
          line.appendChild(sp);
          line.appendChild(document.createTextNode(" "));
          spans.push(sp);
        }
        capRoot.appendChild(line);

        const gStart = WORDS[a].s;
        const gShow = Math.max(0, gStart - 0.14);
        // Line stays up until the next group starts (or a touch past the last word).
        const gEnd = (gi < GROUPS.length - 1)
          ? Math.max(gStart + 0.4, WORDS[GROUPS[gi + 1][0]].s - 0.02)
          : Math.min(46.4, WORDS[b].e + 0.35);

        tl.fromTo(line, { opacity: 0, y: 26, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.28, ease: "power3.out" }, gShow);
        tl.to(line, { opacity: 0, y: -16, filter: "blur(6px)", duration: 0.22, ease: "power2.in" }, gEnd);

        // Karaoke: active word pops flame, then settles back to white (stays "read").
        spans.forEach((sp, k) => {
          const w = WORDS[a + k];
          tl.to(sp, { color: FLAME, scale: 1.12, duration: 0.1, ease: "power2.out" }, w.s);
          tl.to(sp, { color: WHITE, scale: 1.0, duration: 0.18, ease: "power2.out" }, Math.max(w.s + 0.12, w.e));
        });
      });

      // ---- Brand chrome intro ----
      tl.fromTo("#logo", { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2)
        .fromTo("#logo-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.5)
        .fromTo(["#top-scrim", "#bottom-scrim"], { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "sine.out" }, 0);

      // ---- Callout helper: whip-in (blur+slide), hold, blur-out ----
      function callout(sel, tIn, tOut) {
        tl.fromTo(sel, { opacity: 0, y: 40, scale: 0.9, filter: "blur(14px)" },
          { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.42, ease: "power3.out" }, tIn);
        tl.to(sel, { opacity: 0, y: -30, scale: 0.98, filter: "blur(12px)", duration: 0.34, ease: "power2.in" }, tOut);
      }
      function barsGrow(sel, t) {
        tl.fromTo(sel + " .bars i", { scaleY: 0 },
          { scaleY: 1, duration: 0.5, ease: "back.out(1.5)", stagger: 0.07 }, t);
      }

      // Beat 1 — "Put your prices UP" (VO 6.4–8.04), rising bars callback #1
      callout("#co-prices", 6.5, 8.35);
      barsGrow("#co-prices", 6.9);
      // Beat 2 — "test your ceiling" (VO 32.3–34.5)
      callout("#co-ceiling", 32.5, 35.6);
      // Beat 3 — "lift your profit" (VO 40.2–41.1), rising bars callback #2
      callout("#co-profit", 39.1, 41.5);
      barsGrow("#co-profit", 39.5);

      // ---- End card ---- (footage crossfades out; captions/callouts already gone)
      tl.fromTo("#endcard", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, FOOT - 0.5)
        .fromTo("#ec-logo", { opacity: 0, y: 26, scale: 0.96 },
          { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, FOOT - 0.1)
        .fromTo("#ec-bars i", { scaleY: 0 }, { scaleY: 1, duration: 0.55, ease: "back.out(1.6)", stagger: 0.08 }, FOOT + 0.15)
        .fromTo("#ec-cta", { opacity: 0, scale: 0.85 },
          { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.7)" }, FOOT + 0.5)
        .to("#ec-cta", { scale: 1.035, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 2 }, FOOT + 1.25);

      // Law #11 anchor — pad the timeline to the full slot.
      tl.set({}, {}, TOTAL);
      window.__timelines["ecomiq-short-9x16-mg"] = tl;
    </script>
