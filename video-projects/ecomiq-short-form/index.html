<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EcomIQ — Short-Form (index)</title>
    <script src="assets/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      @font-face {
        font-family: "Rethink Sans";
        font-weight: 400 800;
        font-display: block;
        src: url(assets/fonts/RethinkSans.woff2) format("woff2");
      }
      @font-face {
        font-family: "Hedvig Letters Serif";
        font-weight: 400;
        font-display: block;
        src: url(assets/fonts/HedvigLettersSerif.woff2) format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: var(--brand-navy);
        font-family: "Rethink Sans", system-ui, sans-serif;
        color: var(--brand-white);
      }
      #bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(88% 50% at 50% 28%, rgba(156, 212, 255, 0.12) 0%, rgba(6, 40, 76, 0) 58%),
          var(--brand-navy);
      }
      #bloom {
        position: absolute; left: -12%; bottom: -20%; width: 124%; height: 56%;
        background: var(--brand-gradient-2); filter: blur(96px); opacity: 0.34;
      }
      #wrap {
        position: absolute; left: 96px; right: 96px; top: 50%;
        transform: translateY(-50%);
        display: flex; flex-direction: column; align-items: center; text-align: center;
      }
      #wrap img { width: 520px; height: auto; }
      #rule { width: 132px; height: 6px; background: var(--brand-flame); border-radius: 3px; margin: 56px 0 44px; }
      #eyebrow {
        font-size: 30px; font-weight: 600; letter-spacing: 0.30em; text-transform: uppercase;
        color: var(--brand-blue-tint); margin-bottom: 30px;
      }
      #list { font-size: 40px; font-weight: 500; line-height: 1.5; color: var(--brand-text-dim); }
      #list b { color: var(--brand-white); font-weight: 700; }
    </style>
  </head>
  <body>
    <!-- Project index / cover. The two deliverables are the standalone roots
         under compositions/ — render them with:
           npx hyperframes render -c compositions/ecomiq-short-9x16.html ...
           npx hyperframes render -c compositions/ecomiq-short-4x5.html ... -->
    <div
      id="root"
      data-composition-id="ecomiq-short-index"
      data-start="0"
      data-duration="4"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <div id="bg" class="clip" data-start="0" data-duration="4" data-track-index="0"></div>
      <div id="bloom" class="clip" data-start="0" data-duration="4" data-track-index="1"></div>
      <div id="wrap" class="clip" data-start="0" data-duration="4" data-track-index="2">
        <img src="assets/ecomiq-logo-white.png" alt="EcomIQ" />
        <div id="rule"></div>
        <div id="eyebrow">Short-Form Ad</div>
        <div id="list">
          <b>9:16</b> &nbsp;compositions/ecomiq-short-9x16.html<br />
          <b>4:5</b> &nbsp;compositions/ecomiq-short-4x5.html
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#wrap img", { opacity: 0, y: -16, duration: 0.6, ease: "power3.out" }, 0.2)
        .from("#rule", { scaleX: 0, transformOrigin: "left center", duration: 0.5, ease: "power3.out" }, 0.5)
        .from("#eyebrow", { opacity: 0, y: 14, duration: 0.5, ease: "power2.out" }, 0.6)
        .from("#list", { opacity: 0, y: 16, duration: 0.6, ease: "power2.out" }, 0.8);
      tl.to({}, { duration: 4 }, 0);
      window.__timelines["ecomiq-short-index"] = tl;
    </script>
  </body>
</html>
