<template id="s01-hook-template">
  <script src="assets/vendor/gsap.min.js"></script>
  <div data-composition-id="s01-hook" data-start="0" data-duration="3.6" data-width="1080" data-height="1350">
  <style>
    @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800; font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
    @font-face { font-family: 'Hedvig Letters Serif'; font-style: normal; font-weight: 400; font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }
    [data-composition-id="s01-hook"] { position: absolute; inset: 0; overflow: hidden; background: transparent;
      font-family: 'Rethink Sans', system-ui, sans-serif; color: #FFFFFF; }
    [data-composition-id="s01-hook"] .plate { position: absolute; inset: 0; overflow: hidden;
      background: radial-gradient(72% 40% at 50% 20%, rgba(156,212,255,.12) 0%, rgba(6,40,76,0) 60%),
        radial-gradient(90% 42% at 50% 100%, rgba(255,76,50,.10) 0%, rgba(6,40,76,0) 62%), #06284C; }
    [data-composition-id="s01-hook"] .grid { position: absolute; inset: 0; opacity: .13;
      background-image: linear-gradient(#1d4a7a 1px, transparent 1px), linear-gradient(90deg, #1d4a7a 1px, transparent 1px);
      background-size: 90px 90px; -webkit-mask-image: radial-gradient(76% 58% at 50% 42%, #000 40%, transparent 86%); }
    [data-composition-id="s01-hook"] .body { position: absolute; inset: 0; }
    /* shared scene furniture */
    [data-composition-id="s01-hook"] .eyebrow { position: absolute; left: 0; right: 0; text-align: center;
      font-weight: 600; font-size: 24px; letter-spacing: .30em; text-transform: uppercase; color: #9CD4FF; }
    [data-composition-id="s01-hook"] .kicker { position: absolute; left: 90px; right: 90px; text-align: center;
      font-weight: 700; font-size: 46px; line-height: 1.14; letter-spacing: -.01em; color: #FFFFFF; }
    [data-composition-id="s01-hook"] .serif { font-family: 'Hedvig Letters Serif', Georgia, serif;
      font-style: italic; font-weight: 400; }

    [data-composition-id="s01-hook"] .stage { position: absolute; left: 0; right: 0; top: 236px; height: 470px; }
    [data-composition-id="s01-hook"] .seat { position: absolute; left: 50%; top: 50%; width: 96px; height: 96px;
      border-radius: 50%; border: 3px dashed rgba(156,212,255,.30); }
    [data-composition-id="s01-hook"] .node { position: absolute; left: 50%; top: 50%; width: 152px; height: 152px;
      margin: -76px 0 0 -76px; border-radius: 50%;
      background: radial-gradient(circle at 36% 30%, #DEEEFE, #9CD4FF 52%, #4b8fce 100%);
      box-shadow: 0 0 62px rgba(156,212,255,.55); }
    [data-composition-id="s01-hook"] .ring { position: absolute; left: 50%; top: 50%; width: 152px; height: 152px;
      margin: -76px 0 0 -76px; border-radius: 50%; border: 4px solid rgba(255,76,50,.85); }
    [data-composition-id="s01-hook"] .qmark { position: absolute; left: 50%; top: 50%; margin: -206px 0 0 -40px;
      width: 80px; text-align: center; font-weight: 800; font-size: 96px; line-height: 1; color: #FF4C32;
      text-shadow: 0 0 36px rgba(255,76,50,.75); }
    [data-composition-id="s01-hook"] .tag { position: absolute; left: 50%; top: 50%; margin: 120px 0 0 -176px;
      width: 352px; text-align: center; font-weight: 700; font-size: 26px; letter-spacing: .02em;
      padding: 10px 0; border-radius: 999px; background: rgba(255,76,50,.14);
      border: 1px solid rgba(255,76,50,.55); color: #FF8A4C; }
    [data-composition-id="s01-hook"] .head { position: absolute; top: 812px; left: 0; right: 0; text-align: center;
      font-weight: 800; font-size: 96px; line-height: 1.04; letter-spacing: -.03em; color: #FFFFFF; }
    [data-composition-id="s01-hook"] .head .l2 { display: block; color: #FF4C32; margin-top: 12px; }
  </style>

  <div class="slot clip" id="s01-hook-slot" data-start="0" data-duration="3.6" data-track-index="0">
    <div class="plate">
      <div class="grid"></div>
      <div class="body">
        <div class="stage">
          <!-- six empty seats on a 214px ring: the team that is not there.
               Positioned by margin, never transform — GSAP animates scale here. -->
          <div class="seat" style="margin:-262px 0 0 -48px"></div>
          <div class="seat" style="margin:-155px 0 0 137px"></div>
          <div class="seat" style="margin:59px 0 0 137px"></div>
          <div class="seat" style="margin:166px 0 0 -48px"></div>
          <div class="seat" style="margin:59px 0 0 -233px"></div>
          <div class="seat" style="margin:-155px 0 0 -233px"></div>
          <div class="ring" id="r1"></div>
          <div class="ring" id="r2"></div>
          <div class="node"></div>
          <div class="qmark">?</div>
          <div class="tag">1 opinion &middot; 0 back-up</div>
        </div>
        <div class="head">
          <span class="l1">Your coach is one guy.</span>
          <span class="l2">Guessing.</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const SLOT = 3.6, S = '[data-composition-id="s01-hook"] ';
      const tl = gsap.timeline({ paused: true });
      // ENTRY — first frame of the video; nothing underneath to wipe against.
      tl.fromTo(S+'.body', { opacity: 0 }, { opacity: 1, duration: 0.22, ease: 'sine.out' }, 0);
      // the lone node lands first — it is the only thing on the island
      tl.fromTo(S+'.node', { opacity: 0, scale: .4 },
        { opacity: 1, scale: 1, duration: .55, ease: 'back.out(1.9)' }, 0.15);
      // empty seats fade up around it, clockwise from the top
      tl.fromTo(S+'.seat', { opacity: 0, scale: .7 },
        { opacity: 1, scale: 1, duration: .40, stagger: .055, ease: 'power2.out' }, 0.45);
      // two flame pulses ripple out and die — the guess going nowhere
      tl.fromTo(S+'#r1', { opacity: .85, scale: 1 }, { opacity: 0, scale: 3.4, duration: 1.5, ease: 'power2.out' }, 0.75);
      tl.fromTo(S+'#r2', { opacity: .85, scale: 1 }, { opacity: 0, scale: 3.4, duration: 1.5, ease: 'power2.out' }, 1.55);
      tl.fromTo(S+'.qmark', { opacity: 0, y: 18, scale: .7 },
        { opacity: 1, y: 0, scale: 1, duration: .45, ease: 'back.out(2)' }, 0.85);
      tl.to(S+'.qmark', { y: -12, duration: .90, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 1.40);
      tl.fromTo(S+'.tag', { opacity: 0, y: 12, scale: .9 },
        { opacity: 1, y: 0, scale: 1, duration: .45, ease: 'back.out(1.8)' }, 1.15);
      // headline lands on the VO words "just one person" (2.88 project time)
      tl.fromTo(S+'.head .l1', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .55, ease: 'power3.out' }, 1.00);
      tl.fromTo(S+'.head .l2', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .55, ease: 'power3.out' }, 1.40);
      // EXIT — matches the incoming founder cut: body lifts with 30px blur while the
      // plate wipes off as one opaque piece, revealing the footage cleanly beneath.
      tl.to(S+'.body', { y: -150, filter: 'blur(30px)', duration: 0.26, ease: 'power2.in' }, SLOT - 0.26);
      tl.to(S+'.plate', { y: -1350, duration: 0.26, ease: 'power3.in' }, SLOT - 0.26);
      tl.to({}, { duration: SLOT }, 0);   // Law #11 anchor — fills the slot, no black flash
      window.__timelines = window.__timelines || {};
      window.__timelines['s01-hook'] = tl;
    })();
  </script>
  </div>
</template>
