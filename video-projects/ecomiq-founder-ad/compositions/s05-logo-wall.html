  <style>

    @font-face { font-family: 'Hedvig Letters Serif'; font-style: normal; font-weight: 400; font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }

    [data-composition-id="s05-logo-wall"] #wall-track { position: absolute; left: 0; top: 0; width: 1080px;
      display: grid; grid-template-columns: repeat(2, 1fr); grid-auto-rows: 230px;
      align-items: center; justify-items: center; }
    [data-composition-id="s05-logo-wall"] #wall-track img { max-width: 400px; max-height: 128px;
      width: auto; height: auto; opacity: .34; filter: drop-shadow(0 0 18px rgba(6,40,76,.9)); }
    [data-composition-id="s05-logo-wall"] #wall-fade { position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, #06284C 0%, rgba(6,40,76,0) 15%),
                  linear-gradient(0deg,  #06284C 0%, rgba(6,40,76,0) 15%); }
    [data-composition-id="s05-logo-wall"] .eyebrow { top: 430px; }
    /* margin-top, not translateY: GSAP animates y here and a CSS transform would be clobbered */
    [data-composition-id="s05-logo-wall"] #wall-hero { position: absolute; left: 50%; top: 50%;

  <script>
    (function(){
      const SLOT = 7.1, S = '[data-composition-id="s05-logo-wall"] ';
      const tl = gsap.timeline({ paused: true });
      // ENTRY — the opaque plate wipes up over the outgoing founder frame; the
      // content rides in behind it with matching blur so the cut never reads hard.
      tl.fromTo(S+'.plate', { y: 1350 }, { y: 0, duration: 0.28, ease: 'power3.out' }, 0);
      tl.fromTo(S+'.body', { y: 170, filter: 'blur(26px)' },
        { y: 0, filter: 'blur(0px)', duration: 0.62, ease: 'power2.out' }, 0);
      // the wall drifts continuously so it never reads as a static plate
      tl.fromTo(S+'#wall-track', { y: 0 }, { y: -430, duration: 7.10, ease: 'none' }, 0);
      tl.fromTo(S+'#wall-track img', { opacity: 0, y: 26 },
        { opacity: .34, y: 0, duration: .42, stagger: .011, ease: 'power2.out' }, 0.10);
      tl.fromTo(S+'.eyebrow', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .42, ease: 'power2.out' }, 0.62);
      // badge lands centre on the VO word "Shopify" (project 14.78 = local 0.98)
      tl.fromTo(S+'#wall-hero', { opacity: 0, scale: 1.34, y: -18, filter: 'blur(16px)' },
        { opacity: 1, scale: 1, y: 0, filter: 'blur(0px)', duration: .46, ease: 'back.out(1.6)' }, 0.98);
      tl.to(S+'#wall-hero', { scale: 1.025, duration: .90, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 1.70);
      // "over 10 years" -> project 17.64 = local 3.84
      tl.fromTo(S+'#yrs', { opacity: 0, y: 20, scale: .9 },
        { opacity: 1, y: 0, scale: 1, duration: .48, ease: 'back.out(1.7)' }, 3.84);
      // "biggest brands in the world" -> project 19.48 = local 5.68
      tl.fromTo(S+'.rail', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .55, ease: 'power3.out' }, 5.68);
      // EXIT — matches the incoming founder cut: body lifts with 30px blur while the
      // plate wipes off as one opaque piece, revealing the footage cleanly beneath.
      tl.to(S+'.body', { y: -150, filter: 'blur(30px)', duration: 0.26, ease: 'power2.in' }, SLOT - 0.26);
      tl.to(S+'.plate', { y: -1350, duration: 0.26, ease: 'power3.in' }, SLOT - 0.26);
      tl.to({}, { duration: SLOT }, 0);   // Law #11 anchor — fills the slot, no black flash
      window.__timelines = window.__timelines || {};
      window.__timelines['s05-logo-wall'] = tl;
    })();
  </script>
