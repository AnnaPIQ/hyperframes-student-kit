  <style>

    @font-face { font-family: 'Hedvig Letters Serif'; font-style: normal; font-weight: 400; font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }
    [data-composition-id="s10-system"] { position: absolute; inset: 0; overflow: hidden; background: transparent;

  <div class="slot clip" id="s10-system-slot" data-start="0" data-duration="8.85" data-track-index="0">
    <div class="plate">
      <div class="grid"></div>
      <div class="body">
        <div class="eyebrow">How it works</div>
        <div class="step" id="st1">

  </div>

  <script>
    (function(){
      const SLOT = 8.85, S = '[data-composition-id="s10-system"] ';
      const tl = gsap.timeline({ paused: true });
      // ENTRY — the opaque plate wipes up over the outgoing frame with a light streak
      // on its leading edge; the content rides in behind it under matching blur.
      tl.fromTo(S+'.plate', { y: 1350 }, { y: 0, duration: 0.24, ease: 'power3.out' }, 0);
      tl.fromTo(S+'.edge-t', { opacity: 0 }, { opacity: 1, duration: 0.07, ease: 'sine.out' }, 0);
      tl.to(S+'.edge-t', { opacity: 0, duration: 0.15, ease: 'sine.in' }, 0.09);
      tl.fromTo(S+'.body', { y: 150, filter: 'blur(24px)' },
        { y: 0, filter: 'blur(0px)', duration: 0.52, ease: 'power2.out' }, 0);
      tl.fromTo(S+'.eyebrow', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .40, ease: 'power2.out' }, 0);
      // step 01 on "You'll start with a strategy session" (local 0.04)
      tl.fromTo(S+'#st1', { opacity: 0, y: 40, scale: .96 },
        { opacity: 1, y: 0, scale: 1, duration: .55, ease: 'back.out(1.5)' }, 0);
      tl.fromTo(S+'#st1 .no', { opacity: 0, scale: .5, rotation: -14 },
        { opacity: 1, scale: 1, rotation: 0, duration: .45, ease: 'back.out(2)' }, 0.30);
      // the wire draws down between the two steps
      tl.fromTo(S+'#wire', { opacity: 0, scaleY: 0 },
        { opacity: 1, scaleY: 1, duration: .45, ease: 'power2.inOut' }, 2.30);
      // step 02 on "They will map out with you" (local 2.72)
      tl.fromTo(S+'#st2', { opacity: 0, y: 40, scale: .96 },
        { opacity: 1, y: 0, scale: 1, duration: .55, ease: 'back.out(1.5)' }, 2.72);
      tl.fromTo(S+'#st2 .no', { opacity: 0, scale: .5, rotation: -14 },
        { opacity: 1, scale: 1, rotation: 0, duration: .45, ease: 'back.out(2)' }, 2.96);
      // blockers surface on "holding your growth back" (local 5.06)
      tl.fromTo(S+'.blocks .b', { opacity: 0, y: 22, scale: .9 },
        { opacity: 1, y: 0, scale: 1, duration: .42, stagger: .24, ease: 'back.out(1.7)' }, 5.06);
      // ...and resolve into the plan on "work on a plan" (local 7.20)
      tl.to(S+'.blocks .b', { opacity: .45, duration: .45, ease: 'sine.inOut' }, 7.00);
      tl.fromTo(S+'#plan', { opacity: 0, y: 24, scale: .94 },
        { opacity: 1, y: 0, scale: 1, duration: .52, ease: 'back.out(1.6)' }, 7.20);
      // EXIT — matches the incoming founder cut: body lifts with 30px blur while the
      // plate wipes off as one opaque piece, revealing the footage cleanly beneath.
      tl.to(S+'.body', { y: -150, filter: 'blur(30px)', duration: 0.26, ease: 'power2.in' }, SLOT - 0.26);
      tl.to(S+'.plate', { y: -1350, duration: 0.26, ease: 'power3.in' }, SLOT - 0.26);
      tl.fromTo(S+'.edge-b', { opacity: 0 }, { opacity: 1, duration: 0.07, ease: 'sine.out' }, SLOT - 0.26);
      tl.to(S+'.edge-b', { opacity: 0, duration: 0.13, ease: 'sine.in' }, SLOT - 0.17);
      tl.to({}, { duration: SLOT }, 0);   // Law #11 anchor — fills the slot, no black flash
      window.__timelines = window.__timelines || {};
      window.__timelines['s10-system'] = tl;
    })();
  </script>
