  <script>
    (function(){
      const SLOT = 3.3, S = '[data-composition-id="s08-figures"] ';
      const tl = gsap.timeline({ paused: true });
      // ENTRY — the opaque plate wipes up over the outgoing frame with a light streak
      // on its leading edge; the content rides in behind it under matching blur.
      tl.fromTo(S+'.plate', { y: 1350 }, { y: 0, duration: 0.24, ease: 'power3.out' }, 0);

      tl.fromTo(S+'.eyebrow', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .38, ease: 'power2.out' }, 0);
      // the two figures slam on their own VO words: "eight" 0.10, "nine" 0.65
      tl.fromTo(S+'#f8', { opacity: 0, scale: 1.9, y: 20 },
        { opacity: 1, scale: 1, y: 0, duration: .42, ease: 'power4.out' }, 0.10);
      tl.fromTo(S+'.figs .amp', { opacity: 0, scale: .5 },
        { opacity: 1, scale: 1, duration: .34, ease: 'back.out(2)' }, 0.47);

        { opacity: 1, y: 0, scale: 1, duration: .46, ease: 'back.out(1.7)' }, 1.70);
      // the pair breathes so the hold never goes static
      tl.to(S+'.figs', { scale: 1.03, duration: 1.0, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 1.10);
      // EXIT — matches the incoming founder cut: body lifts with 30px blur while the
      // plate wipes off as one opaque piece, revealing the footage cleanly beneath.
