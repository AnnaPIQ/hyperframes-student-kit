    [data-composition-id="s07-team"] .edge { position: absolute; left: -40px; right: -40px; height: 14px;

  <div class="slot clip" id="s07-team-slot" data-start="0" data-duration="3.6" data-track-index="0">
    <div class="plate">

        <div class="pan" id="pL">

            <div class="st ln" style="margin:-93px 0 0 87px"></div>
            <div class="st ln" style="margin:39px 0 0 87px"></div>
            <div class="st ln" style="margin:105px 0 0 -27px"></div>
            <div class="st ln" style="margin:39px 0 0 -141px"></div>
            <div class="st ln" style="margin:-93px 0 0 -141px"></div>
            <div class="hub"></div>

        </div>
        <div class="pan" id="pR">
            <div class="tm rn" style="margin:-159px 0 0 -27px"></div>
            <div class="tm rn" style="margin:-93px 0 0 87px"></div>
            <div class="tm rn" style="margin:39px 0 0 87px"></div>
            <div class="tm rn" style="margin:105px 0 0 -27px"></div>
            <div class="tm rn" style="margin:39px 0 0 -141px"></div>

  <script>
    (function(){
      const SLOT = 3.6, S = '[data-composition-id="s07-team"] ';
      const tl = gsap.timeline({ paused: true });
      // ENTRY — the opaque plate wipes up over the outgoing frame with a light streak
      // on its leading edge; the content rides in behind it under matching blur.
      tl.fromTo(S+'.plate', { y: 1350 }, { y: 0, duration: 0.24, ease: 'power3.out' }, 0);
      tl.fromTo(S+'.edge-t', { opacity: 0 }, { opacity: 1, duration: 0.07, ease: 'sine.out' }, 0);
      tl.to(S+'.edge-t', { opacity: 0, duration: 0.15, ease: 'sine.in' }, 0.09);
      tl.fromTo(S+'.body', { y: 150, filter: 'blur(24px)' },
        { y: 0, filter: 'blur(0px)', duration: 0.52, ease: 'power2.out' }, 0);
      tl.fromTo(S+'.eyebrow', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .40, ease: 'power2.out' }, 0);
      // CALLBACK — the hook's lone node and its six empty seats return on the left
      tl.fromTo(S+'#pL', { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: .50, ease: 'power3.out' }, 0);
      tl.fromTo(S+'#pR', { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: .50, ease: 'power3.out' }, 0.14);
      tl.fromTo(S+'.vs', { opacity: 0, scale: .6 }, { opacity: 1, scale: 1, duration: .34, ease: 'back.out(2)' }, 0.42);
      tl.fromTo(S+'#pL .st', { opacity: 0, scale: .7 },
        { opacity: 1, scale: 1, duration: .34, stagger: .04, ease: 'power2.out' }, 0.28);
      // ...and on the right the same six seats FILL, landing on "an entire team's" (local 0.17-0.53)
      tl.fromTo(S+'#pR .tm', { opacity: 0, scale: .3 },
        { opacity: 1, scale: 1, duration: .40, stagger: .075, ease: 'back.out(2.2)' }, 0.20);
      tl.fromTo(S+'.plab', { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: .45, stagger: .10, ease: 'power2.out' }, 0.62);
      // chips land on the VO words "knowledge" (1.03) and "experience" (1.83)
      tl.fromTo(S+'.chips .c:nth-child(1)', { opacity: 0, y: 24, scale: .92 },
        { opacity: 1, y: 0, scale: 1, duration: .44, ease: 'back.out(1.6)' }, 1.03);
      tl.fromTo(S+'.chips .c:nth-child(2)', { opacity: 0, y: 24, scale: .92 },
        { opacity: 1, y: 0, scale: 1, duration: .44, ease: 'back.out(1.6)' }, 1.83);
      tl.to(S+'#pR .hub', { scale: 1.06, duration: 1.1, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 1.30);
      // EXIT — hands off to another graphic beat: hold the content in place and let the
      // incoming beat's plate wipe over it. Lifting it here emptied the frame first.
      tl.to({}, { duration: SLOT }, 0);   // Law #11 anchor — fills the slot, no black flash
      window.__timelines = window.__timelines || {};
      window.__timelines['s07-team'] = tl;
    })();
  </script>

</template>
