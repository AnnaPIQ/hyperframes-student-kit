<template id="s14-community-template">
  <script src="assets/vendor/gsap.min.js"></script>
  <div data-composition-id="s14-community" data-start="0" data-duration="4.9" data-width="1080" data-height="1350">
  <style>
    @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800; font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
    @font-face { font-family: 'Hedvig Letters Serif'; font-style: normal; font-weight: 400; font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }
    [data-composition-id="s14-community"] { position: absolute; inset: 0; overflow: hidden; background: transparent;
      font-family: 'Rethink Sans', system-ui, sans-serif; color: #FFFFFF; }
    [data-composition-id="s14-community"] .plate { position: absolute; inset: 0; overflow: hidden;
      background: radial-gradient(64% 46% at 50% 42%, rgba(156,212,255,.11) 0%, rgba(6,40,76,0) 64%), #06284C; }
    [data-composition-id="s14-community"] .grid { position: absolute; inset: 0; opacity: .13;
      background-image: linear-gradient(#1d4a7a 1px, transparent 1px), linear-gradient(90deg, #1d4a7a 1px, transparent 1px);
      background-size: 90px 90px; -webkit-mask-image: radial-gradient(76% 58% at 50% 42%, #000 40%, transparent 86%); }
    [data-composition-id="s14-community"] .body { position: absolute; inset: 0; }
    /* shared scene furniture */
    [data-composition-id="s14-community"] .eyebrow { position: absolute; left: 0; right: 0; text-align: center;
      font-weight: 600; font-size: 24px; letter-spacing: .30em; text-transform: uppercase; color: #9CD4FF; }
    [data-composition-id="s14-community"] .kicker { position: absolute; left: 90px; right: 90px; text-align: center;
      font-weight: 700; font-size: 46px; line-height: 1.14; letter-spacing: -.01em; color: #FFFFFF; }
    [data-composition-id="s14-community"] .serif { font-family: 'Hedvig Letters Serif', Georgia, serif;
      font-style: italic; font-weight: 400; }

    [data-composition-id="s14-community"] .step { position: absolute; left: 100px; width: 880px;
      background: linear-gradient(180deg, #0d3768 0%, #0a325f 100%); border: 1px solid #1d4a7a;
      border-radius: 26px; box-shadow: 0 24px 60px -22px rgba(0,0,0,.6);
      display: flex; align-items: center; padding: 0 44px; gap: 32px; }
    [data-composition-id="s14-community"] .step .no { flex: none; width: 96px; height: 96px; border-radius: 22px;
      background: rgba(156,212,255,.14); border: 1px solid rgba(156,212,255,.45); color: #9CD4FF;
      display: grid; place-items: center; font-weight: 800; font-size: 42px; font-variant-numeric: tabular-nums; }
    [data-composition-id="s14-community"] .step .txt b { display: block; font-weight: 800; font-size: 50px;
      line-height: 1.08; letter-spacing: -.025em; color: #FFFFFF; }
    [data-composition-id="s14-community"] .step .txt span { display: block; margin-top: 10px; font-weight: 600;
      font-size: 27px; letter-spacing: .05em; text-transform: uppercase; color: #9fb6d4; }

    [data-composition-id="s14-community"] .eyebrow { top: 242px; }
    [data-composition-id="s14-community"] #st4 { top: 304px; height: 220px; }
    [data-composition-id="s14-community"] .ring { position: absolute; left: 0; right: 0; top: 590px; height: 480px; }
    [data-composition-id="s14-community"] .orbit { position: absolute; left: 50%; top: 50%; width: 372px; height: 372px;
      margin: -186px 0 0 -186px; border-radius: 50%; border: 2px dashed rgba(156,212,255,.28); }
    [data-composition-id="s14-community"] .hub { position: absolute; left: 50%; top: 50%; width: 132px; height: 132px;
      margin: -66px 0 0 -66px; border-radius: 32px; background: linear-gradient(180deg,#0d3768,#0a325f);
      border: 1px solid #2b5d92; display: grid; place-items: center;
      box-shadow: 0 0 56px rgba(156,212,255,.32); }
    [data-composition-id="s14-community"] .hub img { width: 78px; height: auto; display: block; }
    [data-composition-id="s14-community"] .av { position: absolute; left: 50%; top: 50%; width: 76px; height: 76px;
      border-radius: 50%; background: radial-gradient(circle at 36% 30%, #cfe6ff, #9CD4FF 58%, #4b8fce 100%);
      box-shadow: 0 0 26px rgba(156,212,255,.6); }
    [data-composition-id="s14-community"] .cap { position: absolute; left: 90px; right: 90px; top: 1116px;
      text-align: center; font-weight: 700; font-size: 44px; line-height: 1.12; letter-spacing: -.02em; color: #FFFFFF; }
    [data-composition-id="s14-community"] .cap em { font-family: 'Hedvig Letters Serif', Georgia, serif;
      font-style: italic; font-weight: 400; color: #9CD4FF; }
  </style>

  <div class="slot clip" id="s14-community-slot" data-start="0" data-duration="4.9" data-track-index="0">
    <div class="plate">
      <div class="grid"></div>
      <div class="body">
        <div class="eyebrow">Plus, on top of that</div>
        <div class="step" id="st4">
          <div class="no">04</div>
          <div class="txt"><b>Slack support channel</b><span>answers between calls</span></div>
        </div>
        <div class="ring">
          <div class="orbit"></div>
          <div class="av" style="margin:-224px 0 0 -38px"></div>
          <div class="av" style="margin:-170px 0 0 94px"></div>
          <div class="av" style="margin:-38px 0 0 148px"></div>
          <div class="av" style="margin:94px 0 0 94px"></div>
          <div class="av" style="margin:148px 0 0 -38px"></div>
          <div class="av" style="margin:94px 0 0 -170px"></div>
          <div class="av" style="margin:-38px 0 0 -224px"></div>
          <div class="av" style="margin:-170px 0 0 -170px"></div>
          <div class="hub"><img src="assets/ecomiq-icon-white.svg" alt="EcomIQ" /></div>
        </div>
        <div class="cap">A community of founders <em>all doing the same thing.</em></div>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const SLOT = 4.9, S = '[data-composition-id="s14-community"] ';
      const tl = gsap.timeline({ paused: true });
      // ENTRY — the opaque plate wipes up over the outgoing founder frame; the
      // content rides in behind it with matching blur so the cut never reads hard.
      tl.fromTo(S+'.plate', { y: 1350 }, { y: 0, duration: 0.28, ease: 'power3.out' }, 0);
      tl.fromTo(S+'.body', { y: 170, filter: 'blur(26px)' },
        { y: 0, filter: 'blur(0px)', duration: 0.62, ease: 'power2.out' }, 0);
      tl.fromTo(S+'.eyebrow', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .40, ease: 'power2.out' }, 0.06);
      // Slack card on the VO word "Slack" (local 0.56)
      tl.fromTo(S+'#st4', { opacity: 0, y: 38, scale: .96 },
        { opacity: 1, y: 0, scale: 1, duration: .52, ease: 'back.out(1.5)' }, 0.20);
      tl.fromTo(S+'#st4 .no', { opacity: 0, scale: .5, rotation: -14 },
        { opacity: 1, scale: 1, rotation: 0, duration: .42, ease: 'back.out(2)' }, 0.42);
      tl.fromTo(S+'.orbit', { opacity: 0, scale: .7, rotation: -30 },
        { opacity: 1, scale: 1, rotation: 0, duration: .70, ease: 'power3.out' }, 1.40);
      tl.fromTo(S+'.hub', { opacity: 0, scale: .5 },
        { opacity: 1, scale: 1, duration: .48, ease: 'back.out(1.8)' }, 1.56);
      // CALLBACK — the empty seats from the hook now fill completely, one per beat
      tl.fromTo(S+'.av', { opacity: 0, scale: .25 },
        { opacity: 1, scale: 1, duration: .40, stagger: .085, ease: 'back.out(2.2)' }, 1.76);
      tl.to(S+'.orbit', { rotation: 22, duration: 2.6, ease: 'sine.inOut' }, 2.20);
      tl.fromTo(S+'.cap', { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: .55, ease: 'power3.out' }, 3.00);
      // EXIT — matches the incoming founder cut: body lifts with 30px blur while the
      // plate wipes off as one opaque piece, revealing the footage cleanly beneath.
      tl.to(S+'.body', { y: -150, filter: 'blur(30px)', duration: 0.26, ease: 'power2.in' }, SLOT - 0.26);
      tl.to(S+'.plate', { y: -1350, duration: 0.26, ease: 'power3.in' }, SLOT - 0.26);
      tl.to({}, { duration: SLOT }, 0);   // Law #11 anchor — fills the slot, no black flash
      window.__timelines = window.__timelines || {};
      window.__timelines['s14-community'] = tl;
    })();
  </script>
  </div>
</template>
