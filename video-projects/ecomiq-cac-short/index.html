<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ecomiq-cac-short</title>
    <!-- GSAP vendored locally — CDN cert-fails in the render env and freezes renders -->
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      /* LOCAL fonts — no network dependency at render time. Name families
         literally (not via var()) so the linter resolves them. */
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      @font-face { font-family: 'Hedvig Letters Serif'; font-style: italic; font-weight: 400;
        font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: var(--brand-navy);
        font-family: 'Rethink Sans', system-ui, sans-serif;
        color: var(--brand-white);
      }

      /* Fallback canvas — the A-roll fills the frame, but this keeps any seam navy. */
      #bg { position: absolute; inset: 0; background: var(--brand-navy); }

      /* Footage — A-roll spine + B-roll cutaways. All exactly 1080x1920, so
         object-fit:cover is a 1:1 fill (no crop drift). transform-origin center
         so the subtle scale-push breathes from the middle. Never animate
         width/height/top/left on <video> (freezes frames) — only scale/opacity. */
      .footage {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover; object-position: center;
        transform-origin: center center;
        display: block;
      }

      /* Persistent EcomIQ logo, top-left. Wrapped in a NON-clip positioned div
         (so the engine never repositions it). A soft navy corner scrim + drop
         shadow keep the WHITE logo legible on bright calculator cutaways and on
         the white ceiling behind the founder. */
      #logo-wrap { position: absolute; top: 0; left: 0; width: 560px; height: 360px; pointer-events: none; }
      #logo-scrim {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(120% 120% at 8% 12%, rgba(3, 20, 40, 0.55) 0%, rgba(3, 20, 40, 0.30) 34%, rgba(3, 20, 40, 0) 66%);
      }
      #logo {
        position: absolute; top: 92px; left: 64px; width: 300px; height: auto;
        filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.45));
      }

      /* ---- END CARD -------------------------------------------------------- */
      #endcard {
        position: absolute; inset: 0;
        background:
          radial-gradient(90% 50% at 50% 16%, rgba(156, 212, 255, 0.10) 0%, rgba(6, 40, 76, 0) 55%),
          var(--brand-navy);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 0 120px;
      }
      #ec-bloom {
        position: absolute; left: -10%; bottom: -18%; width: 120%; height: 55%;
        background: var(--brand-gradient-2); filter: blur(90px); opacity: 0.34;
      }
      #ec-logo { width: 460px; height: auto; margin-bottom: 90px; position: relative; }
      #ec-eyebrow {
        position: relative;
        font-size: 30px; font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase;
        color: var(--brand-blue-tint); margin-bottom: 34px;
      }
      #ec-headline {
        position: relative;
        font-size: 108px; font-weight: 800; line-height: 0.98; letter-spacing: -0.03em;
        color: var(--brand-white);
      }
      #ec-headline .em {
        font-family: 'Hedvig Letters Serif', Georgia, serif;
        font-style: italic; font-weight: 400; letter-spacing: -0.01em;
        color: var(--brand-blue-tint);
      }
      #ec-cta {
        position: relative;
        margin-top: 74px;
        display: inline-flex; align-items: center; gap: 20px;
        font-size: 44px; font-weight: 700; color: var(--brand-white);
        background: var(--brand-flame);
        padding: 34px 68px; border-radius: 999px;
        box-shadow: 0 24px 72px -16px rgba(255, 76, 50, 0.62);
      }
      #ec-cta .arrow { font-size: 46px; line-height: 1; transform: translateY(-2px); }
      #ec-url {
        position: relative;
        margin-top: 40px; font-size: 34px; font-weight: 600; letter-spacing: 0.02em;
        color: var(--brand-text-dim);
      }
    </style>
  </head>
  <body>
    <!-- Render Contract: root needs id, data-composition-id, data-start=0,
         data-width, data-height. Every timed element needs data-start,
         data-duration, data-track-index (unique per overlapping track). -->
    <div
      id="root"
      data-composition-id="ecomiq-cac-short"
      data-start="0"
      data-duration="54.5"
      data-width="1080"
      data-height="1920"
    >
      <!-- 0 · navy fallback canvas -->
      <div id="bg" class="clip" data-start="0" data-duration="54.5" data-track-index="0"></div>

      <!-- 1 · A-ROLL spine (muted video; audio rides a sibling <audio> track) -->
      <video
        class="footage"
        id="aroll-video"
        data-start="0"
        data-duration="51.53"
        data-track-index="1"
        src="assets/aroll.mp4"
        muted
        playsinline
      ></video>

      <!-- 2 · B-ROLL #1 — establish: the CAC card, REPORTED $37.50 → TRUE CAC (early
             state). Right column so the page's own logo never doubles with our
             overlay. Lands on "…dashboard says each one cost you $37.50." -->
      <video
        class="footage"
        id="cut1"
        data-start="9.8"
        data-duration="3.2"
        data-track-index="2"
        src="assets/broll-1-establish.mp4"
        muted
        playsinline
      ></video>

      <!-- 3 · B-ROLL #2 — hidden acquisition costs list
             (lands on "the creative, the welcome code, the shipping, the processing…") -->
      <video
        class="footage"
        id="cut2"
        data-start="20.7"
        data-duration="5.76"
        data-track-index="3"
        src="assets/broll-2-hidden.mp4"
        muted
        playsinline
      ></video>

      <!-- 4 · B-ROLL #3 — the reveal: REPORTED $37.50 → TRUE CAC $61.69
             (lands on "…the real number's nearly sixty-two dollars") -->
      <video
        class="footage"
        id="cut3"
        data-start="30.4"
        data-duration="4.66"
        data-track-index="4"
        src="assets/broll-3-reveal.mp4"
        muted
        playsinline
      ></video>

      <!-- 5 & 6 · Persistent logo group (scrim under, white logo over) -->
      <div id="logo-wrap">
        <div id="logo-scrim" class="clip" data-start="0" data-duration="50" data-track-index="5"></div>
        <img id="logo" class="clip" data-start="0" data-duration="50" data-track-index="6"
             src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
      </div>

      <!-- 7 · END CARD — logo + CTA (branded finish) -->
      <div id="endcard" class="clip" data-start="49.5" data-duration="5" data-track-index="7">
        <div id="ec-bloom"></div>
        <img id="ec-logo" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
        <div id="ec-eyebrow">More insights like this?</div>
        <div id="ec-headline">The Free<br /><span class="em">Profitability</span><br />Bootcamp.</div>
        <div id="ec-cta">Sign up here <span class="arrow">&rarr;</span></div>
        <div id="ec-url">ecomiq.com</div>
      </div>

      <!-- 8 · A-ROLL audio (founder VO = the spine; mixer-managed track) -->
      <audio
        id="aroll-audio"
        data-start="0"
        data-duration="51.53"
        data-track-index="8"
        data-volume="1"
        src="assets/aroll.mp4"
      ></audio>

      <!-- 9 · Duckable MUSIC-BED PLACEHOLDER (silent). Swap the src for your track;
             data-volume is already ducked to sit under the VO. -->
      <audio
        id="music-bed"
        data-start="0"
        data-duration="54.5"
        data-track-index="9"
        data-volume="0.18"
        src="assets/music-bed-PLACEHOLDER.m4a"
      ></audio>
    </div>

    <script>
      // Render Contract: exactly one paused GSAP timeline, keyed to the
      // data-composition-id, registered on window.__timelines.
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // --- Persistent logo: gentle fade/settle in, fade out just before end card ---
      tl.fromTo("#logo-wrap", { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.3)
        .to("#logo-wrap", { opacity: 0, duration: 0.4, ease: "power1.in" }, 49.1)
        .set("#logo-wrap", { opacity: 0 }, 49.5); // hard kill so non-linear seeks stay hidden

      // --- Cutaways: HARD cut in (no entrance tween), slow scale-push for life,
      //     quick DISSOLVE out to the founder underneath. ---
      // #1 establish  9.8 → 13.0
      tl.fromTo("#cut1", { scale: 1.0 }, { scale: 1.06, duration: 3.2, ease: "none" }, 9.8)
        .to("#cut1", { opacity: 0, duration: 0.25, ease: "power1.in" }, 12.75);
      // #2 hidden costs  20.7 → 26.46
      tl.fromTo("#cut2", { scale: 1.0 }, { scale: 1.06, duration: 5.76, ease: "none" }, 20.7)
        .to("#cut2", { opacity: 0, duration: 0.25, ease: "power1.in" }, 26.21);
      // #3 reveal  30.4 → 35.06
      tl.fromTo("#cut3", { scale: 1.0 }, { scale: 1.06, duration: 4.66, ease: "none" }, 30.4)
        .to("#cut3", { opacity: 0, duration: 0.25, ease: "power1.in" }, 34.81);

      // --- END CARD (49.5 → 54.5): dissolve the card in, then stagger its content ---
      tl.fromTo("#endcard", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 49.5)
        .fromTo("#ec-logo", { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 49.9)
        .fromTo("#ec-eyebrow", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 50.1)
        .fromTo("#ec-headline", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 50.3)
        .fromTo("#ec-cta", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.7)" }, 50.7)
        .fromTo("#ec-url", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 51.1)
        // CTA breathes to hold attention through the outro hold.
        .to("#ec-cta", { scale: 1.045, duration: 0.75, ease: "sine.inOut", yoyo: true, repeat: 3 }, 51.6);

      // Pad timeline so its duration matches root data-duration (Law #7/#11).
      tl.to({}, { duration: 54.5 }, 0);
      window.__timelines["ecomiq-cac-short"] = tl;
    </script>
  </body>
</html>
