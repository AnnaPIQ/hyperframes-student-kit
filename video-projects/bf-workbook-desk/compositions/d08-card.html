<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>d08-card</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Rethink Sans";
        font-style: normal;
        font-weight: 400 800;
        font-display: block;
        src: url(assets/fonts/RethinkSans.woff2) format("woff2");
      }
      @font-face {
        font-family: "Hedvig Letters Serif";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url(assets/fonts/HedvigLettersSerif.woff2) format("woff2");
      }
      [data-composition-id="d08-card"] * { margin: 0; padding: 0; box-sizing: border-box; }
      [data-composition-id="d08-card"] {
        position: absolute;
        inset: 0;
        overflow: hidden;
        font-family: "Rethink Sans", system-ui, sans-serif;
      }
      [data-composition-id="d08-card"] .cam { position: absolute; inset: 0; perspective: 2200px; }

      /* The book, lying on the desk to the left of the lockup */
      [data-composition-id="d08-card"] .plane {
        position: absolute;
        left: 30%;
        top: 52%;
        width: 0;
        height: 0;
        transform-style: preserve-3d;
        transform: rotateX(16deg) rotateZ(-8deg);
      }
      [data-composition-id="d08-card"] .cast {
        position: absolute;
        left: -246px;
        top: -300px;
        width: 500px;
        height: 640px;
        border-radius: 16px;
        background: rgba(1, 8, 18, 0.84);
        filter: blur(36px);
        transform: translate(30px, 40px);
      }
      [data-composition-id="d08-card"] .book {
        position: absolute;
        left: -242px;
        top: -313px;
        width: 484px;
        height: 627px;
        transform-style: preserve-3d;
      }
      [data-composition-id="d08-card"] .edge { position: absolute; inset: 0; border-radius: 3px; }
      [data-composition-id="d08-card"] .e1 { transform: translate(12px, 9px); background: #b9c9db; }
      [data-composition-id="d08-card"] .e2 { transform: translate(6px, 4px);  background: #e0e9f3; }
      [data-composition-id="d08-card"] .paper {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 3px;
        background: #ffffff;
        box-shadow: 0 12px 26px -10px rgba(1, 8, 18, 0.8);
      }
      [data-composition-id="d08-card"] .paper img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      [data-composition-id="d08-card"] .lit {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          116deg,
          rgba(226, 240, 255, 0.22) 0%,
          rgba(226, 240, 255, 0.04) 30%,
          rgba(3, 16, 32, 0.06) 68%,
          rgba(3, 16, 32, 0.2) 100%
        );
      }
      [data-composition-id="d08-card"] .sweep {
        position: absolute;
        top: -40%;
        left: 0;
        width: 46%;
        height: 180%;
        background: linear-gradient(
          104deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.1) 42%,
          rgba(255, 255, 255, 0.2) 52%,
          rgba(255, 255, 255, 0.1) 62%,
          rgba(255, 255, 255, 0) 100%
        );
        filter: blur(5px);
      }

      /* The lockup — the only type in the whole piece */
      [data-composition-id="d08-card"] .lockup {
        position: absolute;
        left: 56%;
        top: 50%;
        width: 660px;
        transform: translateY(-50%);
      }
      [data-composition-id="d08-card"] .logo { width: 352px; height: auto; display: block; }
      [data-composition-id="d08-card"] .rule {
        width: 100px;
        height: 4px;
        margin-top: 42px;
        background-color: #ff4c32;
        transform-origin: 0% 50%;
      }
      [data-composition-id="d08-card"] .title {
        margin-top: 28px;
        font-family: "Hedvig Letters Serif", Georgia, serif;
        font-size: 68px;
        line-height: 1.06;
        color: #ffffff;
      }
      [data-composition-id="d08-card"] .sub {
        margin-top: 24px;
        font-weight: 500;
        font-size: 29px;
        color: #9cd4ff;
      }
      [data-composition-id="d08-card"] .meta {
        margin-top: 36px;
        padding-top: 24px;
        border-top: 1px solid rgba(156, 212, 255, 0.3);
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #9cd4ff;
      }
    </style>
  </head>
  <body>
    <div data-composition-id="d08-card" data-width="1920" data-height="1080" data-duration="4.2">
      <div class="cam" id="d08-cam">
        <div class="plane" id="d08-plane">
          <div class="cast" id="d08-cast"></div>
          <div class="book" id="d08-book">
            <div class="edge e1"></div>
            <div class="edge e2"></div>
            <div class="paper">
              <img src="assets/pages/p01.png" alt="The Black Friday Profit Plan" />
              <div class="lit"></div>
              <div class="sweep" id="d08-sweep"></div>
            </div>
          </div>
        </div>

        <div class="lockup">
          <img class="logo" id="d08-logo" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
          <div class="rule" id="d08-rule"></div>
          <div class="title" id="d08-title">The Black Friday Profit Plan</div>
          <div class="sub" id="d08-sub">Free workbook for US Shopify brands</div>
          <div class="meta" id="d08-meta">8 Parts &middot; 32 Worksheets &middot; 19 Free tools</div>
        </div>
      </div>
    </div>

    <script>
      (() => {
        window.__timelines = window.__timelines || {};
        const S = '[data-composition-id="d08-card"] ';
        const SLOT = 4.2;
        const tl = gsap.timeline({ paused: true });

        tl.fromTo(S + "#d08-cam",
          { opacity: 0, yPercent: 2.2 },
          { opacity: 1, yPercent: 0, duration: 0.36, ease: "power2.out" }, 0);

        // The book is already on the desk; it just settles the last few pixels.
        tl.fromTo(S + "#d08-book",
          { y: -16, scale: 1.02 },
          { y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, 0.05);
        tl.fromTo(S + "#d08-cast",
          { scale: 1.06, opacity: 0.55 },
          { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.05);

        // Lockup builds beside it.
        tl.fromTo(S + "#d08-logo",  { y: -18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.34);
        tl.fromTo(S + "#d08-rule",  { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.36, ease: "power3.out" }, 0.5);
        tl.fromTo(S + "#d08-title", { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 0.6);
        tl.fromTo(S + "#d08-sub",   { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0.76);
        tl.fromTo(S + "#d08-meta",  { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.36, ease: "power2.out" }, 0.88);

        // Two light passes across the cover carry the hold.
        tl.fromTo(S + "#d08-sweep", { xPercent: -190 }, { xPercent: 330, duration: 1.15, ease: "power2.inOut" }, 1.2);
        tl.fromTo(S + "#d08-sweep", { xPercent: -190 }, { xPercent: 330, duration: 1.25, ease: "power2.inOut" }, 2.85);

        // Very slow camera creep — the frame is still but never dead.
        tl.fromTo(S + "#d08-cam",
          { scale: 1, xPercent: 0.6 },
          { scale: 1.04, xPercent: -0.6, duration: SLOT, ease: "sine.inOut" }, 0);
        tl.fromTo(S + "#d08-plane",
          { rotateX: 18, rotateZ: -9.5 },
          { rotateX: 14, rotateZ: -6.5, duration: SLOT, ease: "sine.inOut" }, 0);

        // No fade-out: the last frame is a clean, usable end card.
        tl.to({}, { duration: SLOT }, 0); // Law #11 anchor
        window.__timelines["d08-card"] = tl;
      })();
    </script>
  </body>
</html>
