<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>s08-outro</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Rethink Sans";
        font-style: normal;
        font-weight: 400 800;
        font-display: block;
        src: url(assets/fonts/RethinkSans.woff2) format("woff2");
      }
      @font-face {
        font-family: "Hedvig Letters Serif";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url(assets/fonts/HedvigLettersSerif.woff2) format("woff2");
      }
      [data-composition-id="s08-outro"] * { margin: 0; padding: 0; box-sizing: border-box; }
      [data-composition-id="s08-outro"] {
        position: absolute;
        inset: 0;
        overflow: hidden;
        font-family: "Rethink Sans", system-ui, sans-serif;
      }
      [data-composition-id="s08-outro"] .s08-enter { position: absolute; inset: 0; }
      [data-composition-id="s08-outro"] .s08-stage {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 124px;
        width: 100%;
        height: 100%;
        padding: 120px 192px;
        box-sizing: border-box;
        perspective: 2000px;
      }
      [data-composition-id="s08-outro"] .s08-pool {
        position: absolute;
        left: 34%;
        top: 52%;
        width: 1100px;
        height: 620px;
        margin: -310px 0 0 -550px;
        border-radius: 50%;
        background: radial-gradient(50% 50% at 50% 50%, rgba(255, 76, 50, 0.3) 0%, rgba(255, 76, 50, 0) 70%);
        filter: blur(30px);
      }
      /* Cover returns — the callback from shot 01 */
      [data-composition-id="s08-outro"] .s08-book {
        position: relative;
        width: 480px;
        height: 622px;
        flex: none;
        transform-style: preserve-3d;
      }
      [data-composition-id="s08-outro"] .s08-leaf {
        position: absolute;
        inset: 0;
        border-radius: 3px;
      }
      [data-composition-id="s08-outro"] .s08-leaf-1 { transform: translate(11px, 8px); background: #c3d2e2; }
      [data-composition-id="s08-outro"] .s08-leaf-2 { transform: translate(6px, 4px); background: #e2eaf3; }
      [data-composition-id="s08-outro"] .s08-face {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 3px;
        box-shadow:
          0 54px 110px -30px rgba(1, 10, 22, 0.9),
          0 0 0 1px rgba(156, 212, 255, 0.22);
      }
      [data-composition-id="s08-outro"] .s08-face img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      [data-composition-id="s08-outro"] .s08-glint {
        position: absolute;
        top: -30%;
        left: 0;
        width: 44%;
        height: 160%;
        background: linear-gradient(
          100deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.12) 44%,
          rgba(255, 255, 255, 0.28) 52%,
          rgba(255, 255, 255, 0.12) 60%,
          rgba(255, 255, 255, 0) 100%
        );
        filter: blur(3px);
      }
      /* Lockup */
      [data-composition-id="s08-outro"] .s08-lockup {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        max-width: 720px;
      }
      [data-composition-id="s08-outro"] .s08-logo { width: 372px; height: auto; }
      [data-composition-id="s08-outro"] .s08-rule {
        width: 104px;
        height: 4px;
        margin-top: 46px;
        background-color: #ff4c32;
        transform-origin: 0% 50%;
      }
      [data-composition-id="s08-outro"] .s08-title {
        margin-top: 30px;
        font-family: "Hedvig Letters Serif", Georgia, serif;
        font-weight: 400;
        font-size: 74px;
        line-height: 1.06;
        color: #ffffff;
      }
      [data-composition-id="s08-outro"] .s08-sub {
        margin-top: 26px;
        font-weight: 500;
        font-size: 30px;
        line-height: 1.35;
        color: #9cd4ff;
      }
      [data-composition-id="s08-outro"] .s08-meta {
        margin-top: 40px;
        padding-top: 26px;
        border-top: 1px solid rgba(156, 212, 255, 0.3);
        font-weight: 700;
        font-size: 21px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #9cd4ff;
      }
    </style>
  </head>
  <body>
    <div data-composition-id="s08-outro" data-width="1920" data-height="1080" data-duration="5.6">
      <div class="s08-enter" id="s08-enter">
      <div class="s08-pool" id="s08-pool"></div>
      <div class="s08-stage" id="s08-stage">
        <div class="s08-book" id="s08-book">
          <div class="s08-leaf s08-leaf-1"></div>
          <div class="s08-leaf s08-leaf-2"></div>
          <div class="s08-face">
            <img src="assets/pages/cover.png" alt="The Black Friday Profit Plan" />
            <div class="s08-glint" id="s08-glint"></div>
          </div>
        </div>
        <div class="s08-lockup">
          <img class="s08-logo" id="s08-logo" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
          <div class="s08-rule" id="s08-rule"></div>
          <div class="s08-title" id="s08-title">The Black Friday Profit Plan</div>
          <div class="s08-sub" id="s08-sub">Free workbook for US Shopify brands</div>
          <div class="s08-meta" id="s08-meta">8 Parts &middot; 32 Worksheets &middot; 19 Free tools</div>
        </div>
      </div>
      </div>
    </div>

    <script>
      (() => {
        window.__timelines = window.__timelines || {};
        const S = '[data-composition-id="s08-outro"] ';
        const SLOT = 5.6;
        const tl = gsap.timeline({ paused: true });

        // Scene arrives over the outgoing shot — blur-rise, never a hard cut.
        tl.fromTo(S + "#s08-enter",
          { y: 110, opacity: 0, filter: "blur(20px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, 0);


        // Cover returns.
        tl.fromTo(S + "#s08-book",
          { y: 150, rotateY: -22, scale: 0.9, opacity: 0, filter: "blur(20px)" },
          { y: 0, rotateY: -8, scale: 1, opacity: 1, filter: "blur(0px)",
            duration: 1.1, ease: "expo.out" }, 0.1);
        tl.fromTo(S + "#s08-pool",
          { scale: 0.6, opacity: 0 },
          { scale: 1, opacity: 1, duration: 1.2, ease: "power2.out" }, 0.2);

        // Lockup builds.
        tl.fromTo(S + "#s08-logo",  { y: -22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.45);
        tl.fromTo(S + "#s08-rule",  { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.7);
        tl.fromTo(S + "#s08-title", { y: 34, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, 0.86);
        tl.fromTo(S + "#s08-sub",   { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power2.out" }, 1.08);
        tl.fromTo(S + "#s08-meta",  { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 1.26);

        // Two glints across the 3.5s hold — the only thing that moves fast.
        tl.fromTo(S + "#s08-glint", { xPercent: -180 }, { xPercent: 330, duration: 1.2, ease: "power2.inOut" }, 1.7);
        tl.fromTo(S + "#s08-glint", { xPercent: -180 }, { xPercent: 330, duration: 1.3, ease: "power2.inOut" }, 4.0);

        // The hold still breathes: a very slow push and a settling turn.
        tl.fromTo(S + "#s08-stage",
          { scale: 1 },
          { scale: 1.035, duration: SLOT, ease: "none" }, 0);
        tl.to(S + "#s08-book", { rotateY: -3, y: -8, duration: 3.4, ease: "sine.inOut" }, 1.2);
        tl.to(S + "#s08-pool", { opacity: 0.62, duration: 1.9, ease: "sine.inOut" }, 1.6);
        tl.to(S + "#s08-pool", { opacity: 1, duration: 1.8, ease: "sine.inOut" }, 3.5);

        // No fade-out: the last frame is a clean, usable end card.
        tl.to({}, { duration: SLOT }, 0); // Law #11 anchor
        window.__timelines["s08-outro"] = tl;
      })();
    </script>
  </body>
</html>
