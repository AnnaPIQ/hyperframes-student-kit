<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>EcomIQ — Black Friday Profit Plan (9:16)</title>
    <!-- GSAP vendored locally — a CDN script cert-fails in the render env and freezes renders -->
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      /* LOCAL fonts — no network at render time */
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      @font-face { font-family: 'Hedvig Letters Serif'; font-style: normal; font-weight: 400;
        font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: var(--brand-navy);
        font-family: 'Rethink Sans', system-ui, sans-serif;
        color: var(--brand-text);
      }

      /* ---- ratio-tunable knobs (the 4:5 cut overrides these) ----------------
         --safe-bottom is the reserved subtitle band. NOTHING is drawn inside it:
         every bottom-anchored element and every centred card is held above it,
         so burned-in captions can be dropped in later without a collision.
         Change this one value to resize the band. */
      :root {
        --pad: 72px;          /* side safe-area gutter            */
        --logo-w: 200px;      /* persistent top-left mark         */
        --safe-bottom: 230px; /* reserved subtitle band (12% of height) */
        --q-fs: 38px;         /* question copy                    */
        --title-fs: 112px;
      }

      #bg { position: absolute; inset: 0;
        background: radial-gradient(90% 55% at 50% 18%, rgba(156,212,255,.10) 0%, rgba(6,40,76,0) 55%), var(--brand-navy); }

      /* A-roll spine. The <video> itself is never transformed (rule 9) — any
         motion goes on this wrapper. */
      #aroll-wrap { position: absolute; inset: 0; overflow: hidden; }
      #aroll { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

      /* Persistent logo. Non-`clip`, positioned wrapper so it never drifts. */
      #logo-wrap { position: absolute; top: 62px; left: var(--pad); z-index: 90; }
      #logo-wrap img { display: block; width: var(--logo-w); height: auto;
        filter: drop-shadow(0 6px 18px rgba(0,0,0,.55)); }

      /* ---- shared card furniture --------------------------------------------
         padding-bottom keeps centred card content out of the subtitle band. */
      .card { position: absolute; inset: 0; z-index: 40;
        background: radial-gradient(80% 50% at 50% 14%, rgba(156,212,255,.12) 0%, rgba(6,40,76,0) 60%), var(--brand-navy);
        padding: 0 var(--pad) var(--safe-bottom);
        display: flex; flex-direction: column; justify-content: center; }
      .eyebrow { font-size: 27px; font-weight: 600; letter-spacing: .30em;
        text-transform: uppercase; color: var(--brand-blue-tint); }

      /* ---- S2 · the three questions -----------------------------------------
         A lower panel over Sean, sitting on top of the subtitle band. It is
         bottom-anchored, so each question grows it UPWARD as it lands — it never
         reserves empty height for a question that has not been asked yet. */
      .panel { position: absolute; left: var(--pad); right: var(--pad);
        bottom: calc(var(--safe-bottom) + 20px); z-index: 50; }
      .panel-inner { background: rgba(6,40,76,.94); border: 1px solid var(--brand-border);
        border-radius: 34px; padding: 34px 40px 30px;
        box-shadow: 0 40px 110px -30px rgba(0,0,0,.85); }
      .panel .eyebrow { font-size: 25px; letter-spacing: .26em; }
      .panel-rule { width: 84px; height: 5px; background: var(--brand-flame);
        border-radius: 3px; transform-origin: left center; margin: 14px 0 18px; }

      .q-row { overflow: hidden; }
      .q-in { display: flex; align-items: flex-start; gap: 22px; padding: 13px 0; }
      .q-n { flex: none; width: 56px; height: 56px; border-radius: 16px;
        background: rgba(156,212,255,.14); border: 1px solid var(--brand-border);
        display: flex; align-items: center; justify-content: center;
        font-size: 28px; font-weight: 800; color: var(--brand-blue-tint);
        font-variant-numeric: tabular-nums; }
      .q-t { font-size: var(--q-fs); font-weight: 600; line-height: 1.18;
        letter-spacing: -.015em; padding-top: 6px; }

      /* ---- B-roll: the EcomIQ workbook film ----------------------------------
         Plain non-`clip` wrapper (the <video> inside carries the timing, rule 2),
         so the fades live on the wrapper and never touch the video box (rule 9). */
      .broll-wrap { position: absolute; inset: 0; overflow: hidden; z-index: 25; }
      .broll-wrap video { position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; }

      /* ---- S4 end card -------------------------------------------------------- */
      #endcard { z-index: 70; align-items: center; text-align: center; }
      #ec-logo { width: 420px; height: auto; margin-bottom: 54px; }
      #ec-eyebrow { font-size: 27px; font-weight: 600; letter-spacing: .30em;
        text-transform: uppercase; color: var(--brand-blue-tint); margin-bottom: 30px; }
      #ec-head { font-size: var(--title-fs); font-weight: 800; line-height: .96;
        letter-spacing: -.035em; max-width: 100%; }
      /* No italic-serif emphasis on the end card — "free" stays white and upright. */
      #ec-head .em { font-family: inherit; font-style: normal;
        font-weight: 800; color: var(--brand-white); letter-spacing: inherit; }
      #ec-sub { margin-top: 34px; font-size: 36px; font-weight: 500; line-height: 1.3;
        color: var(--brand-text-dim); max-width: 80%; }
      #ec-pill { margin-top: 58px; font-size: 42px; font-weight: 800; letter-spacing: -.01em;
        color: var(--brand-white); background: var(--brand-flame);
        padding: 34px 78px; border-radius: 999px;
        box-shadow: 0 26px 80px -18px rgba(255,76,50,.75); }
      #ec-bloom { position: absolute; left: -12%; bottom: -26%; width: 124%; height: 58%;
        background: var(--brand-gradient-2); filter: blur(96px); opacity: .30; z-index: -1; }
    </style>
  </head>
  <body>
    <!-- =====================================================================
         EcomIQ — Black Friday Profit Plan · 9:16 (1080x1920 @30fps) · 39.0s

         A-roll spine: assets/aroll-916.mp4 (muted, rule 5) + assets/aroll-audio.m4a.
         scripts/prep-media.sh trims the head/tail AND splices ~3.8s of dead air
         out from between the phrases, so the A-roll runs 35.52s. Every beat
         below is on that tightened timeline.

         Stripped back on review to: Sean, the three questions, the workbook
         b-roll on the closing line, and the end card. The cost stack, count-up
         tiles, discount contrast and the 4-item checklist were all cut, so no
         workbook figures appear on screen any more.

         The bottom --safe-bottom band is deliberately kept empty for subtitles
         to be added later — no element is drawn inside it in any scene.
         ===================================================================== -->
    <div id="root"
         data-composition-id="ecomiq-black-friday"
         data-start="0" data-duration="39"
         data-width="1080" data-height="1920" data-fps="30">

      <div id="bg" class="clip" data-start="0" data-duration="39" data-track-index="0"></div>

      <!-- A-roll: never gets class="clip" (rule 2) and stays muted (rule 5). -->
      <div id="aroll-wrap">
        <video id="aroll" src="assets/aroll-916.mp4" muted
               data-start="0" data-duration="35.5" data-track-index="1"></video>
      </div>

      <!-- Sean's voice — every word, with the silences between them removed. -->
      <audio id="vo" src="assets/aroll-audio.m4a"
             data-start="0" data-duration="35.5" data-track-index="2"></audio>

      <!-- Duckable music bed. Silent placeholder — drop a licensed track in at
           the same path. Ducking is baked into the element volume below. -->
      <audio id="music" src="assets/music-bed-placeholder.m4a"
             data-start="0" data-duration="39" data-track-index="3"></audio>

      <!-- S2 · 5.12–14.90 · the three questions, one landing as Sean asks it. -->
      <div id="panel-q" class="panel clip" data-start="5.12" data-duration="9.78" data-track-index="4">
        <div class="panel-inner" id="q-inner">
          <div class="eyebrow">Ask yourself</div>
          <div class="panel-rule"></div>
          <div class="q-row" id="q1"><div class="q-in">
            <div class="q-n">1</div>
            <div class="q-t">How much do you want to make from an order?</div>
          </div></div>
          <div class="q-row" id="q2"><div class="q-in">
            <div class="q-n">2</div>
            <div class="q-t">How much can you afford to spend to get that order?</div>
          </div></div>
          <div class="q-row" id="q3"><div class="q-in">
            <div class="q-n">3</div>
            <div class="q-t">How far can you discount before that sale stops being worthwhile?</div>
          </div></div>
        </div>
      </div>

      <!-- S3 · 30.42–34.40 · workbook b-roll: the cover itself, under
           "We've put the full process into a free Black Friday workbook." -->
      <div id="broll-b-wrap" class="broll-wrap">
        <video id="broll-b" src="assets/broll-b-916.mp4" muted
               data-start="30.42" data-duration="3.98" data-track-index="5"></video>
      </div>

      <!-- S4 · 34.40–39.00 · end card. Lands on "Link is below" (34.55),
           Sean's audio finishes over it at 35.36, then it holds to the end. -->
      <div id="endcard" class="card clip" data-start="34.4" data-duration="4.6" data-track-index="6">
        <div id="ec-bloom"></div>
        <img id="ec-logo" src="assets/ecomiq-logo-white.png" alt="EcomIQ" />
        <div id="ec-eyebrow">Free workbook</div>
        <div id="ec-head">Get your <span class="em">free</span><br />Black Friday workbook</div>
        <div id="ec-sub">Plan your numbers before you build the ad.</div>
        <div id="ec-pill">Sign up free</div>
      </div>

      <!-- Persistent mark — top-left on every frame. Non-`clip` positioned
           wrapper so it never drifts (LESSONS.md). -->
      <div id="logo-wrap"><img src="assets/ecomiq-logo-white.svg" alt="EcomIQ" /></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ---- audio mix -------------------------------------------------------
         Sean sits at unity. The bed stays under the voice and lifts once he
         finishes, so the end card is not silent. */
      gsap.set('#music', { volume: 0.16 });
      tl.to('#music', { volume: 0.42, duration: 0.9, ease: 'sine.out' }, 35.20);

      /* ---- S2 · the three questions -----------------------------------------
         Each row animates its height from 0, so the bottom-anchored panel grows
         upward question by question instead of reserving empty space. */
      tl.fromTo('#q-inner', { opacity: 0, y: 60 },
               { opacity: 1, y: 0, duration: .42, ease: 'power3.out' }, 5.12)
        .fromTo('#panel-q .panel-rule', { scaleX: 0 },
               { scaleX: 1, duration: .38, ease: 'power3.out' }, 5.28);
      [['#q1', 5.12], ['#q2', 7.85], ['#q3', 10.43]].forEach(([sel, t]) => {
        tl.fromTo(sel, { height: 0, opacity: 0 },
                 { height: 'auto', opacity: 1, duration: .42, ease: 'power3.out' }, t)
          .fromTo(sel + ' .q-n', { scale: .6 },
                 { scale: 1, duration: .44, ease: 'back.out(2.4)' }, t + .06);
      });
      tl.to('#q-inner', { opacity: 0, y: -26, duration: .30, ease: 'power2.in' }, 14.60)
        .set('#q-inner', { opacity: 0 }, 14.90);

      /* ---- S3 · workbook b-roll ---------------------------------------------
         tl.set at 0 gives the wrapper a stable baseline, so a seek to any point
         before the fade-in can't inherit a stale opacity. */
      tl.set('#broll-b-wrap', { opacity: 0 }, 0)
        .to('#broll-b-wrap', { opacity: 1, duration: .30, ease: 'power2.out' }, 30.42)
        .to('#broll-b-wrap', { opacity: 0, duration: .30, ease: 'power2.in' }, 34.18)
        .set('#broll-b-wrap', { opacity: 0 }, 34.40);

      /* ---- S4 · end card ---------------------------------------------------------- */
      tl.fromTo('#endcard', { opacity: 0 },
               { opacity: 1, duration: .32, ease: 'power2.out' }, 34.40)
        .fromTo('#ec-logo', { opacity: 0, y: -22 },
               { opacity: 1, y: 0, duration: .42, ease: 'power3.out' }, 34.50)
        .fromTo('#ec-eyebrow', { opacity: 0, y: 16 },
               { opacity: 1, y: 0, duration: .38, ease: 'power2.out' }, 34.62)
        .fromTo('#ec-head', { opacity: 0, y: 34 },
               { opacity: 1, y: 0, duration: .52, ease: 'power3.out' }, 34.72)
        .fromTo('#ec-sub', { opacity: 0, y: 20 },
               { opacity: 1, y: 0, duration: .42, ease: 'power2.out' }, 35.06)
        .fromTo('#ec-pill', { opacity: 0, scale: .84 },
               { opacity: 1, scale: 1, duration: .48, ease: 'back.out(1.8)' }, 35.26)
        /* soft breathe so the CTA stays alive through the hold */
        .to('#ec-pill', { scale: 1.035, duration: .85, ease: 'sine.inOut',
                          yoyo: true, repeat: 2 }, 36.10)
        /* the persistent mark steps back so the hero lockup leads the card */
        .to('#logo-wrap', { opacity: .30, duration: .42, ease: 'sine.out' }, 34.48);

      /* Duration is the contract (rule 7): pin the timeline to exactly 39.0s. */
      tl.set({}, {}, 39);
      window.__timelines['ecomiq-black-friday'] = tl;
    </script>
  </body>
</html>
