<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Black Friday — start now</title>
    <!-- GSAP vendored locally — CDN cert-fails in the render env and freezes renders -->
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      @font-face {
        font-family: "Rethink Sans";
        font-style: normal;
        font-weight: 400 800;
        font-display: block;
        src: url(assets/fonts/RethinkSans.woff2) format("woff2");
      }
      @font-face {
        font-family: "Hedvig Letters Serif";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url(assets/fonts/HedvigLettersSerif.woff2) format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #06284c;
        font-family: "Rethink Sans", system-ui, sans-serif;
        color: #ffffff;
      }
      .layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
      }

      /* ── Face ──────────────────────────────────────────────────────────────
         The wrapper is the source's native landscape size. GSAP animates the
         WRAPPER — animating the <video> element itself freezes frames. */
      #face-wrapper {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        transform-origin: 0 0;
        z-index: 5;
        overflow: hidden;
      }
      #face-zoom {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      #face-video {
        display: block;
        width: 1920px;
        height: 1080px;
        object-fit: cover;
        filter: contrast(1.08) saturate(1.06) brightness(0.97);
      }
      /* Side vignette so the face sinks into the navy instead of butting a hard edge */
      #face-vig {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(78% 82% at 50% 46%, rgba(6, 40, 76, 0) 52%, rgba(6, 40, 76, 0.72) 100%);
      }

      /* ── Seam: feathers the top edge of the face in BOTTOM mode ───────────── */
      #seam {
        position: absolute;
        left: 0;
        top: 1082px;
        width: 1080px;
        height: 190px;
        z-index: 6;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(6, 40, 76, 1) 0%, rgba(6, 40, 76, 0.86) 18%, rgba(6, 40, 76, 0) 100%);
      }
      #seam-line {
        position: absolute;
        left: 0;
        top: 1104px;
        width: 1080px;
        height: 2px;
        z-index: 6;
        pointer-events: none;
        background: linear-gradient(90deg, rgba(156, 212, 255, 0) 0%, rgba(156, 212, 255, 0.55) 50%, rgba(156, 212, 255, 0) 100%);
        box-shadow: 0 0 18px rgba(156, 212, 255, 0.45);
      }

      #grade {
        position: absolute;
        inset: 0;
        z-index: 40;
        pointer-events: none;
        background: radial-gradient(74% 70% at 50% 44%, rgba(2, 14, 28, 0) 46%, rgba(2, 14, 28, 0.62) 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="bf-start-now"
      data-start="0"
      data-duration="24.9"
      data-width="1080"
      data-height="1920"
    >
      <!-- Ambient background, always on, under everything -->
      <div class="layer" id="beat-bg" style="z-index: 1"
        data-composition-id="ambient-bg"
        data-composition-src="compositions/ambient-bg.html"
        data-start="0" data-duration="24.9" data-track-index="3"
        data-width="1080" data-height="1920"></div>

      <!-- Talking head -->
      <div id="face-wrapper">
        <div id="face-zoom">
          <video id="face-video" src="assets/vo.mp4" muted playsinline
            data-start="0" data-duration="24.9" data-track-index="0"></video>
        </div>
        <div id="face-vig"></div>
      </div>
      <audio id="face-audio" src="assets/vo.mp4"
        data-start="0" data-duration="24.9" data-track-index="8" data-volume="1"></audio>

      <div id="seam"></div>
      <div id="seam-line"></div>

      <!-- Scene overlays, back to back on one track -->
      <div class="layer" id="beat-s1" style="z-index: 10"
        data-composition-id="s1-numbers" data-composition-src="compositions/s1-numbers.html"
        data-start="0" data-duration="3.84" data-track-index="1"
        data-width="1080" data-height="1920"></div>
      <div class="layer" id="beat-s2" style="z-index: 10"
        data-composition-id="s2-offer" data-composition-src="compositions/s2-offer.html"
        data-start="3.84" data-duration="3.12" data-track-index="1"
        data-width="1080" data-height="1920"></div>
      <div class="layer" id="beat-s3" style="z-index: 10"
        data-composition-id="s3-stock-ads" data-composition-src="compositions/s3-stock-ads.html"
        data-start="6.96" data-duration="4.16" data-track-index="1"
        data-width="1080" data-height="1920"></div>
      <div class="layer" id="beat-s4" style="z-index: 10"
        data-composition-id="s4-start-now" data-composition-src="compositions/s4-start-now.html"
        data-start="11.12" data-duration="2.96" data-track-index="1"
        data-width="1080" data-height="1920"></div>
      <div class="layer" id="beat-s5" style="z-index: 10"
        data-composition-id="s5-drain" data-composition-src="compositions/s5-drain.html"
        data-start="14.08" data-duration="4.16" data-track-index="1"
        data-width="1080" data-height="1920"></div>
      <div class="layer" id="beat-s6" style="z-index: 10"
        data-composition-id="s6-workbook" data-composition-src="compositions/s6-workbook.html"
        data-start="18.24" data-duration="4.88" data-track-index="1"
        data-width="1080" data-height="1920"></div>
      <div class="layer" id="beat-s7" style="z-index: 10"
        data-composition-id="s7-cta" data-composition-src="compositions/s7-cta.html"
        data-start="23.12" data-duration="1.78" data-track-index="1"
        data-width="1080" data-height="1920"></div>

      <!-- Karaoke captions, above the scenes -->
      <div class="layer" id="beat-caps" style="z-index: 20"
        data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="24.9" data-track-index="2"
        data-width="1080" data-height="1920"></div>

      <div id="grade"></div>
    </div>

    <script>
      (() => {
        window.__timelines = window.__timelines || {};
        const DUR = 24.9;
        const tl = gsap.timeline({ paused: true });

        // ── Face-mode choreography ─────────────────────────────────────────
        // BOTTOM crops 180px each side of the 1920-wide source and bottom-
        // anchors it, so the speaker fills the lower third instead of sitting
        // in a band of empty studio.
        const BOTTOM = { x: -180, y: 1110, scale: 0.75 };
        const FULL = { x: -1166.5, y: 0, scale: 1.7778 };

        gsap.set("#face-wrapper", FULL);

        // Each entry carries its own duration so a hero change can run longer.
        [
          { t: 1.15, mode: BOTTOM, dur: 0.5 },   // hook lands, drop to the lower third
          { t: 10.84, mode: FULL, dur: 0.5 },    // "start now" — push in on the face
          { t: 13.93, mode: BOTTOM, dur: 0.45 }, // back down for the drain scene
        ].forEach(({ t, mode, dur }) => {
          tl.to("#face-wrapper", { ...mode, duration: dur, ease: "expo.inOut" }, t);
        });

        // The seam only belongs to BOTTOM scenes — hide it while fullscreen.
        tl.to("#seam, #seam-line", { opacity: 0, duration: 0.3, ease: "power2.in" }, 10.84);
        tl.to("#seam, #seam-line", { opacity: 1, duration: 0.3, ease: "power2.out" }, 14.0);
        tl.fromTo("#seam, #seam-line", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.3);

        // Ken Burns on the face for the whole runtime.
        tl.fromTo("#face-zoom", { scale: 1 }, { scale: 1.03, duration: DUR, ease: "none" }, 0);

        tl.to({}, { duration: DUR }, 0); // Law #11 anchor
        window.__timelines["bf-start-now"] = tl;
      })();
    </script>
  </body>
</html>
