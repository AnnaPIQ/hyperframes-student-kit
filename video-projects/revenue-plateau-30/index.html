<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>revenue-plateau-30</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      @font-face { font-family: 'Hedvig Letters Serif'; font-style: normal; font-weight: 400;
        font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1350px; overflow: hidden;
        background: #06284C; font-family: 'Rethink Sans', system-ui, sans-serif; color: #fff; }

      #vidwrap { position: absolute; inset: 0; z-index: 0; background: #06284C; overflow: hidden; transform-origin: 50% 42%; }
      #face { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; }
      #seanscrim { position: absolute; inset: auto 0 0 0; height: 420px; z-index: 2;
        background: linear-gradient(0deg, rgba(4,24,48,.55) 0%, rgba(4,24,48,0) 100%); }

      .mgscene { position: absolute; inset: 0; z-index: 10; opacity: 0;
        background: radial-gradient(92% 52% at 50% 28%, rgba(156,212,255,.10) 0%, rgba(6,40,76,0) 60%), #06284C;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 250px 90px 320px; text-align: center; }
      .mg-bloom { position: absolute; left: -10%; bottom: -20%; width: 120%; height: 55%;
        background: var(--brand-gradient-2); filter: blur(90px); opacity: .26; }
      #mglogo { position: absolute; top: 54px; left: 64px; width: 230px; height: auto; z-index: 11; opacity: 0;
        filter: drop-shadow(0 4px 18px rgba(0,0,0,.45)); }
      .mg-eyebrow { font-weight: 700; font-size: 28px; letter-spacing: .28em; text-transform: uppercase;
        color: var(--brand-blue-tint); margin-bottom: 60px; opacity: 0; }

      .hook-eb { opacity: 0; font-weight: 700; font-size: 30px; letter-spacing: .28em; text-transform: uppercase;
        color: var(--brand-blue-tint); margin-bottom: 36px; }
      .hook-h1 { opacity: 0; font-weight: 800; font-size: 118px; line-height: .98; letter-spacing: -.03em; color: #fff; }
      .hook-h2 { opacity: 0; font-weight: 800; font-size: 118px; line-height: 1.0; letter-spacing: -.03em; color: #fff; }

      #progtrack { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; z-index: 22; background: rgba(156,212,255,.14); }
      #progbar { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: left center;
        background: var(--brand-flame); box-shadow: 0 0 16px rgba(255,76,50,.6); }

      /* do-more kinetic words */
      .morelist { display: flex; flex-direction: column; align-items: center; gap: 20px; }
      .mword { opacity: 0; font-weight: 800; font-size: 78px; letter-spacing: -.02em; color: #fff; }
      .mword b { color: var(--brand-flame); font-weight: 800; }

      /* same-number flat-line */
      #sn-num { opacity: 0; font-weight: 800; font-size: 168px; line-height: .95; letter-spacing: -.03em; color: #fff;
        font-variant-numeric: tabular-nums; margin-bottom: 40px; }
      .snwrap { position: relative; width: 720px; height: 130px; }
      .snwrap svg { width: 100%; height: 100%; overflow: visible; display: block; }
      #sn-line { fill: none; stroke: #9CD4FF; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round;
        filter: drop-shadow(0 0 10px rgba(156,212,255,.5)); }
      #sn-months { display: flex; gap: 16px; margin-top: 44px; }
      #sn-months .m { opacity: 0; width: 78px; height: 12px; border-radius: 6px; background: var(--brand-text-dim); }

      /* CTA card */
      #cta { position: absolute; inset: 0; z-index: 20; opacity: 0; text-align: center;
        background: radial-gradient(90% 55% at 50% 22%, rgba(156,212,255,.12) 0%, rgba(6,40,76,0) 58%), #06284C; }
      #cta-bloom { position: absolute; left: -10%; bottom: -22%; width: 120%; height: 60%; background: var(--brand-gradient-2); filter: blur(90px); opacity: .34; }
      #cta-logo { position: absolute; top: 172px; left: 0; right: 0; margin: 0 auto; width: 360px; height: auto; opacity: 0; display: block; }
      #cta-rule { position: absolute; top: 468px; left: 0; right: 0; margin: 0 auto; width: 120px; height: 6px; border-radius: 3px; background: var(--brand-flame); transform-origin: center; }
      #cta-stage { position: absolute; left: 90px; right: 90px; top: 512px; }
      #cta-eyebrow { opacity: 0; font-weight: 700; font-size: 26px; letter-spacing: .32em; text-transform: uppercase; color: var(--brand-blue-tint); margin-bottom: 28px; }
      #cta-head { font-size: 112px; font-weight: 800; line-height: .98; letter-spacing: -.03em; color: #fff; }
      #cta-sub { opacity: 0; margin: 34px auto 0; font-weight: 500; font-size: 37px; line-height: 1.34; color: var(--brand-text-dim); max-width: 720px; }
      #cta-pillwrap { position: absolute; left: 0; right: 0; bottom: 320px; display: flex; justify-content: center; }
      #cta-pill { opacity: 0; display: inline-flex; align-items: center; gap: 18px; font-weight: 700; font-size: 40px; color: #fff;
        background: var(--brand-flame); padding: 32px 60px; border-radius: 999px; box-shadow: 0 22px 70px -16px rgba(255,76,50,.65); }
      #cta-pill .arrow { font-size: 42px; line-height: 1; transform: translateY(-1px); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="revenue-plateau-30" data-start="0" data-duration="40.54"
         data-width="1080" data-height="1350">

      <div id="vidwrap">
        <video id="face" src="assets/raw30.mp4" muted playsinline data-start="0" data-duration="40.54" data-track-index="0"></video>
      </div>
      <audio id="aud" src="assets/raw30.mp4" data-start="0" data-duration="40.54" data-track-index="1" data-volume="1"></audio>
      <div id="seanscrim" class="clip" data-start="0" data-duration="40.54" data-track-index="3"></div>
      <img id="mglogo" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />

      <!-- OPENING HOOK CARD 0–2.6 -->
      <div class="mgscene clip" id="mgHook" data-start="0" data-duration="40.54" data-track-index="9">
        <div class="mg-bloom"></div>
        <div class="hook-eb" id="hk-eb">For Shopify brands</div>
        <div class="hook-h1" id="hk-h1">Revenue flat.</div>
        <div class="hook-h2" id="hk-h2">For months?</div>
      </div>

      <!-- DO-MORE 15.0–18.75 -->
      <div class="mgscene clip" id="mgMore" data-start="0" data-duration="40.54" data-track-index="11">
        <div class="mg-bloom"></div>
        <div class="mg-eyebrow">Doing more isn't the fix</div>
        <div class="morelist">
          <div class="mword" id="mw1"><b>More</b> ads</div>
          <div class="mword" id="mw2"><b>More</b> emails</div>
          <div class="mword" id="mw3"><b>More</b> products</div>
          <div class="mword" id="mw4"><b>More</b> marketing</div>
        </div>
      </div>

      <!-- SAME NUMBER 24.5–31.2 -->
      <div class="mgscene clip" id="mgSame" data-start="0" data-duration="40.54" data-track-index="13">
        <div class="mg-bloom"></div>
        <div class="mg-eyebrow">Same number, every month</div>
        <div id="sn-num">$48,200</div>
        <div class="snwrap">
          <svg viewBox="0 0 720 130" preserveAspectRatio="none">
            <path id="sn-line" d="M20,80 L140,78 L260,81 L380,79 L500,80 L620,78 L700,80" />
          </svg>
        </div>
        <div id="sn-months"><div class="m"></div><div class="m"></div><div class="m"></div><div class="m"></div><div class="m"></div><div class="m"></div></div>
      </div>

      <!-- CTA CARD 35.5–40.54 -->
      <div id="cta" class="clip" data-start="0" data-duration="40.54" data-track-index="20">
        <div id="cta-bloom"></div>
        <img id="cta-logo" src="assets/ecomiq-logo-white.png" alt="EcomIQ" />
        <div id="cta-rule"></div>
        <div id="cta-stage">
          <div id="cta-eyebrow">For Shopify brands</div>
          <div id="cta-head">Break the <span class="plateau">plateau.</span></div>
          <div id="cta-sub">We find the bottleneck holding your store back &mdash; and the plan to grow past it.</div>
        </div>
        <div id="cta-pillwrap"><div id="cta-pill">Learn how we help <span class="arrow">&rarr;</span></div></div>
      </div>

      <div id="progtrack"><div id="progbar"></div></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const SLOT = 40.54;
      const tl = gsap.timeline({ paused: true });

      function cut(sel, tIn, tOut) {
        tl.set(sel, { opacity: 1 }, tIn);
        tl.set(sel, { opacity: 0 }, tOut);
        tl.set("#mglogo", { opacity: 1 }, tIn);
        tl.set("#mglogo", { opacity: 0 }, tOut);
      }

      tl.fromTo("#progbar", { scaleX: 0 }, { scaleX: 1, duration: SLOT, ease: "none" }, 0);

      /* === OPENING CARD 0–2.6 === */
      cut("#mgHook", 0.0, 2.6);
      tl.fromTo("#hk-eb", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.2);
      tl.fromTo("#hk-h1", { opacity: 0, y: 26, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.4);
      tl.fromTo("#hk-h2", { opacity: 0, y: 26, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.72);

      /* === SEAN 2.6–15.0 (hook + "most founders...do more") === */

      /* === DO-MORE 15.0–18.75 (hides the S1->S2 & S2->S3 splices) === */
      cut("#mgMore", 15.0, 18.75);
      tl.fromTo("#mgMore .mg-eyebrow", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35 }, 15.05);
      var mwT = [15.1, 16.9, 17.55, 18.0]; // ads / emails / products / marketing
      ["#mw1", "#mw2", "#mw3", "#mw4"].forEach(function (w, i) {
        tl.fromTo(w, { opacity: 0, scale: 1.28, filter: "blur(10px)" },
                  { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.28, ease: "power3.out", overwrite: "auto" }, mwT[i]);
      });

      /* === SEAN 18.75–24.5 ("it's a system" + "work harder than ever") ===
             punch-in masks the S3->S4 splice at 21.06 (jump-cut to a tighter frame) */
      tl.set("#vidwrap", { scale: 1.055 }, 21.06);
      tl.set("#vidwrap", { scale: 1.0 }, 24.45);

      /* === SAME NUMBER 24.5–31.2 ("same revenue number month after month") — hides S4->S5 splice === */
      cut("#mgSame", 24.5, 31.2);
      gsap.set("#sn-line", { strokeDasharray: 1000 });
      tl.fromTo("#mgSame .mg-eyebrow", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35 }, 24.6);
      tl.fromTo("#sn-num", { opacity: 0, y: 24, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.3)" }, 24.75);
      tl.fromTo("#sn-line", { strokeDashoffset: 1000 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, 25.2);
      tl.fromTo("#sn-months .m", { opacity: 0 }, { opacity: 1, duration: 0.15, stagger: 0.12, ease: "steps(1)" }, 26.6);
      tl.to("#sn-months .m", { opacity: 0.3, duration: 0.26, yoyo: true, repeat: 3, ease: "steps(1)" }, 28.0);

      /* === SEAN 31.2–35.5 ("if your revenue's been stuck, let's find out what's causing it") === */

      /* === CTA CARD 35.5–40.54 ("click the link below...") === */
      tl.set("#cta", { opacity: 1 }, 35.5);
      tl.fromTo("#cta-logo", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 35.7);
      tl.fromTo("#cta-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, 36.0);
      tl.fromTo("#cta-eyebrow", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 36.1);
      tl.fromTo("#cta-head", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 36.25);
      tl.fromTo("#cta-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 36.7);
      tl.fromTo("#cta-pill", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, 37.1);
      tl.to("#cta-pill", { scale: 1.04, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 3 }, 38.1);

      tl.to({}, { duration: SLOT }, 0);
      window.__timelines["revenue-plateau-30"] = tl;
    </script>
  </body>
</html>
