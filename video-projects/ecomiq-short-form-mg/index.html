<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ecomiq-short-form-mg</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      @font-face { font-family: 'Hedvig Letters Serif'; font-style: normal; font-weight: 400;
        font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: var(--brand-navy);
        font-family: 'Rethink Sans', system-ui, sans-serif; color: var(--brand-white);
      }

      /* ---------- Base talking head ---------- */
      #face-wrapper { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; overflow: hidden; z-index: 0; }
      #face-video {
        display: block; width: 100%; height: 100%; object-fit: cover;
        transform-origin: center center;
        filter: contrast(1.06) saturate(1.06) brightness(0.995);
      }
      #overlay {
        position: absolute; inset: 0; pointer-events: none; z-index: 2;
        background:
          linear-gradient(180deg, rgba(4,16,34,0.55) 0%, rgba(4,16,34,0.16) 16%, rgba(4,16,34,0) 30%),
          radial-gradient(115% 60% at 8% 3%, rgba(6,28,54,0.55) 0%, rgba(6,28,54,0) 40%),
          radial-gradient(ellipse 92% 78% at 50% 48%, rgba(4,14,28,0) 60%, rgba(4,14,28,0.32) 100%);
      }
      #logo-wrap { position: absolute; top: 74px; left: 60px; width: 178px; z-index: 4; }
      #logo-corner { display: block; width: 100%; height: auto; filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5)); }

      /* ---------- Top captions (all-white, keyword just carries weight) ---------- */
      .mg { position: absolute; left: 0; right: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; }
      .mg-top { top: 210px; }
      .cap { max-width: 900px; padding: 22px 40px; border-radius: 26px;
        background: rgba(5,18,38,0.62); border: 1px solid rgba(156,212,255,0.16);
        box-shadow: 0 24px 60px -24px rgba(0,0,0,0.7); text-align: center; }
      .cap .line { font-weight: 800; font-size: 82px; line-height: 1.0; letter-spacing: -0.02em; color: var(--brand-white); }
      .cap .hot { color: var(--brand-white); }
      .cap .sub { display: block; margin-top: 10px; font-weight: 600; font-size: 40px; letter-spacing: 0.01em; color: var(--brand-text-dim); }
      /* flame pill banner ("FREE PROFITABILITY BOOTCAMP") */
      .pill { font-weight: 800; font-size: 46px; letter-spacing: 0.01em; text-transform: uppercase;
        color: #fff; background: var(--brand-flame); padding: 26px 48px; border-radius: 22px;
        box-shadow: 0 24px 64px -18px rgba(255,76,50,0.85); text-align: center; white-space: nowrap; }

      /* ---------- Full-screen chart beat ---------- */
      #graph {
        position: absolute; inset: 0; z-index: 7;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
        padding: 70px 58px; text-align: center;
        background:
          radial-gradient(120% 66% at 50% 24%, rgba(156,212,255,0.10) 0%, rgba(6,40,76,0) 55%),
          var(--brand-navy);
      }
      #graph .g-vig { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 80% 66% at 50% 46%, transparent 54%, rgba(3,12,26,0.62) 100%); }
      #graph .g-grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.5;
        background: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px) 0 0/3px 3px,
                    radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px) 1px 2px/5px 5px; }
      .g-title { position: relative; font-weight: 800; font-size: 60px; letter-spacing: -0.02em; color: var(--brand-white); }
      .g-title .dim { color: var(--brand-text-dim); font-weight: 700; }
      .g-chart { position: relative; width: 960px; }
      .g-legend { position: relative; display: flex; gap: 34px; justify-content: center; }
      .g-leg { display: inline-flex; align-items: center; gap: 14px; font-weight: 700; font-size: 34px; color: var(--brand-white); }
      .g-leg .sw { width: 30px; height: 30px; border-radius: 8px; }
      .g-leg.rep .sw { background: var(--brand-blue-tint); }
      .g-leg.act .sw { background: var(--brand-flame); }
      .g-leg .muted { color: var(--brand-text-dim); font-weight: 600; }
      /* svg line-draw */
      .draw { stroke-dasharray: 1; stroke-dashoffset: 1; }

      /* ---------- End card ---------- */
      #endcard {
        position: absolute; inset: 0; z-index: 10; overflow: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 36px; padding: 8%; text-align: center;
        background:
          radial-gradient(120% 70% at 50% 22%, rgba(156,212,255,0.14) 0%, rgba(6,40,76,0) 55%),
          var(--brand-navy);
      }
      .ec-particle { position: absolute; border-radius: 50%; z-index: 0; }
      #ec-logo { width: 470px; height: auto; display: block; position: relative; z-index: 1; }
      #ec-line { font-weight: 800; font-size: 62px; line-height: 1.04; letter-spacing: -0.02em; color: var(--brand-white); max-width: 88%; position: relative; z-index: 1; }
      #ec-div { width: 76px; height: 5px; border-radius: 3px; background: var(--brand-flame); position: relative; z-index: 1; }
      #ec-cta {
        margin-top: 6px; font-weight: 700; font-size: 42px; color: var(--brand-white);
        background: var(--brand-flame); padding: 32px 70px; border-radius: 999px;
        display: inline-flex; align-items: center; gap: 18px; white-space: nowrap; position: relative; z-index: 1;
        box-shadow: 0 24px 74px -18px rgba(255,76,50,0.85);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="ecomiq-short-form-mg" data-start="0" data-duration="34" data-width="1080" data-height="1920">
      <!-- Base talking head -->
      <div id="face-wrapper">
        <video id="face-video" data-start="0" data-duration="33.10" data-track-index="0" src="assets/face-short.mp4" muted playsinline></video>
      </div>
      <audio id="face-audio" data-start="0" data-duration="33.10" data-track-index="1" data-volume="1" src="assets/face-short-audio.m4a"></audio>
      <div id="overlay" class="clip" data-start="0" data-duration="33.10" data-track-index="2"></div>
      <div id="logo-wrap">
        <img id="logo-corner" class="clip" data-start="0" data-duration="33.10" data-track-index="3" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
      </div>

      <!-- B1 — "the biggest trap" (1.4) -->
      <div id="b1" class="mg mg-top clip" data-start="1.4" data-duration="2.8" data-track-index="5">
        <div class="cap"><div class="line">The biggest <span class="hot">trap</span></div></div>
      </div>

      <!-- B2 — "lose money on the first order" (8.4) -->
      <div id="b2" class="mg mg-top clip" data-start="8.4" data-duration="2.7" data-track-index="6">
        <div class="cap"><div class="line">You <span class="hot">lose money</span><span class="sub">on the first order</span></div></div>
      </div>

      <!-- B3 — FULL-SCREEN animated chart: reported vs. actual (11.0) -->
      <div id="graph" class="clip" data-start="11.0" data-duration="5.2" data-track-index="7">
        <div class="g-vig"></div>
        <div class="g-title" id="g-title">What your dashboard shows<span class="dim" id="g-title2"> — vs. what you keep</span></div>
        <div class="g-chart">
          <svg viewBox="0 0 1000 560" width="100%" xmlns="http://www.w3.org/2000/svg">
            <!-- gridlines -->
            <g stroke="rgba(156,212,255,0.12)" stroke-width="2">
              <line x1="70" y1="70"  x2="965" y2="70"/>
              <line x1="70" y1="180" x2="965" y2="180"/>
              <line x1="70" y1="400" x2="965" y2="400"/>
              <line x1="70" y1="500" x2="965" y2="500"/>
            </g>
            <!-- break-even (zero) line -->
            <line id="g-zero" x1="70" y1="290" x2="965" y2="290" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-dasharray="10 12"/>
            <text x="78" y="278" fill="rgba(255,255,255,0.65)" font-family="Rethink Sans" font-weight="700" font-size="26">Break-even</text>
            <!-- red loss area under the actual curve -->
            <path id="g-area" d="M70,290 L249,330 L428,392 L607,452 L786,506 L965,540 L965,560 L70,560 Z"
                  fill="rgba(255,76,50,0.18)" opacity="0"/>
            <!-- reported line (blue, rises) -->
            <polyline id="g-rep" class="draw" points="70,290 249,236 428,196 607,160 786,128 965,104"
                      fill="none" stroke="#9CD4FF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
            <!-- actual line (flame, dives below zero) -->
            <polyline id="g-act" class="draw" points="70,290 249,330 428,392 607,452 786,506 965,540"
                      fill="none" stroke="#FF4C32" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
            <!-- end marker on the actual line -->
            <circle id="g-dot" cx="965" cy="540" r="14" fill="#FF4C32" opacity="0"/>
          </svg>
        </div>
        <div class="g-legend">
          <div class="g-leg rep" id="g-leg-rep"><span class="sw"></span>Reported</div>
          <div class="g-leg act" id="g-leg-act"><span class="sw"></span>Actual <span class="muted">&nbsp;after hidden costs</span></div>
        </div>
      </div>

      <!-- B4 — "the true cost to acquire" (16.4) -->
      <div id="b4" class="mg mg-top clip" data-start="16.4" data-duration="4.0" data-track-index="8">
        <div class="cap"><div class="line">The <span class="hot">true cost</span><span class="sub">to acquire a customer</span></div></div>
      </div>

      <!-- B5 — flame pill above head when he says "free profitability bootcamp" (28.8) -->
      <div id="b5" class="mg clip" data-start="28.6" data-duration="1.9" data-track-index="9" style="top:180px;">
        <div class="pill" id="b5-pill">Free Profitability Bootcamp</div>
      </div>

      <!-- End card -->
      <div id="endcard" class="clip" data-start="30.3" data-duration="3.7" data-track-index="11">
        <div class="ec-particle" data-p style="left:14%; top:30%; width:12px; height:12px; background:rgba(156,212,255,0.5);"></div>
        <div class="ec-particle" data-p style="left:82%; top:24%; width:9px; height:9px; background:rgba(255,76,50,0.55);"></div>
        <div class="ec-particle" data-p style="left:24%; top:70%; width:8px; height:8px; background:rgba(156,212,255,0.4);"></div>
        <div class="ec-particle" data-p style="left:76%; top:74%; width:12px; height:12px; background:rgba(156,212,255,0.35);"></div>
        <div class="ec-particle" data-p style="left:50%; top:82%; width:8px; height:8px; background:rgba(255,76,50,0.45);"></div>
        <div class="ec-particle" data-p style="left:64%; top:16%; width:7px; height:7px; background:rgba(156,212,255,0.4);"></div>
        <img id="ec-logo" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
        <div id="ec-line">Free Profitability Bootcamp</div>
        <div id="ec-div"></div>
        <div id="ec-cta">Join now</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const POP = "back.out(1.7)";

      tl.fromTo("#face-video", { scale: 1.0 }, { scale: 1.02, duration: 33.10, ease: "none" }, 0);
      tl.fromTo("#logo-corner", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.35);

      function cap(sel, tIn, tOut) {
        tl.fromTo(sel + " .cap", { opacity: 0, y: -26, scale: 0.94 },
          { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: POP }, tIn);
        tl.to(sel + " .cap", { opacity: 0, y: -22, duration: 0.3, ease: "power2.in" }, tOut);
      }

      // B1 — "the biggest trap"
      cap("#b1", 1.5, 3.9);
      // B2 — "lose money"
      cap("#b2", 8.6, 10.75);
      // B4 — "true cost to acquire"
      cap("#b4", 16.6, 20.05);

      // B5 — flame pill "FREE PROFITABILITY BOOTCAMP" above head as he says it (~28.78)
      tl.fromTo("#b5-pill", { opacity: 0, y: -24, scale: 0.9 },
        { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: POP }, 28.8);
      tl.to("#b5-pill", { opacity: 0, y: -18, duration: 0.28, ease: "power2.in" }, 30.15);

      // ---------- B3 — full-screen chart (11.0 -> 16.2) ----------
      tl.fromTo("#graph", { opacity: 0, filter: "blur(24px)", scale: 1.05 },
        { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.4, ease: "power2.out" }, 11.05);
      tl.fromTo("#g-title", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 11.2);
      tl.set("#g-title2", { opacity: 0 }, 11.2);
      // reported line rises (dashboard looks great)
      tl.fromTo("#g-leg-rep", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 11.5);
      tl.fromTo("#g-rep", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.5, ease: "power1.inOut" }, 11.55);
      // reveal the truth on "not accurate" (~14.04): actual line dives below break-even
      tl.to("#g-title2", { opacity: 1, duration: 0.4, ease: "power2.out" }, 13.6);
      tl.fromTo("#g-leg-act", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 13.7);
      tl.fromTo("#g-act", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.4, ease: "power2.in" }, 13.8);
      tl.fromTo("#g-area", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 14.4);
      tl.fromTo("#g-dot", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.4, ease: POP, transformOrigin: "center" }, 15.1);
      // exit back to face
      tl.to("#graph", { opacity: 0, filter: "blur(20px)", scale: 1.03, duration: 0.36, ease: "power2.in" }, 15.9);

      // ---------- End card ----------
      tl.fromTo("#endcard", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 30.3);
      tl.fromTo("#ec-logo", { opacity: 0, y: 26, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 30.6);
      tl.fromTo("#ec-line", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 30.9);
      tl.fromTo("#ec-div", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power2.out" }, 31.15);
      tl.fromTo("#ec-cta", { opacity: 0, y: 16, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.6)" }, 31.3);
      tl.fromTo("[data-p]", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out", stagger: 0.06 }, 30.5);
      tl.to("[data-p]", { y: -22, duration: 1.8, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: { each: 0.15, from: "random" } }, 31.0);

      tl.set({}, {}, 34.0);
      window.__timelines["ecomiq-short-form-mg"] = tl;
    </script>
  </body>
</html>
