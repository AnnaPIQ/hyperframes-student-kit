<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ecomiq-short-form-mg</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      @font-face { font-family: 'Hedvig Letters Serif'; font-style: normal; font-weight: 400;
        font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: var(--brand-navy);
        font-family: 'Rethink Sans', system-ui, sans-serif; color: var(--brand-white);
      }

      /* ---------- Base talking head ---------- */
      #face-wrapper { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; overflow: hidden; z-index: 0; }
      #face-video {
        display: block; width: 100%; height: 100%; object-fit: cover;
        transform-origin: center center;
        filter: contrast(1.06) saturate(1.06) brightness(0.995);
      }
      #overlay {
        position: absolute; inset: 0; pointer-events: none; z-index: 2;
        background:
          radial-gradient(115% 70% at 8% 3%, rgba(6,28,54,0.62) 0%, rgba(6,28,54,0.30) 20%, rgba(6,28,54,0) 42%),
          radial-gradient(ellipse 92% 78% at 50% 45%, rgba(4,14,28,0) 58%, rgba(4,14,28,0.34) 100%);
      }
      #logo-wrap { position: absolute; top: 74px; left: 60px; width: 196px; z-index: 3; }
      #logo-corner { display: block; width: 100%; height: auto; filter: drop-shadow(0 2px 10px rgba(0,0,0,0.45)); }

      /* ---------- Shared motion-graphic system ---------- */
      .mg { position: absolute; inset: 0; z-index: 6; overflow: hidden; }
      /* lower-third scrim so callout text always reads over the face */
      .mg-scrim {
        position: absolute; left: 0; right: 0; bottom: 0; height: 62%;
        background: linear-gradient(180deg, rgba(6,28,54,0) 0%, rgba(5,22,44,0.72) 55%, rgba(4,17,36,0.94) 100%);
      }
      .mg-lower { position: absolute; left: 84px; right: 84px; bottom: 250px; }
      .kicker {
        font-weight: 700; font-size: 34px; letter-spacing: 0.32em; text-transform: uppercase;
        color: var(--brand-blue-tint);
      }
      .kicker.flame { color: var(--brand-flame); }
      .headline {
        font-weight: 800; font-size: 150px; line-height: 0.92; letter-spacing: -0.03em;
        color: var(--brand-white); text-shadow: 0 6px 40px rgba(0,0,0,0.5);
      }
      .headline .em { font-family: 'Hedvig Letters Serif', Georgia, serif; font-style: italic; font-weight: 400; color: var(--brand-blue-tint); }
      .headline.flame { color: var(--brand-flame); text-shadow: 0 0 46px rgba(255,76,50,0.45), 0 6px 40px rgba(0,0,0,0.5); }
      .bar { height: 10px; border-radius: 6px; background: var(--brand-flame); transform-origin: left center; }
      .sub { font-weight: 600; font-size: 40px; color: var(--brand-text-dim); letter-spacing: -0.01em; }

      /* full-frame takeover card + unifying texture (grid + crosshairs + vignette + grain) */
      .mg-card {
        position: absolute; inset: 0; z-index: 7;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px;
        padding: 9%; text-align: center;
        background:
          radial-gradient(120% 68% at 50% 26%, rgba(156,212,255,0.10) 0%, rgba(6,40,76,0) 55%),
          var(--brand-navy);
      }
      .tex-grid {
        position: absolute; inset: 0; opacity: 0.5; pointer-events: none;
        background:
          repeating-linear-gradient(0deg,  rgba(156,212,255,0.06) 0 1px, transparent 1px 96px),
          repeating-linear-gradient(90deg, rgba(156,212,255,0.06) 0 1px, transparent 1px 96px);
        transform: perspective(1200px) rotateX(56deg) scale(1.6); transform-origin: 50% 82%;
      }
      .tex-vig { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 78% 66% at 50% 46%, transparent 52%, rgba(3,12,26,0.66) 100%); }
      .tex-grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.5;
        background:
          radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px) 0 0 / 3px 3px,
          radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px) 1px 2px / 5px 5px; }
      .chips { display: flex; gap: 22px; }
      .chip {
        font-weight: 700; font-size: 34px; letter-spacing: 0.06em;
        padding: 16px 34px; border-radius: 999px; color: var(--brand-white);
        border: 2px solid var(--brand-border); background: rgba(16,61,111,0.55);
      }
      .stamp {
        font-weight: 800; font-size: 176px; line-height: 0.9; letter-spacing: -0.035em;
        color: var(--brand-flame); text-shadow: 0 0 60px rgba(255,76,50,0.5);
      }
      .strike { height: 12px; width: 62%; border-radius: 8px; background: var(--brand-flame);
        transform-origin: left center; box-shadow: 0 0 30px rgba(255,76,50,0.6); }
      .card-kicker { font-weight: 700; font-size: 40px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--brand-text-dim); }

      /* ---------- End card ---------- */
      #endcard {
        position: absolute; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 36px; padding: 8%; text-align: center;
        background:
          radial-gradient(120% 70% at 50% 22%, rgba(156,212,255,0.12) 0%, rgba(6,40,76,0) 55%),
          var(--brand-navy);
      }
      #ec-logo { width: 470px; height: auto; display: block; }
      #ec-line { font-weight: 700; font-size: 54px; line-height: 1.05; letter-spacing: -0.01em; color: var(--brand-white); max-width: 88%; }
      #ec-cta {
        margin-top: 12px; font-weight: 700; font-size: 40px; color: var(--brand-white);
        background: var(--brand-flame); padding: 32px 68px; border-radius: 999px;
        display: inline-flex; align-items: center; gap: 18px; white-space: nowrap;
        box-shadow: 0 24px 74px -18px rgba(255,76,50,0.8);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="ecomiq-short-form-mg" data-start="0" data-duration="34" data-width="1080" data-height="1920">
      <!-- Base talking head -->
      <div id="face-wrapper">
        <video id="face-video" data-start="0" data-duration="33.10" data-track-index="0" src="assets/face-short.mp4" muted playsinline></video>
      </div>
      <audio id="face-audio" data-start="0" data-duration="33.10" data-track-index="1" data-volume="1" src="assets/face-short-audio.m4a"></audio>
      <div id="overlay" class="clip" data-start="0" data-duration="33.10" data-track-index="2"></div>
      <div id="logo-wrap">
        <img id="logo-corner" class="clip" data-start="0" data-duration="33.10" data-track-index="3" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
      </div>

      <!-- BEAT 1 — "THE BIGGEST TRAP" (lower-third) -->
      <div id="b1" class="mg clip" data-start="1.4" data-duration="2.7" data-track-index="5">
        <div class="mg-scrim" id="b1-scrim"></div>
        <div class="mg-lower">
          <div class="kicker flame" id="b1-kick">The biggest</div>
          <div class="headline flame" id="b1-head" style="font-size:220px; margin-top:6px;">TRAP</div>
          <div class="bar" id="b1-bar" style="width:340px; margin-top:14px;"></div>
        </div>
      </div>

      <!-- BEAT 2 — "LOSING MONEY on the first order" (lower-third) -->
      <div id="b2" class="mg clip" data-start="8.4" data-duration="3.0" data-track-index="6">
        <div class="mg-scrim" id="b2-scrim"></div>
        <div class="mg-lower">
          <div class="kicker flame" id="b2-kick">↓ On every first order</div>
          <div class="headline flame" id="b2-head" style="font-size:120px; margin-top:8px;">Losing money</div>
          <div class="bar" id="b2-bar" style="width:300px; margin-top:16px;"></div>
        </div>
      </div>

      <!-- BEAT 3 — "NOT ACCURATE" (full-frame takeover) -->
      <div id="b3" class="mg-card clip" data-start="13.7" data-duration="2.6" data-track-index="7">
        <div class="tex-grid" id="b3-grid"></div>
        <div class="tex-vig"></div>
        <div class="tex-grain"></div>
        <div class="chips" id="b3-chips" style="position:relative;">
          <div class="chip">Meta Ads</div>
          <div class="chip">Google Ads</div>
        </div>
        <div class="card-kicker" id="b3-kick" style="position:relative;">Your dashboard is</div>
        <div class="stamp" id="b3-stamp" style="position:relative; max-width:920px;">NOT ACCURATE</div>
        <div class="strike" id="b3-strike" style="position:relative;"></div>
      </div>

      <!-- BEAT 4 — "the TRUE COST to acquire" (lower-third) -->
      <div id="b4" class="mg clip" data-start="16.6" data-duration="3.6" data-track-index="8">
        <div class="mg-scrim" id="b4-scrim"></div>
        <div class="mg-lower">
          <div class="kicker" id="b4-kick">The number that matters</div>
          <div class="headline" id="b4-head" style="font-size:118px; margin-top:8px;">The <span class="em">true</span> cost<br/>to acquire</div>
          <div class="bar" id="b4-bar" style="width:300px; margin-top:18px; background:var(--brand-blue-tint);"></div>
        </div>
      </div>

      <!-- BEAT 5 — "fundamentally DOOMED" (full-frame slam) -->
      <div id="b5" class="mg-card clip" data-start="25.5" data-duration="2.5" data-track-index="9">
        <div class="tex-grid" id="b5-grid"></div>
        <div class="tex-vig"></div>
        <div class="tex-grain"></div>
        <div class="card-kicker" id="b5-kick" style="position:relative;">Get it wrong and you're</div>
        <div class="stamp" id="b5-stamp" style="position:relative; color:var(--brand-white); text-shadow:0 0 60px rgba(255,76,50,0.55);">DOOMED</div>
        <div class="strike" id="b5-strike" style="position:relative; width:52%;"></div>
      </div>

      <!-- End card -->
      <div id="endcard" class="clip" data-start="30.3" data-duration="3.7" data-track-index="11">
        <img id="ec-logo" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
        <div id="ec-line">Free Profitability Bootcamp</div>
        <div id="ec-cta">Join now <span class="arrow">&rarr;</span></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Base: subtle Ken Burns on the face + logo intro
      tl.fromTo("#face-video", { scale: 1.0 }, { scale: 1.02, duration: 33.10, ease: "none" }, 0);
      tl.fromTo("#logo-corner", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.35);

      // ---------- BEAT 1 — TRAP (1.4) ----------
      tl.fromTo("#b1-scrim", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 1.4);
      tl.fromTo("#b1-kick", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.5);
      tl.fromTo("#b1-head", { opacity: 0, y: 40, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 1.63);
      tl.fromTo("#b1-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 1.9);
      // exit (overlay pops off to reveal face)
      tl.to(["#b1-kick", "#b1-head", "#b1-bar"], { opacity: 0, y: -26, duration: 0.3, ease: "power2.in" }, 3.7);
      tl.to("#b1-scrim", { opacity: 0, duration: 0.35, ease: "power2.in" }, 3.75);

      // ---------- BEAT 2 — LOSING MONEY (8.4) ----------
      tl.fromTo("#b2-scrim", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 8.4);
      tl.fromTo("#b2-kick", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 8.5);
      tl.fromTo("#b2-head", { opacity: 0, y: 40, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, 8.78);
      tl.fromTo("#b2-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 9.1);
      tl.to(["#b2-kick", "#b2-head", "#b2-bar"], { opacity: 0, y: -24, duration: 0.3, ease: "power2.in" }, 10.95);
      tl.to("#b2-scrim", { opacity: 0, duration: 0.35, ease: "power2.in" }, 11.0);

      // ---------- BEAT 3 — NOT ACCURATE full-frame (13.7) ----------
      // whip-in: card blurs + scales in, lands on "accurate" (14.04)
      tl.fromTo("#b3", { opacity: 0, filter: "blur(26px)", scale: 1.06 },
                       { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.34, ease: "power2.out" }, 13.72);
      tl.fromTo("#b3-grid", { yPercent: 6, opacity: 0 }, { yPercent: 0, opacity: 0.5, duration: 0.6, ease: "power2.out" }, 13.72);
      tl.fromTo("#b3-chips", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 13.85);
      tl.fromTo("#b3-kick", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 14.0);
      // stamp slams in on the word "accurate"
      tl.fromTo("#b3-stamp", { opacity: 0, scale: 1.35 },
                             { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.7)" }, 14.06);
      tl.fromTo("#b3-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.34, ease: "power3.out" }, 14.34);
      // slow drift so the "camera never sleeps" (starts after the grid entrance ends)
      tl.to("#b3-grid", { yPercent: -3, duration: 1.5, ease: "none" }, 14.34);
      // exit — blur out to reveal face
      tl.to("#b3", { opacity: 0, filter: "blur(22px)", scale: 1.04, duration: 0.36, ease: "power2.in" }, 15.9);

      // ---------- BEAT 4 — TRUE COST (16.6) ----------
      tl.fromTo("#b4-scrim", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 16.6);
      tl.fromTo("#b4-kick", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 16.72);
      tl.fromTo("#b4-head", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 17.7);
      tl.fromTo("#b4-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 18.4);
      tl.to(["#b4-kick", "#b4-head", "#b4-bar"], { opacity: 0, y: -24, duration: 0.3, ease: "power2.in" }, 19.9);
      tl.to("#b4-scrim", { opacity: 0, duration: 0.35, ease: "power2.in" }, 19.95);

      // ---------- BEAT 5 — DOOMED full-frame (25.5) ----------
      tl.fromTo("#b5", { opacity: 0, filter: "blur(26px)", scale: 1.06 },
                       { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.32, ease: "power2.out" }, 25.55);
      tl.fromTo("#b5-grid", { yPercent: 6, opacity: 0 }, { yPercent: 0, opacity: 0.5, duration: 0.6, ease: "power2.out" }, 25.55);
      tl.fromTo("#b5-kick", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, 25.66);
      // DOOMED slam with a small settle shake
      tl.fromTo("#b5-stamp", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, 25.86);
      tl.to("#b5-stamp", { x: 10, duration: 0.05, ease: "power1.inOut", yoyo: true, repeat: 3 }, 26.26);
      tl.fromTo("#b5-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.34, ease: "power3.out" }, 26.1);
      tl.to("#b5-grid", { yPercent: -3, duration: 1.32, ease: "none" }, 26.16);
      tl.to("#b5", { opacity: 0, filter: "blur(22px)", scale: 1.04, duration: 0.36, ease: "power2.in" }, 27.6);

      // ---------- End card (30.3) ----------
      tl.fromTo("#endcard", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 30.3);
      tl.fromTo("#ec-logo", { opacity: 0, y: 28, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.62, ease: "power3.out" }, 30.6);
      tl.fromTo("#ec-line", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 30.9);
      tl.fromTo("#ec-cta", { opacity: 0, y: 16, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.6)" }, 31.1);

      // Law #11 — anchor timeline to the full slot
      tl.set({}, {}, 34.0);
      window.__timelines["ecomiq-short-form-mg"] = tl;
    </script>
  </body>
</html>
