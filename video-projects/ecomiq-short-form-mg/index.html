<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ecomiq-short-form-mg</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      @font-face { font-family: 'Hedvig Letters Serif'; font-style: normal; font-weight: 400;
        font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: var(--brand-navy);
        font-family: 'Rethink Sans', system-ui, sans-serif; color: var(--brand-white);
      }

      /* ---------- Base talking head ---------- */
      #face-wrapper { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; overflow: hidden; z-index: 0; }
      #face-video {
        display: block; width: 100%; height: 100%; object-fit: cover;
        transform-origin: center center;
        filter: contrast(1.06) saturate(1.06) brightness(0.995);
      }
      /* vignette + logo scrim + a soft TOP scrim so top graphics always read */
      #overlay {
        position: absolute; inset: 0; pointer-events: none; z-index: 2;
        background:
          linear-gradient(180deg, rgba(4,16,34,0.55) 0%, rgba(4,16,34,0.16) 16%, rgba(4,16,34,0) 30%),
          radial-gradient(115% 60% at 8% 3%, rgba(6,28,54,0.55) 0%, rgba(6,28,54,0) 40%),
          radial-gradient(ellipse 92% 78% at 50% 48%, rgba(4,14,28,0) 60%, rgba(4,14,28,0.32) 100%);
      }
      #logo-wrap { position: absolute; top: 74px; left: 60px; width: 178px; z-index: 4; }
      #logo-corner { display: block; width: 100%; height: auto; filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5)); }

      /* ---------- Motion-graphic system (top-anchored, example style) ---------- */
      .mg { position: absolute; left: 0; right: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; }
      .mg-top { top: 210px; }

      /* keyword-emphasis caption on a subtle navy plate */
      .cap { max-width: 900px; padding: 22px 40px; border-radius: 26px;
        background: rgba(5,18,38,0.62); border: 1px solid rgba(156,212,255,0.16);
        box-shadow: 0 24px 60px -24px rgba(0,0,0,0.7); text-align: center; }
      .cap .line { font-weight: 800; font-size: 82px; line-height: 1.0; letter-spacing: -0.02em; color: var(--brand-white); }
      .cap .hot { color: var(--brand-flame); }
      .cap .sub { display: block; margin-top: 10px; font-weight: 600; font-size: 40px; letter-spacing: 0.01em; color: var(--brand-text-dim); }

      /* pill badges (Meta / Google) */
      .chips { display: flex; gap: 20px; justify-content: center; }
      .chip { display: inline-flex; align-items: center; gap: 16px;
        font-weight: 700; font-size: 40px; color: var(--brand-white); letter-spacing: -0.005em;
        padding: 20px 34px 20px 22px; border-radius: 20px;
        background: rgba(6,22,44,0.92); border: 1px solid rgba(156,212,255,0.20);
        box-shadow: 0 20px 48px -22px rgba(0,0,0,0.75); white-space: nowrap; }
      .chip .dot { width: 26px; height: 26px; border-radius: 8px; background: var(--brand-blue-tint); flex: none; }
      .chip.g .dot { background: #f0a500; }
      /* red "not accurate" tag */
      .xtag { margin-top: 22px; display: inline-flex; align-items: center; gap: 16px;
        font-weight: 800; font-size: 46px; letter-spacing: 0.02em; text-transform: uppercase; color: var(--brand-white);
        padding: 16px 32px; border-radius: 999px; background: var(--brand-flame);
        box-shadow: 0 22px 60px -20px rgba(255,76,50,0.85); }
      .xtag .x { width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.28);
        display: inline-flex; align-items: center; justify-content: center; font-size: 30px; }

      /* ---------- End card ---------- */
      #endcard {
        position: absolute; inset: 0; z-index: 10; overflow: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 36px; padding: 8%; text-align: center;
        background:
          radial-gradient(120% 70% at 50% 22%, rgba(156,212,255,0.14) 0%, rgba(6,40,76,0) 55%),
          var(--brand-navy);
      }
      .ec-particle { position: absolute; border-radius: 50%; z-index: 0; }
      #ec-logo { width: 470px; height: auto; display: block; position: relative; z-index: 1; }
      #ec-line { font-weight: 800; font-size: 62px; line-height: 1.04; letter-spacing: -0.02em; color: var(--brand-white); max-width: 88%; position: relative; z-index: 1; }
      #ec-div { width: 76px; height: 5px; border-radius: 3px; background: var(--brand-flame); position: relative; z-index: 1; }
      #ec-cta {
        margin-top: 6px; font-weight: 700; font-size: 42px; color: var(--brand-white);
        background: var(--brand-flame); padding: 32px 70px; border-radius: 999px;
        display: inline-flex; align-items: center; gap: 18px; white-space: nowrap; position: relative; z-index: 1;
        box-shadow: 0 24px 74px -18px rgba(255,76,50,0.85);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="ecomiq-short-form-mg" data-start="0" data-duration="34" data-width="1080" data-height="1920">
      <!-- Base talking head (face stays fully visible the whole time) -->
      <div id="face-wrapper">
        <video id="face-video" data-start="0" data-duration="33.10" data-track-index="0" src="assets/face-short.mp4" muted playsinline></video>
      </div>
      <audio id="face-audio" data-start="0" data-duration="33.10" data-track-index="1" data-volume="1" src="assets/face-short-audio.m4a"></audio>
      <div id="overlay" class="clip" data-start="0" data-duration="33.10" data-track-index="2"></div>
      <div id="logo-wrap">
        <img id="logo-corner" class="clip" data-start="0" data-duration="33.10" data-track-index="3" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
      </div>

      <!-- B1 — "the biggest trap" (1.4) -->
      <div id="b1" class="mg mg-top clip" data-start="1.4" data-duration="2.8" data-track-index="5">
        <div class="cap"><div class="line">The biggest <span class="hot">trap</span></div></div>
      </div>

      <!-- B2 — "lose money on the first order" (8.4) -->
      <div id="b2" class="mg mg-top clip" data-start="8.4" data-duration="2.7" data-track-index="6">
        <div class="cap"><div class="line">You <span class="hot">lose money</span><span class="sub">on the first order</span></div></div>
      </div>

      <!-- B3 — Meta / Google dashboards → NOT ACCURATE (11.0) -->
      <div id="b3" class="mg mg-top clip" data-start="11.0" data-duration="5.2" data-track-index="7" style="top:190px;">
        <div class="chips">
          <div class="chip" id="b3-meta"><span class="dot"></span>Meta Ads</div>
          <div class="chip g" id="b3-goog"><span class="dot"></span>Google Ads</div>
        </div>
        <div class="xtag" id="b3-x"><span class="x">&#10005;</span> Not accurate</div>
      </div>

      <!-- B4 — "the true cost to acquire" (16.4) -->
      <div id="b4" class="mg mg-top clip" data-start="16.4" data-duration="4.0" data-track-index="8">
        <div class="cap"><div class="line">The <span class="hot">true cost</span><span class="sub">to acquire a customer</span></div></div>
      </div>

      <!-- B5 — "fundamentally doomed" (25.3) -->
      <div id="b5" class="mg mg-top clip" data-start="25.3" data-duration="2.7" data-track-index="9">
        <div class="cap"><div class="line">You're <span class="hot">doomed</span><span class="sub">if you get it wrong</span></div></div>
      </div>

      <!-- End card -->
      <div id="endcard" class="clip" data-start="30.3" data-duration="3.7" data-track-index="11">
        <div class="ec-particle" data-p style="left:14%; top:30%; width:12px; height:12px; background:rgba(156,212,255,0.5);"></div>
        <div class="ec-particle" data-p style="left:82%; top:24%; width:9px; height:9px; background:rgba(255,76,50,0.55);"></div>
        <div class="ec-particle" data-p style="left:24%; top:70%; width:8px; height:8px; background:rgba(156,212,255,0.4);"></div>
        <div class="ec-particle" data-p style="left:76%; top:74%; width:12px; height:12px; background:rgba(156,212,255,0.35);"></div>
        <div class="ec-particle" data-p style="left:50%; top:82%; width:8px; height:8px; background:rgba(255,76,50,0.45);"></div>
        <div class="ec-particle" data-p style="left:64%; top:16%; width:7px; height:7px; background:rgba(156,212,255,0.4);"></div>
        <img id="ec-logo" src="assets/ecomiq-logo-white.svg" alt="EcomIQ" />
        <div id="ec-line">Free Profitability Bootcamp</div>
        <div id="ec-div"></div>
        <div id="ec-cta">Join now <span class="arrow">&rarr;</span></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const POP = "back.out(1.7)";

      // Base: subtle Ken Burns + logo intro
      tl.fromTo("#face-video", { scale: 1.0 }, { scale: 1.02, duration: 33.10, ease: "none" }, 0);
      tl.fromTo("#logo-corner", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.35);

      // Reusable caption pop-in/out (plate rises + settles; exits by sliding up)
      function cap(sel, tIn, tOut) {
        tl.fromTo(sel + " .cap", { opacity: 0, y: -26, scale: 0.94 },
          { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: POP }, tIn);
        tl.to(sel + " .cap", { opacity: 0, y: -22, duration: 0.3, ease: "power2.in" }, tOut);
      }

      // B1 — "the biggest trap" (word "trap" ~1.66)
      cap("#b1", 1.5, 3.9);
      // B2 — "lose money" (~8.84)
      cap("#b2", 8.6, 10.75);
      // B4 — "true cost to acquire" (~17.8)
      cap("#b4", 16.6, 20.05);
      // B5 — "doomed" (~25.89)
      cap("#b5", 25.5, 27.55);
      tl.to("#b5 .line", { x: 8, duration: 0.05, ease: "power1.inOut", yoyo: true, repeat: 3 }, 25.95);

      // B3 — chips build as he names each platform, then NOT ACCURATE stamps
      tl.fromTo("#b3-meta", { opacity: 0, y: -24, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: POP }, 11.3);
      tl.fromTo("#b3-goog", { opacity: 0, y: -24, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: POP }, 12.65);
      tl.fromTo("#b3-x", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.4, ease: POP }, 14.05);
      tl.to("#b3-x", { x: 7, duration: 0.05, ease: "power1.inOut", yoyo: true, repeat: 3 }, 14.45);
      tl.to(["#b3-meta", "#b3-goog", "#b3-x"], { opacity: 0, y: -20, duration: 0.32, ease: "power2.in" }, 15.9);

      // End card — crossfade over the face as the CTA lands
      tl.fromTo("#endcard", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 30.3);
      tl.fromTo("#ec-logo", { opacity: 0, y: 26, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 30.6);
      tl.fromTo("#ec-line", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 30.9);
      tl.fromTo("#ec-div", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power2.out" }, 31.15);
      tl.fromTo("#ec-cta", { opacity: 0, y: 16, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.6)" }, 31.3);
      // gentle particle drift (finite repeats)
      tl.fromTo("[data-p]", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out", stagger: 0.06 }, 30.5);
      tl.to("[data-p]", { y: -22, duration: 1.8, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: { each: 0.15, from: "random" } }, 31.0);

      tl.set({}, {}, 34.0);
      window.__timelines["ecomiq-short-form-mg"] = tl;
    </script>
  </body>
</html>
