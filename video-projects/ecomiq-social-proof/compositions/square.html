<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>EcomIQ — Dryft Sleep social proof (1:1)</title>
    <!-- GSAP vendored locally: a CDN <script> cert-fails in the render env and freezes renders -->
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand-tokens.css" />
    <style>
      /* Local brand fonts — no network at render time. Families are named
         literally below (not via var()) because the linter doesn't resolve
         CSS variables and would false-warn on font_family_without_font_face. */
      @font-face { font-family: 'Rethink Sans'; font-style: normal; font-weight: 400 800;
        font-display: block; src: url(assets/fonts/RethinkSans.woff2) format('woff2'); }
      @font-face { font-family: 'Hedvig Letters Serif'; font-style: normal; font-weight: 400;
        font-display: block; src: url(assets/fonts/HedvigLettersSerif.woff2) format('woff2'); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1080px; overflow: hidden;
        background: var(--brand-navy);
        font-family: 'Rethink Sans', system-ui, sans-serif;
        color: var(--brand-white);
      }

      /* ---------- backdrop ---------------------------------------------- */
      #bg { position: absolute; inset: 0; background: var(--brand-navy); z-index: 0; }

      /* Each b-roll <video> lives in a NON-timed wrapper so the crossfade
         animates the wrapper, never the video element itself (animating a
         video's own box freezes frames). */
      .bwrap { position: absolute; inset: 0; z-index: 1; opacity: 0; }
      .bwrap video { width: 1080px; height: 1080px; object-fit: cover; display: block; }

      /* Navy scrim keeps type legible over footage. Flat rgba fill + radial
         vignette — no full-screen linear gradient (H.264 banding). */
      #scrim { position: absolute; inset: 0; z-index: 2;
        background:
          radial-gradient(120% 70% at 50% 22%, rgba(6,40,76,0.30) 0%, rgba(6,40,76,0.66) 60%, rgba(6,40,76,0.86) 100%),
          rgba(6,40,76,0.42);
      }
      /* Extra local darkening under the copy block so text always clears AA. */
      #floor { position: absolute; inset: 0; z-index: 3;
        background: radial-gradient(105% 62% at 34% 82%, rgba(3,20,40,0.80) 0%, rgba(3,20,40,0.34) 55%, rgba(3,20,40,0) 100%);
      }

      /* ---------- persistent logo ---------------------------------------
         Wrapped in a positioned, NON-clip div: the render engine repositions
         elements marked class="clip", which makes a bare logo drift. */
      #logo-hold { position: absolute; top: 52px; left: 72px; width: 228px; z-index: 40; }
      #logo-hold img { width: 100%; height: auto; display: block;
        filter: drop-shadow(0 6px 18px rgba(0,0,0,0.45)); }

      /* ---------- graphic stages ----------------------------------------
         Every stage fills the frame; padding positions the copy. Bottom-anchored
         so each beat's block shares one baseline and the footage stays readable
         in the upper half. */
      .stage { position: absolute; inset: 0; z-index: 20;
        display: flex; flex-direction: column; justify-content: flex-end;
        align-items: flex-start; padding: 0 72px 92px; }

      .eyebrow { font-size: 26px; font-weight: 600; letter-spacing: 0.30em;
        text-transform: uppercase; color: var(--brand-blue-tint); }
      .label { font-size: 26px; font-weight: 600; letter-spacing: 0.24em;
        text-transform: uppercase; color: var(--brand-blue-tint); }
      .stat { font-size: 210px; font-weight: 800; line-height: 0.9;
        letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
        text-shadow: 0 10px 44px rgba(0,0,0,0.5); }
      .headline { font-size: 82px; font-weight: 800; line-height: 1.0;
        letter-spacing: -0.02em; text-shadow: 0 8px 34px rgba(0,0,0,0.5); }

      /* Flame chip = the one hot accent. */
      .chip { display: inline-flex; align-items: center; font-size: 30px; font-weight: 700;
        letter-spacing: 0.02em; color: var(--brand-white); background: var(--brand-flame);
        padding: 18px 36px; border-radius: 999px;
        box-shadow: 0 18px 54px -14px rgba(255,76,50,0.7); }
      .chip-ghost { display: inline-flex; align-items: center; font-size: 27px; font-weight: 700;
        letter-spacing: 0.16em; text-transform: uppercase; color: var(--brand-blue-tint);
        border: 3px solid var(--brand-border); background: rgba(6,40,76,0.55);
        padding: 16px 30px; border-radius: 999px; }

      /* S2 — struck-through "new customers" */
      #s2-strikewrap { position: relative; display: inline-block; }
      #s2-strike { position: absolute; left: -8px; top: 52%; height: 10px; width: calc(100% + 16px);
        background: var(--brand-flame); border-radius: 5px; transform-origin: left center; }

      /* S3 — "again and again" repeat beats */
      #s3-dots { display: flex; gap: 16px; margin-top: 20px; }
      #s3-dots i { width: 26px; height: 26px; border-radius: 50%;
        background: var(--brand-flame); display: block; }

      /* ---------- end card ---------------------------------------------- */
      #s7 { z-index: 30; justify-content: center; align-items: center;
        text-align: center; padding: 0 90px; }
      #s7-cover { position: absolute; inset: 0; background: var(--brand-navy); z-index: 29; opacity: 0; }
      #s7-bloom { position: absolute; left: -12%; top: 46%; width: 124%; height: 58%;
        background: radial-gradient(60% 60% at 50% 50%, rgba(255,76,50,0.30) 0%, rgba(255,76,50,0) 70%);
        z-index: 29; opacity: 0; }
      #s7-head { font-size: 72px; font-weight: 800; line-height: 1.04;
        letter-spacing: -0.02em; max-width: 520px; }
      /* The EcomIQ signature: exactly ONE serif-italic emphasis word. */
      #s7-head .em { font-family: 'Hedvig Letters Serif', Georgia, serif;
        font-style: italic; font-weight: 400; letter-spacing: -0.01em;
        color: var(--brand-blue-tint); }
      #s7-pill { margin-top: 40px; font-size: 36px; font-weight: 700;
        color: var(--brand-white); background: var(--brand-flame);
        padding: 24px 54px; border-radius: 999px;
        box-shadow: 0 22px 68px -14px rgba(255,76,50,0.72); }
    </style>
  </head>
  <body>
    <!-- Render contract: root carries id, data-composition-id, data-start,
         data-duration, data-width, data-height. Timed visible children need
         class="clip" + data-start/data-duration/data-track-index — except
         <video>/<audio>, which are timed but never get class="clip".
         Graphic groups span the full piece so they are always mounted; GSAP
         owns their visibility. Track indices are unique, so nothing collides. -->
    <div
      id="root"
      data-composition-id="ecomiq-social-proof-1x1"
      data-start="0"
      data-duration="38.5"
      data-width="1080"
      data-height="1080"
      data-fps="30"
    >
      <div id="bg" class="clip" data-start="0" data-duration="38.5" data-track-index="0"></div>

      <!-- ===== B-roll bed. Windows overlap ~0.5s so the wrappers crossfade.
           All muted; the VO is the only audio source for the mix. ===== -->
      <div class="bwrap" id="bw-walking">
        <video id="v-walking" data-start="0" data-duration="6.6" data-track-index="1"
               src="assets/broll/1x1/walking.mp4" muted playsinline></video>
      </div>
      <div class="bwrap" id="bw-storefront">
        <video id="v-storefront" data-start="6.1" data-duration="3.6" data-track-index="2"
               src="assets/broll/1x1/storefront.mp4" muted playsinline></video>
      </div>
      <div class="bwrap" id="bw-excited">
        <video id="v-excited" data-start="9.2" data-duration="6.15" data-track-index="3"
               src="assets/broll/1x1/excited.mp4" muted playsinline></video>
      </div>
      <div class="bwrap" id="bw-product">
        <video id="v-product" data-start="14.85" data-duration="5.0" data-track-index="4"
               src="assets/broll/1x1/product.mp4" muted playsinline></video>
      </div>
      <div class="bwrap" id="bw-suppliers">
        <video id="v-suppliers" data-start="19.35" data-duration="7.45" data-track-index="5"
               src="assets/broll/1x1/suppliers.mp4" muted playsinline></video>
      </div>
      <div class="bwrap" id="bw-shelf">
        <video id="v-shelf" data-start="26.3" data-duration="7.3" data-track-index="6"
               src="assets/broll/1x1/shelf.mp4" muted playsinline></video>
      </div>

      <div id="scrim" class="clip" data-start="0" data-duration="38.5" data-track-index="7"></div>
      <div id="floor" class="clip" data-start="0" data-duration="38.5" data-track-index="8"></div>

      <!-- ===== Beat 1 (0.12–6.10) — the headline stat ===== -->
      <div id="s1" class="stage clip" data-start="0" data-duration="38.5" data-track-index="9">
        <div id="s1-eyebrow" class="eyebrow">Dryft Sleep</div>
        <div id="s1-num" class="stat">0%</div>
        <div id="s1-label" class="label">Returning customers</div>
        <div id="s1-chip" class="chip" style="margin-top: 26px">$0 extra ad spend</div>
      </div>

      <!-- ===== Beat 2 (6.10–9.20) — what everyone else chases ===== -->
      <div id="s2" class="stage clip" data-start="0" data-duration="38.5" data-track-index="10">
        <div id="s2-kicker" class="eyebrow">Everyone chases</div>
        <div id="s2-strikewrap" style="margin-top: 16px">
          <div id="s2-text" class="headline">New customers</div>
          <div id="s2-strike"></div>
        </div>
      </div>

      <!-- ===== Beat 3 (9.20–14.85) — the ones they already had ===== -->
      <div id="s3" class="stage clip" data-start="0" data-duration="38.5" data-track-index="11">
        <div id="s3-l1" class="headline">The ones</div>
        <div id="s3-l2" class="headline">they already</div>
        <div id="s3-l3" class="headline">had</div>
        <div id="s3-dots"><i id="s3-d1"></i><i id="s3-d2"></i><i id="s3-d3"></i></div>
      </div>

      <!-- ===== Beat 4 (14.85–19.35) — subscription revenue ===== -->
      <div id="s4" class="stage clip" data-start="0" data-duration="38.5" data-track-index="12">
        <div id="s4-eyebrow" class="eyebrow">Subscription revenue</div>
        <div id="s4-num" class="stat">0&#215;</div>
        <div id="s4-label" class="label">the storefront</div>
      </div>

      <!-- ===== Beat 5 (19.35–26.30) — same inputs, more profit ===== -->
      <div id="s5" class="stage clip" data-start="0" data-duration="38.5" data-track-index="13">
        <div id="s5-c1" class="chip-ghost">Same brand</div>
        <div id="s5-c2" class="chip-ghost" style="margin-top: 14px">Same ad budget</div>
        <div id="s5-head" class="headline" style="margin-top: 22px; color: #FF4C32">Far more profit</div>
      </div>

      <!-- ===== Beat 6 (26.30–33.44) — what EcomIQ does ===== -->
      <div id="s6" class="stage clip" data-start="0" data-duration="38.5" data-track-index="14">
        <div id="s6-eyebrow" class="eyebrow">What we do</div>
        <div id="s6-l1" class="headline" style="margin-top: 12px">Keep more of</div>
        <div id="s6-l2" class="headline">what you've</div>
        <div id="s6-l3" class="headline">already got</div>
        <div id="s6-chip" class="chip-ghost" style="margin-top: 22px">Without more ad spend</div>
      </div>

      <!-- ===== Beat 7 (33.44–38.50) — end card ===== -->
      <div id="s7-cover" class="clip" data-start="0" data-duration="38.5" data-track-index="15"></div>
      <div id="s7-bloom" class="clip" data-start="0" data-duration="38.5" data-track-index="16"></div>
      <div id="s7" class="stage clip" data-start="0" data-duration="38.5" data-track-index="17">
        <div id="s7-head">See if we can <span class="em">help</span> you</div>
        <div id="s7-pill">Find out more</div>
      </div>

      <!-- Persistent logo, on every frame. Non-timed wrapper keeps it put. -->
      <div id="logo-hold">
        <img id="logo" src="assets/ecomiq-logo-white.png" alt="EcomIQ" />
      </div>

      <!-- Voiceover: source trimmed 3.50–40.35s (record-press + throat clear off
           the head, room tone off the tail) and loudness-normalised. -->
      <audio id="vo" data-start="0" data-duration="36.9" data-track-index="118"
             data-volume="1" src="assets/vo/vo-trimmed.m4a"></audio>

      <!-- MUSIC BED placeholder — currently 38.5s of silence, already wired and
           ducked under the VO at 0.18. Drop a real track in at
           assets/audio/music-bed.m4a (same path) and it plays with no HTML edit.
           Raise/lower the mix with data-volume. -->
      <audio id="music" data-start="0" data-duration="38.5" data-track-index="119"
             data-volume="0.18" src="assets/audio/music-bed.m4a"></audio>
    </div>

    <script>
      // Exactly one paused timeline, keyed to data-composition-id.
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Beat boundaries on the trimmed VO timeline (raw source time - 3.50s).
      const XF = 0.42;                       // b-roll crossfade, medium energy
      const BEATS = {
        s1: [0.12, 6.10], s2: [6.10, 9.20], s3: [9.20, 14.85],
        s4: [14.85, 19.35], s5: [19.35, 26.30], s6: [26.30, 33.44], s7: [33.44, 38.50]
      };

      /* ---- B-roll bed: blur crossfades. The crossfade IS the exit, so no
              scene ever empties before its handoff. ---- */
      const BED = [
        ["#bw-walking",    0.00,  6.10],
        ["#bw-storefront", 6.10,  9.20],
        ["#bw-excited",    9.20, 14.85],
        ["#bw-product",   14.85, 19.35],
        ["#bw-suppliers", 19.35, 26.30],
        ["#bw-shelf",     26.30, 33.44]
      ];
      BED.forEach(([sel, inAt, outAt], i) => {
        // fade up (first shot opens from black a touch slower)
        tl.fromTo(sel, { opacity: 0, filter: "blur(14px)", scale: 1.06 },
          { opacity: 1, filter: "blur(0px)", scale: 1,
            duration: i === 0 ? 0.75 : XF, ease: "power2.out" }, inAt);
        // slow push keeps the backdrop alive under the graphics
        tl.to(sel + " video", { scale: 1.07, duration: (outAt - inAt) + XF,
          ease: "none" }, inAt);
        // hand off to the next shot
        tl.to(sel, { opacity: 0, filter: "blur(12px)", duration: XF,
          ease: "power2.inOut" }, outAt);
      });

      /* ---- Graphic beats. Entrances only; each group's crossfade covers it. ---- */
      // Groups start hidden, so fromTo (not from) — `from` on an already-hidden
      // element computes its end state from the hidden state and stays invisible.
      const GROUPS = ["#s1", "#s2", "#s3", "#s4", "#s5", "#s6"];
      GROUPS.forEach((sel) => tl.set(sel, { opacity: 0 }, 0));
      Object.entries(BEATS).forEach(([k, [a, b]]) => {
        if (k === "s7") return;
        tl.to("#" + k, { opacity: 1, duration: 0.28, ease: "power1.out" }, a);
        tl.to("#" + k, { opacity: 0, duration: 0.30, ease: "power1.in" }, b - 0.06);
      });

      // Beat 1 — count 0 -> 59% landing on the spoken "59%" (raw 6.11 -> 2.61).
      const n1 = { v: 0 };
      tl.fromTo("#s1-eyebrow", { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.30);
      tl.fromTo("#s1-num", { opacity: 0, y: 54, scale: 0.88 },
        { opacity: 1, y: 0, scale: 1, duration: 0.62, ease: "expo.out" }, 2.10);
      tl.to(n1, { v: 59, duration: 0.80, ease: "power2.out", snap: { v: 1 },
        onUpdate() { document.getElementById("s1-num").textContent = n1.v + "%"; } }, 2.16);
      tl.fromTo("#s1-label", { opacity: 0, x: -28 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 2.95);
      tl.fromTo("#s1-chip", { opacity: 0, scale: 0.86 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, 3.52);

      // Beat 2 — "new customers", then struck through on the spoken word.
      tl.fromTo("#s2-kicker", { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, 6.30);
      tl.fromTo("#s2-text", { opacity: 0, y: 34 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 6.48);
      tl.fromTo("#s2-strike", { scaleX: 0 },
        { scaleX: 1, duration: 0.42, ease: "power4.inOut" }, 7.84);

      // Beat 3 — staggered kinetic type; dots pulse on "again and again" (12.61).
      tl.fromTo(["#s3-l1", "#s3-l2", "#s3-l3"], { opacity: 0, y: 46 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.13 }, 9.34);
      tl.fromTo("#s3-dots i", { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(2)", stagger: 0.17 }, 12.55);
      tl.to("#s3-dots i", { scale: 1.35, duration: 0.22, ease: "sine.inOut",
        stagger: 0.13, yoyo: true, repeat: 3 }, 13.20);

      // Beat 4 — count 0 -> 3x landing on the spoken "three times" (raw 20.08 -> 16.58).
      const n4 = { v: 0 };
      tl.fromTo("#s4-eyebrow", { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.46, ease: "power2.out" }, 15.00);
      tl.fromTo("#s4-num", { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, 16.14);
      tl.to(n4, { v: 3, duration: 0.62, ease: "power2.out", snap: { v: 1 },
        onUpdate() { document.getElementById("s4-num").textContent = n4.v + "×"; } }, 16.20);
      tl.fromTo("#s4-label", { opacity: 0, x: -26 },
        { opacity: 1, x: 0, duration: 0.46, ease: "power2.out" }, 17.05);

      // Beat 5 — the two "same" chips, then the flame payoff.
      tl.fromTo("#s5-c1", { opacity: 0, x: -34 },
        { opacity: 1, x: 0, duration: 0.46, ease: "power3.out" }, 19.50);
      tl.fromTo("#s5-c2", { opacity: 0, x: -34 },
        { opacity: 1, x: 0, duration: 0.46, ease: "power3.out" }, 20.50);
      tl.fromTo("#s5-head", { opacity: 0, y: 40, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.62, ease: "back.out(1.4)" }, 21.84);

      // Beat 6 — the value prop.
      tl.fromTo("#s6-eyebrow", { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.44, ease: "power2.out" }, 26.45);
      tl.fromTo(["#s6-l1", "#s6-l2", "#s6-l3"], { opacity: 0, y: 42 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.14 }, 27.48);
      tl.fromTo("#s6-chip", { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 30.24);

      /* ---- Beat 7 — end card. Cuts on the spoken "If" (raw 36.94 -> 33.44).
              Final scene: the one place exit animation is allowed. ---- */
      tl.set("#s7", { opacity: 0 }, 0);
      tl.to("#s7-cover", { opacity: 1, duration: 0.46, ease: "power2.inOut" }, 33.44);
      tl.to("#s7-bloom", { opacity: 1, duration: 0.9, ease: "sine.out" }, 33.60);
      tl.to("#s7", { opacity: 1, duration: 0.30, ease: "power1.out" }, 33.62);
      tl.fromTo("#s7-head", { opacity: 0, y: 40 },
        { opacity: 1, y: 0, duration: 0.66, ease: "power3.out" }, 33.72);
      // Pill lands on "find out more" (raw 39.19 -> 35.69).
      tl.fromTo("#s7-pill", { opacity: 0, scale: 0.82 },
        { opacity: 1, scale: 1, duration: 0.54, ease: "back.out(1.8)" }, 35.50);
      tl.to("#s7-pill", { scale: 1.045, duration: 0.62, ease: "sine.inOut",
        yoyo: true, repeat: 3 }, 36.30);
      // Slow bloom drift carries the hold to the last frame (real motion, so the
      // timeline reaches 38.5s without an empty padding tween).
      tl.to("#s7-bloom", { scale: 1.12, opacity: 0.72, duration: 3.6, ease: "sine.inOut" }, 34.90);

      window.__timelines["ecomiq-social-proof-1x1"] = tl;
    </script>
  </body>
</html>
